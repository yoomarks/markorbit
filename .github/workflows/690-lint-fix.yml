name: Apply #690 lint fixes

on:
  push:
    branches:
      - integration/690-official-fee-reference-read
    paths:
      - .github/workflows/690-lint-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/690-official-fee-reference-read
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('services/capability-engine/src/uspto-official-fee-resolver-pilot.ts')
          text = source.read_text()
          old = "resolveCurrent(query: Readonly<OfficialFeeReferenceReaderQueryV1>): unknown | Promise<unknown>;"
          new = "resolveCurrent(query: Readonly<OfficialFeeReferenceReaderQueryV1>): unknown;"
          if old not in text:
              raise SystemExit('reader signature patch target not found')
          source.write_text(text.replace(old, new, 1))

          test = Path('services/capability-engine/tests/official-fee-reference-http-reader.test.ts')
          text = test.read_text()
          old = "expect(JSON.parse(String(init?.body))).toEqual(query);"
          new = "expect(typeof init?.body).toBe('string');\n      expect(JSON.parse(init?.body as string)).toEqual(query);"
          if old not in text:
              raise SystemExit('body assertion patch target not found')
          test.write_text(text.replace(old, new, 1))
          PY
      - run: >-
          pnpm exec prettier --write
          services/capability-engine/src/uspto-official-fee-resolver-pilot.ts
          services/capability-engine/tests/official-fee-reference-http-reader.test.ts
          services/core/tests/official-fee-reference-http.test.ts
      - name: Commit and remove patch workflow
        run: |
          rm .github/workflows/690-lint-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "[INTEGRATION][CORE-P0] Fix Official Fee Reference adapter lint"
          git push origin HEAD:integration/690-official-fee-reference-read
