name: Validate #690 integration branch

on:
  push:
    branches:
      - integration/690-official-fee-reference-read
    paths:
      - .github/workflows/690-static-validation.yml

permissions:
  contents: write

# Temporary owner-boundary validation; removed after the full gate passes. Rerun after binding assertion fix.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/690-official-fee-reference-read
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format new tests
        run: >-
          pnpm exec prettier --write
          services/core/tests/official-fee-reference-http.test.ts
          services/capability-engine/tests/official-fee-reference-http-reader.test.ts
          services/capability-engine/tests/uspto-official-fee-production-bootstrap.test.ts
      - run: pnpm format:check
      - run: pnpm --filter @markorbit/core-service lint
      - run: pnpm --filter @markorbit/core-service typecheck
      - run: pnpm --filter @markorbit/capability-engine lint
      - run: pnpm --filter @markorbit/capability-engine typecheck
      - name: Build Core and Capability dependency closures
        run: >-
          pnpm exec turbo run build
          --filter=@markorbit/core-service...
          --filter=@markorbit/capability-engine...
      - run: pnpm --filter @markorbit/core-service exec vitest run tests/official-fee-reference-http.test.ts
      - run: >-
          pnpm --filter @markorbit/capability-engine exec vitest run
          tests/official-fee-reference-http-reader.test.ts
          tests/uspto-official-fee-production-bootstrap.test.ts
          tests/uspto-official-fee-reference-currentness.test.ts
          tests/governed-runtime-bootstrap.test.ts
      - name: Commit validated formatting and remove workflow
        run: |
          rm .github/workflows/690-static-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "[INTEGRATION][CORE-P0] Format and validate Official Fee Reference integration"
          git push origin HEAD:integration/690-official-fee-reference-read
