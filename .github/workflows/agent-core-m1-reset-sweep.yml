name: Agent CORE-M1 Reset Sweep

on:
  push:
    branches:
      - agent/core-m1-ready-package-content-consumption

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-m1-ready-package-content-consumption
      - name: Include content exports in every legacy Core database reset
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'DROP TABLE IF EXISTS knowledge_intakes,'
          new = 'DROP TABLE IF EXISTS knowledge_content_exports,knowledge_intakes,'
          changed = []
          for root in (Path('scripts'), Path('services/core/tests')):
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.ts', '.mts', '.mjs', '.js'}:
                      continue
                  text = path.read_text()
                  if old not in text:
                      continue
                  path.write_text(text.replace(old, new))
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No legacy Core reset remained to repair')
          print('\n'.join(changed))
          PY
          npx prettier --write scripts services/core/tests
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts services/core/tests
          git commit -m "test(core-m1): include content exports in shared Core resets"
          git push origin HEAD:agent/core-m1-ready-package-content-consumption
