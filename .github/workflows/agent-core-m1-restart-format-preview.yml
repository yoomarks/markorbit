name: Agent CORE-M1 Restart Format Preview

on:
  push:
    branches:
      - core-m1-ready-package-content-consumption

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format restart test
        run: pnpm prettier --write scripts/milestone2-core-restart.integration.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- scripts/milestone2-core-restart.integration.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/milestone2-core-restart.integration.test.ts
          git commit -m "style(core): format restart reliability test"
          git push origin HEAD:core-m1-ready-package-content-consumption
