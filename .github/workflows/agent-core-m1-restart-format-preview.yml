name: Agent CORE-M1 Restart Format Preview

on:
  push:
    branches:
      - core-m1-ready-package-content-consumption

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm prettier --write scripts/milestone2-core-restart.integration.test.ts
          git diff --no-ext-diff --unified=0 -- scripts/milestone2-core-restart.integration.test.ts
