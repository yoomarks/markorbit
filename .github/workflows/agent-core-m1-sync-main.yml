name: Agent CORE-M1 Rebase Cleanup

on:
  push:
    branches:
      - agent/core-m1-ready-package-content-consumption

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-m1-ready-package-content-consumption
          fetch-depth: 0
      - name: Rebuild CORE-M1 on merged PR 72 baseline
        run: python scripts/agent-core-m1-rebase-cleanup.py
