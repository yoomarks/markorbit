name: Agent CORE-M1 Tenant Cleanup

on:
  push:
    branches:
      - core-m1-ready-package-content-consumption

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Core tenant database cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/milestone2-tenant-isolation.integration.test.ts')
          text = path.read_text()
          old = 'DROP TABLE IF EXISTS knowledge_intakes,sessions,workspace_memberships,workspaces,users CASCADE; DROP SCHEMA IF EXISTS markorbit_persistence CASCADE'
          new = 'DROP TABLE IF EXISTS knowledge_intake_contents,knowledge_intakes,sessions,workspace_memberships,workspaces,users CASCADE; DROP SCHEMA IF EXISTS markorbit_persistence CASCADE'
          if old not in text:
              raise SystemExit('expected cleanup statement not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/milestone2-tenant-isolation.integration.test.ts
          git commit -m "test(core): clean ReadyPackage content table in tenant matrix"
          git push origin HEAD:core-m1-ready-package-content-consumption
