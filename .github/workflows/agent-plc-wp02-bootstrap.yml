name: Agent PLC WP02 Bootstrap

on:
  push:
    branches:
      - plc-wp-02-durable-content-preparation

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-02-durable-content-preparation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Refresh workspace lockfile
        run: pnpm install --lockfile-only
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Keep Lite test bootstrap inside its persistence boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/lite/tests/content-preparation-postgres.test.ts')
          text = path.read_text()
          old = """    const coreMigrations = await loadMigrationsForOwner(\n      migrationsDirectory,\n      migrationOwners,\n      '@markorbit/core-service'\n    );\n    const liteMigrations = await loadMigrationsForOwner(\n      migrationsDirectory,\n      migrationOwners,\n      '@markorbit/lite-service'\n    );\n    await migrate(database.getPool(), 'lite_content_test_core', coreMigrations);\n    await migrate(database.getPool(), 'lite_content_test', liteMigrations);\n"""
          new = """    await database.getPool().query(\n      'CREATE TABLE IF NOT EXISTS workspaces (workspace_id uuid PRIMARY KEY, name text NOT NULL, slug text NOT NULL UNIQUE)'\n    );\n    const liteMigrations = await loadMigrationsForOwner(\n      migrationsDirectory,\n      migrationOwners,\n      '@markorbit/lite-service'\n    );\n    await migrate(database.getPool(), 'lite_content_test', liteMigrations);\n"""
          if old not in text:
              raise SystemExit('Lite test bootstrap target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format WP02 files
        run: pnpm exec prettier --write services/lite infrastructure/persistence/migration-owners.json scripts/validate-workspace.mjs docs/tasks/MO-MVP-PLC-WP-02-DURABLE-CONTENT-PREPARATION.md
      - name: Validate boundaries
        run: pnpm validate:workspace && pnpm validate:persistence-boundaries
      - name: Validate Lite service
        run: pnpm --filter @markorbit/lite-service lint && pnpm --filter @markorbit/lite-service typecheck && pnpm --filter @markorbit/lite-service test && pnpm --filter @markorbit/lite-service build
      - name: Commit generated lockfile and formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml services/lite infrastructure/persistence/migration-owners.json scripts/validate-workspace.mjs docs/tasks/MO-MVP-PLC-WP-02-DURABLE-CONTENT-PREPARATION.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(plc): normalize WP02 workspace changes"
          git push origin HEAD:plc-wp-02-durable-content-preparation
