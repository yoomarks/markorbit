name: Brain BRN-004 Wire and Format

on:
  push:
    branches: [brain-brn-004-confidence-engine]

permissions:
  contents: write

jobs:
  wire-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain-brn-004-confidence-engine
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire confidence package surfaces
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const contractsPath = 'packages/contracts/package.json';
          const contracts = JSON.parse(fs.readFileSync(contractsPath, 'utf8'));
          contracts.exports['./brain-confidence'] = {
            types: './dist/brain-confidence.d.ts',
            import: './dist/brain-confidence.js',
            default: './dist/brain-confidence.js'
          };
          if (!contracts.scripts.build.includes('src/brain-confidence.ts')) {
            contracts.scripts.build = contracts.scripts.build.replace(
              'src/brain-evidence.ts ',
              'src/brain-evidence.ts src/brain-confidence.ts '
            );
          }
          fs.writeFileSync(contractsPath, JSON.stringify(contracts, null, 2) + '\n');

          const tsconfigPath = 'tsconfig.base.json';
          const tsconfig = JSON.parse(fs.readFileSync(tsconfigPath, 'utf8'));
          tsconfig.compilerOptions.paths['@markorbit/contracts/brain-confidence'] = [
            'packages/contracts/src/brain-confidence.ts'
          ];
          fs.writeFileSync(tsconfigPath, JSON.stringify(tsconfig, null, 2) + '\n');

          const corePath = 'services/core/package.json';
          const core = JSON.parse(fs.readFileSync(corePath, 'utf8'));
          if (!core.scripts.build.includes('src/brain-confidence-engine.ts')) {
            core.scripts.build = core.scripts.build.replace(
              'src/brain-evidence-resolver.ts',
              'src/brain-evidence-resolver.ts src/brain-confidence-engine.ts'
            );
          }
          core.exports['./brain-confidence-engine'] = {
            types: './dist/brain-confidence-engine.d.ts',
            import: './dist/brain-confidence-engine.js'
          };
          fs.writeFileSync(corePath, JSON.stringify(core, null, 2) + '\n');
          NODE
      - name: Format BRN-004 files
        run: |
          pnpm exec prettier --write \
            packages/contracts/package.json \
            packages/contracts/src/brain-evidence.ts \
            packages/contracts/src/brain-confidence.ts \
            packages/contracts/tests/brain-confidence.test.ts \
            services/core/package.json \
            services/core/src/brain-confidence-engine.ts \
            services/core/tests/brain-confidence-engine.test.ts \
            tsconfig.base.json
      - name: Commit wired and formatted files and remove one-shot workflow
        run: |
          rm .github/workflows/brain-brn-004-wire-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/package.json packages/contracts/src/brain-evidence.ts packages/contracts/src/brain-confidence.ts packages/contracts/tests/brain-confidence.test.ts services/core/package.json services/core/src/brain-confidence-engine.ts services/core/tests/brain-confidence-engine.test.ts tsconfig.base.json .github/workflows/brain-brn-004-wire-format.yml
          git commit -m "build(brain): wire and format BRN-004 confidence engine" || exit 0
          git push origin HEAD:brain-brn-004-confidence-engine
