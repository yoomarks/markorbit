name: Brain Foundation Prettier Autofix

on:
  push:
    branches:
      - brain-foundation-brn-000-002

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain-foundation-brn-000-002
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Brain Foundation files
        run: pnpm exec prettier --write docs/architecture/BRAIN-FOUNDATION-ARCHITECTURE.md packages/contracts/src/brain.ts services/core/src/brain-asset-registry.ts
      - name: Commit formatted files and remove one-shot workflow
        run: |
          rm .github/workflows/brain-foundation-prettier-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/BRAIN-FOUNDATION-ARCHITECTURE.md packages/contracts/src/brain.ts services/core/src/brain-asset-registry.ts .github/workflows/brain-foundation-prettier-autofix.yml
          git commit -m "style(brain): apply repository prettier" || exit 0
          git push origin HEAD:brain-foundation-brn-000-002
