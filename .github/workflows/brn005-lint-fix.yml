name: BRN005 one-shot lint fix

on:
  push:
    branches:
      - brain-brn-005-build-runtime
    paths:
      - .github/workflows/brn005-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain-brn-005-build-runtime
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint services/core/src/brain-build-runtime.ts --fix
      - run: pnpm exec prettier --write services/core/src/brain-build-runtime.ts
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/brn005-lint-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/core/src/brain-build-runtime.ts .github/workflows/brn005-lint-fix.yml
          git commit -m "fix(brain): remove redundant BRN-005 type assertions"
          git push origin HEAD:brain-brn-005-build-runtime
