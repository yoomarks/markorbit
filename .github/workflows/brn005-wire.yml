name: BRN005 one-shot wire

on:
  push:
    branches:
      - brain-brn-005-build-runtime
    paths:
      - .github/workflows/brn005-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain-brn-005-build-runtime
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire contracts and core runtime
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const contractsPath = 'packages/contracts/package.json';
          const contracts = JSON.parse(fs.readFileSync(contractsPath, 'utf8'));
          contracts.exports['./brain-build'] = {
            types: './dist/brain-build.d.ts',
            import: './dist/brain-build.js',
            default: './dist/brain-build.js'
          };
          contracts.scripts.build = contracts.scripts.build.replace(
            'src/brain-confidence.ts src/managed-ai-execution.ts',
            'src/brain-confidence.ts src/brain-build.ts src/managed-ai-execution.ts'
          );
          fs.writeFileSync(contractsPath, `${JSON.stringify(contracts, null, 2)}\n`);

          const corePath = 'services/core/package.json';
          const core = JSON.parse(fs.readFileSync(corePath, 'utf8'));
          core.scripts.build = core.scripts.build.replace(
            'src/brain-confidence-engine.ts --format',
            'src/brain-confidence-engine.ts src/brain-build-runtime.ts --format'
          );
          core.exports['./brain-build-runtime'] = {
            types: './dist/brain-build-runtime.d.ts',
            import: './dist/brain-build-runtime.js'
          };
          fs.writeFileSync(corePath, `${JSON.stringify(core, null, 2)}\n`);

          const tsconfigPath = 'tsconfig.base.json';
          const tsconfig = JSON.parse(fs.readFileSync(tsconfigPath, 'utf8'));
          tsconfig.compilerOptions.paths['@markorbit/contracts/brain-build'] = [
            'packages/contracts/src/brain-build.ts'
          ];
          fs.writeFileSync(tsconfigPath, `${JSON.stringify(tsconfig, null, 2)}\n`);
          NODE
      - name: Format BRN-005 files
        run: pnpm exec prettier --write packages/contracts/package.json packages/contracts/src/brain-build.ts services/core/package.json services/core/src/brain-build-runtime.ts services/core/tests/brain-build-runtime.test.ts tsconfig.base.json
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/brn005-wire.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/contracts/package.json packages/contracts/src/brain-build.ts services/core/package.json services/core/src/brain-build-runtime.ts services/core/tests/brain-build-runtime.test.ts tsconfig.base.json .github/workflows/brn005-wire.yml
          git commit -m "build(brain): wire and format BRN-005 runtime"
          git push origin HEAD:brain-brn-005-build-runtime
