name: BRN006 one-shot verify

on:
  push:
    branches:
      - brain-brn-006-registry-admission
    paths:
      - .github/workflows/brn006-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain-brn-006-registry-admission
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/core/src/brain-asset-registry.ts services/core/tests/brain-build-registry-admission.test.ts
      - run: pnpm exec eslint services/core/src/brain-asset-registry.ts services/core/tests/brain-build-registry-admission.test.ts
      - run: pnpm --filter @markorbit/core test -- brain-asset-registry.test.ts brain-build-registry-admission.test.ts
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/brn006-verify.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/core/src/brain-asset-registry.ts services/core/tests/brain-build-registry-admission.test.ts .github/workflows/brn006-verify.yml
          git commit -m "test(brain): verify and format BRN-006 registry admission"
          git push origin HEAD:brain-brn-006-registry-admission
