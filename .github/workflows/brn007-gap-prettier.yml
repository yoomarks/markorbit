name: BRN007 Gap Prettier
on:
  push:
    branches: [brain-brn-007-gap-registry]
    paths: ['.github/workflows/brn007-gap-prettier.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain-brn-007-gap-registry
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/core/src/brain-gap-registry.ts services/core/tests/brain-gap-registry.test.ts
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/core/src/brain-gap-registry.ts services/core/tests/brain-gap-registry.test.ts
          git commit -m 'style(brain): format BRN-007 Gap Registry'
          git push origin HEAD:brain-brn-007-gap-registry
