name: BRN007 finalize nonworkflow wiring

on:
  push:
    branches: [brain-brn-007-postgres-registry]
    paths:
      - '.github/workflows/brn007-restore-nonworkflow.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain-brn-007-postgres-registry
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Wire BRN-007 non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ownersPath = 'infrastructure/persistence/migration-owners.json';
          const owners = JSON.parse(fs.readFileSync(ownersPath, 'utf8'));
          owners.namespaces.core_brain_registry = '@markorbit/core-service';
          owners.migrations['0071_core_brain_registry'] = '@markorbit/core-service';
          fs.writeFileSync(ownersPath, JSON.stringify(owners, null, 2) + '\n');

          const packagePath = 'services/core/package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          if (!pkg.scripts.build.includes('src/brain-asset-registry-postgres.ts')) {
            pkg.scripts.build = pkg.scripts.build.replace('src/brain-asset-registry.ts', 'src/brain-asset-registry.ts src/brain-asset-registry-postgres.ts');
          }
          pkg.scripts['test:brain-registry:postgres'] = 'vitest run tests/brain-asset-registry-postgres.test.ts';
          pkg.exports['./brain-asset-registry-postgres'] = {
            types: './dist/brain-asset-registry-postgres.d.ts',
            import: './dist/brain-asset-registry-postgres.js'
          };
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');

          const registryPath = 'services/core/src/brain-asset-registry.ts';
          let registry = fs.readFileSync(registryPath, 'utf8');
          if (!registry.includes("'PERSISTENCE_UNAVAILABLE'")) {
            registry = registry.replace("  | 'BUILD_IDENTITY_CONFLICT';", "  | 'BUILD_IDENTITY_CONFLICT'\n  | 'PERSISTENCE_UNAVAILABLE';");
          }
          fs.writeFileSync(registryPath, registry);
          NODE

          pnpm install --frozen-lockfile
          pnpm exec prettier --write infrastructure/persistence/migration-owners.json services/core/package.json services/core/src/brain-asset-registry.ts services/core/src/brain-asset-registry-postgres.ts services/core/tests/brain-asset-registry-postgres.test.ts
          pnpm exec eslint services/core/src/brain-asset-registry.ts services/core/src/brain-asset-registry-postgres.ts services/core/tests/brain-asset-registry-postgres.test.ts
          pnpm --filter @markorbit/core-service typecheck

          git config user.name yoomarks
          git config user.email lukeluccas6292643@gmail.com
          git add infrastructure/persistence/migration-owners.json services/core/package.json services/core/src/brain-asset-registry.ts services/core/src/brain-asset-registry-postgres.ts services/core/tests/brain-asset-registry-postgres.test.ts
          git commit -m 'BRN-007: wire durable Brain Registry on latest main'
          git push origin HEAD:brain-brn-007-postgres-registry
