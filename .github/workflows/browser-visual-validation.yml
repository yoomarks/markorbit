name: Browser and Visual Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  milestone-real-runtime:
    name: Milestone Real Runtime Validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:workspace
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:runtime
      - run: pnpm test:story-matrix
      - run: pnpm test:gateway-inventory
      - run: pnpm test:negative-path-matrix
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:storybook-matrix
      - run: pnpm test:storybook-index
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: CI=1 pnpm test:e2e
      - run: CI=1 pnpm test:e2e:real-runtime
      - run: CI=1 pnpm test:visual
      - name: Ensure generated artifacts are not tracked
        run: |
          if git ls-files | rg '\.(png|jpe?g|webm|zip|trace)$|(^|/)(test-results|playwright-report|runtime-logs|playwright-screenshots|screenshots?)(/|$)'; then
            echo 'Generated artifacts must not be tracked.' >&2
            exit 1
          fi
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-real-runtime-failure
          path: |
            .artifacts/milestone-runtime
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build products
        run: pnpm -w build

      - name: Run browser and visual validation
        run: pnpm test:e2e

      - name: Run focused Formal Matter desktop and mobile acceptance
        run: pnpm test:formal-matter:browser

      - name: Generate focused visual evidence
        run: pnpm test:visual

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: playwright-screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: warn
          retention-days: 14
