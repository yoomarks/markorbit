name: C2A Format Diagnostic

on:
  pull_request:
    paths:
      - 'packages/contracts/src/email-campaign.ts'
      - 'packages/contracts/tests/email-campaign.test.ts'
      - '.github/workflows/c2a-format-diagnostic.yml'

permissions:
  contents: read

jobs:
  format-diff:
    if: github.head_ref == 'channels/1340-campaign-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show exact Prettier diff
        run: |
          pnpm exec prettier --write packages/contracts/src/email-campaign.ts packages/contracts/tests/email-campaign.test.ts
          git diff -- packages/contracts/src/email-campaign.ts packages/contracts/tests/email-campaign.test.ts
