name: Capability 397 Format Probe

on:
  pull_request:
    paths:
      - '.github/workflows/capability-397-format-probe.yml'
      - 'services/capability-engine/src/current-source-admission.ts'
      - 'services/capability-engine/tests/current-source-admission.test.ts'

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write \
            services/capability-engine/src/current-source-admission.ts \
            services/capability-engine/tests/current-source-admission.test.ts
          git diff -- \
            services/capability-engine/src/current-source-admission.ts \
            services/capability-engine/tests/current-source-admission.test.ts
