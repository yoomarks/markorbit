name: Capability 397 Format Probe

on:
  pull_request:
    paths:
      - '.github/workflows/capability-397-format-probe.yml'
      - 'services/capability-engine/src/current-source-admission.ts'
      - 'services/capability-engine/tests/current-source-admission.test.ts'

permissions:
  contents: write

jobs:
  prettier-apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier formatting
        run: |
          pnpm exec prettier --write \
            services/capability-engine/src/current-source-admission.ts \
            services/capability-engine/tests/current-source-admission.test.ts
          if git diff --quiet -- \
            services/capability-engine/src/current-source-admission.ts \
            services/capability-engine/tests/current-source-admission.test.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            services/capability-engine/src/current-source-admission.ts \
            services/capability-engine/tests/current-source-admission.test.ts
          git commit -m 'style(capability): format current source admission'
          git push origin HEAD:${{ github.head_ref }}
