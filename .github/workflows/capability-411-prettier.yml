name: Capability 411 Prettier Apply

on:
  push:
    branches:
      - capability/411-runtime-quality-observation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capability/411-runtime-quality-observation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: >-
          pnpm exec prettier --write
          services/capability-engine/src/capability-runtime-quality-telemetry.ts
          services/capability-engine/tests/capability-runtime-quality-telemetry.test.ts
      - name: Commit formatting only when needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/capability-engine/src/capability-runtime-quality-telemetry.ts services/capability-engine/tests/capability-runtime-quality-telemetry.test.ts
          git commit -m "[CAPABILITY-P1] Apply repository formatting"
          git push origin HEAD:capability/411-runtime-quality-observation
