name: Capability 418 Quality Fix

on:
  push:
    branches:
      - capability/418-demand-coverage-audit

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capability/418-demand-coverage-audit
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply owner-local ESLint fixes
        run: >-
          pnpm --filter @markorbit/capability-engine exec eslint
          src/capability-demand-coverage.ts
          tests/capability-demand-coverage.test.ts
          --fix
      - name: Apply repository Prettier
        run: >-
          pnpm exec prettier --write
          services/capability-engine/src/capability-demand-coverage.ts
          services/capability-engine/tests/capability-demand-coverage.test.ts
      - name: Commit owner-local fixes only when needed
        run: |
          if git diff --quiet; then
            echo "No quality fixes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/capability-engine/src/capability-demand-coverage.ts services/capability-engine/tests/capability-demand-coverage.test.ts
          git commit -m "[CAPABILITY-P1] Apply lint and repository formatting"
          git push origin HEAD:capability/418-demand-coverage-audit
