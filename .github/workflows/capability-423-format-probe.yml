name: Capability 423 format probe

on:
  push:
    branches:
      - capability/423-catalog-binding-integrity

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capability/423-catalog-binding-integrity
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact Capability 423 files
        run: |
          pnpm exec prettier --write \
            services/capability-engine/src/capability-catalog-integrity.ts \
            services/capability-engine/src/runtime-capability-catalog.ts \
            services/capability-engine/tests/capability-catalog-integrity.test.ts \
            services/capability-engine/tests/runtime-capability-catalog.test.ts
          pnpm exec prettier --check \
            services/capability-engine/src/capability-catalog-integrity.ts \
            services/capability-engine/src/runtime-capability-catalog.ts \
            services/capability-engine/tests/capability-catalog-integrity.test.ts \
            services/capability-engine/tests/runtime-capability-catalog.test.ts
      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            services/capability-engine/src/capability-catalog-integrity.ts \
            services/capability-engine/src/runtime-capability-catalog.ts \
            services/capability-engine/tests/capability-catalog-integrity.test.ts \
            services/capability-engine/tests/runtime-capability-catalog.test.ts
          git commit -m "chore: format capability 423 files"
          git push origin HEAD:capability/423-catalog-binding-integrity
