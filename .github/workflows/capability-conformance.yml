name: Capability Runtime Conformance

on:
  pull_request:
    paths:
      - 'packages/contracts/src/capability-runtime.ts'
      - 'services/capability-engine/src/capability-runtime.ts'
      - 'services/capability-engine/tests/capability-runtime-conformance-harness.ts'
      - 'services/capability-engine/tests/capability-runtime-conformance.test.ts'
      - '.github/workflows/capability-conformance.yml'
  push:
    branches: [main]
    paths:
      - 'packages/contracts/src/capability-runtime.ts'
      - 'services/capability-engine/src/capability-runtime.ts'
      - 'services/capability-engine/tests/capability-runtime-conformance-harness.ts'
      - 'services/capability-engine/tests/capability-runtime-conformance.test.ts'
      - '.github/workflows/capability-conformance.yml'

permissions:
  contents: write

concurrency:
  group: capability-runtime-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Commit temporary #815 formatter output
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 837
        run: |
          pnpm exec prettier --write apps/gateway/src/auth.ts apps/gateway/src/mgsn-http.ts apps/gateway/tests/mgsn-governed-network-http.test.ts services/core/src/governed-human-action-receipt.ts services/core/src/index.ts services/core/tests/governed-human-action-receipt-http.test.ts
          if git diff --quiet -- apps/gateway/src/auth.ts apps/gateway/src/mgsn-http.ts apps/gateway/tests/mgsn-governed-network-http.test.ts services/core/src/governed-human-action-receipt.ts services/core/src/index.ts services/core/tests/governed-human-action-receipt-http.test.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/gateway/src/auth.ts apps/gateway/src/mgsn-http.ts apps/gateway/tests/mgsn-governed-network-http.test.ts services/core/src/governed-human-action-receipt.ts services/core/src/index.ts services/core/tests/governed-human-action-receipt-http.test.ts
          git commit -m 'style: format governed receipt implementation'
          git push origin HEAD:${{ github.head_ref }}
      - name: Build Capability dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/capability-engine...
      - name: Run reusable runtime conformance suite
        run: pnpm --filter @markorbit/capability-engine exec vitest run tests/capability-runtime-conformance.test.ts
      - name: Typecheck Capability Engine
        run: pnpm --filter @markorbit/capability-engine typecheck
