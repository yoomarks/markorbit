name: Capability Runtime Durable Replay

on:
  pull_request:
    paths:
      - '.github/workflows/capability-runtime-durable-replay.yml'
      - 'services/capability-engine/src/capability-runtime-replay-store.ts'
      - 'services/capability-engine/tests/capability-runtime-replay.test.ts'
      - 'services/capability-engine/tests/capability-runtime-replay-postgres.test.ts'

permissions:
  contents: write

concurrency:
  group: capability-runtime-durable-replay-lint-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-fix-once:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic lint fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          store = Path('services/capability-engine/src/capability-runtime-replay-store.ts')
          text = store.read_text()
          needles = [
              "  async inspect(\n    input: Readonly<CapabilityRuntimeReplayLookupV1>\n  ): Promise<CapabilityRuntimeReplayDecisionV1> {\n",
              "  async claim(\n    input: Readonly<CapabilityRuntimeReplayClaimV1>\n  ): Promise<CapabilityRuntimeReplayClaimDecisionV1> {\n",
              "  async complete(input: Readonly<CapabilityRuntimeReplayCompletionV1>): Promise<void> {\n",
              "  async release(input: Readonly<CapabilityRuntimeReplayClaimV1>): Promise<void> {\n",
          ]
          for needle in needles:
              if needle not in text:
                  raise SystemExit(f'Expected in-memory method not found: {needle.splitlines()[0]}')
              text = text.replace(needle, needle + '    await Promise.resolve();\n', 1)
          store.write_text(text)

          for filename in [
              'services/capability-engine/tests/capability-runtime-replay.test.ts',
              'services/capability-engine/tests/capability-runtime-replay-postgres.test.ts',
          ]:
              path = Path(filename)
              text = path.read_text()
              text = text.replace('vi.fn(async () => (', 'vi.fn(() => Promise.resolve(')
              path.write_text(text)
          PY
          pnpm exec prettier --write \
            services/capability-engine/src/capability-runtime-replay-store.ts \
            services/capability-engine/tests/capability-runtime-replay.test.ts \
            services/capability-engine/tests/capability-runtime-replay-postgres.test.ts
          pnpm --filter @markorbit/capability-engine lint
      - name: Commit lint fixes when changed
        run: |
          if git diff --quiet -- \
            services/capability-engine/src/capability-runtime-replay-store.ts \
            services/capability-engine/tests/capability-runtime-replay.test.ts \
            services/capability-engine/tests/capability-runtime-replay-postgres.test.ts; then
            echo 'No lint fixes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/capability-engine/src/capability-runtime-replay-store.ts \
            services/capability-engine/tests/capability-runtime-replay.test.ts \
            services/capability-engine/tests/capability-runtime-replay-postgres.test.ts
          git commit -m 'fix: satisfy durable replay lint invariants'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
