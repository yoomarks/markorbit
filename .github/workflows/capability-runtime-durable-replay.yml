name: Capability Runtime Durable Replay

on:
  pull_request:
    paths:
      - '.github/workflows/capability-runtime-durable-replay.yml'
      - 'services/capability-engine/src/capability-runtime-replay-store.ts'
      - 'services/capability-engine/src/durable-governed-capability-runtime.ts'
      - 'services/capability-engine/tests/capability-runtime-replay.test.ts'
      - 'services/capability-engine/tests/capability-runtime-replay-postgres.test.ts'

permissions:
  contents: write

concurrency:
  group: capability-runtime-durable-replay-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-once:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format WP07B files with repository Prettier
        run: |
          pnpm exec prettier --write \
            services/capability-engine/src/capability-runtime-replay-store.ts \
            services/capability-engine/src/durable-governed-capability-runtime.ts \
            services/capability-engine/tests/capability-runtime-replay.test.ts \
            services/capability-engine/tests/capability-runtime-replay-postgres.test.ts
      - name: Commit formatted files when changed
        run: |
          if git diff --quiet -- \
            services/capability-engine/src/capability-runtime-replay-store.ts \
            services/capability-engine/src/durable-governed-capability-runtime.ts \
            services/capability-engine/tests/capability-runtime-replay.test.ts \
            services/capability-engine/tests/capability-runtime-replay-postgres.test.ts; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/capability-engine/src/capability-runtime-replay-store.ts \
            services/capability-engine/src/durable-governed-capability-runtime.ts \
            services/capability-engine/tests/capability-runtime-replay.test.ts \
            services/capability-engine/tests/capability-runtime-replay-postgres.test.ts
          git commit -m 'style: format durable replay implementation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
