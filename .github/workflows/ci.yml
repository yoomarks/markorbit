name: validation

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-wp07:
    name: format-wp07
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format WP07 with repository Prettier
        run: pnpm exec prettier --write services/lite/src/trademark-asset-ai-guide.ts services/lite/tests/trademark-asset-ai-guide.test.ts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes needed"
            exit 0
          fi
          git config user.name "markorbit-ci"
          git config user.email "markorbit-ci@users.noreply.github.com"
          git add services/lite/src/trademark-asset-ai-guide.ts services/lite/tests/trademark-asset-ai-guide.test.ts
          git commit -m "M10 WP07: apply exact repository formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
