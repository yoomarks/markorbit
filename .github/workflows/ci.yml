name: validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  wire-trademark-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Wire durable Trademark Asset surface
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/lite-web/src/App.tsx')
          text = path.read_text()
          replacements = [
            (
              "import { CapabilityCenter } from './features/capability/CapabilityCenter.js';",
              "import { CapabilityCenter } from './features/capability/CapabilityCenter.js';\nimport { TrademarkAssetPortfolio } from './features/trademark-assets/TrademarkAssetPortfolio.js';"
            ),
            (
              "  | 'matters'\n  | 'capability'",
              "  | 'matters'\n  | 'trademarks'\n  | 'capability'"
            ),
            (
              "      else if (window.location.hash === '#matters') setSurface('matters');\n      else if (window.location.hash === '#capability') setSurface('capability');",
              "      else if (window.location.hash === '#matters') setSurface('matters');\n      else if (window.location.hash === '#trademarks') setSurface('trademarks');\n      else if (window.location.hash === '#capability') setSurface('capability');"
            ),
            (
              "                  : surface === 'matters'\n                    ? label === 'Matters'\n                    : surface === 'capability'",
              "                  : surface === 'matters'\n                    ? label === 'Matters'\n                    : surface === 'trademarks'\n                      ? label === 'Trademarks'\n                      : surface === 'capability'"
            ),
            (
              "            surface === 'matters' || surface === 'today' || surface === 'capability'",
              "            surface === 'matters' ||\n            surface === 'today' ||\n            surface === 'trademarks' ||\n            surface === 'capability'"
            ),
            (
              "              {surface === 'matters' || surface === 'today' || surface === 'capability'",
              "              {surface === 'matters' ||\n              surface === 'today' ||\n              surface === 'trademarks' ||\n              surface === 'capability'"
            ),
            (
              "        {surface !== 'matters' && surface !== 'today' && surface !== 'capability' && (",
              "        {surface !== 'matters' &&\n          surface !== 'today' &&\n          surface !== 'trademarks' &&\n          surface !== 'capability' && ("
            ),
            (
              "        ) : surface === 'capability' ? (\n          activeWorkspaceId ? (\n            <CapabilityCenter workspaceId={activeWorkspaceId} />\n          ) : (\n            <ErrorState\n              title=\"Select a Workspace\"\n              description=\"A valid Workspace context is required to load your private Capability Center.\"\n            />\n          )\n        ) : surface === 'customers' ? (",
              "        ) : surface === 'trademarks' ? (\n          activeWorkspaceId ? (\n            <TrademarkAssetPortfolio workspaceId={activeWorkspaceId} />\n          ) : (\n            <ErrorState\n              title=\"Select a Workspace\"\n              description=\"A valid Workspace context is required to load durable Trademark Assets.\"\n            />\n          )\n        ) : surface === 'capability' ? (\n          activeWorkspaceId ? (\n            <CapabilityCenter workspaceId={activeWorkspaceId} />\n          ) : (\n            <ErrorState\n              title=\"Select a Workspace\"\n              description=\"A valid Workspace context is required to load your private Capability Center.\"\n            />\n          )\n        ) : surface === 'customers' ? ("
            )
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one App.tsx match, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/lite-web/src/App.tsx
      - name: Commit exact App wiring
        run: |
          git config user.name markorbit-ci
          git config user.email markorbit-ci@users.noreply.github.com
          git add apps/lite-web/src/App.tsx
          if git diff --cached --quiet; then
            echo 'No App wiring changes produced.'
            exit 1
          fi
          git commit -m 'M10 WP08: wire durable Trademark Asset navigation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
