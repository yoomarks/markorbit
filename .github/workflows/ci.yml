name: validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      PERSISTENCE_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_persistence_test
      DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_persistence_test
      DB_MIGRATION_NAMESPACE: persistence_foundation
      DB_TEST_DATABASE: markorbit_persistence_test
      PERSISTENCE_TEST_REQUIRED: '1'
      IDENTITY_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_identity_test
      IDENTITY_POSTGRES_TEST_REQUIRED: '1'
      AUTH_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_auth_test
      AUTH_POSTGRES_TEST_REQUIRED: '1'
      MARKREG_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_markreg_test
      MARKREG_POSTGRES_TEST_REQUIRED: '1'
      MARKREG_AUDIT_POSTGRES_REQUIRED: '1'
      MARKREG_AUDIT_HTTP_REQUIRED: '1'
      EXECUTION_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_execution_test
      EXECUTION_POSTGRES_TEST_REQUIRED: '1'
      MO_INTERNAL_SERVICE_SECRET: task-019-ci-internal-secret-32-bytes-minimum
      MO_CSRF_SECRET: task-019-ci-csrf-secret-32-bytes-minimum
      WEB_ORIGINS: https://test.markorbit.local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create isolated suite databases
        env:
          PGPASSWORD: markorbit-test-only
        run: |
          psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE markorbit_persistence_test;
          CREATE DATABASE markorbit_identity_test;
          CREATE DATABASE markorbit_auth_test;
          CREATE DATABASE markorbit_markreg_test;
          CREATE DATABASE markorbit_execution_test;
          SQL
      - run: pnpm db:test:bootstrap
      - run: pnpm db:migrate
      - run: pnpm db:migrate:status
      - run: pnpm db:migrate:verify
      - run: pnpm test:persistence
      - run: pnpm test:identity:postgres
      - run: pnpm test:identity:postgres
      - run: pnpm test:auth:postgres
      - run: pnpm test:auth:postgres
      - run: pnpm test:auth
      - run: pnpm test:auth:http
      - run: pnpm test:customer-confirmation
      - run: pnpm test:customer-confirmation:postgres
      - run: pnpm test:customer-confirmation:postgres
      - run: pnpm test:customer-confirmation:http
      - run: pnpm test:lite-matter:postgres
      - run: pnpm test:lite-matter:postgres
      - run: pnpm test:lite-matter:http
      - run: pnpm test:professional-review:postgres
      - run: pnpm test:professional-review:postgres
      - run: pnpm test:professional-review:http
      - run: pnpm test:document-package:postgres
      - run: pnpm test:document-package:postgres
      - run: pnpm test:document-package:http
      - run: pnpm test:audit-idempotency:postgres
      - run: pnpm test:audit-idempotency:postgres
      - run: pnpm test:audit-idempotency:http
      - run: pnpm test:audit-idempotency:restart
      - run: pnpm test:auth:http
      - run: pnpm test:gateway-inventory

  professional-review-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_review_browser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_review_browser"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      MARKREG_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_review_browser
      MARKREG_POSTGRES_TEST_REQUIRED: '1'
      MARKREG_DOCUMENT_PACKAGE_POSTGRES_REQUIRED: '1'
      EXECUTION_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_execution_review_browser
      EXECUTION_POSTGRES_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create Execution browser database
        env:
          PGPASSWORD: markorbit-test-only
        run: psql -h 127.0.0.1 -U markorbit_test -d markorbit_review_browser -v ON_ERROR_STOP=1 -c 'CREATE DATABASE markorbit_execution_review_browser;'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:professional-review:browser
      - run: pnpm exec playwright test --config playwright.document-package-real-runtime.config.ts --project document-package-desktop --reporter=line
      - run: pnpm exec playwright test --config playwright.document-package-real-runtime.config.ts --project document-package-mobile-390 --reporter=line
      - run: pnpm exec playwright test --config playwright.document-package-real-runtime.config.ts --reporter=line
      - run: pnpm test:document-package:no-interception
      - run: node --test scripts/playwright-suite-boundary.test.mjs

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm check
