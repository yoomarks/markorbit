name: validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-wp08:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format WP08 with repository Prettier
        run: |
          pnpm exec prettier --write \
            apps/lite-web/src/features/trademark-assets/TrademarkAssetPortfolio.tsx \
            apps/lite-web/src/features/trademark-assets/TrademarkAssetWorkspace.tsx \
            services/lite/src/trademark-asset-http.ts
      - name: Commit exact formatter output
        run: |
          git config user.name markorbit-ci
          git config user.email markorbit-ci@users.noreply.github.com
          git add \
            apps/lite-web/src/features/trademark-assets/TrademarkAssetPortfolio.tsx \
            apps/lite-web/src/features/trademark-assets/TrademarkAssetWorkspace.tsx \
            services/lite/src/trademark-asset-http.ts
          if git diff --cached --quiet; then
            echo 'No formatter changes produced.'
            exit 1
          fi
          git commit -m 'M10 WP08: apply exact repository formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
