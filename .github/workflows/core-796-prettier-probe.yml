name: Core 796 Prettier Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target files
        run: |
          pnpm exec prettier --write \
            services/capability-engine/src/capability-cognitive-read.ts \
            services/capability-engine/tests/capability-cognitive-read-policy-content.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: core-796-prettier-output
          path: |
            services/capability-engine/src/capability-cognitive-read.ts
            services/capability-engine/tests/capability-cognitive-read-policy-content.test.ts
          if-no-files-found: error
