name: Core 809 Prettier Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target files
        run: |
          pnpm exec prettier --write \
            services/capability-engine/tests/capability-cognitive-read-catalog-integrity.test.ts \
            services/capability-engine/tests/capability-cognitive-read-http.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: core-809-prettier-output
          path: |
            services/capability-engine/tests/capability-cognitive-read-catalog-integrity.test.ts
            services/capability-engine/tests/capability-cognitive-read-http.test.ts
