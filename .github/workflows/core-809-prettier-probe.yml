name: Core 809 Prettier Probe

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/core-809-prettier-probe
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and persist target files
        run: |
          pnpm exec prettier --write \
            services/capability-engine/tests/capability-cognitive-read-catalog-integrity.test.ts \
            services/capability-engine/tests/capability-cognitive-read-http.test.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            services/capability-engine/tests/capability-cognitive-read-catalog-integrity.test.ts \
            services/capability-engine/tests/capability-cognitive-read-http.test.ts
          git rm .github/workflows/core-809-prettier-probe.yml
          git commit -m "[VOID] persist Core 809 Prettier output"
          git push origin HEAD:tmp/core-809-prettier-probe
