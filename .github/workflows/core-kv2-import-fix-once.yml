name: Core KV2 Import Fix Once

on:
  push:
    branches:
      - core-kv2-wp01-02

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core-kv2-wp01-02
      - name: Re-export V2 contract and normalize Core imports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('packages/contracts/src/index.ts')
          text = index.read_text()
          export = "export * from './knowledge-ready-package-v2.js';\n"
          if export not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += export
              index.write_text(text)

          files = [
              Path('services/core/src/index.ts'),
              Path('services/core/src/knowledge-v2-delivery.ts'),
              Path('services/core/src/knowledge-v2-ingress.ts'),
              Path('services/core/tests/knowledge-v2-delivery-http.test.ts'),
              Path('services/core/tests/knowledge-v2-delivery-postgres.test.ts'),
          ]
          for path in files:
              value = path.read_text()
              value = value.replace("from '@markorbit/contracts/knowledge-ready-package-v2';", "from '@markorbit/contracts';")
              path.write_text(value)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/index.ts services/core/src/index.ts services/core/src/knowledge-v2-delivery.ts services/core/src/knowledge-v2-ingress.ts services/core/tests/knowledge-v2-delivery-http.test.ts services/core/tests/knowledge-v2-delivery-postgres.test.ts
          git commit -m "fix(core-kv2): resolve V2 contract through root export"
          git push origin HEAD:core-kv2-wp01-02
