name: Core KV2 Milestone2 Migration Fix Once

on:
  push:
    branches:
      - core-kv2-wp01-02

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core-kv2-wp01-02
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Extend Milestone 2 migration ownership evidence for Core V2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/milestone2-migrations.integration.test.ts')
          text = path.read_text()

          old_tables = "    'knowledge_intakes',\n    'knowledge_intake_contents'\n"
          new_tables = "    'knowledge_intakes',\n    'knowledge_intake_contents',\n    'knowledge_v2_deliveries'\n"
          if new_tables not in text:
              if old_tables not in text:
                  raise SystemExit('Core owned-table expectation anchor not found')
              text = text.replace(old_tables, new_tables, 1)

          old_count = "expect(sets.reduce((count, set) => count + set.size, 0)).toBe(18);"
          new_count = "expect(sets.reduce((count, set) => count + set.size, 0)).toBe(19);"
          if new_count not in text:
              if old_count not in text:
                  raise SystemExit('owner migration count anchor not found')
              text = text.replace(old_count, new_count, 1)

          anchor = "    expect(sets[0]).toContain('0038_core_knowledge_intake_contents');\n"
          extra = "    expect(sets[0]).toContain('0048_core_knowledge_v2_deliveries');\n"
          if extra not in text:
              if anchor not in text:
                  raise SystemExit('Core migration ownership assertion anchor not found')
              text = text.replace(anchor, anchor + extra, 1)

          path.write_text(text)
          PY
          pnpm exec prettier --write scripts/milestone2-migrations.integration.test.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/milestone2-migrations.integration.test.ts
          git commit -m "test(core-kv2): include V2 ledger in migration reliability matrix"
          git push origin HEAD:core-kv2-wp01-02
