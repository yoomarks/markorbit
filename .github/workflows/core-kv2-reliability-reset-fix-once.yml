name: Core KV2 Reliability Reset Fix Once

on:
  push:
    branches:
      - core-kv2-wp01-02

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core-kv2-wp01-02
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Extend every scripted Core reset that reapplies owned migrations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = 'DROP TABLE IF EXISTS knowledge_intake_contents,knowledge_intakes,sessions,workspace_memberships,workspaces,users CASCADE; DROP SCHEMA IF EXISTS markorbit_persistence CASCADE'
          new = 'DROP TABLE IF EXISTS knowledge_v2_deliveries,knowledge_intake_contents,knowledge_intakes,sessions,workspace_memberships,workspaces,users CASCADE; DROP SCHEMA IF EXISTS markorbit_persistence CASCADE'
          touched = []
          for path in sorted(Path('scripts').rglob('*')):
              if not path.is_file() or path.suffix not in {'.ts', '.mjs', '.js'}:
                  continue
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new))
                  touched.append(str(path))
          if not touched:
              raise SystemExit('No scripted Core reset boundary needed updating')
          print('Updated Core reset boundaries:')
          print('\n'.join(touched))
          Path('/tmp/core-kv2-reset-files.txt').write_text('\n'.join(touched) + '\n')
          PY
          mapfile -t files < /tmp/core-kv2-reset-files.txt
          pnpm exec prettier --write "${files[@]}"
      - name: Commit reset-boundary repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts
          git commit -m "test(core-kv2): include V2 ledger in scripted Core resets"
          git push origin HEAD:core-kv2-wp01-02
