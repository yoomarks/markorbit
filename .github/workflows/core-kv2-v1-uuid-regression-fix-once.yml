name: Core KV2 V1 UUID Regression Fix Once

on:
  push:
    branches:
      - core-kv2-wp01-02

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core-kv2-wp01-02
      - name: Restore the canonical UUID boundary exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('services/core/src/index.ts')
          text = path.read_text()
          broken = "/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/iu.test(value);"
          correct = "/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/iu.test(value);"
          if correct in text:
              raise SystemExit(0)
          if broken not in text:
              raise SystemExit('expected broken UUID boundary not found')
          path.write_text(text.replace(broken, correct, 1))
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/core/src/index.ts
          git commit -m "fix(core-kv2): preserve V1 canonical UUID validation"
          git push origin HEAD:core-kv2-wp01-02
