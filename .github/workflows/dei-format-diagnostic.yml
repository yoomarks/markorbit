name: DEI format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and emit exact files
        run: |
          files=(
            apps/gateway/src/data-engine-http.ts
            apps/gateway/tests/data-engine-http.test.ts
            packages/contracts/src/data-engine.ts
            packages/contracts/tests/data-engine-contract.test.ts
          )
          pnpm exec prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            printf 'DEI_FORMAT::%s::' "$file"
            base64 -w0 "$file"
            printf '\n'
          done
