name: K-CASE-002 Format Once

on:
  push:
    branches:
      - issue-244-markreg-knowledge-case-producer

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-244-markreg-knowledge-case-producer
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format K-CASE-002 files
        run: >-
          pnpm exec prettier --write
          services/markreg/tests/knowledge-case-promotion-postgres.test.ts
          services/markreg/tests/formal-matter-postgres.test.ts
          .github/workflows/markreg-knowledge-case-promotion.yml
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/markreg/tests/knowledge-case-promotion-postgres.test.ts services/markreg/tests/formal-matter-postgres.test.ts .github/workflows/markreg-knowledge-case-promotion.yml
          git commit -m "style: format K-CASE-002 durability acceptance"
          git push origin HEAD:issue-244-markreg-knowledge-case-producer
