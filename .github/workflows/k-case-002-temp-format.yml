name: K-CASE-002 Temporary Format

on:
  push:
    branches:
      - issue-244-markreg-knowledge-case-producer
    paths:
      - '.github/workflows/k-case-002-temp-format.yml'
      - 'services/markreg/src/knowledge-case-promotion-postgres.ts'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-244-markreg-knowledge-case-producer
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact K-CASE-002 persistence file
        run: pnpm exec prettier --write services/markreg/src/knowledge-case-promotion-postgres.ts
      - name: Commit formatter output when needed
        run: |
          if git diff --quiet -- services/markreg/src/knowledge-case-promotion-postgres.ts; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/markreg/src/knowledge-case-promotion-postgres.ts
          git commit -m 'style: format K-CASE-002 promotion persistence'
          git push origin HEAD:issue-244-markreg-knowledge-case-producer
