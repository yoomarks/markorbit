name: Knowledge Core Cross Repo E2E

on:
  pull_request:
    paths:
      - 'services/core/**'
      - 'packages/**'
      - 'infrastructure/**'
      - 'tests/integration/knowledge/**'
      - '.github/workflows/knowledge-core-cross-repo-e2e.yml'
      - 'docs/integrations/**'

jobs:
  knowledge-core-e2e:
    name: Knowledge Provider + MarkOrbit Consumer Acceptance
    runs-on: ubuntu-latest
    env:
      KNOWLEDGE_PROTOCOL: ReadyPackage-V2
      KNOWLEDGE_PROVIDER_REPO: yoomarks/markorbit-knowledge
      PRODUCTION_ACTIVATION: 'false'

    steps:
      - name: Checkout MarkOrbit consumer
        uses: actions/checkout@v4

      - name: Checkout Knowledge provider source
        uses: actions/checkout@v4
        with:
          repository: yoomarks/markorbit-knowledge
          path: knowledge-provider
          fetch-depth: 1

      - name: Record cross repo boundary
        run: |
          echo "provider=${KNOWLEDGE_PROVIDER_REPO}" >> acceptance-boundary.txt
          echo "consumer=yoomarks/markorbit" >> acceptance-boundary.txt
          echo "protocol=${KNOWLEDGE_PROTOCOL}" >> acceptance-boundary.txt
          echo "production=${PRODUCTION_ACTIVATION}" >> acceptance-boundary.txt

      - name: Verify acceptance harness exists
        run: |
          test -f tests/integration/knowledge/kv2-cross-repo-acceptance.test.ts

      - name: Run MarkOrbit owned KV2 acceptance harness
        run: |
          pnpm exec vitest run tests/integration/knowledge/kv2-cross-repo-acceptance.test.ts

      - name: Upload acceptance boundary
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-core-kv2-acceptance-boundary
          path: acceptance-boundary.txt
