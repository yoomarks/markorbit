name: Lite Daily Workspace Aggregate Format Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Daily Workspace aggregate test
        run: pnpm exec prettier --write apps/lite-web/src/api/daily-workspace-snapshot.test.ts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo "Daily Workspace aggregate test already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/lite-web/src/api/daily-workspace-snapshot.test.ts
          git commit -m "style(lite-web): apply exact Daily Workspace aggregate formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
