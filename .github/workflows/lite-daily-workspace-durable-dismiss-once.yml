name: Lite Daily Workspace Durable Dismiss Once

on:
  push:
    branches:
      - agent/lite-daily-workspace-durable-dismiss

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lite-daily-workspace-durable-dismiss
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch durable dismiss semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1))

          path = 'services/lite/src/daily-orbit.ts'
          anchor = '''export class NoCreatorPreferenceProvider implements DailyOrbitPreferenceProvider {
            resolve(): Promise<undefined> {
              return Promise.resolve(undefined);
            }
          }
          '''
          insertion = anchor + '''
          export interface DailyOrbitVisibilityProvider {
            dismissedOrbitItemIds(
              workspaceId: string,
              subjectUserId: string
            ): Promise<ReadonlySet<string>>;
          }

          export class NoDailyOrbitVisibilityProvider implements DailyOrbitVisibilityProvider {
            dismissedOrbitItemIds(): Promise<ReadonlySet<string>> {
              return Promise.resolve(new Set());
            }
          }

          export class PostgresDailyOrbitVisibilityProvider implements DailyOrbitVisibilityProvider {
            constructor(private readonly query: QueryClient) {}

            async dismissedOrbitItemIds(
              workspaceIdValue: string,
              subjectUserIdValue: string
            ): Promise<ReadonlySet<string>> {
              const workspaceId = cleanWorkspaceId(workspaceIdValue);
              const subjectUserId = cleanUserId(subjectUserIdValue);
              try {
                const result = await this.query.query(
                  `WITH latest AS (
                     SELECT DISTINCT ON (target_id) target_id,kind
                       FROM lite_product_preference_events
                      WHERE workspace_id=$1
                        AND subject_user_id=$2
                        AND target_type='DAILY_ORBIT_ITEM'
                        AND kind IN ('SAVED','DISMISSED')
                      ORDER BY target_id,recorded_at DESC,product_preference_event_id DESC
                   )
                   SELECT target_id
                     FROM latest
                    WHERE kind='DISMISSED'
                    ORDER BY target_id`,
                  [workspaceId, subjectUserId]
                );
                return new Set(
                  result.rows.map((row) => String((row as { target_id: unknown }).target_id))
                );
              } catch (error) {
                throw new DailyOrbitError(
                  'PERSISTENCE_UNAVAILABLE',
                  'Lite Daily Orbit visibility persistence is unavailable.',
                  503,
                  true,
                  { cause: error instanceof Error ? error : undefined }
                );
              }
            }
          }
          '''
          replace_once(path, anchor, insertion)

          replace_once(
              path,
              '''  constructor(
            private readonly signals: DailySignalReader,
            private readonly today: DailyOrbitTodayReader,
            private readonly preferences: DailyOrbitPreferenceProvider = new NoCreatorPreferenceProvider(),
            private readonly now: () => string = () => new Date().toISOString()
          ) {}
          ''',
              '''  constructor(
            private readonly signals: DailySignalReader,
            private readonly today: DailyOrbitTodayReader,
            private readonly preferences: DailyOrbitPreferenceProvider = new NoCreatorPreferenceProvider(),
            private readonly now: () => string = () => new Date().toISOString(),
            private readonly visibility: DailyOrbitVisibilityProvider = new NoDailyOrbitVisibilityProvider()
          ) {}
          '''
          )

          replace_once(
              path,
              '''
            let recommendations: readonly Readonly<TodayRecommendation>[] = [];
          ''',
              '''
            let dismissedOrbitItemIds: ReadonlySet<string> = new Set();
            try {
              dismissedOrbitItemIds = await this.visibility.dismissedOrbitItemIds(workspaceId, subjectUserId);
            } catch {
              warnings.push('ORBIT_VISIBILITY_UNAVAILABLE');
            }

            let recommendations: readonly Readonly<TodayRecommendation>[] = [];
          '''
          )

          replace_once(
              path,
              '''      })
              .sort(
                (left, right) =>
          ''',
              '''      })
              .filter((entry) => !dismissedOrbitItemIds.has(entry.item.dailyOrbitItemId))
              .sort(
                (left, right) =>
          '''
          )

          replace_once(
              'services/lite/src/main.ts',
              "import { DailyOrbitService, PostgresDailySignalReader } from './daily-orbit.js';",
              "import {\n  DailyOrbitService,\n  PostgresDailyOrbitVisibilityProvider,\n  PostgresDailySignalReader\n} from './daily-orbit.js';"
          )
          replace_once(
              'services/lite/src/main.ts',
              '''const dailyOrbitService = new DailyOrbitService(
            dailySignalReader,
            journeyService,
            creatorPreferences
          );''',
              '''const dailyOrbitService = new DailyOrbitService(
            dailySignalReader,
            journeyService,
            creatorPreferences,
            undefined,
            new PostgresDailyOrbitVisibilityProvider(pool)
          );'''
          )

          replace_once(
              'scripts/product-loop-today-real-runtime.ts',
              "import { DailyOrbitService, PostgresDailySignalReader } from '../services/lite/src/daily-orbit.js';",
              "import {\n  DailyOrbitService,\n  PostgresDailyOrbitVisibilityProvider,\n  PostgresDailySignalReader\n} from '../services/lite/src/daily-orbit.js';"
          )
          replace_once(
              'scripts/product-loop-today-real-runtime.ts',
              '''  const dailyOrbitService = new DailyOrbitService(
              dailySignalReader,
              journeyService,
              preferences,
              () => at
            );''',
              '''  const dailyOrbitService = new DailyOrbitService(
              dailySignalReader,
              journeyService,
              preferences,
              () => at,
              new PostgresDailyOrbitVisibilityProvider(pool)
            );'''
          )

          replace_once(
              'services/lite/tests/daily-orbit.test.ts',
              '''  type DailyOrbitPreferenceProvider,
            type DailyOrbitTodayReader,
            type DailySignalReader
          } from '../src/daily-orbit.js';''',
              '''  type DailyOrbitPreferenceProvider,
            type DailyOrbitTodayReader,
            type DailyOrbitVisibilityProvider,
            type DailySignalReader
          } from '../src/daily-orbit.js';'''
          )

          test_path = 'services/lite/tests/daily-orbit.test.ts'
          visibility_anchor = '''class Preferences implements DailyOrbitPreferenceProvider {
            constructor(private readonly value: CreatorPreference | Error | undefined) {}
            resolve(
              requestWorkspaceId: string,
              requestUserId: string
            ): Promise<CreatorPreference | undefined> {
              expect(requestWorkspaceId).toBe(workspaceId);
              expect(requestUserId).toBe(userId);
              if (this.value instanceof Error) return Promise.reject(this.value);
              return Promise.resolve(this.value);
            }
          }
          '''
          visibility_class = visibility_anchor + '''
          class Visibility implements DailyOrbitVisibilityProvider {
            constructor(private readonly value: ReadonlySet<string> | Error) {}
            dismissedOrbitItemIds(
              requestWorkspaceId: string,
              requestUserId: string
            ): Promise<ReadonlySet<string>> {
              expect(requestWorkspaceId).toBe(workspaceId);
              expect(requestUserId).toBe(userId);
              if (this.value instanceof Error) return Promise.reject(this.value);
              return Promise.resolve(this.value);
            }
          }
          '''
          replace_once(test_path, visibility_anchor, visibility_class)

          test_anchor = '''  it('uses RISK only when the source-derived signal carries explicit risk evidence', () => {
          '''
          tests = '''  it('removes an exact dismissed Orbit item and its Content Pick from the durable projection', async () => {
            const ranked = rankDailyOrbitItem(
              signal(),
              userId,
              preference(),
              recommendation(),
              '2026-08-18T03:00:00.000Z'
            );
            const service = new DailyOrbitService(
              new Signals([signal()]),
              new Today(today(recommendation(true))),
              new Preferences(preference()),
              () => '2026-08-18T03:00:00.000Z',
              new Visibility(new Set([ranked.dailyOrbitItemId]))
            );

            const snapshot = await service.snapshot(workspaceId, userId);

            expect(snapshot.items).toEqual([]);
            expect(snapshot.contentPicks).toEqual([]);
            expect(snapshot.partial).toBe(false);
          });

          it('fails open with an explicit warning when durable Orbit visibility cannot be read', async () => {
            const service = new DailyOrbitService(
              new Signals([signal()]),
              new Today(today(recommendation(true))),
              new Preferences(preference()),
              () => '2026-08-18T03:00:00.000Z',
              new Visibility(new Error('visibility store unavailable'))
            );

            const snapshot = await service.snapshot(workspaceId, userId);

            expect(snapshot.items).toHaveLength(1);
            expect(snapshot.partial).toBe(true);
            expect(snapshot.warnings).toContain('ORBIT_VISIBILITY_UNAVAILABLE');
          });

          ''' + test_anchor
          replace_once(test_path, test_anchor, tests)

          e2e_path = 'tests/e2e/product-loop-today-real-runtime.spec.ts'
          e2e_anchor = '''    await expect(dismissCard).toHaveCount(0);

            expect(productLoopRequests.some(({ url }) => url.includes('/api/lite/daily-workspace'))).toBe(
          '''
          e2e_replacement = '''    await expect(dismissCard).toHaveCount(0);

            const dismissedWorkspaceResponse = page.waitForResponse(
              (response) =>
                response.url().includes('/api/lite/daily-workspace') &&
                response.request().method() === 'GET'
            );
            await page.reload();
            const dismissedWorkspace = (await (await dismissedWorkspaceResponse).json()) as {
              see: { orbitItems: Array<{ dailyOrbitItemId: string }> };
            };
            expect(
              dismissedWorkspace.see.orbitItems.some(
                (item) => item.dailyOrbitItemId === initialItem.dailyOrbitItemId
              )
            ).toBe(false);
            await expect(dismissCard).toHaveCount(0);

            expect(productLoopRequests.some(({ url }) => url.includes('/api/lite/daily-workspace'))).toBe(
          '''
          replace_once(e2e_path, e2e_anchor, e2e_replacement)
          PY
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            services/lite/src/daily-orbit.ts \
            services/lite/src/main.ts \
            scripts/product-loop-today-real-runtime.ts \
            services/lite/tests/daily-orbit.test.ts \
            tests/e2e/product-loop-today-real-runtime.spec.ts
      - name: Run focused unit acceptance
        run: pnpm exec vitest run services/lite/tests/daily-orbit.test.ts
      - name: Commit implementation and remove one-shot workflow
        run: |
          rm .github/workflows/lite-daily-workspace-durable-dismiss-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(lite): make Orbit dismiss durable across reloads"
          git push origin HEAD:agent/lite-daily-workspace-durable-dismiss
