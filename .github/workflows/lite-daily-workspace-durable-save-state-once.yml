name: Lite Daily Workspace Durable Save State Once

on:
  push:
    branches:
      - agent/lite-daily-workspace-durable-save-state

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lite-daily-workspace-durable-save-state
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch durable saved-state projection
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:160]!r}')
              file.write_text(text.replace(old, new, 1))

          orbit = 'services/lite/src/daily-orbit.ts'
          replace_once(
              orbit,
              '''export interface DailyOrbitVisibilityProvider {
            dismissedOrbitItemIds(workspaceId: string, subjectUserId: string): Promise<ReadonlySet<string>>;
          }

          export class NoDailyOrbitVisibilityProvider implements DailyOrbitVisibilityProvider {
            dismissedOrbitItemIds(): Promise<ReadonlySet<string>> {
              return Promise.resolve(new Set());
            }
          }

          export class PostgresDailyOrbitVisibilityProvider implements DailyOrbitVisibilityProvider {
            constructor(private readonly query: QueryClient) {}

            async dismissedOrbitItemIds(
              workspaceIdValue: string,
              subjectUserIdValue: string
            ): Promise<ReadonlySet<string>> {
              const workspaceId = cleanWorkspaceId(workspaceIdValue);
              const subjectUserId = cleanUserId(subjectUserIdValue);
              try {
                const result = await this.query.query(
                  `SELECT DISTINCT target_id
                     FROM lite_product_preference_events
                    WHERE workspace_id=$1
                      AND subject_user_id=$2
                      AND target_type='DAILY_ORBIT_ITEM'
                      AND kind='DISMISSED'
                    ORDER BY target_id`,
                  [workspaceId, subjectUserId]
                );
                return new Set(result.rows.map((row) => String((row as { target_id: unknown }).target_id)));
              } catch (error) {
                throw new DailyOrbitError(
                  'PERSISTENCE_UNAVAILABLE',
                  'Lite Daily Orbit visibility persistence is unavailable.',
                  503,
                  true,
                  { cause: error instanceof Error ? error : undefined }
                );
              }
            }
          }
          ''',
              '''export interface DailyOrbitVisibilityState {
            savedOrbitItemIds: ReadonlySet<string>;
            dismissedOrbitItemIds: ReadonlySet<string>;
          }

          export interface DailyOrbitVisibilityProvider {
            orbitItemState(
              workspaceId: string,
              subjectUserId: string
            ): Promise<Readonly<DailyOrbitVisibilityState>>;
          }

          export class NoDailyOrbitVisibilityProvider implements DailyOrbitVisibilityProvider {
            orbitItemState(): Promise<Readonly<DailyOrbitVisibilityState>> {
              return Promise.resolve({ savedOrbitItemIds: new Set(), dismissedOrbitItemIds: new Set() });
            }
          }

          export class PostgresDailyOrbitVisibilityProvider implements DailyOrbitVisibilityProvider {
            constructor(private readonly query: QueryClient) {}

            async orbitItemState(
              workspaceIdValue: string,
              subjectUserIdValue: string
            ): Promise<Readonly<DailyOrbitVisibilityState>> {
              const workspaceId = cleanWorkspaceId(workspaceIdValue);
              const subjectUserId = cleanUserId(subjectUserIdValue);
              try {
                const result = await this.query.query(
                  `SELECT DISTINCT target_id,kind
                     FROM lite_product_preference_events
                    WHERE workspace_id=$1
                      AND subject_user_id=$2
                      AND target_type='DAILY_ORBIT_ITEM'
                      AND kind IN ('SAVED','DISMISSED')
                    ORDER BY target_id,kind`,
                  [workspaceId, subjectUserId]
                );
                const savedOrbitItemIds = new Set<string>();
                const dismissedOrbitItemIds = new Set<string>();
                for (const row of result.rows) {
                  const targetId = String((row as { target_id: unknown }).target_id);
                  if ((row as { kind: unknown }).kind === 'SAVED') savedOrbitItemIds.add(targetId);
                  if ((row as { kind: unknown }).kind === 'DISMISSED') dismissedOrbitItemIds.add(targetId);
                }
                return { savedOrbitItemIds, dismissedOrbitItemIds };
              } catch (error) {
                throw new DailyOrbitError(
                  'PERSISTENCE_UNAVAILABLE',
                  'Lite Daily Orbit visibility persistence is unavailable.',
                  503,
                  true,
                  { cause: error instanceof Error ? error : undefined }
                );
              }
            }
          }
          '''
          )
          replace_once(
              orbit,
              '''  preferenceSource: CreatorPreference['source'] | 'NONE';
            items: ReadonlyArray<Readonly<DailyOrbitItem>>;
            contentPicks: ReadonlyArray<Readonly<ContentPick>>;
          ''',
              '''  preferenceSource: CreatorPreference['source'] | 'NONE';
            savedOrbitItemIds: readonly string[];
            items: ReadonlyArray<Readonly<DailyOrbitItem>>;
            contentPicks: ReadonlyArray<Readonly<ContentPick>>;
          '''
          )
          replace_once(
              orbit,
              '''    let dismissedOrbitItemIds: ReadonlySet<string> = new Set();
              try {
                dismissedOrbitItemIds = await this.visibility.dismissedOrbitItemIds(
                  workspaceId,
                  subjectUserId
                );
              } catch {
                warnings.push('ORBIT_VISIBILITY_UNAVAILABLE');
              }
          ''',
              '''    let orbitItemState: Readonly<DailyOrbitVisibilityState> = {
                savedOrbitItemIds: new Set(),
                dismissedOrbitItemIds: new Set()
              };
              try {
                orbitItemState = await this.visibility.orbitItemState(workspaceId, subjectUserId);
              } catch {
                warnings.push('ORBIT_VISIBILITY_UNAVAILABLE');
              }
          '''
          )
          replace_once(
              orbit,
              '''      .filter((entry) => !dismissedOrbitItemIds.has(entry.item.dailyOrbitItemId))
          ''',
              '''      .filter(
                (entry) => !orbitItemState.dismissedOrbitItemIds.has(entry.item.dailyOrbitItemId)
              )
          '''
          )
          replace_once(
              orbit,
              '''    const items = ranked.map((entry) => entry.item);
              const contentPicks = ranked
          ''',
              '''    const items = ranked.map((entry) => entry.item);
              const savedOrbitItemIds = items
                .filter((item) => orbitItemState.savedOrbitItemIds.has(item.dailyOrbitItemId))
                .map((item) => item.dailyOrbitItemId);
              const contentPicks = ranked
          '''
          )
          replace_once(
              orbit,
              '''      preferenceSource: preference?.source ?? 'NONE',
                items,
          ''',
              '''      preferenceSource: preference?.source ?? 'NONE',
                savedOrbitItemIds,
                items,
          '''
          )

          unit = 'services/lite/tests/daily-orbit.test.ts'
          replace_once(
              unit,
              '''  type DailyOrbitPreferenceProvider,
            type DailyOrbitTodayReader,
            type DailyOrbitVisibilityProvider,
            type DailySignalReader
          ''',
              '''  type DailyOrbitPreferenceProvider,
            type DailyOrbitTodayReader,
            type DailyOrbitVisibilityProvider,
            type DailyOrbitVisibilityState,
            type DailySignalReader
          '''
          )
          replace_once(
              unit,
              '''class Visibility implements DailyOrbitVisibilityProvider {
            constructor(private readonly value: ReadonlySet<string> | Error) {}
            dismissedOrbitItemIds(
              requestWorkspaceId: string,
              requestUserId: string
            ): Promise<ReadonlySet<string>> {
              expect(requestWorkspaceId).toBe(workspaceId);
              expect(requestUserId).toBe(userId);
              if (this.value instanceof Error) return Promise.reject(this.value);
              return Promise.resolve(this.value);
            }
          }
          ''',
              '''class Visibility implements DailyOrbitVisibilityProvider {
            constructor(private readonly value: Readonly<DailyOrbitVisibilityState> | Error) {}
            orbitItemState(
              requestWorkspaceId: string,
              requestUserId: string
            ): Promise<Readonly<DailyOrbitVisibilityState>> {
              expect(requestWorkspaceId).toBe(workspaceId);
              expect(requestUserId).toBe(userId);
              if (this.value instanceof Error) return Promise.reject(this.value);
              return Promise.resolve(this.value);
            }
          }
          '''
          )
          replace_once(
              unit,
              '''      new Visibility(new Set([ranked.dailyOrbitItemId]))
          ''',
              '''      new Visibility({
                savedOrbitItemIds: new Set([ranked.dailyOrbitItemId]),
                dismissedOrbitItemIds: new Set([ranked.dailyOrbitItemId])
              })
          '''
          )
          replace_once(
              unit,
              '''    expect(snapshot.items).toEqual([]);
              expect(snapshot.contentPicks).toEqual([]);
              expect(snapshot.partial).toBe(false);
            });

            it('fails open with an explicit warning when durable Orbit visibility cannot be read', async () => {
          ''',
              '''    expect(snapshot.items).toEqual([]);
              expect(snapshot.savedOrbitItemIds).toEqual([]);
              expect(snapshot.contentPicks).toEqual([]);
              expect(snapshot.partial).toBe(false);
            });

            it('returns durable saved state only for visible exact Orbit items', async () => {
              const ranked = rankDailyOrbitItem(
                signal(),
                userId,
                preference(),
                recommendation(),
                '2026-08-18T03:00:00.000Z'
              );
              const service = new DailyOrbitService(
                new Signals([signal()]),
                new Today(today(recommendation(true))),
                new Preferences(preference()),
                () => '2026-08-18T03:00:00.000Z',
                new Visibility({
                  savedOrbitItemIds: new Set([ranked.dailyOrbitItemId]),
                  dismissedOrbitItemIds: new Set()
                })
              );

              const snapshot = await service.snapshot(workspaceId, userId);

              expect(snapshot.items).toHaveLength(1);
              expect(snapshot.savedOrbitItemIds).toEqual([ranked.dailyOrbitItemId]);
              expect(snapshot.partial).toBe(false);
            });

            it('fails open with an explicit warning when durable Orbit visibility cannot be read', async () => {
          '''
          )

          aggregate = 'services/lite/src/daily-workspace-snapshot.ts'
          replace_once(
              aggregate,
              '''  see: {
                preferenceSource: DailyOrbitSnapshot['preferenceSource'] | null;
                orbitItems: ReadonlyArray<Readonly<DailyOrbitItem>>;
              };
          ''',
              '''  see: {
                preferenceSource: DailyOrbitSnapshot['preferenceSource'] | null;
                savedOrbitItemIds: readonly string[];
                orbitItems: ReadonlyArray<Readonly<DailyOrbitItem>>;
              };
          '''
          )
          replace_once(
              aggregate,
              '''      see: {
                preferenceSource: orbit?.preferenceSource ?? null,
                orbitItems: orbit?.items ?? []
              },
          ''',
              '''      see: {
                preferenceSource: orbit?.preferenceSource ?? null,
                savedOrbitItemIds: orbit?.savedOrbitItemIds ?? [],
                orbitItems: orbit?.items ?? []
              },
          '''
          )

          api = 'apps/lite-web/src/api/daily-workspace.ts'
          replace_once(
              api,
              '''  readonly preferenceSource: 'EXPLICIT' | 'PRODUCT_FEEDBACK' | 'NONE';
            readonly items: ReadonlyArray<Readonly<DailyOrbitItem>>;
          ''',
              '''  readonly preferenceSource: 'EXPLICIT' | 'PRODUCT_FEEDBACK' | 'NONE';
            readonly savedOrbitItemIds: readonly string[];
            readonly items: ReadonlyArray<Readonly<DailyOrbitItem>>;
          '''
          )
          replace_once(
              api,
              '''  readonly see: {
                readonly preferenceSource: DailyOrbitSnapshot['preferenceSource'] | null;
                readonly orbitItems: ReadonlyArray<Readonly<DailyOrbitItem>>;
              };
          ''',
              '''  readonly see: {
                readonly preferenceSource: DailyOrbitSnapshot['preferenceSource'] | null;
                readonly savedOrbitItemIds: readonly string[];
                readonly orbitItems: ReadonlyArray<Readonly<DailyOrbitItem>>;
              };
          '''
          )

          primary = 'apps/lite-web/src/features/today/daily-workspace-primary.ts'
          replace_once(
              primary,
              '''      preferenceSource: snapshot.see.preferenceSource ?? 'NONE',
                items: snapshot.see.orbitItems,
          ''',
              '''      preferenceSource: snapshot.see.preferenceSource ?? 'NONE',
                savedOrbitItemIds: snapshot.see.savedOrbitItemIds,
                items: snapshot.see.orbitItems,
          '''
          )

          primary_test = 'apps/lite-web/src/features/today/daily-workspace-primary.test.ts'
          replace_once(
              primary_test,
              '''    see: { preferenceSource: 'PRODUCT_FEEDBACK', orbitItems: [] },
          ''',
              '''    see: {
              preferenceSource: 'PRODUCT_FEEDBACK',
              savedOrbitItemIds: ['daily-orbit-item_saved'],
              orbitItems: []
            },
          '''
          )
          replace_once(
              primary_test,
              '''    expect(result.orbit.items).toEqual([]);
              expect(result.orbit.contentPicks).toEqual([]);
          ''',
              '''    expect(result.orbit.savedOrbitItemIds).toEqual(['daily-orbit-item_saved']);
              expect(result.orbit.items).toEqual([]);
              expect(result.orbit.contentPicks).toEqual([]);
          '''
          )
          replace_once(
              primary_test,
              '''        see: { preferenceSource: null, orbitItems: [] },
          ''',
              '''        see: { preferenceSource: null, savedOrbitItemIds: [], orbitItems: [] },
          '''
          )

          ui = 'apps/lite-web/src/features/today/TodayWorkspace.tsx'
          replace_once(
              ui,
              '''                saved={savedOrbitItemIds.has(item.dailyOrbitItemId)}
          ''',
              '''                saved={
                  savedOrbitItemIds.has(item.dailyOrbitItemId) ||
                  Boolean(orbit?.savedOrbitItemIds.includes(item.dailyOrbitItemId))
                }
          '''
          )
          replace_once(
              ui,
              '''                saved={savedOrbitItemIds.has(item.dailyOrbitItemId)}
          ''',
              '''                saved={
                  savedOrbitItemIds.has(item.dailyOrbitItemId) ||
                  Boolean(orbit?.savedOrbitItemIds.includes(item.dailyOrbitItemId))
                }
          '''
          )

          e2e = 'tests/e2e/product-loop-today-real-runtime.spec.ts'
          replace_once(
              e2e,
              '''      see: {
                preferenceSource: string | null;
                orbitItems: Array<{
          ''',
              '''      see: {
                preferenceSource: string | null;
                savedOrbitItemIds: string[];
                orbitItems: Array<{
          '''
          )
          replace_once(
              e2e,
              '''    expect(personalizedWorkspace.see.preferenceSource).toBe('PRODUCT_FEEDBACK');
              const personalizedItem = personalizedWorkspace.see.orbitItems.find(
          ''',
              '''    expect(personalizedWorkspace.see.preferenceSource).toBe('PRODUCT_FEEDBACK');
              expect(personalizedWorkspace.see.savedOrbitItemIds).toContain(initialItem.dailyOrbitItemId);
              const personalizedItem = personalizedWorkspace.see.orbitItems.find(
          '''
          )
          replace_once(
              e2e,
              '''    await expect(
                page.getByText(`Relevance ${personalizedItem!.score.personalRelevance.score}`, {
                  exact: true
                })
              ).toBeVisible();
          ''',
              '''    await expect(
                page.getByText(`Relevance ${personalizedItem!.score.personalRelevance.score}`, {
                  exact: true
                })
              ).toBeVisible();
              await expect(orbitCard.getByRole('button', { name: 'Saved', exact: true })).toBeDisabled();
          '''
          )
          PY
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            services/lite/src/daily-orbit.ts \
            services/lite/tests/daily-orbit.test.ts \
            services/lite/src/daily-workspace-snapshot.ts \
            apps/lite-web/src/api/daily-workspace.ts \
            apps/lite-web/src/features/today/daily-workspace-primary.ts \
            apps/lite-web/src/features/today/daily-workspace-primary.test.ts \
            apps/lite-web/src/features/today/TodayWorkspace.tsx \
            tests/e2e/product-loop-today-real-runtime.spec.ts
      - name: Focused durable saved-state tests
        run: |
          pnpm exec vitest run \
            services/lite/tests/daily-orbit.test.ts \
            apps/lite-web/src/features/today/daily-workspace-primary.test.ts
      - name: Build affected dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/lite-service... --filter=@markorbit/lite-web...
      - name: Commit implementation and remove one-shot workflow
        run: |
          rm .github/workflows/lite-daily-workspace-durable-save-state-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(lite): restore saved Orbit state across reloads"
          git push origin HEAD:agent/lite-daily-workspace-durable-save-state
