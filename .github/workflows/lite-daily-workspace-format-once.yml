name: Lite Daily Workspace Format Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Lite Daily Workspace files
        run: |
          pnpm exec prettier --write \
            services/lite/src/daily-workspace-http.ts \
            services/lite/src/daily-workspace-snapshot.ts \
            services/lite/tests/daily-workspace-http.test.ts \
            services/lite/tests/daily-workspace-snapshot.test.ts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo "Lite Daily Workspace files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/lite/src/daily-workspace-http.ts \
            services/lite/src/daily-workspace-snapshot.ts \
            services/lite/tests/daily-workspace-http.test.ts \
            services/lite/tests/daily-workspace-snapshot.test.ts
          git commit -m "style(lite): format Daily Workspace snapshot"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
