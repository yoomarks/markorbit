name: Lite Daily Workspace Primary Patch Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch Lite primary Daily Workspace runtime and UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          main_path = Path('services/lite/src/main.ts')
          main = main_path.read_text()
          old_main = """const dailyWorkspaceSnapshotService = new DailyWorkspaceSnapshotService(
            dailyOrbitService,
            journeyService
          );"""
          new_main = """const dailyWorkspaceSnapshotService = new DailyWorkspaceSnapshotService(
            dailyOrbitService,
            {
              async listToday(workspaceId) {
                const [snapshot, recentFeedback, feedbackPendingPackages] = await Promise.all([
                  journeyService.listToday(workspaceId),
                  feedbackStore.listRecent(workspaceId),
                  feedbackStore.listPendingPackages(workspaceId)
                ]);
                return { ...snapshot, recentFeedback, feedbackPendingPackages };
              }
            }
          );"""
          if old_main not in main:
              raise SystemExit('main Daily Workspace constructor anchor not found')
          main_path.write_text(main.replace(old_main, new_main, 1))

          ui_path = Path('apps/lite-web/src/features/today/TodayWorkspace.tsx')
          ui = ui_path.read_text()
          import_anchor = """} from '../../api/product-loop.js';
          import './today.css';"""
          import_replacement = """} from '../../api/product-loop.js';
          import { projectDailyWorkspacePrimary } from './daily-workspace-primary.js';
          import './today.css';"""
          if import_anchor not in ui:
              raise SystemExit('TodayWorkspace import anchor not found')
          ui = ui.replace(import_anchor, import_replacement, 1)

          new_reload = """  const reload = async () => {
            setTodayError(undefined);
            setDailyError(undefined);

            if (suppliedTodayClient && !suppliedDailyClient) {
              const [todayResult, orbitResult] = await Promise.allSettled([
                todayClient.loadToday(),
                dailyClient.loadOrbit()
              ]);
              if (todayResult.status === 'fulfilled') setToday(todayResult.value);
              else
                setTodayError(
                  todayResult.reason instanceof TodayHttpError
                    ? todayResult.reason
                    : new TodayHttpError(503, 'TODAY_REQUEST_FAILED', 'Lite Today is unavailable.')
                );
              if (orbitResult.status === 'fulfilled') setOrbit(orbitResult.value);
              else
                setDailyError(
                  orbitResult.reason instanceof DailyWorkspaceHttpError
                    ? orbitResult.reason
                    : new DailyWorkspaceHttpError(
                        503,
                        'DAILY_ORBIT_UNAVAILABLE',
                        'Daily Orbit is unavailable.',
                        true
                      )
                );
              return;
            }

            try {
              const workspace = await dailyClient.loadWorkspace();
              const projection = projectDailyWorkspacePrimary(workspace);
              setToday(projection.today);
              setOrbit(projection.orbit);
            } catch (cause) {
              const error =
                cause instanceof DailyWorkspaceHttpError
                  ? cause
                  : new DailyWorkspaceHttpError(
                      503,
                      'DAILY_WORKSPACE_UNAVAILABLE',
                      'Daily Workspace is unavailable.',
                      true
                    );
              setDailyError(error);
              setTodayError(new TodayHttpError(error.status, error.code, error.message));
            }
          };"""
          pattern = re.compile(
              r"  const reload = async \(\) => \{\n.*?\n  \};\n\n  useEffect\(\(\) => \{\n    void reload\(\);\n  \}, \[todayClient, dailyClient\]\);",
              re.S,
          )
          match = pattern.search(ui)
          if not match:
              raise SystemExit('TodayWorkspace reload region not found')
          replacement = new_reload + """

          useEffect(() => {
            void reload();
          }, [todayClient, dailyClient]);"""
          ui_path.write_text(pattern.sub(replacement, ui, count=1))
          PY
      - name: Format patched Daily Workspace files
        run: |
          pnpm exec prettier --write \
            services/lite/src/main.ts \
            services/lite/src/daily-workspace-snapshot.ts \
            services/lite/tests/daily-workspace-snapshot.test.ts \
            services/lite/tests/daily-workspace-http.test.ts \
            apps/lite-web/src/api/daily-workspace.ts \
            apps/lite-web/src/api/daily-workspace-snapshot.test.ts \
            apps/lite-web/src/features/today/daily-workspace-primary.ts \
            apps/lite-web/src/features/today/daily-workspace-primary.test.ts \
            apps/lite-web/src/features/today/TodayWorkspace.tsx
      - name: Commit primary Daily Workspace patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/lite/src/main.ts \
            services/lite/src/daily-workspace-snapshot.ts \
            services/lite/tests/daily-workspace-snapshot.test.ts \
            services/lite/tests/daily-workspace-http.test.ts \
            apps/lite-web/src/api/daily-workspace.ts \
            apps/lite-web/src/api/daily-workspace-snapshot.test.ts \
            apps/lite-web/src/features/today/daily-workspace-primary.ts \
            apps/lite-web/src/features/today/daily-workspace-primary.test.ts \
            apps/lite-web/src/features/today/TodayWorkspace.tsx
          if git diff --cached --quiet; then
            echo "Daily Workspace primary patch already applied."
            exit 0
          fi
          git commit -m "feat(lite): make Daily Workspace the primary Today read"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
