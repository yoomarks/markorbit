name: Lite Daily Workspace Runtime Fixture Patch Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch Daily Workspace real-runtime fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/product-loop-today-real-runtime.ts')
          text = path.read_text()

          orbit_import = "import { DailyOrbitService, PostgresDailySignalReader } from '../services/lite/src/daily-orbit.js';"
          orbit_replacement = orbit_import + "\nimport { createDailyWorkspaceRoutes } from '../services/lite/src/daily-workspace-http.js';\nimport { DailyWorkspaceSnapshotService } from '../services/lite/src/daily-workspace-snapshot.js';"
          if "createDailyWorkspaceRoutes" not in text:
              if orbit_import not in text:
                  raise SystemExit('Daily Orbit import anchor not found')
              text = text.replace(orbit_import, orbit_replacement, 1)

          if "const dailyWorkspaceSnapshotService" not in text:
              service_pattern = re.compile(
                  r"(?P<indent>\s*)const dailyOrbitService = new DailyOrbitService\(\n"
                  r"(?P<body>.*?)"
                  r"(?P=indent>\);\n"
                  r"(?P=indent>)const visualStore = new PostgresVisualBridgeStore\(database, pool, \(\) => at\);",
                  re.S,
              )
              match = service_pattern.search(text)
              if not match:
                  raise SystemExit('Daily Workspace service region not found')
              indent = match.group('indent')
              orbit_block = match.group(0).rsplit(f"{indent}const visualStore", 1)[0]
              workspace_block = (
                  f"{indent}const dailyWorkspaceSnapshotService = new DailyWorkspaceSnapshotService(\n"
                  f"{indent}  dailyOrbitService,\n"
                  f"{indent}  {{\n"
                  f"{indent}    async listToday(workspaceId) {{\n"
                  f"{indent}      const [snapshot, recentFeedback, feedbackPendingPackages] = await Promise.all([\n"
                  f"{indent}        journeyService.listToday(workspaceId),\n"
                  f"{indent}        feedbackStore.listRecent(workspaceId),\n"
                  f"{indent}        feedbackStore.listPendingPackages(workspaceId)\n"
                  f"{indent}      ]);\n"
                  f"{indent}      return {{ ...snapshot, recentFeedback, feedbackPendingPackages }};\n"
                  f"{indent}    }}\n"
                  f"{indent}  }},\n"
                  f"{indent}  () => at\n"
                  f"{indent});\n"
              )
              visual = f"{indent}const visualStore = new PostgresVisualBridgeStore(database, pool, () => at);"
              text = text[:match.start()] + orbit_block + workspace_block + visual + text[match.end():]

          if "...createDailyWorkspaceRoutes({" not in text:
              routes_pattern = re.compile(r"(?P<indent>\s*)routes: \[\n(?P=indent>\s*)\.\.\.createLiteProductLoopRoutes\(\{")
              match = routes_pattern.search(text)
              if not match:
                  raise SystemExit('Lite route region not found')
              indent = match.group('indent')
              replacement = (
                  f"{indent}routes: [\n"
                  f"{indent}  ...createDailyWorkspaceRoutes({{\n"
                  f"{indent}    internalServiceSecret: secret,\n"
                  f"{indent}    service: dailyWorkspaceSnapshotService\n"
                  f"{indent}  }}),\n"
                  f"{indent}  ...createLiteProductLoopRoutes({{"
              )
              text = text[:match.start()] + replacement + text[match.end():]

          path.write_text(text)
          PY
      - name: Format runtime fixture
        run: pnpm exec prettier --write scripts/product-loop-today-real-runtime.ts
      - name: Commit fixture patch and remove one-shot workflow
        run: |
          rm .github/workflows/lite-daily-workspace-runtime-fixture-patch-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(lite): expose Daily Workspace in real-runtime fixture"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
