name: M10 Prettier Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/m10-prettier-diagnostic.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact format and remove diagnostic
        shell: bash
        run: |
          pnpm exec prettier --write services/lite/src/trademark-asset.ts
          git rm .github/workflows/m10-prettier-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/lite/src/trademark-asset.ts
          git commit -m 'style(m10): apply exact Prettier formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
