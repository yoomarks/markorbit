name: M10 Prettier Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/m10-prettier-diagnostic.yml'
      - 'services/lite/src/trademark-asset.ts'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier patch
        shell: bash
        run: |
          cp services/lite/src/trademark-asset.ts /tmp/trademark-asset.before.ts
          pnpm exec prettier --write services/lite/src/trademark-asset.ts
          diff -u /tmp/trademark-asset.before.ts services/lite/src/trademark-asset.ts || true
