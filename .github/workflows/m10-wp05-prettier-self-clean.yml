name: M10 WP05 Prettier Self Clean

on:
  push:
    branches:
      - agent/m10-wp05-commerce-profile

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m10-wp05-commerce-profile
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/lite/src/trademark-asset-commerce.ts
      - name: Commit exact repository formatting
        run: |
          if git diff --quiet -- services/lite/src/trademark-asset-commerce.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/lite/src/trademark-asset-commerce.ts
          git commit -m "chore: apply repository Prettier to Commerce Profile"
          git push origin HEAD:agent/m10-wp05-commerce-profile
