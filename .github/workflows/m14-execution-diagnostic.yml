name: M14 Execution Integration Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  execution-diagnostic:
    name: Execution diagnostic (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: professional-review-postgres
            command: pnpm test:professional-review:postgres
          - name: professional-review-http
            command: pnpm test:professional-review:http
          - name: filing-governance-auth
            command: pnpm test:filing-governance:auth
          - name: filing-governance-postgres
            command: pnpm test:filing-governance:postgres
          - name: provider-return-evidence-postgres
            command: pnpm --filter @markorbit/execution-service exec vitest run tests/provider-return-evidence-postgres.test.ts
          - name: evidence-review-postgres
            command: pnpm test:evidence-review:postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      EXECUTION_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_execution_test
      EXECUTION_POSTGRES_TEST_REQUIRED: '1'
      EXECUTION_PROVIDER_RETURN_EVIDENCE_POSTGRES_REQUIRED: '1'
      EXECUTION_EVIDENCE_REVIEW_POSTGRES_REQUIRED: '1'
      MO_INTERNAL_SERVICE_SECRET: task-019-ci-internal-secret-32-bytes-minimum
      MO_CSRF_SECRET: task-019-ci-csrf-secret-32-bytes-minimum
      WEB_ORIGINS: https://test.markorbit.local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create Execution test database
        env:
          PGPASSWORD: markorbit-test-only
        run: psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE markorbit_execution_test;'
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
