name: M14 Execution Integration Diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  execution-reset-fix:
    name: Execution reset fix verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      MARKREG_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_markreg_test
      MARKREG_POSTGRES_TEST_REQUIRED: '1'
      EXECUTION_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_execution_test
      EXECUTION_POSTGRES_TEST_REQUIRED: '1'
      EXECUTION_PROVIDER_RETURN_EVIDENCE_POSTGRES_REQUIRED: '1'
      EXECUTION_EVIDENCE_REVIEW_POSTGRES_REQUIRED: '1'
      MO_INTERNAL_SERVICE_SECRET: task-019-ci-internal-secret-32-bytes-minimum
      MO_CSRF_SECRET: task-019-ci-csrf-secret-32-bytes-minimum
      WEB_ORIGINS: https://test.markorbit.local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m14-operational-execution-workbench
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Patch stale Execution reset inventories
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = list(Path('scripts').glob('*.ts')) + list(Path('services/execution/tests').glob('*.ts'))
          markers = (
              'professional_review_cases',
              'filing_authorizations',
              'execution_provider_return_evidence_receipts',
              'execution_evidence_review_sources',
              'execution_reviewed_source_handoffs',
          )
          insert = (
              '         execution_trademark_service_artifacts,\n'
              '         execution_trademark_service_protected_action_replays,\n'
              '         execution_trademark_service_sessions,\n'
          )
          patched = []

          for path in paths:
              text = path.read_text()
              cursor = 0
              changed = False
              while True:
                  start = text.find('DROP TABLE IF EXISTS\n', cursor)
                  if start < 0:
                      break
                  end = text.find('CASCADE`', start)
                  if end < 0:
                      break
                  end += len('CASCADE`')
                  block = text[start:end]
                  if any(marker in block for marker in markers) and 'execution_trademark_service_sessions' not in block:
                      block = block.replace('DROP TABLE IF EXISTS\n', 'DROP TABLE IF EXISTS\n' + insert, 1)
                      text = text[:start] + block + text[end:]
                      end = start + len(block)
                      changed = True
                  cursor = end
              if changed:
                  path.write_text(text)
                  patched.append(str(path))

          print('Patched reset inventories:')
          for path in patched:
              print(f'  {path}')
          if not patched:
              print('  none')
          PY
          git diff --check
      - name: Create Execution and MarkReg test databases
        env:
          PGPASSWORD: markorbit-test-only
        run: |
          psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE markorbit_execution_test;'
          psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE markorbit_markreg_test;'
      - name: 1 professional-review-postgres
        run: pnpm test:professional-review:postgres
      - name: 2 professional-review-http
        run: pnpm test:professional-review:http
      - name: 3 filing-governance-auth
        run: pnpm test:filing-governance:auth
      - name: 4 filing-governance-postgres
        run: pnpm test:filing-governance:postgres
      - name: 5 provider-return-evidence-postgres
        run: pnpm --filter @markorbit/execution-service exec vitest run tests/provider-return-evidence-postgres.test.ts
      - name: 6 evidence-review-postgres
        run: pnpm test:evidence-review:postgres
      - name: Commit verified reset fixes
        run: |
          if git diff --quiet; then
            echo 'No source reset changes to commit.'
            exit 0
          fi
          git config user.name 'markorbit-ci'
          git config user.email 'markorbit-ci@users.noreply.github.com'
          git add scripts services/execution/tests
          git commit -m 'test(execution): reset M14 tables across integration suites'
          git push origin HEAD:agent/m14-operational-execution-workbench
