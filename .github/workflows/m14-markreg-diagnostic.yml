name: M14 MarkReg Reset Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  verify-reset-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      MARKREG_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_markreg_test
      MARKREG_POSTGRES_TEST_REQUIRED: '1'
      MARKREG_DOCUMENT_PACKAGE_POSTGRES_REQUIRED: '1'
      MARKREG_AUDIT_POSTGRES_REQUIRED: '1'
      MARKREG_AUDIT_HTTP_REQUIRED: '1'
      EXECUTION_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_execution_test
      EXECUTION_POSTGRES_TEST_REQUIRED: '1'
      MO_INTERNAL_SERVICE_SECRET: task-019-ci-internal-secret-32-bytes-minimum
      MO_CSRF_SECRET: task-019-ci-csrf-secret-32-bytes-minimum
      WEB_ORIGINS: https://test.markorbit.local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m14-operational-execution-workbench
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create MarkReg and Execution databases
        env:
          PGPASSWORD: markorbit-test-only
        run: |
          psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE markorbit_markreg_test;'
          psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE markorbit_execution_test;'
      - name: Patch Execution reset inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/document-package-http.integration.test.ts')
          text = path.read_text()
          needle = '         execution_reviewed_source_handoff_audit,\n'
          additions = (
              '         execution_trademark_service_artifacts,\n'
              '         execution_trademark_service_protected_action_replays,\n'
              '         execution_trademark_service_sessions,\n'
          )
          if additions in text:
              raise SystemExit('reset inventory is already patched')
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one reset anchor, found {text.count(needle)}')
          path.write_text(text.replace(needle, additions + needle, 1))
          PY
          git diff --check -- scripts/document-package-http.integration.test.ts
          git diff -- scripts/document-package-http.integration.test.ts
      - name: Reproduce Document Package then audit-idempotency HTTP chain
        run: |
          pnpm test:document-package:http
          pnpm test:audit-idempotency:http
      - name: Commit verified reset fix
        run: |
          git config user.name 'markorbit-ci'
          git config user.email 'markorbit-ci@users.noreply.github.com'
          git add -- scripts/document-package-http.integration.test.ts
          git diff --cached --check
          git commit -m 'test(markreg): reset M14 execution tables in HTTP suite'
          git push origin HEAD:agent/m14-operational-execution-workbench

# Temporary verification workflow. Remove after the verified source commit lands.
