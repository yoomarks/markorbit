name: M14 Prettier Diagnostic

on:
  pull_request:
    branches:
      - main

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@10.28.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier services/execution/src/trademark-service-execution-http.ts > /tmp/trademark-service-execution-http.ts
          diff -u services/execution/src/trademark-service-execution-http.ts /tmp/trademark-service-execution-http.ts || true
          exit 1
