name: M15 Scope Format

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m15-execution-sandbox-release-readiness
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/planning/MO-MVP-MILESTONE-015-SCOPE-LOCK.md
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'markorbit-ci'
          git config user.email 'markorbit-ci@users.noreply.github.com'
          git add docs/planning/MO-MVP-MILESTONE-015-SCOPE-LOCK.md
          git commit -m 'style(m15): format scope lock'
          git push origin HEAD:agent/m15-execution-sandbox-release-readiness
