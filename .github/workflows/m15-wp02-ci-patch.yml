name: M15 WP02 CI Patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  wire-sandbox-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m15-wp02-durable-sandbox-policy
      - name: Add sandbox PostgreSQL suite to Execution integration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = """          pnpm test:filing-governance:postgres\n          pnpm --filter @markorbit/execution-service exec vitest run tests/provider-return-evidence-postgres.test.ts\n"""
          new = """          pnpm test:filing-governance:postgres\n          pnpm --filter @markorbit/execution-service exec vitest run tests/trademark-service-execution-sandbox-postgres.test.ts\n          pnpm --filter @markorbit/execution-service exec vitest run tests/provider-return-evidence-postgres.test.ts\n"""
          if old not in text:
              raise SystemExit('Execution integration anchor not found exactly once')
          if text.count(old) != 1:
              raise SystemExit('Execution integration anchor is ambiguous')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit CI coverage
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'markorbit-ci'
          git config user.email 'markorbit-ci@users.noreply.github.com'
          git add .github/workflows/ci.yml
          git commit -m 'ci(m15): run sandbox postgres integration'
          git push origin HEAD:agent/m15-wp02-durable-sandbox-policy
