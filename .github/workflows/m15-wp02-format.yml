name: M15 WP02 Format

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-wp02:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m15-wp02-durable-sandbox-policy
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          packages/contracts/src/trademark-service-execution-sandbox.ts
          services/execution/src/trademark-service-execution-sandbox-postgres.ts
          services/execution/tests/trademark-service-execution-sandbox-postgres.test.ts
          services/execution/tests/trademark-service-execution-sandbox.test.ts
      - run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'markorbit-ci'
          git config user.email 'markorbit-ci@users.noreply.github.com'
          git add packages/contracts/src/trademark-service-execution-sandbox.ts services/execution/src/trademark-service-execution-sandbox-postgres.ts services/execution/tests/trademark-service-execution-sandbox-postgres.test.ts services/execution/tests/trademark-service-execution-sandbox.test.ts
          git commit -m 'style(m15): format WP02 sandbox policy'
          git push origin HEAD:agent/m15-wp02-durable-sandbox-policy
