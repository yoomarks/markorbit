name: M20 Core Entitlement Scale Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/m20-core-entitlement-scale.yml'
      - 'services/core/src/workspace-commercial*.ts'
      - 'services/core/tests/workspace-commercial*.test.ts'
      - 'packages/contracts/src/workspace-commercial.ts'
      - 'packages/persistence/**'
      - 'infrastructure/persistence/migrations/**'
      - 'docs/development/m20-core-entitlement-scale.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/m20-core-entitlement-scale.yml'
      - 'services/core/src/workspace-commercial*.ts'
      - 'services/core/tests/workspace-commercial*.test.ts'
      - 'packages/contracts/src/workspace-commercial.ts'
      - 'packages/persistence/**'
      - 'infrastructure/persistence/migrations/**'
      - 'docs/development/m20-core-entitlement-scale.md'

permissions:
  contents: read

jobs:
  postgres-scale-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_core_entitlement_scale_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_core_entitlement_scale_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      CORE_COMMERCIAL_SCALE_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_core_entitlement_scale_test
      CORE_COMMERCIAL_SCALE_POSTGRES_REQUIRED: '1'
      CORE_COMMERCIAL_SCALE_EVIDENCE_PATH: ${{ github.workspace }}/core-entitlement-scale-evidence.json
      CORE_COMMERCIAL_SCALE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@markorbit/core-service...
      - name: Measure real PostgreSQL reads and preserve resolver semantics
        run: pnpm --filter @markorbit/core-service exec vitest run tests/workspace-commercial-scale-postgres.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-entitlement-scale-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: core-entitlement-scale-evidence.json
          if-no-files-found: error
