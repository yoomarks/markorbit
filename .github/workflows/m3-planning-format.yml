name: M3 planning format

on:
  push:
    branches:
      - task-028-milestone3-scope-lock

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-028-milestone3-scope-lock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatting
        run: >-
          pnpm exec prettier --write
          README.md
          docs/planning/MO-MVP-MILESTONE-003-SCOPE-LOCK.md
          docs/planning/MO-MVP-MILESTONE-003-DELIVERY-PLAN.md
          docs/planning/TASK-INDEX.md
          docs/tasks/MO-MVP-TASK-028-MILESTONE-003-SCOPE-LOCK.md
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/planning/MO-MVP-MILESTONE-003-SCOPE-LOCK.md docs/planning/MO-MVP-MILESTONE-003-DELIVERY-PLAN.md docs/planning/TASK-INDEX.md docs/tasks/MO-MVP-TASK-028-MILESTONE-003-SCOPE-LOCK.md
          git commit -m "style: format Milestone 3 planning docs"
          git push origin HEAD:task-028-milestone3-scope-lock
