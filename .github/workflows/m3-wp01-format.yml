name: M3 WP01 format

on:
  push:
    branches:
      - m3-wp-01-order-contract

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-wp-01-order-contract
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Order contract test
        run: pnpm exec prettier --write packages/contracts/tests/order-contract.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/contracts/tests/order-contract.test.ts
          git commit -m "style(contracts): format Order contract test"
          git push origin HEAD:m3-wp-01-order-contract
