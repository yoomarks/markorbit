name: M3 WP02 format

on:
  push:
    branches:
      - m3-wp-02-order-persistence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-wp-02-order-persistence
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format WP-02 files
        run: pnpm exec prettier --write services/markreg/src/order-persistence.ts services/markreg/tests/order-memory-contract.test.ts services/markreg/tests/order-postgres.test.ts services/markreg/tests/order-repository-contract.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/markreg/src/order-persistence.ts services/markreg/tests/order-memory-contract.test.ts services/markreg/tests/order-postgres.test.ts services/markreg/tests/order-repository-contract.ts
          git commit -m "style(markreg): format Order persistence files"
          git push origin HEAD:m3-wp-02-order-persistence
