name: M4 WP01 format

on:
  push:
    branches: [m4-wp-01-provider-execution-contracts]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4-wp-01-provider-execution-contracts
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          docs/architecture/PROVIDER-EXECUTION-AUTHORITY-BOUNDARY.md
          docs/planning/MO-MVP-MILESTONE-004-IMPLEMENTATION-TRACEABILITY.md
          packages/contracts/tests/provider-execution-contract.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/PROVIDER-EXECUTION-AUTHORITY-BOUNDARY.md docs/planning/MO-MVP-MILESTONE-004-IMPLEMENTATION-TRACEABILITY.md packages/contracts/tests/provider-execution-contract.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(m4): format WP-01 files"
          git push origin HEAD:m4-wp-01-provider-execution-contracts
