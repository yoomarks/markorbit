name: M4 WP09 re-audit finalize

on:
  push:
    branches:
      - m4-wp-09-reaudit-go

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4-wp-09-reaudit-go
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Finalize canonical M4 status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/planning/MO-MVP-MILESTONE-004-IMPLEMENTATION-TRACEABILITY.json')
          text = path.read_text()
          replacements = [
              ('"currentAuditRecommendation": "FIX"', '"currentAuditRecommendation": "GO"'),
              ('"auditedMergedBaseline": "f1fd652cf4882cd1e0996bd9846995443ca5e967"', '"auditedMergedBaseline": "327b61a22ad800250a2d9babe5997eb5a6a9e8eb"'),
              ('"auditedImplementationTree": "fc5b44772dcd51f10f9aaac5495a2d1f33d13e8a"', '"auditedImplementationTree": "79efcbe2580e7fa372f0c7f5ebefe6f744216416"'),
              ('"testedHead": "016cb221cf57733df04f56a815eefeb55dffe839"', '"testedHead": "4c75c837374f1e92e61bc1a612273c94990371cd"'),
              ('"testedHeadTree": "fc5b44772dcd51f10f9aaac5495a2d1f33d13e8a"', '"testedHeadTree": "79efcbe2580e7fa372f0c7f5ebefe6f744216416"'),
              ('"status": "AUDIT_FIX_REQUIRED"', '"status": "AUDIT_COMPLETE_GO"'),
              ('"recommendation": "FIX",\n    "semanticAuthorityAudit"', '"recommendation": "GO",\n    "semanticAuthorityAudit"'),
              ('"durableMgsnRuntimeComposition": "FIX_REQUIRED"', '"durableMgsnRuntimeComposition": "PASS"'),
              ('"executionEvidenceRuntimeBoundary": "FIX_REQUIRED"', '"executionEvidenceRuntimeBoundary": "PASS"'),
              ('"fullDurableRealRuntimePath": "FIX_REQUIRED"', '"fullDurableRealRuntimePath": "PASS"'),
              ('"blockingFindingIds": ["M4-INT-001", "M4-INT-002", "M4-E2E-001"]', '"blockingFindingIds": []'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing traceability anchor: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('docs/planning/TASK-INDEX.md')
          text = path.read_text()
          old = '''- M4-WP-09 — Independent integration and authority audit (**in progress; recommendation FIX**)
  - Evidence: `docs/audits/MO-MVP-MILESTONE-004-INTEGRATION-AUDIT.{md,json}`.
  - Blocking findings: normal durable MGSN runtime composition missing; normal durable Execution Provider Return evidence-handoff HTTP boundary missing; required full zero-interception Core + Gateway + Execution + MGSN + owner PostgreSQL provider path missing.
  - Required next action: bounded M4 integration remediation, then rerun M4-WP-09 against the remediated merged baseline.
  - No tag, release, deployment freeze, Payment/Invoice, legal appointment, external filing or Official Truth is created by this audit.

Milestone 4 does not yet have a GO recommendation. The established authority locks remain in force throughout remediation.'''
          new = '''- M4-WP-09 — Independent integration and authority audit (**complete; final recommendation GO**)
  - Initial PR #57 audit returned `FIX` for three bounded runtime-integration findings.
  - PR #58 merged the durable MGSN/Execution runtime composition and permanent zero-interception integration gate.
  - Re-audited merged baseline: `327b61a22ad800250a2d9babe5997eb5a6a9e8eb`; tree `79efcbe2580e7fa372f0c7f5ebefe6f744216416`.
  - Exact remediation head passed M4 integration, validation, M4/M3/M2 reliability and Browser/Visual Validation; merged main additionally passed integration, validation and Browser/Visual Validation.
  - Evidence: `docs/audits/MO-MVP-MILESTONE-004-INTEGRATION-AUDIT.{md,json}`.
  - No tag, release, deployment freeze, Payment/Invoice, legal appointment, external filing or Official Truth is created by this audit.

Milestone 4 now has a **GO** recommendation for its approved engineering scope. The established authority locks remain in force.'''
          if old not in text:
              raise SystemExit('missing TASK-INDEX M4-WP-09 anchor')
          path.write_text(text.replace(old, new, 1))

          path = Path('docs/audits/MO-MVP-MILESTONE-004-INTEGRATION-AUDIT.json')
          text = path.read_text()
          old = '"validation": { "runId": 31323865372, "result": "PASS" }\n    }'
          new = '"validation": { "runId": 31323865372, "result": "PASS" },\n      "browserAndVisualValidation": { "runId": 31323865383, "result": "PASS" }\n    }'
          if old not in text:
              raise SystemExit('missing audit JSON merged-main anchor')
          path.write_text(text.replace(old, new, 1))

          path = Path('docs/audits/MO-MVP-MILESTONE-004-INTEGRATION-AUDIT.md')
          text = path.read_text()
          old = '- validation run `31323865372`: **PASS**, including persistence and professional-review-browser jobs.\n'
          new = old + '- Browser and Visual Validation run `31323865383`: **PASS**, including Milestone Real Runtime Validation.\n'
          if old not in text:
              raise SystemExit('missing audit MD merged-main anchor')
          path.write_text(text.replace(old, new, 1))

          path = Path('docs/tasks/MO-MVP-M4-WP-09-INTEGRATION-AUTHORITY-AUDIT.md')
          text = path.read_text()
          old = 'Merged main `327b61a22ad800250a2d9babe5997eb5a6a9e8eb` independently passed Milestone 4 integration `31323865361` and validation `31323865372` after merge.\n'
          new = 'Merged main `327b61a22ad800250a2d9babe5997eb5a6a9e8eb` independently passed Milestone 4 integration `31323865361`, validation `31323865372` and Browser and Visual Validation `31323865383` after merge.\n'
          if old not in text:
              raise SystemExit('missing audit task merged-main anchor')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format finalized status files
        run: >-
          pnpm exec prettier --write
          docs/planning/MO-MVP-MILESTONE-004-IMPLEMENTATION-TRACEABILITY.json
          docs/planning/TASK-INDEX.md
          docs/audits/MO-MVP-MILESTONE-004-INTEGRATION-AUDIT.json
          docs/audits/MO-MVP-MILESTONE-004-INTEGRATION-AUDIT.md
          docs/tasks/MO-MVP-M4-WP-09-INTEGRATION-AUTHORITY-AUDIT.md
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/m4-wp09-reaudit-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(m4): finalize GO traceability after re-audit"
          git push origin HEAD:m4-wp-09-reaudit-go
