name: M5 WP08 audit doc format helper

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format WP-08 audit documents
        run: >-
          pnpm exec prettier --write
          docs/audits/MO-MVP-MILESTONE-005-INTEGRATION-AUDIT.md
          docs/audits/MO-MVP-MILESTONE-005-INTEGRATION-AUDIT.json
          docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.md
          docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.json
          docs/planning/TASK-INDEX.md
      - name: Verify document formatting
        run: >-
          pnpm exec prettier --check
          docs/audits/MO-MVP-MILESTONE-005-INTEGRATION-AUDIT.md
          docs/audits/MO-MVP-MILESTONE-005-INTEGRATION-AUDIT.json
          docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.md
          docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.json
          docs/planning/TASK-INDEX.md
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/audits/MO-MVP-MILESTONE-005-INTEGRATION-AUDIT.md \
            docs/audits/MO-MVP-MILESTONE-005-INTEGRATION-AUDIT.json \
            docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.md \
            docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.json \
            docs/planning/TASK-INDEX.md
          git commit -m "style(m5): format WP-08 audit documents"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
