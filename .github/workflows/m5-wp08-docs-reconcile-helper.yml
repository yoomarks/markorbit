name: M5 WP08 docs reconcile helper

on:
  pull_request:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Reconcile Milestone 5 traceability and task index
        run: |
          python - <<'PY'
          from pathlib import Path

          trace = Path('docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.md')
          text = trace.read_text()
          text = text.replace(
              '**Current work package:** `M5-WP-07` — migration, restart, replay, isolation, redaction, concurrency and browser reliability matrix  ',
              '**Current work package:** `M5-WP-08` — independent integration and authority audit  '
          )
          text = text.replace(
              '**Milestone status:** `IMPLEMENTATION_ACTIVE`',
              '**Milestone status:** `AUDIT_GO_PENDING_PR_70_MERGE`'
          )
          text = text.replace(
              'This traceability record is now current through the active WP-07 reliability package.',
              'This traceability record is current through the WP-08 independent audit and bounded remediation in PR #70.'
          )
          text = text.replace(
              '- **M5-WP-07 — Migration, restart, replay, isolation, redaction, concurrency and browser reliability matrix:** `IMPLEMENTATION_IN_PR_69`. Evidence: machine-readable reliability matrix, exact-head runner, inventory validator, dedicated hosted workflow and WP-07 task record.\n- **M5-WP-08 — Independent Milestone 5 integration and authority audit:** `NOT_STARTED`.',
              '- **M5-WP-07 — Migration, restart, replay, isolation, redaction, concurrency and browser reliability matrix:** `MERGED_IN_PR_69`. Merge: `48a3c223a51b381da83d181f9d0cb70bb812a82c`. Evidence: machine-readable reliability matrix, exact-head runner, inventory validator, dedicated hosted workflow and WP-07 task record.\n- **M5-WP-08 — Independent Milestone 5 integration and authority audit:** `AUDIT_GO_IN_PR_70_PENDING_FINAL_HEAD_VALIDATION`. Initial audit returned `FIX` for two bounded integration findings; PR #70 closes them and the audited code head `f79002d81329de2ae80c777e391f1b025f014e79` passed all eight hosted gates. Evidence: `docs/audits/MO-MVP-MILESTONE-005-INTEGRATION-AUDIT.{md,json}` and the permanent Milestone 5 integration gate.'
          )
          anchor = '## Ownership boundary\n'
          section = '''## WP-08 independent integration and authority audit\n\nThe independent audit initially returned `FIX` for two bounded integration gaps: the approved Operations review workflow was not operable through the governed browser/API boundary, and the real MarkReg lifecycle handoff did not compose the already-implemented deterministic Recommended Action regeneration.\n\nPR #70 remediates only those approved-scope gaps. Operations now runs an explicit human-governed sequence over real Core identity and Execution persistence: `PENDING_REVIEW queue -> exact source capture -> explicit review/correction -> explicit Reviewed Source Admission -> explicit lifecycle handoff`. The MarkReg handoff regenerates a Recommended Action only when the newly projected event is the current Lifecycle View. Reviewer identity is derived from the authenticated Workspace Principal, actor spoofing is rejected, correlation lineage is preserved, and no cross-service SQL is introduced.\n\nA permanent zero-interception gate, `.github/workflows/milestone-5-integration.yml`, starts Core, Execution, MarkReg and Gateway with separate Core/Execution/MarkReg PostgreSQL databases and proves the complete M5 path plus the correction-not-admissible branch. The audited code head `f79002d81329de2ae80c777e391f1b025f014e79` passed Milestone 5 integration `31447652716`, Milestone 5 reliability `31447652734`, validation `31447652680`, Browser and Visual Validation `31447652689`, Milestone 4 integration `31447652685`, Milestone 4 reliability `31447652678`, Milestone 3 reliability `31447652687` and Milestone 2 reliability `31447652705`.\n\nThe re-audit recommendation is **GO**. Evidence Review remains internal governed truth, admission remains non-filing, Lifecycle Projection remains non-official, Recommended Action remains non-executing, and no Payment/Invoice/legal appointment/automatic completion/Capability verification/external filing/Official Truth is introduced.\n\n'''
          if section not in text:
              text = text.replace(anchor, section + anchor)
          old_next = '''## Next implementation step\n\nM5-WP-08 remains `NOT_STARTED`. It may begin only after M5-WP-07 passes the exact-head Milestone 5 reliability workflow and the repository's existing hosted gates on the same final PR head, then merges with explicit owner authorization. WP-08 is the independent integration and authority audit; it must not be folded into this reliability implementation PR.\n'''
          new_next = '''## Audit outcome and owner action\n\nM5-WP-08 has a **GO** recommendation for the audited code head. The documentation head must pass the same hosted gates before PR #70 is marked ready for review. No additional implementation work package exists inside the currently approved Milestone 5 scope. Merge, tagging, release or any next milestone remains an explicit owner decision.\n'''
          if old_next not in text:
              raise SystemExit('expected WP-08 next-step block not found')
          text = text.replace(old_next, new_next)
          trace.write_text(text)

          index = Path('docs/planning/TASK-INDEX.md')
          text = index.read_text()
          text = text.replace(
              '- M5-WP-07 — Exact-head migration/restart/replay/isolation/redaction/concurrency/browser reliability matrix (**implementation in PR #69**)',
              '- M5-WP-07 — Exact-head migration/restart/replay/isolation/redaction/concurrency/browser reliability matrix (**merged in PR #69**)'
          )
          old = '- M5-WP-08 — Independent Milestone 5 integration and authority audit (**not started; blocked on WP-07 merge**)'
          new = '''- M5-WP-08 — Independent Milestone 5 integration and authority audit (**GO in PR #70; pending final documentation-head validation**)\n  - Initial audit recommendation: **FIX** for two bounded integration gaps in the Operations review journey and real lifecycle-to-Recommended-Action composition.\n  - PR #70 closes the gaps with an authenticated explicit review/admission/handoff path, real Recommended Action regeneration and a permanent zero-interception M5 integration gate.\n  - Audited code head `f79002d81329de2ae80c777e391f1b025f014e79` passed all eight hosted gates.\n  - Evidence: `docs/audits/MO-MVP-MILESTONE-005-INTEGRATION-AUDIT.{md,json}`.\n  - No Payment/Invoice, legal appointment, Filing Submission, external filing, Official Truth, automatic Matter completion, Capability verification or cross-service SQL is created. Merge remains an explicit owner action.'''
          if old not in text:
              raise SystemExit('expected TASK-INDEX WP-08 block not found')
          text = text.replace(old, new)
          index.write_text(text)
          PY
          pnpm exec prettier --write docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.md docs/planning/TASK-INDEX.md
          node scripts/validate-workspace.mjs
      - name: Commit reconciliation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.md docs/planning/TASK-INDEX.md
          git commit -m "docs(m5): reconcile WP-08 audit status"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
