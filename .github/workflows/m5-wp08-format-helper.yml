name: M5 WP08 format helper

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format WP-08 remediation files
        run: >-
          pnpm exec prettier --write
          services/execution/src/evidence-review-queue-postgres.ts
          services/execution/src/evidence-provenance-http.ts
          services/execution/src/main.ts
          apps/gateway/src/lifecycle-http.ts
          services/markreg/src/lifecycle-handoff-http.ts
          services/markreg/src/main.ts
          apps/operations-console/src/lifecycle.ts
          apps/operations-console/src/App.tsx
          scripts/m5-evidence-lifecycle-runtime.integration.test.ts
          .github/workflows/milestone-5-integration.yml
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/execution/src/evidence-review-queue-postgres.ts \
            services/execution/src/evidence-provenance-http.ts \
            services/execution/src/main.ts \
            apps/gateway/src/lifecycle-http.ts \
            services/markreg/src/lifecycle-handoff-http.ts \
            services/markreg/src/main.ts \
            apps/operations-console/src/lifecycle.ts \
            apps/operations-console/src/App.tsx \
            scripts/m5-evidence-lifecycle-runtime.integration.test.ts \
            .github/workflows/milestone-5-integration.yml
          git commit -m "style(m5): format WP-08 remediation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
