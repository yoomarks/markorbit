name: M5 WP08 inventory helper

on:
  pull_request:

permissions:
  contents: write

jobs:
  update-inventory:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Reconcile Gateway route inventory
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'docs/architecture/GATEWAY_ROUTE_INVENTORY.json';
          const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
          const additions = [
            {
              method: 'GET',
              path: '/api/operations/evidence-review/queue',
              owner: 'markreg',
              namespaceClass: 'AUTHENTICATED_RUNTIME',
              authenticationMode: 'COOKIE_AUTHENTICATED',
              environmentScope: 'ALL_ENVIRONMENTS',
              idempotencyRequirement: 'NOT_APPLICABLE_READ',
              authorityConsequenceResponse: 'NONE_EXTERNAL',
              httpIntegrationTestFile: 'scripts/m5-evidence-lifecycle-runtime.integration.test.ts'
            },
            {
              method: 'POST',
              path: '/api/operations/evidence-review/sources/capture',
              owner: 'markreg',
              namespaceClass: 'AUTHENTICATED_RUNTIME',
              authenticationMode: 'COOKIE_AUTHENTICATED',
              environmentScope: 'ALL_ENVIRONMENTS',
              idempotencyRequirement: 'NOT_REQUIRED_EXACT_SOURCE_CAPTURE',
              authorityConsequenceResponse: 'NONE_EXTERNAL',
              httpIntegrationTestFile: 'scripts/m5-evidence-lifecycle-runtime.integration.test.ts'
            },
            {
              method: 'POST',
              path: '/api/operations/evidence-review/decisions',
              owner: 'markreg',
              namespaceClass: 'AUTHENTICATED_RUNTIME',
              authenticationMode: 'COOKIE_AUTHENTICATED',
              environmentScope: 'ALL_ENVIRONMENTS',
              idempotencyRequirement: 'REQUIRED_FOR_MUTATION',
              authorityConsequenceResponse: 'NONE_EXTERNAL',
              httpIntegrationTestFile: 'scripts/m5-evidence-lifecycle-runtime.integration.test.ts'
            },
            {
              method: 'POST',
              path: '/api/operations/reviewed-source-admissions',
              owner: 'markreg',
              namespaceClass: 'AUTHENTICATED_RUNTIME',
              authenticationMode: 'COOKIE_AUTHENTICATED',
              environmentScope: 'ALL_ENVIRONMENTS',
              idempotencyRequirement: 'REQUIRED_FOR_MUTATION',
              authorityConsequenceResponse: 'NONE_EXTERNAL',
              httpIntegrationTestFile: 'scripts/m5-evidence-lifecycle-runtime.integration.test.ts'
            },
            {
              method: 'POST',
              path: '/api/operations/reviewed-source-handoffs/deliver',
              owner: 'markreg',
              namespaceClass: 'AUTHENTICATED_RUNTIME',
              authenticationMode: 'COOKIE_AUTHENTICATED',
              environmentScope: 'ALL_ENVIRONMENTS',
              idempotencyRequirement: 'REQUIRED_FOR_MUTATION',
              authorityConsequenceResponse: 'NONE_EXTERNAL',
              httpIntegrationTestFile: 'scripts/m5-evidence-lifecycle-runtime.integration.test.ts'
            }
          ];
          const keys = new Set(doc.routes.map((r) => `${r.method} ${r.path}`));
          const missing = additions.filter((r) => !keys.has(`${r.method} ${r.path}`));
          if (missing.length) {
            const anchor = doc.routes.findIndex(
              (r) => r.method === 'GET' && r.path === '/api/operations/formal-matters/:formalMatterId/lifecycle-provenance'
            );
            if (anchor < 0) throw new Error('Lifecycle provenance inventory anchor is missing.');
            doc.routes.splice(anchor + 1, 0, ...missing);
            fs.writeFileSync(file, `${JSON.stringify(doc, null, 2)}\n`);
          }

          const validatorFile = 'scripts/validate-gateway-inventory.mjs';
          let validator = fs.readFileSync(validatorFile, 'utf8');
          validator = validator
            .replace('assert.equal(source.length, 81);', 'assert.equal(source.length, 86);')
            .replace(').length,\n  75\n);', ').length,\n  80\n);')
            .replace(
              'Gateway inventory PASS: 81 runtime routes; authenticated Order, Document Package and Lifecycle boundaries included; test bootstrap excluded',
              'Gateway inventory PASS: 86 runtime routes; authenticated Order, Document Package, Evidence Review and Lifecycle boundaries included; test bootstrap excluded'
            );
          fs.writeFileSync(validatorFile, validator);
          NODE
          pnpm exec prettier --write docs/architecture/GATEWAY_ROUTE_INVENTORY.json scripts/validate-gateway-inventory.mjs
          node scripts/validate-gateway-inventory.mjs
      - name: Commit inventory reconciliation if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/GATEWAY_ROUTE_INVENTORY.json scripts/validate-gateway-inventory.mjs
          git commit -m "docs(m5): reconcile Gateway evidence review routes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
