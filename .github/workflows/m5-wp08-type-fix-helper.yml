name: M5 WP08 type fix helper

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Require explicit exact source capture after queue selection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/operations-console/src/App.tsx')
          text = path.read_text()
          old = '    setSource(item.source ?? null);'
          new = '    setSource(null);'
          if old not in text:
              raise SystemExit('expected queue source assignment not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/operations-console/src/App.tsx
          pnpm --filter @markorbit/operations-console typecheck
      - name: Commit type fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operations-console/src/App.tsx
          git commit -m "fix(m5): require exact review source capture"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
