name: M5 WP08 format diagnosis

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Export repository Prettier diff
        run: |
          mkdir -p .artifacts/m5-wp08-format
          pnpm exec prettier --write .
          git diff --name-only > .artifacts/m5-wp08-format/files.txt
          git diff > .artifacts/m5-wp08-format/format.patch
          cat .artifacts/m5-wp08-format/files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m5-wp08-format-diff-${{ github.run_id }}
          path: .artifacts/m5-wp08-format
          retention-days: 1
