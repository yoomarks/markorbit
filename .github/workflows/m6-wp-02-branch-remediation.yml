name: M6 WP-02 branch remediation

on:
  push:
    branches:
      - m6-wp-02-durable-capability-registry

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m6-wp-02-durable-capability-registry
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Synchronize lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Format WP-02 sources
        run: |
          pnpm exec prettier --write \
            services/capability-engine/src/index.ts \
            services/capability-engine/src/main.ts \
            services/capability-engine/src/runtime-capability-http.ts \
            services/capability-engine/src/runtime-capability-registry.ts \
            services/capability-engine/tests/runtime-capability-registry.test.ts \
            services/capability-engine/tests/runtime-capability-registry-postgres.test.ts \
            services/capability-engine/package.json \
            infrastructure/persistence/migration-owners.json \
            .github/workflows/m6-wp-02-capability-registry.yml
      - name: Commit generated branch maintenance
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml \
            services/capability-engine/src/index.ts \
            services/capability-engine/src/main.ts \
            services/capability-engine/src/runtime-capability-http.ts \
            services/capability-engine/src/runtime-capability-registry.ts \
            services/capability-engine/tests/runtime-capability-registry.test.ts \
            services/capability-engine/tests/runtime-capability-registry-postgres.test.ts \
            services/capability-engine/package.json \
            infrastructure/persistence/migration-owners.json \
            .github/workflows/m6-wp-02-capability-registry.yml
          git commit -m "chore(m6): synchronize WP-02 generated formatting"
          git push origin HEAD:m6-wp-02-durable-capability-registry
