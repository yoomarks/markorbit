name: M6 WP-02 Capability Registry

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/m6-wp-02-capability-registry.yml'
      - 'services/capability-engine/**'
      - 'packages/contracts/src/capability-learning.ts'
      - 'infrastructure/persistence/migrations/**'
      - 'infrastructure/persistence/migration-owners.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  capability-registry-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_capability_registry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_capability_registry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CAPABILITY_ENGINE_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_capability_registry_test
      CAPABILITY_ENGINE_POSTGRES_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate ownership boundaries
        run: pnpm validate:workspace && pnpm validate:persistence-boundaries
      - name: Build Capability Engine dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/capability-engine...
      - name: Validate Capability Engine
        run: pnpm --filter @markorbit/capability-engine lint && pnpm --filter @markorbit/capability-engine typecheck
      - name: Run real PostgreSQL runtime Capability Registry tests
        run: pnpm --filter @markorbit/capability-engine test:runtime-registry:postgres
