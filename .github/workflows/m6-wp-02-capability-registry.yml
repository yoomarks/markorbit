name: TMP Core 786 Prettier Probe

on:
  pull_request:
    paths:
      - '.github/workflows/m6-wp-02-capability-registry.yml'
      - 'services/capability-engine/**'

permissions:
  contents: read

jobs:
  prettier-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Print exact Prettier 3.9.6 diff
        run: |
          pnpm exec prettier --write services/capability-engine/src/capability-cognitive-read.ts services/capability-engine/tests/capability-cognitive-read.test.ts
          git diff --no-ext-diff -- services/capability-engine/src/capability-cognitive-read.ts services/capability-engine/tests/capability-cognitive-read.test.ts
