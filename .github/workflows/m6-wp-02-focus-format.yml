name: M6 WP-02 focus formatting remediation

on:
  push:
    branches:
      - m6-wp-02-durable-capability-registry

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m6-wp-02-durable-capability-registry
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/markreg-web/src/routing/GovernedRouteEntry.tsx
      - run: pnpm --filter @markorbit/markreg-web exec vitest run src/routing/GovernedRouteEntry.test.tsx
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/markreg-web/src/routing/GovernedRouteEntry.tsx
          git commit -m "style(markreg): format deterministic recovery focus"
          git push origin HEAD:m6-wp-02-durable-capability-registry
