name: M6 WP-02 exact lint remediation

on:
  push:
    branches:
      - m6-wp-02-durable-capability-registry

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m6-wp-02-durable-capability-registry
      - name: Fix typed PostgreSQL result access
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('services/capability-engine/src/runtime-capability-registry.ts')
          s = p.read_text()
          s, first = re.subn(
              r"        let runtimeCapabilityDefinitionId = identity\.rows\[0\]\?\.runtime_capability_definition_id as\n          RuntimeCapabilityDefinitionId \| undefined;",
              "        const identityRow = identity.rows[0] as\n          | { runtime_capability_definition_id: RuntimeCapabilityDefinitionId }\n          | undefined;\n        let runtimeCapabilityDefinitionId = identityRow?.runtime_capability_definition_id;",
              s,
              count=1,
          )
          s, second = re.subn(
              r"        const version = Number\(versionResult\.rows\[0\]\?\.current_version \?\? 0\) \+ 1;",
              "        const versionRow = versionResult.rows[0] as\n          | { current_version: number | string }\n          | undefined;\n        const version = Number(versionRow?.current_version ?? 0) + 1;",
              s,
              count=1,
          )
          p.write_text(s)
          print(f'replacements={first + second}')
          if first + second not in (0, 2):
              raise SystemExit('expected both unsafe accesses or neither')
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/capability-engine/src/runtime-capability-registry.ts
      - run: pnpm --filter @markorbit/capability-engine lint
      - name: Commit exact lint fix when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/capability-engine/src/runtime-capability-registry.ts
          git commit -m "fix(m6): type PostgreSQL registry result rows"
          git push origin HEAD:m6-wp-02-durable-capability-registry
