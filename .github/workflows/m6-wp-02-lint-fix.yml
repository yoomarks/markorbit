name: M6 WP-02 exact lint remediation

on:
  push:
    branches:
      - m6-wp-02-durable-capability-registry

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m6-wp-02-durable-capability-registry
      - name: Fix typed PostgreSQL result access
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/capability-engine/src/runtime-capability-registry.ts')
          s = p.read_text()
          s = s.replace(
          """        let runtimeCapabilityDefinitionId = identity.rows[0]?.runtime_capability_definition_id as
          RuntimeCapabilityDefinitionId | undefined;""",
          """        const identityRow = identity.rows[0] as
          | { runtime_capability_definition_id: RuntimeCapabilityDefinitionId }
          | undefined;
        let runtimeCapabilityDefinitionId = identityRow?.runtime_capability_definition_id;"""
          )
          s = s.replace(
          """        const version = Number(versionResult.rows[0]?.current_version ?? 0) + 1;""",
          """        const versionRow = versionResult.rows[0] as { current_version: number | string } | undefined;
        const version = Number(versionRow?.current_version ?? 0) + 1;"""
          )
          p.write_text(s)
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/capability-engine/src/runtime-capability-registry.ts
      - run: pnpm --filter @markorbit/capability-engine lint
      - name: Commit exact lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/capability-engine/src/runtime-capability-registry.ts
          git commit -m "fix(m6): type PostgreSQL registry result rows"
          git push origin HEAD:m6-wp-02-durable-capability-registry
