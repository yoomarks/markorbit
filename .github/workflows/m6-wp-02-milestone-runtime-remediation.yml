name: M6 WP-02 milestone runtime remediation

on:
  push:
    branches:
      - m6-wp-02-durable-capability-registry

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m6-wp-02-durable-capability-registry
      - name: Mark historical Capability Engine milestone runtime explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/milestone-runtime.mjs')
          text = path.read_text()
          old = "env: { PORT: String(ports.capability) }"
          new = "env: { PORT: String(ports.capability), MO_MILESTONE_TEST_RUNTIME: '1' }"
          if new not in text:
              if old not in text:
                  raise SystemExit('capability milestone runtime marker not found')
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/capability-engine/src/main.ts scripts/milestone-runtime.mjs
      - run: pnpm --filter @markorbit/capability-engine lint && pnpm --filter @markorbit/capability-engine typecheck
      - name: Commit compatibility fix when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/capability-engine/src/main.ts scripts/milestone-runtime.mjs
          git commit -m "fix(m6): isolate legacy milestone fixture startup"
          git push origin HEAD:m6-wp-02-durable-capability-registry
