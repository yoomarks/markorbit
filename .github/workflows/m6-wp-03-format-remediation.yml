name: M6 WP-03 exact remediation

on:
  push:
    branches:
      - m6-wp-03-capability-observation-ledger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m6-wp-03-capability-observation-ledger
      - name: Remove fake async authority lint defect
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/capability-engine/tests/capability-observation-ledger-postgres.test.ts')
          s = p.read_text()
          old = """  async verify(\n    locator: Readonly<CapabilityObservationSourceLocator>\n  ): Promise<GovernedCapabilityObservationSourceAssertion> {\n    this.calls += 1;"""
          new = """  async verify(\n    locator: Readonly<CapabilityObservationSourceLocator>\n  ): Promise<GovernedCapabilityObservationSourceAssertion> {\n    await Promise.resolve();\n    this.calls += 1;"""
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          elif '    await Promise.resolve();\n    this.calls += 1;' not in s:
              raise SystemExit('expected FakeSourceAuthority verify block not found')
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and prove exact lint scope
        run: |
          pnpm exec prettier --write \
            services/capability-engine/tests/capability-observation-ledger-postgres.test.ts \
            services/capability-engine/tests/capability-observation-source.test.ts
          pnpm exec turbo run build --filter=@markorbit/capability-engine...
          pnpm --filter @markorbit/capability-engine lint
          pnpm --filter @markorbit/capability-engine typecheck
      - name: Commit exact remediation when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/capability-engine/tests/capability-observation-ledger-postgres.test.ts \
            services/capability-engine/tests/capability-observation-source.test.ts
          git commit -m "fix(m6): make Observation authority tests lint-safe"
          git push origin HEAD:m6-wp-03-capability-observation-ledger
