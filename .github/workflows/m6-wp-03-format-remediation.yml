name: M6 WP-03 formatting remediation

on:
  push:
    branches:
      - m6-wp-03-capability-observation-ledger

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m6-wp-03-capability-observation-ledger
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact WP-03 files
        run: |
          pnpm exec prettier --write \
            services/capability-engine/src/capability-observation-http.ts \
            services/capability-engine/src/capability-observation-ledger.ts \
            services/capability-engine/src/capability-observation-source.ts \
            services/capability-engine/tests/capability-observation-ledger-postgres.test.ts \
            services/execution/tests/capability-observation-source-http.test.ts
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/capability-engine/src/capability-observation-http.ts \
            services/capability-engine/src/capability-observation-ledger.ts \
            services/capability-engine/src/capability-observation-source.ts \
            services/capability-engine/tests/capability-observation-ledger-postgres.test.ts \
            services/execution/tests/capability-observation-source-http.test.ts
          git commit -m "style(m6): format Capability Observation Ledger"
          git push origin HEAD:m6-wp-03-capability-observation-ledger
