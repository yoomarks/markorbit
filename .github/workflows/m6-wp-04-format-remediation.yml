name: M6 WP-04 exact formatting remediation

on:
  push:
    branches:
      - m6-wp-04-private-reflection-candidate

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m6-wp-04-private-reflection-candidate
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact WP-04 files
        run: |
          pnpm exec prettier --write \
            services/capability-engine/src/private-reflection-candidate.ts \
            services/capability-engine/tests/private-reflection-candidate-postgres.test.ts
          pnpm exec prettier --check \
            services/capability-engine/src/private-reflection-candidate.ts \
            services/capability-engine/tests/private-reflection-candidate-postgres.test.ts
      - name: Commit exact formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/capability-engine/src/private-reflection-candidate.ts \
            services/capability-engine/tests/private-reflection-candidate-postgres.test.ts
          git commit -m "style(m6): format private Reflection Candidate"
          git push origin HEAD:m6-wp-04-private-reflection-candidate
