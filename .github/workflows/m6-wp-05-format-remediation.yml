name: M6 WP-05 exact formatting remediation

on:
  push:
    branches:
      - agent/m6-wp-05-reflection-disposition-profile-twin

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6-wp-05-reflection-disposition-profile-twin
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact WP-05 file
        run: |
          pnpm exec prettier --write services/capability-engine/src/reflection-disposition-profile.ts
          pnpm exec prettier --check services/capability-engine/src/reflection-disposition-profile.ts
      - name: Commit exact formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/capability-engine/src/reflection-disposition-profile.ts
          git commit -m "style(m6): format Reflection disposition projection"
          git push origin HEAD:agent/m6-wp-05-reflection-disposition-profile-twin
