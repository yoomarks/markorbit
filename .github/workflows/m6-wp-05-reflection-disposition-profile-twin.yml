name: M6 WP-05 Reflection Disposition Profile Twin

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/m6-wp-05-reflection-disposition-profile-twin.yml'
      - 'services/capability-engine/**'
      - 'infrastructure/persistence/migrations/**'
      - 'infrastructure/persistence/migration-owners.json'
      - 'docs/tasks/MO-MVP-M6-WP-05-REFLECTION-DISPOSITION-PROFILE-TWIN.md'

permissions:
  contents: read

jobs:
  reflection-disposition-profile-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_wp05_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_wp05_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CAPABILITY_ENGINE_POSTGRES_TEST_REQUIRED: '1'
      PGPASSWORD: markorbit-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate persistence and owner boundaries
        run: pnpm validate:workspace && pnpm validate:persistence-boundaries
      - name: Check repository formatting
        run: pnpm format:check
      - name: Build typed dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/capability-engine...
      - name: Validate Capability Engine
        run: |
          pnpm --filter @markorbit/capability-engine lint
          pnpm --filter @markorbit/capability-engine typecheck
      - name: Create isolated durable regression databases
        run: |
          psql -h 127.0.0.1 -U markorbit_test -d postgres -c 'CREATE DATABASE markorbit_wp02_regression'
          psql -h 127.0.0.1 -U markorbit_test -d postgres -c 'CREATE DATABASE markorbit_wp03_regression'
          psql -h 127.0.0.1 -U markorbit_test -d postgres -c 'CREATE DATABASE markorbit_wp04_regression'
          psql -h 127.0.0.1 -U markorbit_test -d postgres -c 'CREATE DATABASE markorbit_wp05_acceptance'
      - name: Run M6-WP-02 durable regression
        env:
          CAPABILITY_ENGINE_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_wp02_regression
        run: pnpm --filter @markorbit/capability-engine test:runtime-registry:postgres
      - name: Run M6-WP-03 durable regression
        env:
          CAPABILITY_ENGINE_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_wp03_regression
        run: pnpm --filter @markorbit/capability-engine test:observation-ledger:postgres
      - name: Run M6-WP-04 durable regression
        env:
          CAPABILITY_ENGINE_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_wp04_regression
        run: pnpm --filter @markorbit/capability-engine test:reflection-candidates:postgres
      - name: Run real PostgreSQL Reflection disposition and private Profile/Twin tests
        env:
          CAPABILITY_ENGINE_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_wp05_acceptance
        run: pnpm --filter @markorbit/capability-engine test:reflection-disposition-profile:postgres
