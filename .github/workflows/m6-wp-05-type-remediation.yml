name: M6 WP-05 exact type remediation

on:
  push:
    branches:
      - agent/m6-wp-05-reflection-disposition-profile-twin

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6-wp-05-reflection-disposition-profile-twin
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix exact optional rationale construction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/capability-engine/src/reflection-disposition-profile.ts')
          text = path.read_text()
          old = """  return {\n    candidateVersion: positive(value.candidateVersion, 'candidateVersion'),\n    expectedCandidateFingerprintSha256,\n    outcome,\n    ...(optionalText(value.rationale, 'rationale')\n      ? { rationale: optionalText(value.rationale, 'rationale') }\n      : {})\n  };\n"""
          new = """  const rationale = optionalText(value.rationale, 'rationale');\n  return {\n    candidateVersion: positive(value.candidateVersion, 'candidateVersion'),\n    expectedCandidateFingerprintSha256,\n    outcome,\n    ...(rationale ? { rationale } : {})\n  };\n"""
          if old not in text:
              raise SystemExit('expected WP-05 optional rationale snippet not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write services/capability-engine/src/reflection-disposition-profile.ts
          pnpm exec turbo run build --filter=@markorbit/capability-engine...
      - name: Commit exact remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/capability-engine/src/reflection-disposition-profile.ts
          git commit -m "fix(m6): preserve exact optional disposition rationale"
          git push origin HEAD:agent/m6-wp-05-reflection-disposition-profile-twin
