name: M7 WP-04 Temporary Root Integration Fix

on:
  pull_request:
    paths:
      - '.github/workflows/m7-wp-04-fix-helper.yml'

permissions:
  contents: write

jobs:
  repair-root-integration:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair root-level source resolution and PublishPackage assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/m7-wp-04-product-opportunity-runtime.integration.test.ts')
          s = p.read_text()
          s = s.replace("from '@markorbit/contracts/knowledge-content-export';", "from '../packages/contracts/src/knowledge-content-export.js';")
          s = s.replace("from '@markorbit/contracts/product-loop';", "from '../packages/contracts/src/product-loop.js';")
          s = s.replace("from '@markorbit/service-kit';", "from '../packages/service-kit/src/index.js';")
          s = s.replace('publishPackage.externalActionExecutedByMarkOrbit', 'publishPackage.externalPublishExecuted')
          p.write_text(s)
          PY
          pnpm exec prettier --write scripts/m7-wp-04-product-opportunity-runtime.integration.test.ts
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/m7-wp-04-product-opportunity-runtime.integration.test.ts
          git commit -m 'M7-WP-04 repair root integration resolution'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
