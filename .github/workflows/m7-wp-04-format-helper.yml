name: M7 WP-04 Temporary Formatter

on:
  pull_request:
    paths:
      - 'services/core/src/index.ts'
      - 'scripts/m7-wp-04-product-opportunity-runtime.integration.test.ts'
      - '.github/workflows/m7-wp-04-format-helper.yml'

permissions:
  contents: write

jobs:
  format-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format WP-04 sources
        run: pnpm exec prettier --write services/core/src/index.ts scripts/m7-wp-04-product-opportunity-runtime.integration.test.ts
      - name: Commit formatter result when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/core/src/index.ts scripts/m7-wp-04-product-opportunity-runtime.integration.test.ts
          git commit -m 'M7-WP-04 format acceptance sources'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
