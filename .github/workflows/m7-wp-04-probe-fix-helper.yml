name: M7 WP-04 Temporary Probe Fix

on:
  pull_request:
    paths:
      - '.github/workflows/m7-wp-04-probe-fix-helper.yml'

permissions:
  contents: write

jobs:
  fix-probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove duplicate-module-only Lite negative probe
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/m7-wp-04-product-opportunity-runtime.integration.test.ts')
          s = p.read_text()
          start = s.index('    const otherAuthorityProbe = await fetch(')
          end_marker = '    expect(otherAuthorityProbe.status).toBe(404);\n\n'
          end = s.index(end_marker, start) + len(end_marker)
          s = s[:start] + s[end:]
          p.write_text(s)
          PY
          pnpm exec prettier --write scripts/m7-wp-04-product-opportunity-runtime.integration.test.ts
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/m7-wp-04-product-opportunity-runtime.integration.test.ts
          git commit -m 'M7-WP-04 remove duplicate-module negative probe'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
