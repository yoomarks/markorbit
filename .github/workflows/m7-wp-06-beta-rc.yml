name: M7 WP-06 Beta RC Matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/m7-wp-06-beta-rc.yml'
      - 'scripts/m7-wp-06-beta-rc-matrix.mjs'

permissions:
  contents: read

jobs:
  canonical-format:
    runs-on: ubuntu-latest
    env:
      M7_WP06_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Emit canonical Prettier source
        run: |
          pnpm exec prettier --write scripts/m7-wp-06-beta-rc-matrix.mjs
          printf 'CANONICAL_BASE64='
          base64 -w0 scripts/m7-wp-06-beta-rc-matrix.mjs
          printf '\n'
          exit 1
