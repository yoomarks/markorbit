name: M7 WP-06 Beta RC Matrix

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  beta-rc-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      M7_WP06_EXPECTED_HEAD_SHA: ${{ github.sha }}
      M7_WP06_HEAD_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$M7_WP06_EXPECTED_HEAD_SHA"
      - name: Run full workspace release-candidate regression
        run: pnpm check
      - name: Dispatch predecessor gates on the exact candidate ref
        run: |
          workflows=(
            product-loop-closure-reliability.yml
            m7-wp-02-conversion-analytics.yml
            m7-wp-03-seeded-beta-scenario.yml
            m7-wp-04-three-loop-full-journey.yml
            m7-wp-05-deployment-rehearsal.yml
          )
          for workflow in "${workflows[@]}"; do
            gh workflow run "$workflow" --ref "$M7_WP06_HEAD_REF"
          done
      - name: Wait for predecessor gates and record exact-head results
        run: |
          mkdir -p .artifacts
          result_lines="$(mktemp)"
          failed=0
          workflows=(
            product-loop-closure-reliability.yml
            m7-wp-02-conversion-analytics.yml
            m7-wp-03-seeded-beta-scenario.yml
            m7-wp-04-three-loop-full-journey.yml
            m7-wp-05-deployment-rehearsal.yml
          )
          for workflow in "${workflows[@]}"; do
            run_id=""
            for attempt in $(seq 1 60); do
              run_id="$(gh run list --workflow "$workflow" --branch "$M7_WP06_HEAD_REF" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$M7_WP06_EXPECTED_HEAD_SHA\") | .databaseId" | head -n 1)"
              if [ -n "$run_id" ]; then break; fi
              sleep 5
            done
            if [ -z "$run_id" ]; then
              jq -n --arg workflow "$workflow" '{workflow: $workflow, runId: null, conclusion: "missing"}' >> "$result_lines"
              failed=1
              continue
            fi
            gh run watch "$run_id" --interval 10 >/dev/null 2>&1 || true
            conclusion="$(gh run view "$run_id" --json conclusion --jq '.conclusion')"
            jq -n --arg workflow "$workflow" --argjson runId "$run_id" --arg conclusion "$conclusion" '{workflow: $workflow, runId: $runId, conclusion: $conclusion}' >> "$result_lines"
            if [ "$conclusion" != "success" ]; then failed=1; fi
          done
          jq -s --arg exactHeadSha "$M7_WP06_EXPECTED_HEAD_SHA" '{schemaVersion: 1, workPackage: "M7-WP-06", exactHeadSha: $exactHeadSha, gates: .}' "$result_lines" > .artifacts/m7-wp-06-required-gates.json
          cat .artifacts/m7-wp-06-required-gates.json
          if [ "$failed" -ne 0 ]; then exit 1; fi
      - name: Generate exact-head candidate fingerprint and known-limits evidence
        run: node scripts/m7-wp-06-beta-rc-matrix.mjs
      - name: Upload Beta RC matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-wp-06-beta-rc-matrix-${{ github.run_id }}
          path: |
            .artifacts/m7-wp-06-beta-rc-matrix.json
            .artifacts/m7-wp-06-required-gates.json
          if-no-files-found: warn
          retention-days: 14
