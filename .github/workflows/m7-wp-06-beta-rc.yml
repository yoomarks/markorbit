name: M7 WP-06 Beta RC Matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'infrastructure/**'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright*.ts'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'README.md'
      - 'docs/tasks/MO-MVP-M7-WP-06-BETA-RC-RELIABILITY-MATRIX.md'

permissions:
  contents: read

jobs:
  beta-rc-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      M7_WP06_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$M7_WP06_EXPECTED_HEAD_SHA"
      - name: Run full workspace release-candidate regression
        run: pnpm check
      - name: Generate exact-head candidate fingerprint and known-limits evidence
        run: node scripts/m7-wp-06-beta-rc-matrix.mjs
      - name: Upload Beta RC matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-wp-06-beta-rc-matrix-${{ github.run_id }}
          path: .artifacts/m7-wp-06-beta-rc-matrix.json
          if-no-files-found: warn
          retention-days: 14
