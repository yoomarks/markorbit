name: M7 WP-07 Independent Beta Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/m7-wp-07-independent-beta-audit.yml'
      - 'scripts/m7-wp-07-independent-beta-audit.mjs'
      - 'docs/audits/MO-MVP-MILESTONE-007-BETA-READINESS-AUDIT.json'
      - 'docs/audits/MO-MVP-MILESTONE-007-BETA-READINESS-AUDIT.md'
      - 'docs/tasks/MO-MVP-M7-WP-07-INDEPENDENT-BETA-READINESS-AUDIT.md'
      - 'README.md'

permissions:
  contents: read

jobs:
  canonical-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format canonical audit sources
        run: |
          pnpm exec prettier --write \
            docs/audits/MO-MVP-MILESTONE-007-BETA-READINESS-AUDIT.json \
            docs/audits/MO-MVP-MILESTONE-007-BETA-READINESS-AUDIT.md \
            scripts/m7-wp-07-independent-beta-audit.mjs
      - name: Upload canonical audit sources
        uses: actions/upload-artifact@v4
        with:
          name: m7-wp-07-canonical-audit-sources-${{ github.run_id }}
          path: |
            docs/audits/MO-MVP-MILESTONE-007-BETA-READINESS-AUDIT.json
            docs/audits/MO-MVP-MILESTONE-007-BETA-READINESS-AUDIT.md
            scripts/m7-wp-07-independent-beta-audit.mjs
          retention-days: 1
      - name: Keep formatter extraction non-qualifying
        run: exit 1
