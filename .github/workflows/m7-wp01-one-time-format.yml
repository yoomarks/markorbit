name: M7 WP-01 one-time formatter

on:
  push:
    branches:
      - agent/m7-wp-01-beta-readiness-contracts-authority

permissions:
  contents: write

jobs:
  format-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m7-wp-01-beta-readiness-contracts-authority
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier and remove formatter
        run: |
          pnpm exec prettier --write \
            docs/architecture/BETA-READINESS-AUTHORITY-BOUNDARY.md \
            packages/contracts/tests/beta-readiness-contract.test.ts
          git rm .github/workflows/m7-wp01-one-time-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/architecture/BETA-READINESS-AUTHORITY-BOUNDARY.md \
            packages/contracts/tests/beta-readiness-contract.test.ts
          git commit -m 'style(m7): format WP-01 contract artifacts'
          git push origin HEAD:agent/m7-wp-01-beta-readiness-contracts-authority
