name: M7 WP-02 one-time reconciliation formatter

on:
  push:
    branches:
      - agent/m7-wp-02-bounded-conversion-analytics

permissions:
  contents: write

jobs:
  reconcile-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m7-wp-02-bounded-conversion-analytics
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile, format and remove one-time files
        run: |
          python scripts/m7-wp02-one-time-reconcile.py
          pnpm exec prettier --write \
            README.md \
            docs/planning/TASK-INDEX.md \
            docs/tasks/MO-MVP-M7-WP-02-BOUNDED-CONVERSION-ANALYTICS.md \
            packages/contracts/src/beta-readiness.ts \
            packages/contracts/tests/beta-readiness-conversion-analytics.test.ts \
            services/lite/src/conversion-analytics.ts \
            services/lite/tests/conversion-analytics-postgres.test.ts \
            apps/gateway/tests/product-loop-conversion-analytics-http.test.ts \
            .github/workflows/m7-wp-02-conversion-analytics.yml
          git rm .github/workflows/m7-wp02-one-time-reconcile-format.yml scripts/m7-wp02-one-time-reconcile.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            docs/planning/TASK-INDEX.md \
            docs/tasks/MO-MVP-M7-WP-02-BOUNDED-CONVERSION-ANALYTICS.md \
            packages/contracts/src/beta-readiness.ts \
            packages/contracts/tests/beta-readiness-conversion-analytics.test.ts \
            services/lite/src/conversion-analytics.ts \
            services/lite/tests/conversion-analytics-postgres.test.ts \
            apps/gateway/tests/product-loop-conversion-analytics-http.test.ts \
            .github/workflows/m7-wp-02-conversion-analytics.yml
          git commit -m 'style(m7): reconcile and format WP-02'
          git push origin HEAD:agent/m7-wp-02-bounded-conversion-analytics
