name: M8 Format Diff

on:
  push:
    branches: [agent/m8-wp02-account-onboarding]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write apps/gateway/src/account-access-http.ts apps/markreg-web/src/AccountEntry.test.tsx
          git diff --no-ext-diff --unified=5 -- apps/gateway/src/account-access-http.ts apps/markreg-web/src/AccountEntry.test.tsx
