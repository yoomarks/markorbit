name: M8 WP-06 Commercial Runtime Reliability

on:
  pull_request:
    paths:
      - '.github/workflows/m8-wp-06-commercial-runtime-reliability.yml'
      - '.github/workflows/payment-stripe-sandbox-acceptance.yml'
      - 'docs/tasks/MO-MVP-M8-WP-06-COMMERCIAL-RUNTIME-RELIABILITY.md'
      - 'infrastructure/rehearsal/m8-wp-06-*.json'
      - 'infrastructure/persistence/**'
      - 'scripts/m8-wp-06-commercial-runtime-reliability.mjs'
      - 'services/core/**'
      - 'services/markreg/**'
      - 'services/payment/**'
      - 'services/mgsn/**'
      - 'apps/gateway/**'
      - 'apps/operations-console/**'
      - 'packages/contracts/**'
      - 'packages/persistence/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m8-wp06-commercial-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commercial-runtime-contract:
    name: Exact-head commercial runtime contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      M8_WP06_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$M8_WP06_EXPECTED_HEAD_SHA"
      - name: Validate workspace and authority boundaries
        run: |
          pnpm validate:workspace
          pnpm validate:persistence-boundaries
          pnpm test:gateway-inventory
          pnpm format:check
      - name: Build and validate commercial dependency closure
        run: |
          pnpm exec turbo run build --filter=@markorbit/core-service... --filter=@markorbit/markreg-service... --filter=@markorbit/payment-service... --filter=@markorbit/mgsn-service... --filter=@markorbit/gateway... --filter=@markorbit/operations-console...
          pnpm exec turbo run lint typecheck test --filter=@markorbit/core-service --filter=@markorbit/markreg-service --filter=@markorbit/payment-service --filter=@markorbit/mgsn-service --filter=@markorbit/gateway --filter=@markorbit/operations-console
      - name: Generate exact-head commercial reliability evidence
        run: node scripts/m8-wp-06-commercial-runtime-reliability.mjs
      - name: Upload commercial reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-wp-06-commercial-runtime-reliability-${{ github.run_id }}
          path: .artifacts/m8-wp-06-commercial-runtime-reliability.json
          if-no-files-found: warn
          retention-days: 30

  commercial-persistence-recovery:
    name: Commercial persistence, replay and authorization
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: markorbit-test-only
      AUTH_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_m8_wp06_core
      AUTH_POSTGRES_TEST_REQUIRED: '1'
      MARKREG_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_m8_wp06_markreg
      MARKREG_POSTGRES_TEST_REQUIRED: '1'
      MARKREG_ORDER_POSTGRES_REQUIRED: '1'
      MARKREG_AUDIT_POSTGRES_REQUIRED: '1'
      PAYMENT_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_m8_wp06_payment
      PAYMENT_POSTGRES_REQUIRED: '1'
      MO_INTERNAL_SERVICE_SECRET: m8-wp06-ci-internal-secret-32-bytes-minimum
      MO_CSRF_SECRET: m8-wp06-ci-csrf-secret-32-bytes-minimum
      WEB_ORIGINS: https://test.markorbit.local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create commercial owner databases
        run: |
          psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE markorbit_m8_wp06_core;
          CREATE DATABASE markorbit_m8_wp06_markreg;
          CREATE DATABASE markorbit_m8_wp06_payment;
          SQL
      - name: Build typed commercial dependencies
        run: pnpm exec turbo run build --filter=@markorbit/core-service... --filter=@markorbit/markreg-service... --filter=@markorbit/payment-service... --filter=@markorbit/mgsn-service... --filter=@markorbit/gateway...
      - name: Prove Core account and Workspace restart durability
        run: pnpm --filter @markorbit/core-service exec vitest run --no-file-parallelism tests/account-access-postgres.test.ts tests/account-onboarding-postgres.test.ts
      - name: Prove MarkReg checkout replay and audit durability
        run: pnpm --filter @markorbit/markreg-service exec vitest run --no-file-parallelism tests/commercial-checkout-postgres.test.ts tests/audit-postgres.test.ts
      - name: Prove Payment initiation, lifecycle, refund and reconciliation durability
        run: pnpm --filter @markorbit/payment-service exec vitest run --no-file-parallelism tests/payment-postgres.test.ts tests/payment-lifecycle-postgres.test.ts
      - name: Prove internal operator and owner-routing boundaries
        run: |
          pnpm --filter @markorbit/core-service exec vitest run tests/commercial-admin-account.test.ts
          pnpm --filter @markorbit/markreg-service exec vitest run tests/commercial-admin-read.test.ts
          pnpm --filter @markorbit/payment-service exec vitest run tests/payment-admin-http.test.ts tests/stripe-provider.test.ts
          pnpm --filter @markorbit/gateway exec vitest run tests/commercial-admin-account-http.test.ts tests/commercial-admin-markreg-http.test.ts tests/commercial-admin-mgsn-http.test.ts tests/commercial-admin-payment-http.test.ts tests/commercial-checkout-boundary.test.ts
