name: M8 WP-06 Commercial Runtime Reliability

on:
  pull_request:
    paths:
      - '.github/workflows/m8-wp-06-commercial-runtime-reliability.yml'
      - 'apps/operations-console/**'

permissions:
  contents: read

jobs:
  prettier-probe:
    name: Control Center Prettier probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write apps/operations-console/src/App.tsx
          git diff -- apps/operations-console/src/App.tsx
          exit 1
