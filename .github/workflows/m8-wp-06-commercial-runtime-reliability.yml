name: Control Plane Doc Prettier Probe

on:
  pull_request:
    paths:
      - '.github/workflows/m8-wp-06-commercial-runtime-reliability.yml'
      - 'docs/architecture/MO_CONTROL_PLANE_CURRENT_STATE.md'

permissions:
  contents: read

jobs:
  prettier-probe:
    name: Control Plane doc Prettier probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write docs/architecture/MO_CONTROL_PLANE_CURRENT_STATE.md
          git diff -- docs/architecture/MO_CONTROL_PLANE_CURRENT_STATE.md
          exit 1
