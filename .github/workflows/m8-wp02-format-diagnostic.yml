name: M8 WP02 format diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/m8-wp02-format-diagnostic.yml'
      - 'apps/markreg-web/src/AccountEntry*'
      - 'apps/lite-web/src/AccountEntry*'
      - 'apps/lite-web/src/account-entry.css'
      - 'services/core/tests/account-onboarding-postgres.test.ts'

permissions:
  contents: write

jobs:
  apply-prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact repository formatting
        run: >-
          pnpm exec prettier --write
          apps/markreg-web/src/AccountEntry.stories.tsx
          apps/markreg-web/src/AccountEntry.tsx
          apps/lite-web/src/AccountEntry.stories.tsx
          apps/lite-web/src/AccountEntry.test.tsx
          apps/lite-web/src/AccountEntry.tsx
          apps/lite-web/src/account-entry.css
          services/core/tests/account-onboarding-postgres.test.ts
      - name: Commit formatting only when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/markreg-web/src/AccountEntry.stories.tsx \
            apps/markreg-web/src/AccountEntry.tsx \
            apps/lite-web/src/AccountEntry.stories.tsx \
            apps/lite-web/src/AccountEntry.test.tsx \
            apps/lite-web/src/AccountEntry.tsx \
            apps/lite-web/src/account-entry.css \
            services/core/tests/account-onboarding-postgres.test.ts
          git commit -m "format m8 wp02 account onboarding"
          git push origin HEAD:${{ github.head_ref }}
