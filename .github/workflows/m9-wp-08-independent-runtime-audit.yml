name: M9 WP-08 Independent Runtime Audit

on:
  pull_request:
    paths:
      - '.github/workflows/m9-wp-08-independent-runtime-audit.yml'
      - 'scripts/m9-wp-08-independent-runtime-audit.mjs'
      - 'docs/audits/MO-MVP-MILESTONE-009-DAILY-WORKSPACE-RUNTIME-AUDIT.json'
      - 'docs/tasks/MO-MVP-M9-WP-08-RELIABILITY-INDEPENDENT-AUDIT.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: m9-wp08-independent-runtime-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-runtime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      M9_WP08_AUDITED_CANDIDATE_SHA: d4d9595bcf8d1fe57ee0e4b4885b7c4c451274b1
      M9_WP08_WP07_BASE_SHA: 48d6c44aa55648b25222698cc07ba892735d145c
      M9_WP08_CANDIDATE_PR: '126'
      M9_WP08_CANDIDATE_DIR: .artifacts/m9-wp08-candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install audit dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch exact audited and inherited candidates
        run: |
          git fetch --no-tags origin "$M9_WP08_AUDITED_CANDIDATE_SHA"
          git fetch --no-tags origin "$M9_WP08_WP07_BASE_SHA"
      - name: Collect exact candidate GitHub evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$M9_WP08_CANDIDATE_PR" > .artifacts/m9-wp08-candidate-pr.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$M9_WP08_AUDITED_CANDIDATE_SHA&per_page=100" > .artifacts/m9-wp08-candidate-runs.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$M9_WP08_WP07_BASE_SHA&per_page=100" > .artifacts/m9-wp08-wp07-runs.json
      - name: Validate independent audit branch boundaries
        run: |
          pnpm validate:workspace
          pnpm validate:persistence-boundaries
          pnpm test:gateway-inventory
          pnpm format:check
      - name: Prepare exact candidate clean worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$M9_WP08_CANDIDATE_DIR" "$M9_WP08_AUDITED_CANDIDATE_SHA"
          cd "$M9_WP08_CANDIDATE_DIR"
          pnpm install --frozen-lockfile
          pnpm build
      - name: Exact candidate governance and formatting
        working-directory: ${{ env.M9_WP08_CANDIDATE_DIR }}
        run: |
          pnpm validate:workspace
          pnpm validate:persistence-boundaries
          pnpm test:story-matrix
          pnpm test:gateway-inventory
          pnpm format:check
      - name: Exact candidate lint
        working-directory: ${{ env.M9_WP08_CANDIDATE_DIR }}
        run: pnpm lint
      - name: Exact candidate typecheck
        working-directory: ${{ env.M9_WP08_CANDIDATE_DIR }}
        run: pnpm typecheck
      - name: Exact candidate tests
        working-directory: ${{ env.M9_WP08_CANDIDATE_DIR }}
        run: pnpm test
      - name: Exact candidate final build
        working-directory: ${{ env.M9_WP08_CANDIDATE_DIR }}
        run: pnpm build
      - name: Produce independent M9 runtime recommendation
        run: node scripts/m9-wp-08-independent-runtime-audit.mjs
      - name: Upload independent runtime audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m9-wp-08-independent-runtime-audit-${{ github.run_id }}
          path: |
            .artifacts/m9-wp-08-independent-runtime-audit.json
            .artifacts/m9-wp08-candidate-pr.json
            .artifacts/m9-wp08-candidate-runs.json
            .artifacts/m9-wp08-wp07-runs.json
          if-no-files-found: warn
          retention-days: 30
