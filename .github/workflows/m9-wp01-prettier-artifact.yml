name: M9 WP01 Prettier Artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  CI: '1'

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m9-wp01-daily-workspace-contracts
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format WP01 files
        run: >-
          pnpm exec prettier --write
          docs/architecture/MO-LITE-DAILY-WORKSPACE-AUTHORITY-BOUNDARY.md
          docs/planning/MO-MVP-MILESTONE-009-SCOPE-LOCK.md
          packages/contracts/src/daily-workspace.ts
          packages/contracts/tests/daily-workspace-contract.test.ts
      - name: Commit exact Prettier output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/MO-LITE-DAILY-WORKSPACE-AUTHORITY-BOUNDARY.md \
            docs/planning/MO-MVP-MILESTONE-009-SCOPE-LOCK.md \
            packages/contracts/src/daily-workspace.ts \
            packages/contracts/tests/daily-workspace-contract.test.ts
          if git diff --cached --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git commit -m "chore: apply WP01 prettier"
          git push origin HEAD:agent/m9-wp01-daily-workspace-contracts
