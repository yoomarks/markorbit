name: M9 WP02 Runtime Wiring

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  CI: '1'

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m9-wp02-knowledge-daily-signal
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire Core and Lite runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('services/core/src/index.ts')
          text = core.read_text()
          marker = "import {\n  fingerprintCoreIntakeRequest,"
          replacement = "import { resolveAcceptedKnowledgeDailySource } from './knowledge-daily-source.js';\nimport {\n  fingerprintCoreIntakeRequest,"
          if marker not in text:
              raise SystemExit('Core import marker missing')
          text = text.replace(marker, replacement, 1)
          route_marker = "        {\n          method: 'GET' as const,\n          path: '/internal/knowledge/ready-packages/:readyPackageId/product-loop-source',"
          daily_route = """        {
          method: 'GET' as const,
          path: '/internal/knowledge/ready-packages/:readyPackageId/daily-source',
          handle: internal(async (request) => {
            const workspaceId = request.headers['x-markorbit-workspace-id'];
            const readyPackageId = request.params.readyPackageId;
            if (!workspaceId || !canonicalUuid(workspaceId))
              throw new HttpError(
                400,
                'INVALID_WORKSPACE_CONTEXT',
                'Workspace context is required.'
              );
            if (!readyPackageId?.trim())
              throw new HttpError(400, 'INVALID_REQUEST', 'readyPackageId is required.');
            if (!options.knowledgeIntakes || !options.knowledgeContents)
              throw new HttpError(
                503,
                'KNOWLEDGE_DAILY_SOURCE_UNAVAILABLE',
                'Accepted Knowledge Daily source projection is unavailable.',
                true
              );
            const projection = await resolveAcceptedKnowledgeDailySource(
              options.knowledgeIntakes,
              options.knowledgeContents,
              workspaceId.toLowerCase(),
              readyPackageId
            );
            if (!projection)
              throw new HttpError(
                404,
                'ACCEPTED_KNOWLEDGE_DAILY_SOURCE_NOT_FOUND',
                'Accepted Knowledge ReadyPackage content was not found for this Workspace.'
              );
            return json(200, projection);
          })
        },
"""
          if route_marker not in text:
              raise SystemExit('Core route marker missing')
          text = text.replace(route_marker, daily_route + route_marker, 1)
          export_marker = "export * from './knowledge-content.js';\n"
          if export_marker not in text:
              raise SystemExit('Core export marker missing')
          text = text.replace(
              export_marker,
              export_marker + "export * from './knowledge-daily-source.js';\n",
              1
          )
          core.write_text(text)

          lite_main = Path('services/lite/src/main.ts')
          text = lite_main.read_text()
          import_marker = "import { PostgresProductLoopFeedbackStore } from './feedback.js';\n"
          if import_marker not in text:
              raise SystemExit('Lite main import marker missing')
          text = text.replace(
              import_marker,
              import_marker + "import {\n  HttpCoreDailyKnowledgeSourceAuthority,\n  PostgresLiteDailySignalStore\n} from './daily-signal.js';\n",
              1
          )
          url_marker = "const markRegUrl = process.env.MARKREG_URL ?? 'http://127.0.0.1:4105';\n"
          if url_marker not in text:
              raise SystemExit('Lite main URL marker missing')
          text = text.replace(
              url_marker,
              url_marker + "const coreUrl = process.env.CORE_URL ?? 'http://127.0.0.1:4101';\n",
              1
          )
          store_marker = "const analyticsStore = new PostgresProductConversionAnalyticsStore(pool);\n"
          if store_marker not in text:
              raise SystemExit('Lite main store marker missing')
          text = text.replace(
              store_marker,
              store_marker + "const dailySignalStore = new PostgresLiteDailySignalStore(\n  database,\n  pool,\n  new HttpCoreDailyKnowledgeSourceAuthority(coreUrl, internalServiceSecret)\n);\n",
              1
          )
          options_marker = "    analyticsStore\n  })\n"
          if options_marker not in text:
              raise SystemExit('Lite main route options marker missing')
          text = text.replace(options_marker, "    analyticsStore,\n    dailySignalStore\n  })\n", 1)
          lite_main.write_text(text)

          lite_http = Path('services/lite/src/http.ts')
          text = lite_http.read_text()
          import_marker = "import { ProductLoopFeedbackError, type PostgresProductLoopFeedbackStore } from './feedback.js';\n"
          if import_marker not in text:
              raise SystemExit('Lite HTTP import marker missing')
          text = text.replace(
              import_marker,
              import_marker + "import {\n  DailySignalImportError,\n  type PostgresLiteDailySignalStore\n} from './daily-signal.js';\n",
              1
          )
          option_marker = "  analyticsStore: PostgresProductConversionAnalyticsStore;\n"
          if option_marker not in text:
              raise SystemExit('Lite HTTP option marker missing')
          text = text.replace(
              option_marker,
              option_marker + "  dailySignalStore?: PostgresLiteDailySignalStore;\n",
              1
          )
          error_marker = "    error instanceof ProductLoopFeedbackError ||\n    error instanceof ProductConversionAnalyticsError\n"
          if error_marker not in text:
              raise SystemExit('Lite HTTP error marker missing')
          text = text.replace(
              error_marker,
              "    error instanceof ProductLoopFeedbackError ||\n    error instanceof ProductConversionAnalyticsError ||\n    error instanceof DailySignalImportError\n",
              1
          )
          return_marker = "export function createLiteProductLoopRoutes(options: LiteProductLoopRouteOptions): JsonRoute[] {\n  return [\n"
          if return_marker not in text:
              raise SystemExit('Lite HTTP return marker missing')
          import_route = """export function createLiteProductLoopRoutes(options: LiteProductLoopRouteOptions): JsonRoute[] {
  return [
    ...(options.dailySignalStore
      ? [
          {
            method: 'POST' as const,
            path: '/internal/v1/daily-signals/import',
            handle: async (request: JsonRequest) => {
              const workspaceId = internalWorkspace(request, options.internalServiceSecret);
              const body = bodyOf(request);
              try {
                return json(
                  201,
                  await options.dailySignalStore!.importKnowledgeSource({
                    workspaceId,
                    readyPackageId: text(body.readyPackageId, 'readyPackageId'),
                    idempotencyKey: keyOf(request)
                  })
                );
              } catch (error) {
                return mapError(error);
              }
            }
          }
        ]
      : []),
"""
          text = text.replace(return_marker, import_route, 1)
          lite_http.write_text(text)
          PY
      - name: Format WP02 files
        run: >-
          pnpm exec prettier --write
          packages/contracts/src/daily-source.ts
          services/core/src/knowledge-content.ts
          services/core/src/knowledge-daily-source.ts
          services/core/src/index.ts
          services/core/tests/knowledge-daily-source-http.test.ts
          services/lite/src/daily-signal.ts
          services/lite/src/http.ts
          services/lite/src/main.ts
          services/lite/tests/daily-signal.test.ts
          services/lite/tests/daily-signal-postgres.test.ts
          docs/tasks/MO-MVP-M9-WP-02-KNOWLEDGE-TO-DAILY-SIGNAL.md
      - name: Commit runtime wiring and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m9-wp02-wire-runtime.yml
          git add packages/contracts services/core services/lite docs/tasks infrastructure/persistence
          git commit -m "M9 WP02: wire accepted Knowledge into Lite Daily Signals"
          git push origin HEAD:agent/m9-wp02-knowledge-daily-signal
