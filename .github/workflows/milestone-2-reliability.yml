name: Milestone 2 reliability

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      PERSISTENCE_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_persistence_test
      IDENTITY_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_core_test
      AUTH_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_core_test
      MARKREG_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_markreg_test
      EXECUTION_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_execution_test
      MO_INTERNAL_SERVICE_SECRET: task-026-ci-internal-secret-32-bytes
      MO_CSRF_SECRET: task-026-ci-csrf-secret-32-bytes-minimum
      WEB_ORIGINS: https://test.markorbit.local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create database-per-owner topology
        env: { PGPASSWORD: markorbit-test-only }
        run: |
          psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE markorbit_persistence_test;
          CREATE DATABASE markorbit_core_test;
          CREATE DATABASE markorbit_markreg_test;
          CREATE DATABASE markorbit_execution_test;
          SQL
      - name: Migration matrix
        run: pnpm test:milestone2:migrations
      - name: MarkReg repeatability
        run: pnpm test:milestone2:markreg-repeatability
      - name: Listener restart matrix
        run: pnpm test:milestone2:restart
      - name: Outage and recovery matrix
        run: pnpm test:milestone2:outage
      - name: Concurrency and idempotency matrix
        run: pnpm test:milestone2:concurrency
      - name: Tenant-isolation matrix
        run: pnpm test:milestone2:tenant-isolation
      - name: Browser topology and no-interception guards
        run: pnpm test:milestone2:topology
      - run: pnpm exec playwright install --with-deps chromium
      - name: Existing dedicated browser suites
        run: |
          pnpm test:lite-matter:browser
          pnpm test:professional-review:browser
          pnpm test:document-package:browser
          pnpm test:e2e:real-runtime
      - name: Final workspace check
        run: pnpm check
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-2-reliability-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
