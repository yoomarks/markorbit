name: Milestone 2 reliability

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'scripts/milestone2-migrations.integration.test.ts'
      - '.github/workflows/milestone-2-reliability.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      PERSISTENCE_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_persistence_test
      IDENTITY_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_core_test
      AUTH_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_core_test
      MARKREG_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_markreg_test
      EXECUTION_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_execution_test
      MILESTONE2_CORE_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_core_test
      MILESTONE2_MARKREG_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_markreg_test
      MILESTONE2_EXECUTION_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_execution_test
      MILESTONE2_TENANT_REQUIRED: '1'
      MILESTONE2_MIGRATIONS_REQUIRED: '1'
      MILESTONE2_RESTART_REQUIRED: '1'
      MILESTONE2_OUTAGE_REQUIRED: '1'
      MO_INTERNAL_SERVICE_SECRET: task-026-ci-internal-secret-32-bytes
      MO_CSRF_SECRET: task-026-ci-csrf-secret-32-bytes-minimum
      WEB_ORIGINS: https://test.markorbit.local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create database-per-owner topology
        env: { PGPASSWORD: markorbit-test-only }
        run: |
          psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE markorbit_persistence_test;
          CREATE DATABASE markorbit_core_test;
          CREATE DATABASE markorbit_markreg_test;
          CREATE DATABASE markorbit_execution_test;
          SQL
      - name: Install browser for full reliability matrix
        if: github.event_name != 'pull_request'
        run: pnpm exec playwright install --with-deps chromium
      - name: Exact-head migration reliability
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p .artifacts
          if pnpm test:milestone2:migrations > .artifacts/milestone-2-migrations.log 2>&1; then
            status=0
          else
            status=$?
          fi
          cat .artifacts/milestone-2-migrations.log
          exit "$status"
      - name: Ordered executable reliability matrix
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p .artifacts
          if pnpm test:milestone2:reliability > .artifacts/milestone-2-reliability.log 2>&1; then
            status=0
          else
            status=$?
          fi
          cat .artifacts/milestone-2-reliability.log
          exit "$status"
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-2-reliability-failure
          path: |
            .artifacts/milestone-2-migrations.log
            .artifacts/milestone-2-reliability.log
            .artifacts/milestone-runtime/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
