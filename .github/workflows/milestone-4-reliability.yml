name: Milestone 4 reliability

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * *'

permissions:
  contents: read

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      M4_EXPECTED_HEAD_SHA: ${{ github.sha }}
      MGSN_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_mgsn_test
      EXECUTION_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_execution_test
      MO_INTERNAL_SERVICE_SECRET: m4-wp08-ci-internal-key-32-bytes
      MO_CSRF_SECRET: m4-wp08-ci-csrf-key-32-bytes-minimum
      WEB_ORIGINS: https://test.markorbit.local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create M4 reliability database topology
        env: { PGPASSWORD: markorbit-test-only }
        run: |
          psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE markorbit_mgsn_test;
          CREATE DATABASE markorbit_execution_test;
          SQL
      - name: Run exact-head M4 reliability matrix
        run: |
          mkdir -p .artifacts
          set -o pipefail
          node scripts/run-milestone4-reliability.mjs 2>&1 | tee .artifacts/milestone-4-reliability.log
      - name: Upload exact-head reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-4-reliability-${{ github.run_id }}
          path: |
            .artifacts/milestone-4-reliability.log
            .artifacts/milestone-4-reliability-evidence.json
          if-no-files-found: ignore
          retention-days: 14
