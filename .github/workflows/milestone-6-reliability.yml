name: Milestone 6 reliability

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '57 2 * * *'

permissions:
  contents: read

jobs:
  reliability-privacy-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      M6_EXPECTED_HEAD_SHA: ${{ github.sha }}
      M6_REGISTRY_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_m6_registry
      M6_LEDGER_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_m6_ledger
      M6_CANDIDATE_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_m6_candidate
      M6_DISPOSITION_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_m6_disposition
      M6_BROWSER_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_m6_browser
      M6_BROWSER_EXECUTION_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_m6_browser_execution
      PGPASSWORD: markorbit-test-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Create isolated M6 reliability databases
        run: |
          psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE markorbit_m6_registry;
          CREATE DATABASE markorbit_m6_ledger;
          CREATE DATABASE markorbit_m6_candidate;
          CREATE DATABASE markorbit_m6_disposition;
          CREATE DATABASE markorbit_m6_browser;
          CREATE DATABASE markorbit_m6_browser_execution;
          SQL
      - name: Run exact-head M6 reliability privacy replay matrix
        run: |
          mkdir -p .artifacts
          set -o pipefail
          node scripts/run-milestone6-reliability.mjs 2>&1 | tee .artifacts/milestone-6-reliability.log
      - name: Upload exact-head M6 reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-6-reliability-${{ github.run_id }}
          path: |
            .artifacts/milestone-6-reliability.log
            .artifacts/milestone-6-reliability-evidence.json
          if-no-files-found: ignore
          retention-days: 14
