name: MO-CAP-001 Implementation Profile Registry

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mo-cap-001-implementation-profile-registry.yml'
      - 'services/capability-engine/src/implementation-profile-registry.ts'
      - 'services/capability-engine/src/implementation-profile-registry-postgres.ts'
      - 'services/capability-engine/tests/implementation-profile-registry*.test.ts'
      - 'services/capability-engine/package.json'
      - 'packages/contracts/src/capability-runtime.ts'
      - 'infrastructure/persistence/migration-owners.json'
      - 'infrastructure/persistence/migrations/0066_capability_engine_implementation_profile_registry.sql'

permissions:
  contents: read

jobs:
  implementation-profile-registry-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_capability_implementation_profile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_capability_implementation_profile_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CAPABILITY_ENGINE_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_capability_implementation_profile_test
      CAPABILITY_ENGINE_POSTGRES_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture exact Prettier output
        run: |
          pnpm exec prettier services/capability-engine/src/implementation-profile-registry-postgres.ts --write
          echo '__PRETTIER_OUTPUT_BEGIN__'
          cat services/capability-engine/src/implementation-profile-registry-postgres.ts
          echo '__PRETTIER_OUTPUT_END__'
          exit 1
      - name: Validate ownership boundaries
        run: pnpm validate:workspace && pnpm validate:persistence-boundaries
      - name: Build Capability Engine dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/capability-engine...
      - name: Validate Capability Engine
        run: pnpm --filter @markorbit/capability-engine lint && pnpm --filter @markorbit/capability-engine typecheck
      - name: Run real PostgreSQL Implementation Profile Registry tests
        run: pnpm --filter @markorbit/capability-engine test:implementation-profile-registry:postgres
