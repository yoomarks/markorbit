name: MO-CAP-003 Constructor Fix Once

on:
  push:
    branches: [mo-cap-003-durable-communication-foundation]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mo-cap-003-durable-communication-foundation
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Fix reconstruction wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/capability-engine/tests/managed-communication-foundation-postgres.test.ts')
          text = path.read_text()
          old = 'new PostgresManagedCommunicationFoundationV1(database.getPool())'
          if text.count(old) != 2:
              raise SystemExit(f'expected two old constructor calls, found {text.count(old)}')
          path.write_text(text.replace(old, 'new PostgresManagedCommunicationFoundationV1(database, database.getPool())'))
          PY
          pnpm exec prettier --write services/capability-engine/tests/managed-communication-foundation-postgres.test.ts
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/capability-engine/tests/managed-communication-foundation-postgres.test.ts
          git commit -m 'fix: wire communication reconstruction transaction host'
          git push origin HEAD:mo-cap-003-durable-communication-foundation
