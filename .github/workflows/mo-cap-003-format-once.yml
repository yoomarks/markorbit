name: MO-CAP-003 Format Once

on:
  push:
    branches: [mo-cap-003-durable-communication-foundation]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mo-cap-003-durable-communication-foundation
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          services/capability-engine/src/managed-communication-foundation.ts
          services/capability-engine/tests/managed-communication-foundation.test.ts
          services/capability-engine/tests/managed-communication-foundation-postgres.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/capability-engine/src/managed-communication-foundation.ts services/capability-engine/tests/managed-communication-foundation.test.ts services/capability-engine/tests/managed-communication-foundation-postgres.test.ts
          git commit -m 'style: format durable communication foundation'
          git push origin HEAD:mo-cap-003-durable-communication-foundation
