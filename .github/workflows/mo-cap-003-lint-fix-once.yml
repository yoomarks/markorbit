name: MO-CAP-003 Lint Fix Once

on:
  push:
    branches: [mo-cap-003-durable-communication-foundation]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mo-cap-003-durable-communication-foundation
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply lint-only fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('services/capability-engine/src/managed-communication-foundation.ts')
          text = source.read_text()
          old = """    } catch (error) {
              return Promise.reject(error);
            }
          }

          resolveAccount("""
          new = """    } catch (error) {
              return Promise.reject(
                error instanceof Error
                  ? error
                  : new ManagedCommunicationFoundationError(
                      'INVALID_PERSISTED_STATE',
                      'Managed Communication account registration failed with a non-Error rejection.'
                    )
              );
            }
          }

          resolveAccount("""
          if old not in text:
              raise SystemExit('target Promise.reject pattern not found')
          source.write_text(text.replace(old, new, 1))

          test = Path('services/capability-engine/tests/managed-communication-foundation-postgres.test.ts')
          value = test.read_text()
          old_sql = "SET message_json=jsonb_set(message_json,'{subject}','\\\"tampered\\\"'::jsonb,false)"
          new_sql = "SET message_json=jsonb_set(message_json,'{subject}',to_jsonb('tampered'::text),false)"
          if old_sql not in value:
              raise SystemExit('target tamper SQL pattern not found')
          test.write_text(value.replace(old_sql, new_sql, 1))
          PY
          pnpm exec prettier --write services/capability-engine/src/managed-communication-foundation.ts services/capability-engine/tests/managed-communication-foundation-postgres.test.ts
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/capability-engine/src/managed-communication-foundation.ts services/capability-engine/tests/managed-communication-foundation-postgres.test.ts
          git commit -m 'fix: satisfy communication lint invariants'
          git push origin HEAD:mo-cap-003-durable-communication-foundation
