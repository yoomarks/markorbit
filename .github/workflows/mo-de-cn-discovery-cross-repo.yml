name: MO-DE CN Discovery Cross-Repo Acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/mo-de-cn-discovery-cross-repo.yml'
      - 'packages/contracts/src/data-engine.ts'
      - 'packages/contracts/src/data-engine-discovery.ts'
      - 'packages/contracts/package.json'
      - 'apps/gateway/src/data-engine-http.ts'
      - 'apps/gateway/src/data-engine-discovery-http.ts'
      - 'apps/gateway/tests/data-engine-cn-discovery-cross-repo.test.ts'
      - 'apps/gateway/package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mo-de-cn-discovery-cross-repo-${{ github.ref }}
  cancel-in-progress: true

env:
  DATA_ENGINE_DISCOVERY_ACCEPTANCE_SHA: 3e31dfea05a56d4a36cbf93520bbdf79148b601c
  MO_DE_DISCOVERY_PROVIDER_URL: http://127.0.0.1:8211
  MO_DE_DISCOVERY_CROSS_REPO: '1'

jobs:
  authenticated-discovery-cross-repo:
    name: Authenticated Gateway -> bounded CN Discovery V2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout MarkOrbit consumer
        uses: actions/checkout@v4

      - name: Checkout exact accepted Data Engine Discovery provider
        uses: actions/checkout@v4
        with:
          repository: yoomarks/markorbit-data-engine
          ref: ${{ env.DATA_ENGINE_DISCOVERY_ACCEPTANCE_SHA }}
          path: .cross-repo/markorbit-data-engine

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .cross-repo/markorbit-data-engine/pyproject.toml

      - name: Install MarkOrbit workspace
        run: pnpm install --frozen-lockfile

      - name: Build Discovery consumer runtime dependencies
        run: |
          pnpm --filter @markorbit/contracts build
          pnpm --filter @markorbit/events build
          pnpm --filter @markorbit/service-kit build
          pnpm --filter @markorbit/gateway build

      - name: Install exact Data Engine provider
        run: python -m pip install -e .cross-repo/markorbit-data-engine

      - name: Initialize provider-owned Postgres and ClickHouse schemas
        shell: bash
        run: |
          set -euo pipefail
          cd .cross-repo/markorbit-data-engine
          cp .env.example .env
          sed -i 's|^RAW_DATA_PATH=.*|RAW_DATA_PATH=./raw_data|' .env
          mkdir -p raw_data raw_data/visual_processed
          docker compose up -d --wait postgres clickhouse
          docker compose ps

      - name: Seed quiescent CN serving epoch and bounded Discovery facts
        shell: bash
        run: |
          set -euo pipefail
          cd .cross-repo/markorbit-data-engine

          docker compose exec -T postgres psql \
            -U markorbit -d markorbit_control -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO control.source_package
          (package_id, jurisdiction, file_name, file_path, file_size, sha256,
           package_kind, partition_dimension, partition_value,
           source_period_start, source_period_end, source_sequence, source_rank,
           dataset_release_date, status, profile, processed_at)
          VALUES
          ('70000000-0000-4000-8000-000000000001', 'CN',
           'cn-discovery-crossrepo-202608.zip', '/acceptance/cn-discovery-crossrepo-202608.zip',
           1024, '7777777777777777777777777777777777777777777777777777777777777777',
           'MONTHLY_PATCH', 'MONTH', '2026-08',
           DATE '2026-08-01', DATE '2026-08-31', 1, 1,
           DATE '2026-08-31', 'SUCCESS', '{}'::jsonb, now());
          SQL

          docker compose exec -T clickhouse clickhouse-client --multiquery <<'SQL'
          INSERT INTO markorbit_facts.cn_case_current
          (case_id, application_number, mark_name_raw, filing_date, prelim_pub_date,
           prelim_pub_issue, classes, source_effective_date, source_row_hash,
           last_source_package_id, record_hash, source_rank, ingested_at, is_deleted)
          VALUES
          ('70000000-0000-4000-8000-000000000011', '2026000001', 'DISCOVERY ONE',
           '2026-01-02', '2026-04-02', '1930', [9], '2026-08-31',
           '1111111111111111111111111111111111111111111111111111111111111111',
           '70000000-0000-4000-8000-000000000001',
           'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',
           1, '2026-08-31 00:01:00.000', 0),
          ('70000000-0000-4000-8000-000000000012', '2026000002', 'DISCOVERY TWO',
           '2026-01-03', '2026-04-03', '1930', [35], '2026-08-31',
           '2222222222222222222222222222222222222222222222222222222222222222',
           '70000000-0000-4000-8000-000000000001',
           'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb',
           1, '2026-08-31 00:02:00.000', 0),
          ('70000000-0000-4000-8000-000000000013', '2026000003', 'DISCOVERY THREE',
           '2026-01-04', '2026-04-04', '1930', [42], '2026-08-31',
           '3333333333333333333333333333333333333333333333333333333333333333',
           '70000000-0000-4000-8000-000000000001',
           'cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc',
           1, '2026-08-31 00:03:00.000', 0);
          SQL

          docker compose exec -T postgres psql -U markorbit -d markorbit_control -v ON_ERROR_STOP=1 \
            -c "SELECT package_sequence, status, package_kind, dataset_release_date FROM control.source_package WHERE jurisdiction='CN';"
          docker compose exec -T clickhouse clickhouse-client \
            --query "SELECT application_number, toString(case_id), prelim_pub_date FROM markorbit_facts.cn_case_current FINAL WHERE application_number >= '2026000000' AND application_number < '2026000010' ORDER BY application_number, toString(case_id)"

      - name: Start exact auth-required Discovery provider
        shell: bash
        run: |
          set -euo pipefail
          KEY="mo-de-discovery-$(openssl rand -hex 32)"
          echo "MO_DE_DISCOVERY_API_KEY=$KEY" >> "$GITHUB_ENV"

          cd .cross-repo/markorbit-data-engine
          env INTEGRATION_AUTH_MODE=required \
              INTEGRATION_API_KEYS="$KEY" \
              INTEGRATION_RATE_LIMIT_ENABLED=false \
              MARKORBIT_DATA_ENGINE_SHA="${DATA_ENGINE_DISCOVERY_ACCEPTANCE_SHA}" \
              nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8211 \
              > /tmp/mo-de-cn-discovery-provider.log 2>&1 &

          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null \
              -H "Authorization: Bearer $KEY" \
              http://127.0.0.1:8211/api/v1/contract; then
              exit 0
            fi
            sleep 1
          done
          echo 'Discovery provider did not become ready.' >&2
          cat /tmp/mo-de-cn-discovery-provider.log || true
          exit 1

      - name: Run exact authenticated Discovery cross-repository acceptance
        run: |
          pnpm --filter @markorbit/gateway exec vitest run \
            tests/data-engine-cn-discovery-cross-repo.test.ts

      - name: Show provider diagnostics on failure
        if: failure()
        run: |
          echo '--- Discovery provider ---'
          cat /tmp/mo-de-cn-discovery-provider.log || true
          echo '--- provider databases ---'
          cd .cross-repo/markorbit-data-engine
          docker compose ps || true
          docker compose logs --no-color postgres clickhouse || true

      - name: Tear down isolated provider databases
        if: always()
        run: |
          cd .cross-repo/markorbit-data-engine
          docker compose down --remove-orphans
