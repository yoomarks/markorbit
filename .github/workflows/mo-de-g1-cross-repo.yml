name: MO-DE G1 Cross-Repo Acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/mo-de-g1-cross-repo.yml'
      - 'apps/gateway/src/data-engine-http.ts'
      - 'apps/gateway/src/data-engine-g1-runtime.ts'
      - 'apps/gateway/src/data-engine-route-support.ts'
      - 'apps/gateway/src/data-engine-product-http.ts'
      - 'apps/gateway/src/index.ts'
      - 'apps/gateway/tests/data-engine-http.test.ts'
      - 'apps/gateway/tests/data-engine-g1-cross-repo.test.ts'
      - 'apps/gateway/tests/data-engine-primary-runtime.test.ts'
      - 'apps/gateway/tests/data-engine-primary-cross-repo.test.ts'
      - 'packages/contracts/src/data-engine.ts'
      - 'docs/integrations/data-engine/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mo-de-g1-cross-repo-${{ github.ref }}
  cancel-in-progress: true

env:
  DATA_ENGINE_ACCEPTANCE_SHA: 57be59ab27e41ac99ae95922ce802aa189c48181
  MO_DE_G1_PROVIDER_URL: http://127.0.0.1:8201
  MO_DE_G1_RATE_LIMIT_PROVIDER_URL: http://127.0.0.1:8202
  MO_DE_G1_INVALID_CONFIG_PROVIDER_URL: http://127.0.0.1:8203
  MO_DE_G1_CROSS_REPO: '1'

jobs:
  authenticated-cross-repo:
    name: Authenticated primary Gateway -> Data Engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout MarkOrbit consumer
        uses: actions/checkout@v4

      - name: Checkout current accepted Data Engine provider baseline
        uses: actions/checkout@v4
        with:
          repository: yoomarks/markorbit-data-engine
          ref: ${{ env.DATA_ENGINE_ACCEPTANCE_SHA }}
          path: .cross-repo/markorbit-data-engine

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .cross-repo/markorbit-data-engine/pyproject.toml

      - name: Install MarkOrbit workspace
        run: pnpm install --frozen-lockfile

      - name: Build G1 runtime workspace dependencies
        run: |
          pnpm --filter @markorbit/contracts build
          pnpm --filter @markorbit/service-kit build

      - name: Install exact Data Engine provider
        run: python -m pip install -e .cross-repo/markorbit-data-engine

      - name: Initialize provider databases with provider-owned schema
        shell: bash
        run: |
          set -euo pipefail
          cd .cross-repo/markorbit-data-engine
          cp .env.example .env
          sed -i 's|^RAW_DATA_PATH=.*|RAW_DATA_PATH=./raw_data|' .env
          mkdir -p raw_data raw_data/visual_processed
          docker compose up -d --wait postgres clickhouse
          docker compose ps

      - name: Start isolated auth-required provider profiles
        shell: bash
        run: |
          set -euo pipefail
          KEY="mo-de-g1-$(openssl rand -hex 32)"
          echo "MO_DE_G1_API_KEY=$KEY" >> "$GITHUB_ENV"

          cd .cross-repo/markorbit-data-engine
          env INTEGRATION_AUTH_MODE=required \
              INTEGRATION_API_KEYS="$KEY" \
              INTEGRATION_RATE_LIMIT_ENABLED=false \
              nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8201 \
              > /tmp/mo-de-g1-provider.log 2>&1 &

          env INTEGRATION_AUTH_MODE=required \
              INTEGRATION_API_KEYS="$KEY" \
              INTEGRATION_RATE_LIMIT_ENABLED=true \
              INTEGRATION_RATE_LIMIT_MAX_REQUESTS=1 \
              INTEGRATION_RATE_LIMIT_WINDOW_SECONDS=60 \
              nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8202 \
              > /tmp/mo-de-g1-rate-limit.log 2>&1 &

          env INTEGRATION_AUTH_MODE=required \
              INTEGRATION_API_KEYS= \
              INTEGRATION_RATE_LIMIT_ENABLED=false \
              nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8203 \
              > /tmp/mo-de-g1-invalid-config.log 2>&1 &

          wait_http() {
            local url="$1"
            local authorization="${2:-}"
            for _ in $(seq 1 60); do
              if [ -n "$authorization" ]; then
                if curl --silent --output /dev/null \
                  -H "Authorization: Bearer $authorization" "$url"; then
                  return 0
                fi
              elif curl --silent --output /dev/null "$url"; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          wait_http http://127.0.0.1:8201/api/v1/contract "$KEY"
          # An unauthenticated readiness request proves the rate-limit process is alive
          # without consuming its single authenticated acceptance request.
          wait_http http://127.0.0.1:8202/api/v1/contract
          # This profile intentionally answers 503 because required auth is misconfigured.
          wait_http http://127.0.0.1:8203/api/v1/contract

      - name: Run consumer contract and primary Gateway cross-repository acceptance
        run: |
          pnpm --filter @markorbit/gateway typecheck
          pnpm --filter @markorbit/gateway exec vitest run \
            tests/data-engine-http.test.ts \
            tests/data-engine-primary-runtime.test.ts \
            tests/data-engine-g1-cross-repo.test.ts \
            tests/data-engine-primary-cross-repo.test.ts

      - name: Show provider diagnostics on failure
        if: failure()
        run: |
          echo '--- primary provider ---'
          cat /tmp/mo-de-g1-provider.log || true
          echo '--- rate-limit provider ---'
          cat /tmp/mo-de-g1-rate-limit.log || true
          echo '--- invalid-config provider ---'
          cat /tmp/mo-de-g1-invalid-config.log || true
          echo '--- provider databases ---'
          cd .cross-repo/markorbit-data-engine
          docker compose ps || true
          docker compose logs --no-color postgres clickhouse || true

      - name: Tear down isolated provider databases
        if: always()
        run: |
          cd .cross-repo/markorbit-data-engine
          docker compose down --remove-orphans
