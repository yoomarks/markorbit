name: MO-DE G1 Cross-Repo Acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/mo-de-g1-cross-repo.yml'
      - 'apps/gateway/src/data-engine-http.ts'
      - 'apps/gateway/src/data-engine-g1-runtime.ts'
      - 'apps/gateway/src/data-engine-route-support.ts'
      - 'apps/gateway/src/data-engine-product-http.ts'
      - 'apps/gateway/src/product-loop-http.ts'
      - 'apps/gateway/src/trademark-asset-data-engine.ts'
      - 'apps/gateway/src/index.ts'
      - 'apps/gateway/tests/data-engine-http.test.ts'
      - 'apps/gateway/tests/data-engine-g1-cross-repo.test.ts'
      - 'apps/gateway/tests/data-engine-primary-runtime.test.ts'
      - 'apps/gateway/tests/data-engine-primary-cross-repo.test.ts'
      - 'apps/gateway/tests/data-engine-product-query-contract.test.ts'
      - 'apps/gateway/tests/trademark-asset-data-engine.test.ts'
      - 'apps/gateway/tests/trademark-asset-product-admission.test.ts'
      - 'apps/gateway/tests/trademark-asset-primary-cross-repo.test.ts'
      - 'services/lite/src/trademark-asset-composition-http.ts'
      - 'services/lite/src/trademark-asset-http.ts'
      - 'services/lite/tests/trademark-asset-composition-http.test.ts'
      - 'packages/contracts/src/data-engine.ts'
      - 'docs/integrations/data-engine/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mo-de-g1-cross-repo-${{ github.ref }}
  cancel-in-progress: true

env:
  DATA_ENGINE_ACCEPTANCE_SHA: 57be59ab27e41ac99ae95922ce802aa189c48181
  MO_DE_G1_PROVIDER_URL: http://127.0.0.1:8201
  MO_DE_G1_RATE_LIMIT_PROVIDER_URL: http://127.0.0.1:8202
  MO_DE_G1_INVALID_CONFIG_PROVIDER_URL: http://127.0.0.1:8203
  MO_DE_G1_PRIMARY_RATE_LIMIT_PROVIDER_URL: http://127.0.0.1:8204
  MO_DE_G1_CROSS_REPO: '1'

jobs:
  authenticated-cross-repo:
    name: Authenticated primary Gateway -> Data Engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout MarkOrbit consumer
        uses: actions/checkout@v4

      - name: Checkout current accepted Data Engine provider baseline
        uses: actions/checkout@v4
        with:
          repository: yoomarks/markorbit-data-engine
          ref: ${{ env.DATA_ENGINE_ACCEPTANCE_SHA }}
          path: .cross-repo/markorbit-data-engine

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .cross-repo/markorbit-data-engine/pyproject.toml

      - name: Install MarkOrbit workspace
        run: pnpm install --frozen-lockfile

      - name: Build G1 runtime workspace dependencies
        run: |
          pnpm --filter @markorbit/contracts build
          pnpm --filter @markorbit/service-kit build

      - name: Install exact Data Engine provider
        run: python -m pip install -e .cross-repo/markorbit-data-engine

      - name: Initialize provider databases with provider-owned schema
        shell: bash
        run: |
          set -euo pipefail
          cd .cross-repo/markorbit-data-engine
          cp .env.example .env
          sed -i 's|^RAW_DATA_PATH=.*|RAW_DATA_PATH=./raw_data|' .env
          mkdir -p raw_data raw_data/visual_processed
          docker compose up -d --wait postgres clickhouse
          docker compose ps

      - name: Seed isolated MO-DE-010 provider fact fixture
        shell: bash
        run: |
          set -euo pipefail
          cd .cross-repo/markorbit-data-engine
          docker compose exec -T clickhouse clickhouse-client --multiquery <<'SQL'
          INSERT INTO markorbit_facts.us_case_current
          (case_id, serial_number, filing_date, registration_date, renewal_date, status_code,
           source_row_hash, last_source_package_id, record_hash, source_rank, ingested_at)
          VALUES
          ('11111111-1111-4111-8111-111111111111', '98123456', '2024-01-02', '2025-03-04',
           '2035-03-04', '700',
           'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',
           '22222222-2222-4222-8222-222222222222',
           'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb',
           1, '2026-08-24 02:00:00.000');

          INSERT INTO markorbit_facts.us_owner_current
          (owner_key, serial_number, entry_number, party_name, source_row_hash,
           last_source_package_id, record_hash, source_rank, ingested_at)
          VALUES
          ('cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc',
           '98123456', 1, 'MarkOrbit Acceptance Owner LLC',
           'dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd',
           '33333333-3333-4333-8333-333333333333',
           'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee',
           1, '2026-08-24 02:01:00.000');

          INSERT INTO markorbit_facts.us_classification_current
          (classification_key, serial_number, international_codes, source_row_hash,
           last_source_package_id, record_hash, source_rank, ingested_at)
          VALUES
          ('ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff',
           '98123456', ['009', '035'],
           '1111111111111111111111111111111111111111111111111111111111111111',
           '44444444-4444-4444-8444-444444444444',
           '2222222222222222222222222222222222222222222222222222222222222222',
           1, '2026-08-24 02:02:00.000');
          SQL

      - name: Start isolated auth-required provider profiles
        shell: bash
        run: |
          set -euo pipefail
          KEY="mo-de-g1-$(openssl rand -hex 32)"
          echo "MO_DE_G1_API_KEY=$KEY" >> "$GITHUB_ENV"

          cd .cross-repo/markorbit-data-engine
          env INTEGRATION_AUTH_MODE=required \
              INTEGRATION_API_KEYS="$KEY" \
              INTEGRATION_RATE_LIMIT_ENABLED=false \
              nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8201 \
              > /tmp/mo-de-g1-provider.log 2>&1 &

          env INTEGRATION_AUTH_MODE=required \
              INTEGRATION_API_KEYS="$KEY" \
              INTEGRATION_RATE_LIMIT_ENABLED=true \
              INTEGRATION_RATE_LIMIT_MAX_REQUESTS=1 \
              INTEGRATION_RATE_LIMIT_WINDOW_SECONDS=60 \
              nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8202 \
              > /tmp/mo-de-g1-rate-limit.log 2>&1 &

          env INTEGRATION_AUTH_MODE=required \
              INTEGRATION_API_KEYS= \
              INTEGRATION_RATE_LIMIT_ENABLED=false \
              nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8203 \
              > /tmp/mo-de-g1-invalid-config.log 2>&1 &

          env INTEGRATION_AUTH_MODE=required \
              INTEGRATION_API_KEYS="$KEY" \
              INTEGRATION_RATE_LIMIT_ENABLED=true \
              INTEGRATION_RATE_LIMIT_MAX_REQUESTS=1 \
              INTEGRATION_RATE_LIMIT_WINDOW_SECONDS=60 \
              nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8204 \
              > /tmp/mo-de-g1-primary-rate-limit.log 2>&1 &

          wait_http() {
            local url="$1"
            local authorization="${2:-}"
            for _ in $(seq 1 60); do
              if [ -n "$authorization" ]; then
                if curl --silent --output /dev/null \
                  -H "Authorization: Bearer $authorization" "$url"; then
                  return 0
                fi
              elif curl --silent --output /dev/null "$url"; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          wait_http http://127.0.0.1:8201/api/v1/contract "$KEY"
          # Unauthenticated readiness probes prove the rate-limit processes are alive
          # without consuming either single authenticated acceptance request.
          wait_http http://127.0.0.1:8202/api/v1/contract
          wait_http http://127.0.0.1:8204/api/v1/contract
          # This profile intentionally answers 503 because required auth is misconfigured.
          wait_http http://127.0.0.1:8203/api/v1/contract

      - name: Run consumer contract and primary Gateway cross-repository acceptance
        run: |
          pnpm --filter @markorbit/gateway typecheck
          pnpm --filter @markorbit/lite-service typecheck
          pnpm --filter @markorbit/gateway exec vitest run \
            tests/data-engine-http.test.ts \
            tests/data-engine-product-query-contract.test.ts \
            tests/data-engine-primary-runtime.test.ts \
            tests/data-engine-g1-cross-repo.test.ts \
            tests/data-engine-primary-cross-repo.test.ts \
            tests/trademark-asset-data-engine.test.ts \
            tests/trademark-asset-product-admission.test.ts \
            tests/trademark-asset-primary-cross-repo.test.ts
          pnpm --filter @markorbit/lite-service exec vitest run \
            tests/trademark-asset-composition-http.test.ts

      - name: Show provider diagnostics on failure
        if: failure()
        run: |
          echo '--- primary provider ---'
          cat /tmp/mo-de-g1-provider.log || true
          echo '--- MO-DE-006 rate-limit provider ---'
          cat /tmp/mo-de-g1-rate-limit.log || true
          echo '--- MO-DE-009 rate-limit provider ---'
          cat /tmp/mo-de-g1-primary-rate-limit.log || true
          echo '--- invalid-config provider ---'
          cat /tmp/mo-de-g1-invalid-config.log || true
          echo '--- provider databases ---'
          cd .cross-repo/markorbit-data-engine
          docker compose ps || true
          docker compose logs --no-color postgres clickhouse || true

      - name: Tear down isolated provider databases
        if: always()
        run: |
          cd .cross-repo/markorbit-data-engine
          docker compose down --remove-orphans
