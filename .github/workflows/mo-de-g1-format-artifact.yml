name: MO-DE-006 Format Artifact

on:
  pull_request:
    paths:
      - '.github/workflows/mo-de-g1-format-artifact.yml'
      - 'apps/gateway/src/data-engine-g1-runtime.ts'
      - 'apps/gateway/src/data-engine-http.ts'
      - 'apps/gateway/tests/data-engine-g1-cross-repo.test.ts'
      - 'apps/gateway/tests/data-engine-http.test.ts'
      - 'packages/contracts/src/data-engine.ts'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format G1 files
        run: pnpm exec prettier --write apps/gateway/src/data-engine-g1-runtime.ts apps/gateway/src/data-engine-http.ts apps/gateway/tests/data-engine-g1-cross-repo.test.ts apps/gateway/tests/data-engine-http.test.ts packages/contracts/src/data-engine.ts
      - name: Commit exact formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Formatting already clean.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/gateway/src/data-engine-g1-runtime.ts \
                  apps/gateway/src/data-engine-http.ts \
                  apps/gateway/tests/data-engine-g1-cross-repo.test.ts \
                  apps/gateway/tests/data-engine-http.test.ts \
                  packages/contracts/src/data-engine.ts
          git commit -m 'chore: apply Prettier to MO-DE-006 files'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
