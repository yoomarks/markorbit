name: one-time M6 WP-08 formatter

on:
  push:
    branches:
      - agent/m6-wp-08-independent-integration-authority-audit

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6-wp-08-independent-integration-authority-audit
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format WP-08 remediation
        run: |
          pnpm exec prettier --write \
            scripts/m6-wp-06-capability-center-real-runtime.ts \
            scripts/run-milestone6-reliability.mjs \
            scripts/validate-m6-capability-center-no-interception.mjs \
            .github/workflows/m6-wp-06-authenticated-capability-center.yml \
            .github/workflows/milestone-6-reliability.yml
          rm .github/workflows/one-time-m6-wp08-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(m6): format WP-08 remediation'
          git push origin HEAD:agent/m6-wp-08-independent-integration-authority-audit
