name: one-time M7 planning formatter

on:
  push:
    branches:
      - agent/m7-beta-release-readiness-scope-lock

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m7-beta-release-readiness-scope-lock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M7 planning docs
        run: |
          pnpm exec prettier --write \
            README.md \
            docs/planning/TASK-INDEX.md \
            docs/planning/MO-MVP-MILESTONE-007-SCOPE-LOCK.md \
            docs/planning/MO-MVP-MILESTONE-007-DELIVERY-PLAN.md \
            docs/planning/MO-MVP-MILESTONE-007-PLAN.json \
            docs/tasks/MO-MVP-TASK-032A-MILESTONE-007-SCOPE-LOCK.md
          rm .github/workflows/one-time-m7-planning-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(m7): format planning scope lock'
          git push origin HEAD:agent/m7-beta-release-readiness-scope-lock
