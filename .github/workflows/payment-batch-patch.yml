name: Payment batch patch and validate

on:
  push:
    branches:
      - agent/m8-wp04-payment-foundation-v2
    paths:
      - .github/workflows/payment-batch-patch.yml

permissions:
  contents: write

jobs:
  patch-format-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m8-wp04-payment-foundation-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix exact optional refund event test fixtures
        shell: python
        run: |
          from pathlib import Path
          for file in [
              Path('services/payment/tests/payment-lifecycle.test.ts'),
              Path('services/payment/tests/payment-lifecycle-postgres.test.ts'),
          ]:
              text = file.read_text()
              old = 'providerRefundReference: refund.providerRefundReference,'
              new = 'providerRefundReference: refund.providerRefundReference!,'
              if old not in text:
                  raise SystemExit(f'refund reference fixture not found in {file}')
              file.write_text(text.replace(old, new, 1))
      - name: Format focused files
        run: >-
          pnpm exec prettier --write
          services/payment/tests/payment-lifecycle.test.ts
          services/payment/tests/payment-lifecycle-postgres.test.ts
      - name: Commit focused fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "markorbit-payment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add services/payment/tests/payment-lifecycle.test.ts services/payment/tests/payment-lifecycle-postgres.test.ts
          git commit -m "test(payment): tighten refund event fixtures"
          git push origin HEAD:agent/m8-wp04-payment-foundation-v2
      - name: Validate focused Payment slice
        run: |
          pnpm --filter @markorbit/contracts typecheck
          pnpm --filter @markorbit/payment-service typecheck
          pnpm --filter @markorbit/gateway typecheck
          pnpm --filter @markorbit/contracts test -- payment.test.ts
          pnpm --filter @markorbit/payment-service test
          pnpm --filter @markorbit/gateway test -- payment-http.test.ts
          node scripts/validate-gateway-inventory.mjs
