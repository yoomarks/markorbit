name: Payment exact format

on:
  push:
    branches:
      - agent/m8-wp04-payment-foundation-v2
    paths:
      - .github/workflows/payment-format-exact.yml

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m8-wp04-payment-foundation-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format lifecycle HTTP exactly
        run: pnpm exec prettier --write services/payment/src/payment-lifecycle-http.ts services/payment/tests/payment-lifecycle-http.test.ts
      - name: Commit exact formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted"
          else
            git config user.name "markorbit-format-bot"
            git config user.email "actions@users.noreply.github.com"
            git add services/payment/src/payment-lifecycle-http.ts services/payment/tests/payment-lifecycle-http.test.ts
            git commit -m "style(payment): normalize lifecycle HTTP"
            git push origin HEAD:agent/m8-wp04-payment-foundation-v2
          fi
      - name: Validate focused Payment slice
        run: |
          pnpm --filter @markorbit/payment-service typecheck
          pnpm --filter @markorbit/payment-service test
          pnpm --filter @markorbit/payment-service lint
          pnpm --filter @markorbit/payment-service build
