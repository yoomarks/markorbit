name: Payment format and focused validation

on:
  push:
    branches:
      - agent/m8-wp04-payment-foundation-v2
    paths:
      - .github/workflows/payment-format-sync.yml

permissions:
  contents: write

jobs:
  format-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m8-wp04-payment-foundation-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Payment files
        run: >-
          pnpm exec prettier --write
          packages/contracts/src/payment.ts
          packages/contracts/tests/payment.test.ts
          services/payment/src/payment-lifecycle.ts
          services/payment/src/payment-postgres.ts
          services/payment/src/payment-service.ts
          services/payment/tests/payment-lifecycle.test.ts
          services/payment/tests/payment-postgres.test.ts
          services/payment/tests/payment-service.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "markorbit-format-bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/contracts/src/payment.ts packages/contracts/tests/payment.test.ts services/payment
          git commit -m "style(payment): normalize payment foundation"
          git push origin HEAD:agent/m8-wp04-payment-foundation-v2
      - name: Typecheck Payment contracts and service
        run: |
          pnpm --filter @markorbit/contracts typecheck
          pnpm --filter @markorbit/payment-service typecheck
      - name: Test Payment contracts and service
        run: |
          pnpm --filter @markorbit/contracts test -- payment.test.ts
          pnpm --filter @markorbit/payment-service test
