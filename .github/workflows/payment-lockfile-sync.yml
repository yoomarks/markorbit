name: Payment lockfile sync

on:
  push:
    branches:
      - agent/m8-wp04-payment-foundation-v2
    paths:
      - services/payment/package.json
      - .github/workflows/payment-lockfile-sync.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m8-wp04-payment-foundation-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Generate workspace lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "markorbit-lockfile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(payment): sync workspace lockfile"
          git push origin HEAD:agent/m8-wp04-payment-foundation-v2
