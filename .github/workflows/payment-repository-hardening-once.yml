name: Payment repository hardening once

on:
  push:
    branches:
      - agent/m8-wp04-payment-foundation-v2
    paths:
      - .github/workflows/payment-repository-hardening-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Make Payment lifecycle lookup explicit
        run: |
          python - <<'PY'
          from pathlib import Path

          lifecycle = Path('services/payment/src/payment-lifecycle.ts')
          s = lifecycle.read_text()
          old = """  findByProviderPaymentReference(\n    provider: PaymentProviderCode,\n    providerPaymentReference: string\n  ): Promise<PaymentLifecycleAggregate | null>;\n"""
          new = """  findByPaymentId(\n    workspaceId: string,\n    paymentId: PaymentId\n  ): Promise<PaymentLifecycleAggregate | null>;\n  findByProviderPaymentReference(\n    provider: PaymentProviderCode,\n    providerPaymentReference: string\n  ): Promise<PaymentLifecycleAggregate | null>;\n"""
          assert s.count(old) == 1, 'repository interface shape changed'
          s = s.replace(old, new, 1)

          old = """  findByProviderPaymentReference(provider: string, reference: string) {\n    const attempt = [...this.attempts.values()].find(\n"""
          new = """  findByPaymentId(workspaceId: string, paymentId: PaymentId) {\n    const payment = this.payments.get(paymentId);\n    if (!payment || payment.workspaceId !== workspaceId) return Promise.resolve(null);\n    const attempt = [...this.attempts.values()]\n      .filter((candidate) => candidate.paymentId === paymentId)\n      .sort((a, b) => b.attemptNumber - a.attemptNumber)[0];\n    return Promise.resolve(attempt ? { payment: clone(payment), attempt: clone(attempt) } : null);\n  }\n\n  findByProviderPaymentReference(provider: string, reference: string) {\n    const attempt = [...this.attempts.values()].find(\n"""
          assert s.count(old) == 1, 'in-memory repository shape changed'
          s = s.replace(old, new, 1)

          old = """  private async findAggregateByPayment(\n    workspaceId: string,\n    paymentId: PaymentId\n  ): Promise<PaymentLifecycleAggregate> {\n    // Provider references are the durable join point; repositories may optimize this lookup.\n    const candidates = await Promise.all([] as Promise<PaymentLifecycleAggregate | null>[]);\n    void candidates;\n    if ('findByPaymentId' in this.repository) {\n      const lookup = this.repository as PaymentLifecycleRepository & {\n        findByPaymentId(\n          workspaceId: string,\n          paymentId: PaymentId\n        ): Promise<PaymentLifecycleAggregate | null>;\n      };\n      const aggregate = await lookup.findByPaymentId(workspaceId, paymentId);\n      if (aggregate) return aggregate;\n    }\n    throw new PaymentLifecycleError('PAYMENT_NOT_FOUND', 'Payment was not found.');\n  }\n"""
          new = """  private async findAggregateByPayment(\n    workspaceId: string,\n    paymentId: PaymentId\n  ): Promise<PaymentLifecycleAggregate> {\n    const aggregate = await this.repository.findByPaymentId(workspaceId, paymentId);\n    if (aggregate) return aggregate;\n    throw new PaymentLifecycleError('PAYMENT_NOT_FOUND', 'Payment was not found.');\n  }\n"""
          assert s.count(old) == 1, 'payment lookup implementation changed'
          s = s.replace(old, new, 1)

          old = """    if (thrown) throw thrown;\n    return result;\n"""
          new = """    if (thrown !== undefined) {\n      if (thrown instanceof Error) throw thrown;\n      throw new PaymentLifecycleError(\n        'PERSISTENCE_UNAVAILABLE',\n        'Payment lifecycle operation failed.'\n      );\n    }\n    return result;\n"""
          assert s.count(old) == 1, 'atomic error handling changed'
          s = s.replace(old, new, 1)

          old = """\nexport interface PaymentLifecycleLookupRepository extends PaymentLifecycleRepository {\n  findByPaymentId(\n    workspaceId: string,\n    paymentId: PaymentId\n  ): Promise<PaymentLifecycleAggregate | null>;\n}\n"""
          assert s.count(old) == 1, 'lookup extension interface changed'
          s = s.replace(old, '\n', 1)
          lifecycle.write_text(s)

          postgres = Path('services/payment/src/payment-postgres.ts')
          s = postgres.read_text()
          assert s.count('  type PaymentLifecycleLookupRepository,') == 1
          s = s.replace('  type PaymentLifecycleLookupRepository,', '  type PaymentLifecycleRepository,', 1)
          assert s.count('implements PaymentRepository, PaymentLifecycleLookupRepository') == 1
          s = s.replace(
            'implements PaymentRepository, PaymentLifecycleLookupRepository',
            'implements PaymentRepository, PaymentLifecycleRepository',
            1
          )
          s = s.replace(
            "...(row.payment_id ? { paymentId: String(row.payment_id) as PaymentId } : {}),",
            "...(typeof row.payment_id === 'string' ? { paymentId: row.payment_id as PaymentId } : {}),",
            1
          )
          s = s.replace(
            "...(row.refund_id ? { refundId: String(row.refund_id) as PaymentRefundId } : {}),",
            "...(typeof row.refund_id === 'string' ? { refundId: row.refund_id as PaymentRefundId } : {}),",
            1
          )
          s = s.replace(
            "...(row.ignored_reason ? { ignoredReason: String(row.ignored_reason) } : {})",
            "...(typeof row.ignored_reason === 'string' ? { ignoredReason: row.ignored_reason } : {})",
            1
          )
          s = s.replace(
            "...(row.provider_refund_reference\n      ? { providerRefundReference: String(row.provider_refund_reference) }\n      : {}),",
            "...(typeof row.provider_refund_reference === 'string'\n      ? { providerRefundReference: row.provider_refund_reference }\n      : {}),",
            1
          )
          old = """          const reservedRows = await client.query(\n            `SELECT amount_minor\n"""
          new = """          const reservedRows = await client.query<Row>(\n            `SELECT amount_minor\n"""
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          assert s.count('(sum, row) => sum + Number((row as Row).amount_minor),') == 1
          s = s.replace(
            '(sum, row) => sum + Number((row as Row).amount_minor),',
            '(sum, row) => sum + Number(row.amount_minor),',
            1
          )
          postgres.write_text(s)

          tests = Path('services/payment/tests/payment-lifecycle.test.ts')
          s = tests.read_text()
          assert s.count('  type PaymentLifecycleLookupRepository,\n') == 1
          s = s.replace('  type PaymentLifecycleLookupRepository,\n', '', 1)
          s = s.replace(
            "  initiatedByUserId: 'user_lifecycle-test' as Payment['initiatedByUserId'],",
            "  initiatedByUserId: 'user_lifecycle-test',",
            1
          )
          old = """  const repository = new InMemoryPaymentLifecycleRepository() as PaymentLifecycleLookupRepository &\n    InMemoryPaymentLifecycleRepository;\n  repository.putPayment(initial, attempt);\n  repository.findByPaymentId = async (workspaceId, paymentId) => {\n    const aggregate = await repository.findByProviderPaymentReference(\n      attempt.provider,\n      attempt.providerPaymentReference\n    );\n    return aggregate?.payment.workspaceId === workspaceId &&\n      aggregate.payment.paymentId === paymentId\n      ? aggregate\n      : null;\n  };\n"""
          new = """  const repository = new InMemoryPaymentLifecycleRepository();\n  repository.putPayment(initial, attempt);\n"""
          assert s.count(old) == 1, 'test harness shape changed'
          s = s.replace(old, new, 1)
          tests.write_text(s)

          http_tests = Path('services/payment/tests/payment-lifecycle-http.test.ts')
          s = http_tests.read_text()
          s = s.replace(
            'const handleWebhook = vi.fn((_input: PaymentWebhookInput) => Promise.resolve(receipt));',
            'const handleWebhook = vi.fn(() => Promise.resolve(receipt));',
            1
          )
          http_tests.write_text(s)
          PY
          pnpm exec prettier --write services/payment/src/payment-lifecycle.ts services/payment/src/payment-postgres.ts services/payment/tests/payment-lifecycle.test.ts services/payment/tests/payment-lifecycle-http.test.ts
      - name: Validate Payment package with workspace dependencies
        run: |
          pnpm --filter @markorbit/payment-service lint
          pnpm --filter @markorbit/payment-service typecheck
          pnpm turbo run test --filter=@markorbit/payment-service
          pnpm turbo run build --filter=@markorbit/payment-service
      - name: Commit hardened source and remove one-shot workflow
        run: |
          git config user.name "markorbit-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/payment-repository-hardening-once.yml
          git add services/payment
          git commit -m "refactor(payment): make lifecycle lookup contract explicit"
          git push origin HEAD:agent/m8-wp04-payment-foundation-v2
