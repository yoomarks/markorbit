name: Phase 2 Format Preview

on:
  pull_request:
    paths:
      - 'services/core/src/official-fee-reference-store.ts'
      - 'services/core/src/official-fee-reference-store-postgres.ts'
      - 'services/core/tests/official-fee-reference-store.test.ts'
      - 'services/core/tests/official-fee-reference-store-postgres.test.ts'
      - '.github/workflows/phase2-format-preview.yml'

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and commit exact Phase 2 files
        run: |
          pnpm exec prettier --write \
            services/core/src/official-fee-reference-store.ts \
            services/core/src/official-fee-reference-store-postgres.ts \
            services/core/tests/official-fee-reference-store.test.ts \
            services/core/tests/official-fee-reference-store-postgres.test.ts
          git add \
            services/core/src/official-fee-reference-store.ts \
            services/core/src/official-fee-reference-store-postgres.ts \
            services/core/tests/official-fee-reference-store.test.ts \
            services/core/tests/official-fee-reference-store-postgres.test.ts
          if git diff --cached --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(core): format official fee reference store'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
