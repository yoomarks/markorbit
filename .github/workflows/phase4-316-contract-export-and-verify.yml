name: Phase 4 316 Contract Export And Verify

on:
  pull_request:

permissions:
  contents: write

jobs:
  wire-and-verify:
    if: github.head_ref == 'phase4/316-cn-duration-band-classification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Wire export, verify contracts, self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/contracts/package.json')
          s = p.read_text()
          export_anchor = '''    "./brain-cn-duration-research": {
              "types": "./dist/brain-cn-duration-research.d.ts",
              "import": "./dist/brain-cn-duration-research.js",
              "default": "./dist/brain-cn-duration-research.js"
            },'''.replace('      ', '  ')
          export_insert = export_anchor + '''
    "./brain-cn-duration-band-classification": {
      "types": "./dist/brain-cn-duration-band-classification.d.ts",
      "import": "./dist/brain-cn-duration-band-classification.js",
      "default": "./dist/brain-cn-duration-band-classification.js"
    },'''
          if s.count(export_anchor) != 1:
              raise SystemExit(f'expected one export anchor, found {s.count(export_anchor)}')
          s = s.replace(export_anchor, export_insert, 1)
          build_anchor = 'src/brain-cn-duration-research.ts src/brain-cn-duration-evidence-intake.ts'
          build_insert = 'src/brain-cn-duration-research.ts src/brain-cn-duration-band-classification.ts src/brain-cn-duration-evidence-intake.ts'
          if s.count(build_anchor) != 1:
              raise SystemExit(f'expected one build anchor, found {s.count(build_anchor)}')
          p.write_text(s.replace(build_anchor, build_insert, 1))
          PY
          pnpm exec prettier --write packages/contracts/package.json packages/contracts/src/brain-cn-duration-band-classification.ts packages/contracts/tests/brain-cn-duration-band-classification.test.ts
          pnpm --filter @markorbit/contracts build
          pnpm --filter @markorbit/contracts typecheck
          pnpm --filter @markorbit/contracts test -- brain-cn-duration-band-classification.test.ts
          rm .github/workflows/phase4-316-contract-export-and-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/package.json packages/contracts/src/brain-cn-duration-band-classification.ts packages/contracts/tests/brain-cn-duration-band-classification.test.ts .github/workflows/phase4-316-contract-export-and-verify.yml
          git diff --cached --check
          git commit -m "feat: publish validated CN duration band classifier"
          git push origin HEAD:${{ github.head_ref }}