name: Phase 4 Prettier Oracle

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'phase4/310-official-fee-resolver'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format, self-remove, and commit canonical output
        run: |
          pnpm exec prettier --write \
            services/capability-engine/src/uspto-official-fee-resolver-pilot.ts \
            services/capability-engine/tests/uspto-official-fee-resolver-pilot.test.ts
          pnpm exec prettier --check \
            services/capability-engine/src/uspto-official-fee-resolver-pilot.ts \
            services/capability-engine/tests/uspto-official-fee-resolver-pilot.test.ts
          rm .github/workflows/phase4-prettier-oracle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/capability-engine/src/uspto-official-fee-resolver-pilot.ts \
            services/capability-engine/tests/uspto-official-fee-resolver-pilot.test.ts \
            .github/workflows/phase4-prettier-oracle.yml
          git diff --cached --check
          git commit -m "chore: apply canonical resolver formatting"
          git push origin HEAD:${{ github.head_ref }}
