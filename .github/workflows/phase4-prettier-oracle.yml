name: Phase 4 Prettier Oracle

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'phase4/310-official-fee-resolver'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format exact Phase 4 Resolver files
        run: |
          pnpm exec prettier --write \
            services/capability-engine/src/uspto-official-fee-resolver-pilot.ts \
            services/capability-engine/tests/uspto-official-fee-resolver-pilot.test.ts
          pnpm exec prettier --check \
            services/capability-engine/src/uspto-official-fee-resolver-pilot.ts \
            services/capability-engine/tests/uspto-official-fee-resolver-pilot.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: phase4-resolver-prettier-output
          path: |
            services/capability-engine/src/uspto-official-fee-resolver-pilot.ts
            services/capability-engine/tests/uspto-official-fee-resolver-pilot.test.ts
          if-no-files-found: error
          retention-days: 1
