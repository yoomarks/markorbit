name: Phase 5 PR 325 Contract Fix

on:
  push:
    branches:
      - phase5/324-markreg-matter-intelligence-observation
    paths:
      - .github/workflows/phase5-325-contract-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5/324-markreg-matter-intelligence-observation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Promote Phase 4 output shape to shared runtime contract
        run: |
          python - <<'PY'
          from pathlib import Path

          contract = Path('packages/contracts/src/capability-runtime-execution.ts')
          text = contract.read_text()
          anchor = "} from './capability-runtime.js';\n"
          addition = """} from './capability-runtime.js';
          import {
            CN_DURATION_BAND_ACCEPTED_DATASET_REF,
            CN_DURATION_BAND_EXECUTABLE_KIND,
            cnCompletedDurationHistoricalBands,
            type CnCompletedDurationHistoricalBandV1
          } from './brain-cn-duration-band-classification.js';
          """
          if "CnDurationBandClassificationOutputV1" not in text:
              text = text.replace(anchor, addition, 1)
              insert = """
          export interface CnDurationBandClassificationOutputV1 {
            schemaVersion: 1;
            kind: typeof CN_DURATION_BAND_EXECUTABLE_KIND;
            jurisdiction: 'CN';
            procedure: 'FILING_TO_PRELIMINARY_PUBLICATION';
            observedCompletedDurationDays: number;
            historicalBand: CnCompletedDurationHistoricalBandV1;
            datasetRefId: typeof CN_DURATION_BAND_ACCEPTED_DATASET_REF;
            thresholds: Readonly<{ p25Days: 335; medianDays: 336; p75Days: 383 }>;
            semantics: 'COMPLETED_INTERVAL_RELATIVE_TO_ACCEPTED_HISTORICAL_DISTRIBUTION';
            descriptiveInterpretationOnly: true;
            legalConclusion: false;
            predictiveClaim: false;
            riskClaim: false;
            probabilityClaim: false;
            recommendation: false;
            currentCaseStatusInferred: false;
            productBusinessStateMutated: false;
          }

          export function parseCnDurationBandClassificationOutputV1(
            value: unknown
          ): CnDurationBandClassificationOutputV1 {
            const output = record(value, 'cnDurationBandClassificationOutput');
            exactKeys(
              output,
              [
                'schemaVersion', 'kind', 'jurisdiction', 'procedure',
                'observedCompletedDurationDays', 'historicalBand', 'datasetRefId', 'thresholds',
                'semantics', 'descriptiveInterpretationOnly', 'legalConclusion', 'predictiveClaim',
                'riskClaim', 'probabilityClaim', 'recommendation', 'currentCaseStatusInferred',
                'productBusinessStateMutated'
              ],
              'cnDurationBandClassificationOutput'
            );
            const thresholds = record(output.thresholds, 'cnDurationBandClassificationOutput.thresholds');
            exactKeys(
              thresholds,
              ['p25Days', 'medianDays', 'p75Days'],
              'cnDurationBandClassificationOutput.thresholds'
            );
            if (
              output.schemaVersion !== 1 ||
              output.kind !== CN_DURATION_BAND_EXECUTABLE_KIND ||
              output.jurisdiction !== 'CN' ||
              output.procedure !== 'FILING_TO_PRELIMINARY_PUBLICATION' ||
              !Number.isSafeInteger(output.observedCompletedDurationDays) ||
              Number(output.observedCompletedDurationDays) < 0 ||
              typeof output.historicalBand !== 'string' ||
              !(cnCompletedDurationHistoricalBands as readonly string[]).includes(output.historicalBand) ||
              output.datasetRefId !== CN_DURATION_BAND_ACCEPTED_DATASET_REF ||
              thresholds.p25Days !== 335 || thresholds.medianDays !== 336 || thresholds.p75Days !== 383 ||
              output.semantics !== 'COMPLETED_INTERVAL_RELATIVE_TO_ACCEPTED_HISTORICAL_DISTRIBUTION' ||
              output.descriptiveInterpretationOnly !== true ||
              output.legalConclusion !== false || output.predictiveClaim !== false ||
              output.riskClaim !== false || output.probabilityClaim !== false ||
              output.recommendation !== false || output.currentCaseStatusInferred !== false ||
              output.productBusinessStateMutated !== false
            ) {
              throw new CapabilityRuntimeExecutionContractError(
                'CN duration-band output is outside the accepted descriptive contract.'
              );
            }
            return {
              schemaVersion: 1,
              kind: CN_DURATION_BAND_EXECUTABLE_KIND,
              jurisdiction: 'CN',
              procedure: 'FILING_TO_PRELIMINARY_PUBLICATION',
              observedCompletedDurationDays: Number(output.observedCompletedDurationDays),
              historicalBand: output.historicalBand as CnCompletedDurationHistoricalBandV1,
              datasetRefId: CN_DURATION_BAND_ACCEPTED_DATASET_REF,
              thresholds: { p25Days: 335, medianDays: 336, p75Days: 383 },
              semantics: 'COMPLETED_INTERVAL_RELATIVE_TO_ACCEPTED_HISTORICAL_DISTRIBUTION',
              descriptiveInterpretationOnly: true,
              legalConclusion: false,
              predictiveClaim: false,
              riskClaim: false,
              probabilityClaim: false,
              recommendation: false,
              currentCaseStatusInferred: false,
              productBusinessStateMutated: false
            };
          }

          """
              marker = 'export interface GovernedCapabilityRuntimeExecutionV2 {'
              text = text.replace(marker, insert + marker, 1)
              contract.write_text(text)

          markreg = Path('services/markreg/src/matter-intelligence.ts')
          text = markreg.read_text()
          old_import = """import {
            CN_DURATION_BAND_ACCEPTED_DATASET_REF,
            CN_DURATION_BAND_EXECUTABLE_KIND,
            validateCnDurationBandClassificationOutputV1,
            type CnCompletedDurationHistoricalBandV1
          } from '@markorbit/contracts/brain-cn-duration-band-classification';
          """
          new_import = """import {
            CN_DURATION_BAND_ACCEPTED_DATASET_REF,
            type CnCompletedDurationHistoricalBandV1
          } from '@markorbit/contracts/brain-cn-duration-band-classification';
          """
          text = text.replace(old_import, new_import, 1)
          old_runtime_import = """import {
            CapabilityRuntimeExecutionContractError,
            parseGovernedCapabilityRuntimeExecutionV2,
            type GovernedCapabilityRuntimeExecutionV2
          } from '@markorbit/contracts/capability-runtime-execution';
          """
          new_runtime_import = """import {
            CapabilityRuntimeExecutionContractError,
            parseCnDurationBandClassificationOutputV1,
            parseGovernedCapabilityRuntimeExecutionV2,
            type CnDurationBandClassificationOutputV1,
            type GovernedCapabilityRuntimeExecutionV2
          } from '@markorbit/contracts/capability-runtime-execution';
          """
          text = text.replace(old_runtime_import, new_runtime_import, 1)
          start = text.index('interface DurationBandOutput {')
          end = text.index('\n}\n\nexport interface ValidatedDurationBandCapabilityResult', start) + 2
          text = text[:start] + 'type DurationBandOutput = CnDurationBandClassificationOutputV1;' + text[end:]
          old_parser = """function parseDurationBandOutput(value: unknown, expectedDays: number): DurationBandOutput {
            if (!validateCnDurationBandClassificationOutputV1(value)) {
              throw new MatterIntelligenceError(
                'CAPABILITY_CONTRACT_MISMATCH',
                'Capability output is outside the accepted descriptive Phase 5 contract.'
              );
            }
            const output = record(value, 'Capability output');
            if (output.observedCompletedDurationDays !== expectedDays) {
              throw new MatterIntelligenceError(
                'CAPABILITY_CONTRACT_MISMATCH',
                'Capability output does not match the caller-supplied completed duration.'
              );
            }
            return clone(value) as DurationBandOutput;
          }
          """
          new_parser = """function parseDurationBandOutput(value: unknown, expectedDays: number): DurationBandOutput {
            let output: DurationBandOutput;
            try {
              output = parseCnDurationBandClassificationOutputV1(value);
            } catch (error) {
              throw new MatterIntelligenceError(
                'CAPABILITY_CONTRACT_MISMATCH',
                'Capability output is outside the accepted descriptive Phase 5 contract.',
                409,
                false,
                undefined,
                { cause: error }
              );
            }
            if (output.observedCompletedDurationDays !== expectedDays) {
              throw new MatterIntelligenceError(
                'CAPABILITY_CONTRACT_MISMATCH',
                'Capability output does not match the caller-supplied completed duration.'
              );
            }
            return output;
          }
          """
          text = text.replace(old_parser, new_parser, 1)
          markreg.write_text(text)
          PY
          pnpm exec prettier --write packages/contracts/src/capability-runtime-execution.ts services/markreg/src/matter-intelligence.ts
      - name: Validate focused lint and typecheck
        run: |
          pnpm exec turbo run build --filter=@markorbit/markreg-service...
          pnpm --filter @markorbit/markreg-service lint
          pnpm --filter @markorbit/markreg-service typecheck
      - name: Self-clean and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase5-325-contract-fix.yml
          printf '%s\n' 'phase5-pr-325-contract-fix-complete' > .phase5-325-contract-fix-trigger
          git add packages/contracts/src/capability-runtime-execution.ts services/markreg/src/matter-intelligence.ts .phase5-325-contract-fix-trigger
          git commit -m "fix: formalize Phase 5 duration output contract"
          git push origin HEAD:phase5/324-markreg-matter-intelligence-observation
