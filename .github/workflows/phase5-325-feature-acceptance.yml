name: Phase 5 PR 325 Feature Acceptance

on:
  push:
    branches:
      - phase5/324-markreg-matter-intelligence-observation
    paths:
      - .github/workflows/phase5-325-feature-acceptance.yml

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: markorbit
          POSTGRES_PASSWORD: markorbit-phase5-test
          POSTGRES_DB: markorbit_phase5_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U markorbit -d markorbit_phase5_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5/324-markreg-matter-intelligence-observation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair focused test lint and typing
        run: |
          python - <<'PY'
          from pathlib import Path

          unit = Path('services/markreg/tests/matter-intelligence.test.ts')
          text = unit.read_text()
          text = text.replace(
              "  type MatterIntelligenceRepository,\n  type ValidatedDurationBandCapabilityResult",
              "  type MatterIntelligenceRepository,\n  type RecordMatterIntelligenceCommand,\n  type ValidatedDurationBandCapabilityResult",
              1,
          )
          text = text.replace(
              "function rawExecution(command: CapabilityRequestV2Command, suffix = 'one', output = durationOutput(336)) {",
              "function rawExecution(\n  command: CapabilityRequestV2Command,\n  suffix = 'one',\n  output: unknown = durationOutput(336)\n) {",
              1,
          )
          text = text.replace(
              "function command(days = 336, key = 'matter-intelligence-key-one') {",
              "function command(\n  days = 336,\n  key = 'matter-intelligence-key-one'\n): RecordMatterIntelligenceCommand {",
              1,
          )
          marker = "describe('MarkReg governed Capability HTTP client', () => {"
          helper = """function requestBodyText(body: BodyInit | null | undefined): string {
            if (typeof body !== 'string') throw new Error('Expected JSON string request body.');
            return body;
          }

          """
          if 'function requestBodyText(' not in text:
              text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              'const fetcher: typeof fetch = async (_input, init) => {',
              'const fetcher: typeof fetch = (_input, init) => {',
          )
          text = text.replace(
              'JSON.parse(String(init?.body))',
              'JSON.parse(requestBodyText(init?.body))',
          )
          text = text.replace(
              "return new Response(JSON.stringify(rawExecution(capturedCommand, 'http', durationOutput(336))), {\n        status: 201,\n        headers: { 'content-type': 'application/json' }\n      });",
              "return Promise.resolve(\n        new Response(JSON.stringify(rawExecution(capturedCommand, 'http', durationOutput(336))), {\n          status: 201,\n          headers: { 'content-type': 'application/json' }\n        })\n      );",
              1,
          )
          text = text.replace(
              "return new Response(JSON.stringify(rawExecution(commandValue, 'unsafe', unsafeOutput as never)), {\n        status: 201,\n        headers: { 'content-type': 'application/json' }\n      });",
              "return Promise.resolve(\n        new Response(JSON.stringify(rawExecution(commandValue, 'unsafe', unsafeOutput)), {\n          status: 201,\n          headers: { 'content-type': 'application/json' }\n        })\n      );",
              1,
          )
          text = text.replace(
              "async () => new Response(JSON.stringify({ code: 'CALLER_NOT_ALLOWED' }), { status: 409 })",
              "() => Promise.resolve(new Response(JSON.stringify({ code: 'CALLER_NOT_ALLOWED' }), { status: 409 }))",
              1,
          )
          text = text.replace(
              "async () => new Response(JSON.stringify({ code: 'UPSTREAM_FAILED' }), { status: 503 })",
              "() => Promise.resolve(new Response(JSON.stringify({ code: 'UPSTREAM_FAILED' }), { status: 503 }))",
              1,
          )
          text = text.replace(
              "async () => {\n        throw new Error('connection refused');\n      }",
              "() => Promise.reject(new Error('connection refused'))",
              1,
          )
          text = text.replace(
              "    const input = {\n      workspaceId,\n      formalMatterId,",
              "    const input: Parameters<\n      MatterIntelligenceCapabilityClient['classifyCompletedDuration']\n    >[0] = {\n      workspaceId,\n      formalMatterId,",
              1,
          )
          unit.write_text(text)

          postgres = Path('services/markreg/tests/matter-intelligence-postgres.test.ts')
          text = postgres.read_text()
          text = text.replace(
              "  MatterIntelligenceError,\n  PostgresMatterIntelligenceRepository,\n  type MarkRegMatterIntelligenceObservationV1",
              "  PostgresMatterIntelligenceRepository,\n  type MarkRegMatterIntelligenceObservationV1,\n  type MatterIntelligenceError",
              1,
          )
          postgres.write_text(text)
          PY
      - name: Format focused Phase 5 tests
        run: |
          pnpm exec prettier --write \
            packages/contracts/tests/capability-runtime-execution.test.ts \
            services/markreg/tests/matter-intelligence.test.ts \
            services/markreg/tests/matter-intelligence-postgres.test.ts
      - name: Validate focused contracts and MarkReg unit boundary
        run: |
          pnpm exec turbo run build --filter=@markorbit/markreg-service...
          pnpm --filter @markorbit/contracts exec vitest run tests/capability-runtime-execution.test.ts
          pnpm --filter @markorbit/markreg-service lint
          pnpm --filter @markorbit/markreg-service typecheck
          pnpm --filter @markorbit/markreg-service exec vitest run tests/matter-intelligence.test.ts
      - name: Run PostgreSQL durability acceptance
        env:
          MARKREG_MATTER_INTELLIGENCE_TEST_DATABASE_URL: postgresql://markorbit:markorbit-phase5-test@127.0.0.1:5432/markorbit_phase5_test
          MARKREG_MATTER_INTELLIGENCE_POSTGRES_REQUIRED: '1'
        run: pnpm --filter @markorbit/markreg-service exec vitest run --no-file-parallelism tests/matter-intelligence-postgres.test.ts
      - name: Self-clean and push accepted tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase5-325-feature-acceptance.yml
          printf '%s\n' 'phase5-pr-325-feature-acceptance-complete' > .phase5-325-feature-acceptance-trigger
          git add \
            packages/contracts/tests/capability-runtime-execution.test.ts \
            services/markreg/tests/matter-intelligence.test.ts \
            services/markreg/tests/matter-intelligence-postgres.test.ts \
            .phase5-325-feature-acceptance-trigger
          git commit -m "test: accept Phase 5 MarkReg intelligence slice"
          git push origin HEAD:phase5/324-markreg-matter-intelligence-observation
