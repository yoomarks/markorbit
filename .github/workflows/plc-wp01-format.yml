name: PLC WP01 format

on:
  push:
    branches:
      - plc-wp-01-product-loop-contracts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-01-product-loop-contracts
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact repository formatting
        run: >-
          pnpm exec prettier --write
          docs/architecture/PRODUCT-LOOP-AUTHORITY-BOUNDARY.md
          packages/contracts/src/product-loop.ts
          packages/contracts/tests/product-loop-contract.test.ts
      - name: Commit formatting only when changed
        shell: bash
        run: |
          if git diff --quiet -- \
            docs/architecture/PRODUCT-LOOP-AUTHORITY-BOUNDARY.md \
            packages/contracts/src/product-loop.ts \
            packages/contracts/tests/product-loop-contract.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/architecture/PRODUCT-LOOP-AUTHORITY-BOUNDARY.md \
            packages/contracts/src/product-loop.ts \
            packages/contracts/tests/product-loop-contract.test.ts
          git commit -m "style(plc): apply repository formatting"
          git push origin HEAD:plc-wp-01-product-loop-contracts
