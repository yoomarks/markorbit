name: PLC WP03 static fix

on:
  push:
    branches:
      - plc-wp-03-durable-candidate-qualification
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-03-durable-candidate-qualification
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove unnecessary assertions and apply repository formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/lite/src/candidate-qualification.ts')
          text = path.read_text()
          text = text.replace("  type ProductLoopSourceKind,\n", "")
          text = text.replace("  type ProductLoopSourceOwner,\n", "")
          text = text.replace("  const owner = locator.owner as ProductLoopSourceOwner;\n", "  const owner = locator.owner;\n")
          text = text.replace("  const kind = locator.kind as ProductLoopSourceKind;\n", "  const kind = locator.kind;\n")
          path.write_text(text)
          PY
          pnpm exec prettier --write \
            services/lite/src/candidate-qualification.ts \
            services/lite/tests/candidate-qualification-postgres.test.ts \
            .github/workflows/product-loop-candidate-qualification.yml \
            docs/tasks/MO-MVP-PLC-WP-03-DURABLE-CANDIDATE-QUALIFICATION.md \
            infrastructure/persistence/migrations/0040_lite_candidate_qualification.sql \
            infrastructure/persistence/migration-owners.json \
            services/lite/README.md \
            services/lite/package.json \
            services/lite/src/index.ts
          pnpm exec turbo run build --filter=@markorbit/lite-service...
          pnpm --filter @markorbit/lite-service lint
          pnpm --filter @markorbit/lite-service typecheck
      - name: Commit fixes only when changed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/lite/src/candidate-qualification.ts \
            services/lite/tests/candidate-qualification-postgres.test.ts \
            .github/workflows/product-loop-candidate-qualification.yml \
            docs/tasks/MO-MVP-PLC-WP-03-DURABLE-CANDIDATE-QUALIFICATION.md \
            infrastructure/persistence/migrations/0040_lite_candidate_qualification.sql \
            infrastructure/persistence/migration-owners.json \
            services/lite/README.md \
            services/lite/package.json \
            services/lite/src/index.ts
          git commit -m "fix(plc): satisfy WP03 static validation"
          git push origin HEAD:plc-wp-03-durable-candidate-qualification
