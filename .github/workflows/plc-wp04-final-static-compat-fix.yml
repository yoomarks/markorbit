name: PLC WP04 final static compatibility fix

on:
  push:
    branches:
      - plc-wp-04-formal-opportunity-handoff
    paths:
      - '.github/workflows/plc-wp04-final-static-compat-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-04-formal-opportunity-handoff
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Update current owner migration expectations
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/milestone2-migrations.integration.test.ts';
          let text = fs.readFileSync(path, 'utf8');
          const tablesOld = `    'markreg_lifecycle_views',\n    'orders',`;
          const tablesNew = `    'markreg_lifecycle_views',\n    'markreg_formal_opportunity_commands',\n    'markreg_formal_trademark_service_opportunities',\n    'markreg_intake_handoffs',\n    'orders',`;
          if (!text.includes(tablesOld)) throw new Error('MarkReg table inventory target not found');
          text = text.replace(tablesOld, tablesNew);
          const countOld = `expect(sets.reduce((count, set) => count + set.size, 0)).toBe(17);`;
          const countNew = `expect(sets.reduce((count, set) => count + set.size, 0)).toBe(18);`;
          if (!text.includes(countOld)) throw new Error('owner migration count target not found');
          text = text.replace(countOld, countNew);
          const markerOld = `    expect(sets[1]).toContain('0035_markreg_recommended_actions');`;
          const markerNew = `${markerOld}\n    expect(sets[1]).toContain('0041_markreg_formal_opportunity_handoff');`;
          if (!text.includes(markerOld)) throw new Error('MarkReg owner migration marker not found');
          text = text.replace(markerOld, markerNew);
          fs.writeFileSync(path, text);
          NODE
      - name: Format touched files
        run: >-
          pnpm exec prettier --write
          services/markreg/src/formal-opportunity.ts
          services/markreg/tests/formal-opportunity-postgres.test.ts
          scripts/milestone2-migrations.integration.test.ts
      - name: Commit permanent fixes and remove this workflow
        run: |
          rm .github/workflows/plc-wp04-final-static-compat-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(plc): align migration reliability and formatting"
          git push origin HEAD:plc-wp-04-formal-opportunity-handoff
