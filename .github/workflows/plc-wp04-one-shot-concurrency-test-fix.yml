name: PLC WP04 one-shot concurrency test fix

on:
  push:
    branches:
      - plc-wp-04-formal-opportunity-handoff
    paths:
      - '.github/workflows/plc-wp04-one-shot-concurrency-test-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-04-formal-opportunity-handoff
          fetch-depth: 0
      - name: Make concurrency replay assertion durable
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/markreg/tests/formal-opportunity-postgres.test.ts')
          text = path.read_text()
          old = """    const replayKey = fulfilled[0]!.value.formalTrademarkServiceOpportunityId.endsWith('_1')\n      ? command.idempotencyKey\n      : 'formal-opportunity-create-002';\n    const replay = await service.createFormalOpportunity({ ...command, idempotencyKey: replayKey });\n"""
          new = """    const winnerCommand = await database\n      .getPool()\n      .query(\n        \"SELECT idempotency_key FROM markreg_formal_opportunity_commands WHERE command_type='CREATE_FORMAL_OPPORTUNITY' LIMIT 1\"\n      );\n    const replayKey = String(winnerCommand.rows[0]?.idempotency_key);\n    expect([command.idempotencyKey, 'formal-opportunity-create-002']).toContain(replayKey);\n    const replay = await service.createFormalOpportunity({ ...command, idempotencyKey: replayKey });\n"""
          if old not in text:
              raise SystemExit('expected concurrency test target not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/markreg/tests/formal-opportunity-postgres.test.ts
          git diff --cached --check
          git commit -m "fix(plc): derive replay key from durable command winner"
          git push origin HEAD:plc-wp-04-formal-opportunity-handoff
