name: PLC WP04 one-shot M3 inventory fix

on:
  push:
    branches:
      - plc-wp-04-formal-opportunity-handoff
    paths:
      - '.github/workflows/plc-wp04-one-shot-m3-inventory-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-04-formal-opportunity-handoff
          fetch-depth: 0
      - name: Extend current MarkReg owner migration inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/markreg/tests/order-postgres.test.ts')
          text = path.read_text()
          old = """      '0034',
      '0035'
    ]);"""
          new = """      '0034',
      '0035',
      '0041'
    ]);"""
          if old not in text:
              raise SystemExit('expected MarkReg owner migration inventory target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/markreg/tests/order-postgres.test.ts
          git diff --cached --check
          git commit -m "test(plc): include 0041 in MarkReg owner migration inventory"
          git push origin HEAD:plc-wp-04-formal-opportunity-handoff
