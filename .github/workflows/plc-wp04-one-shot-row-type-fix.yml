name: PLC WP04 one-shot row typing fix

on:
  push:
    branches:
      - plc-wp-04-formal-opportunity-handoff
    paths:
      - '.github/workflows/plc-wp04-one-shot-row-type-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-04-formal-opportunity-handoff
          fetch-depth: 0
      - name: Type durable command winner row
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/markreg/tests/formal-opportunity-postgres.test.ts')
          text = path.read_text()
          old = "    const replayKey = String(winnerCommand.rows[0]?.idempotency_key);\n"
          new = "    const winnerRow = winnerCommand.rows[0] as Record<string, unknown> | undefined;\n    const replayKey = String(winnerRow?.idempotency_key);\n"
          if old not in text:
              raise SystemExit('expected row typing target not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/markreg/tests/formal-opportunity-postgres.test.ts
          git diff --cached --check
          git commit -m "fix(plc): type durable command winner row"
          git push origin HEAD:plc-wp-04-formal-opportunity-handoff
