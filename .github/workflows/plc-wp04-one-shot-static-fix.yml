name: PLC WP04 one-shot static fix

on:
  push:
    branches:
      - plc-wp-04-formal-opportunity-handoff
    paths:
      - '.github/workflows/plc-wp04-one-shot-static-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-04-formal-opportunity-handoff
          fetch-depth: 0
      - name: Remove unnecessary assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/markreg/tests/formal-opportunity-postgres.test.ts')
          text = path.read_text()
          old = """    const losing = [left, right].find((result) => result.status === 'rejected') as\n      | PromiseRejectedResult\n      | undefined;\n    expect(losing?.reason).toMatchObject({ code: 'VERSION_CONFLICT' });\n"""
          new = """    const losing = [left, right].find((result) => result.status === 'rejected');\n    expect(losing?.reason).toMatchObject({ code: 'VERSION_CONFLICT' });\n"""
          if old not in text:
              raise SystemExit('expected lint-fix target not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/markreg/tests/formal-opportunity-postgres.test.ts
          git diff --cached --check
          git commit -m "fix(plc): remove unnecessary test assertion"
          git push origin HEAD:plc-wp-04-formal-opportunity-handoff
