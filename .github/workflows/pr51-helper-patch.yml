name: PR51 patch temporary helper
on:
  push:
    branches: [m4-wp-03-durable-mgsn-provider-registry]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4-wp-03-durable-mgsn-provider-registry
      - name: Remove SQL from Prettier input
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pr51-wp03-fix.yml')
          s=p.read_text()
          old='infrastructure/persistence/migration-owners.json infrastructure/persistence/migrations/0028_mgsn_provider_registry.sql package.json'
          new='infrastructure/persistence/migration-owners.json package.json'
          if old not in s: raise SystemExit('formatter target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr51-wp03-fix.yml
          git commit -m "chore: fix temporary WP03 formatter"
          git push origin HEAD:m4-wp-03-durable-mgsn-provider-registry
