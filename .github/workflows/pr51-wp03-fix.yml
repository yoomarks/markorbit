name: PR51 WP03 focused fix

on:
  push:
    branches: [m4-wp-03-durable-mgsn-provider-registry]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      MGSN_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_mgsn_test
      MGSN_PROVIDER_REGISTRY_POSTGRES_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4-wp-03-durable-mgsn-provider-registry
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Apply WP03 integration fixes
        shell: python
        run: |
          import json
          from pathlib import Path

          # Correct the shared provider contract to reference Core's real Workspace identity type.
          path = Path('packages/contracts/src/provider-execution.ts')
          text = path.read_text()
          count = text.count('providerWorkspaceId: MarkOrbitId;')
          if count != 3:
              raise SystemExit(f'expected 3 providerWorkspaceId fields, found {count}')
          path.write_text(text.replace('providerWorkspaceId: MarkOrbitId;', 'providerWorkspaceId: string;'))

          # Use the published provider-execution subpath, not the contracts root.
          for filename in [
              'services/mgsn/src/provider-registry.ts',
              'services/mgsn/src/provider-registry-postgres.ts',
          ]:
              path = Path(filename)
              text = path.read_text()
              text = text.replace("from '@markorbit/contracts';", "from '@markorbit/contracts/provider-execution';", 1)
              path.write_text(text)

          # Persist and replay the exact command response snapshot.
          path = Path('services/mgsn/src/provider-registry.ts')
          text = path.read_text()
          needle = "  responseVersion: number;\n}"
          replacement = "  responseVersion: number;\n  responseRecord: ProviderRegistryRecord | ProviderSupplyCapabilityRecord;\n}"
          if needle not in text:
              raise SystemExit('replay interface block not found')
          text = text.replace(needle, replacement, 1)

          old = """    const record = await this.repository.findProviderById(replay.targetId as ProviderId);\n    if (!record || record.version !== replay.responseVersion)\n      throw new ProviderRegistryError(\n        'PERSISTENCE_UNAVAILABLE',\n        'Idempotent Provider result is unavailable.',\n        503\n      );\n    return record;"""
          new = """    const record = replay.responseRecord as ProviderRegistryRecord;\n    if (\n      !record.providerId ||\n      record.providerId !== replay.targetId ||\n      record.version !== replay.responseVersion\n    )\n      throw new ProviderRegistryError(\n        'PERSISTENCE_UNAVAILABLE',\n        'Idempotent Provider result is unavailable.',\n        503\n      );\n    return record;"""
          if old not in text:
              raise SystemExit('provider replay block not found')
          text = text.replace(old, new, 1)

          old = """    const record = await this.repository.findSupplyCapability(\n      replay.targetId as ProviderSupplyCapabilityId,\n      replay.responseVersion\n    );\n    if (!record)\n      throw new ProviderRegistryError(\n        'PERSISTENCE_UNAVAILABLE',\n        'Idempotent Supply Capability result is unavailable.',\n        503\n      );\n    return record;"""
          new = """    const record = replay.responseRecord as ProviderSupplyCapabilityRecord;\n    if (\n      !record.providerSupplyCapabilityId ||\n      record.providerSupplyCapabilityId !== replay.targetId ||\n      record.version !== replay.responseVersion\n    )\n      throw new ProviderRegistryError(\n        'PERSISTENCE_UNAVAILABLE',\n        'Idempotent Supply Capability result is unavailable.',\n        503\n      );\n    return record;"""
          if old not in text:
              raise SystemExit('supply replay block not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('services/mgsn/src/provider-registry-postgres.ts')
          text = path.read_text()
          text = text.replace(
              'SELECT request_fingerprint,target_type,target_id,response_version FROM mgsn_provider_registry_commands',
              'SELECT request_fingerprint,target_type,target_id,response_version,response_record FROM mgsn_provider_registry_commands',
          )
          needle = """        responseVersion: Number(row.response_version)\n      };"""
          replacement = """        responseVersion: Number(row.response_version),\n        responseRecord: row.response_record as ProviderRegistryRecord | ProviderSupplyCapabilityRecord\n      };"""
          if text.count(needle) != 1:
              raise SystemExit('findReplay return block not found')
          text = text.replace(needle, replacement, 1)
          needle = """      responseVersion: Number(row.response_version)\n    } satisfies ProviderRegistryReplay;"""
          replacement = """      responseVersion: Number(row.response_version),\n      responseRecord: row.response_record as ProviderRegistryRecord | ProviderSupplyCapabilityRecord\n    } satisfies ProviderRegistryReplay;"""
          if needle not in text:
              raise SystemExit('lockReplay return block not found')
          path.write_text(text.replace(needle, replacement, 1))

          # Root commands for permanent focused verification.
          path = Path('package.json')
          data = json.loads(path.read_text())
          data['scripts']['build:mgsn-provider-registry-deps'] = 'turbo run build --filter=@markorbit/mgsn-service...'
          data['scripts']['test:mgsn-provider-registry:postgres'] = 'pnpm build:mgsn-provider-registry-deps && MGSN_PROVIDER_REGISTRY_POSTGRES_REQUIRED=1 pnpm --filter @markorbit/mgsn-service exec vitest run tests/provider-registry-postgres.test.ts'
          path.write_text(json.dumps(data, indent=2) + '\n')

          # Add a separate MGSN DB and permanent suite to repository CI.
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = """      EXECUTION_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_execution_test\n      EXECUTION_POSTGRES_TEST_REQUIRED: '1'"""
          new = old + """\n      MGSN_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_mgsn_test\n      MGSN_PROVIDER_REGISTRY_POSTGRES_REQUIRED: '1'"""
          if old not in text:
              raise SystemExit('CI Execution env block not found')
          text = text.replace(old, new, 1)
          old = """          CREATE DATABASE markorbit_execution_test;\n          SQL"""
          new = """          CREATE DATABASE markorbit_execution_test;\n          CREATE DATABASE markorbit_mgsn_test;\n          SQL"""
          if old not in text:
              raise SystemExit('CI database block not found')
          text = text.replace(old, new, 1)
          old = """      - name: Run durable Execution filing-governance PostgreSQL suite\n        run: pnpm test:filing-governance:postgres"""
          new = old + """\n      - name: Run durable MGSN Provider Registry PostgreSQL suite\n        run: pnpm test:mgsn-provider-registry:postgres"""
          if old not in text:
              raise SystemExit('CI filing suite block not found')
          path.write_text(text.replace(old, new, 1))

          # Traceability JSON.
          path = Path('docs/planning/MO-MVP-MILESTONE-004-IMPLEMENTATION-TRACEABILITY.json')
          data = json.loads(path.read_text())
          for wp in data['workPackages']:
              if wp['id'] == 'M4-WP-03':
                  wp.clear()
                  wp.update({
                      'id': 'M4-WP-03',
                      'status': 'IMPLEMENTED_IN_PR_51',
                      'evidence': [
                          'infrastructure/persistence/migrations/0028_mgsn_provider_registry.sql',
                          'services/mgsn/src/provider-registry.ts',
                          'services/mgsn/src/provider-registry-postgres.ts',
                          'services/mgsn/tests/provider-registry-postgres.test.ts',
                          'docs/tasks/MO-MVP-M4-WP-03-DURABLE-MGSN-PROVIDER-REGISTRY.md'
                      ]
                  })
          data['wp03DurabilityBoundary'] = {
              'owner': 'MGSN',
              'databasePerOwner': True,
              'migration': '0028_mgsn_provider_registry',
              'coreWorkspaceIdentityReferencedNotDuplicated': True,
              'uniqueProviderWorkspaceBinding': True,
              'versionedSupplyCapabilityHistory': True,
              'durableIdempotency': True,
              'optimisticConcurrency': True,
              'appendOnlyAudit': True,
              'suspendedOrInactiveSupplyEligible': False,
              'userCapabilityVerifiedAutomatically': False,
              'professionalQualifiedAutomatically': False,
              'providerAllocated': False,
              'legalProfessionalAppointmentCreated': False,
              'paymentOrInvoiceCreated': False,
              'filingSubmitted': False,
              'officialTruthCreated': False
          }
          path.write_text(json.dumps(data, indent=2) + '\n')

          # Traceability Markdown.
          path = Path('docs/planning/MO-MVP-MILESTONE-004-IMPLEMENTATION-TRACEABILITY.md')
          text = path.read_text().replace(
              '**Current work package:** `M4-WP-02`', '**Current work package:** `M4-WP-03`'
          )
          text = text.replace(
              '| M4-WP-03     | Durable MGSN Provider Registry and Supply Capability             | NOT_STARTED           | —',
              '| M4-WP-03     | Durable MGSN Provider Registry and Supply Capability             | IMPLEMENTED_IN_PR_51  | migration `0028_mgsn_provider_registry`; `ProviderRegistryService`; `PostgresProviderRegistryRepository`; PostgreSQL/version/history/idempotency/audit tests; WP-03 task evidence'
          )
          marker = '## Boundary preserved through WP-02'
          if marker not in text:
              raise SystemExit('traceability boundary marker not found')
          prefix = text.split(marker, 1)[0]
          path.write_text(prefix + """## Boundary preserved through WP-03\n\nWP-03 makes MGSN the durable owner of private Provider Registry and Provider Supply Capability truth. Provider identity references Core Workspace identity through an explicit service dependency and unique binding; MGSN does not duplicate Core identity or read Core tables.\n\nSupply Capability retains immutable historical versions, effective period, bounded capacity/availability, evidence references and supply-only verification state. Suspended/inactive Provider state and suspended/retired supply are not operationally eligible inputs.\n\nProvider Supply Capability remains distinct from user Capability evidence and professional qualification. WP-03 creates no Allocation, Provider Acceptance, legal/professional appointment, Payment, Invoice, Filing, official application or Official Truth.\n\nAfter PR #51 is merged with clean hosted gates, the next approved implementation step is `M4-WP-04`.\n""")

          path = Path('docs/planning/TASK-INDEX.md')
          text = path.read_text()
          old = """- M4-WP-03 — Durable MGSN Provider Registry and Supply Capability (**next after WP-02 merge**)\n- M4-WP-04 — MGSN Service Package and deterministic Eligibility (**not started**)"""
          new = """- M4-WP-03 — Durable MGSN Provider Registry and Supply Capability (**implemented in PR #51**)\n  - MGSN-owned migration: `0028_mgsn_provider_registry`.\n  - Durable Provider/Core Workspace reference with unique identity binding, suspension/inactive state, optimistic versioning and idempotency.\n  - Immutable historical Supply Capability versions with effective period, capacity/availability, evidence references and supply-only verification state.\n  - Supply Capability does not create user Capability evidence, professional qualification, Allocation, appointment, Filing, Payment/Invoice or Official Truth.\n  - Evidence: `docs/tasks/MO-MVP-M4-WP-03-DURABLE-MGSN-PROVIDER-REGISTRY.md`.\n- M4-WP-04 — MGSN Service Package and deterministic Eligibility (**next after WP-03 merge**)"""
          if old not in text:
              raise SystemExit('TASK-INDEX WP03 block not found')
          path.write_text(text.replace(old, new, 1))
      - name: Write WP03 evidence document
        run: |
          cat > docs/tasks/MO-MVP-M4-WP-03-DURABLE-MGSN-PROVIDER-REGISTRY.md <<'EOF'
          # M4-WP-03 — Durable MGSN Provider Registry and Supply Capability

          **Milestone:** MO-MVP-MILESTONE-004  
          **Direction:** `DURABLE_GOVERNED_PROVIDER_EXECUTION_AND_RETURN`  
          **PR:** #51  
          **Status:** IMPLEMENTED_IN_PR_51

          ## Objective

          Make MGSN the durable owner of private provider-network supply truth before Service Package admission and deterministic Eligibility.

          ## Ownership and identity

          Core remains owner of Workspace identity. MGSN stores only a bounded `providerWorkspaceId` reference, never reads Core tables and does not duplicate Core identity. Provider creation requires an active Core Workspace reference; reactivation rechecks that source. A unique database constraint prevents duplicate Provider binding to one Core Workspace.

          MGSN owns Provider records, versioned Provider Supply Capability, durable idempotency response evidence and append-only registry audit evidence in its own database.

          ## Provider Registry and Supply Capability

          Provider records use server-generated IDs, `ACTIVE` / `SUSPENDED` / `INACTIVE` state, optimistic versions, actor lineage and timestamps. `INACTIVE` is terminal in this M4 boundary.

          Supply Capability revisions create immutable historical versions and one current version. Each version carries an exact Provider reference snapshot, normalized jurisdictions/service types, effective period, capacity/availability, evidence references, supply verification state and SHA-256 fingerprint.

          `VERIFIED_FOR_SUPPLY` is private MGSN operating verification only. It is not user Capability evidence and is not automatic professional qualification.

          ## Reliability and authority boundary

          Migration `0028_mgsn_provider_registry` belongs only to `@markorbit/mgsn-service`. The durable repository enforces optimistic concurrency, exact idempotency replay/conflict detection, history reads, provider identity uniqueness, append-only audit and 503-class persistence outage semantics.

          Suspended/inactive Provider state or suspended/retired supply cannot be treated as operationally eligible input. Full deterministic Eligibility remains M4-WP-04.

          WP-03 does not create Allocation, Provider Acceptance, legal/professional appointment, Payment, Invoice, Filing submission, official application truth, user Capability verification or Official Truth.

          ## Contract correction

          WP-01 typed `providerWorkspaceId` as `MarkOrbitId`, while Core Workspace IDs are UUID/string identities. WP-03 corrects the shared provider-execution contract to Core's actual `string` identity type and consumes it through the already published `@markorbit/contracts/provider-execution` subpath.

          ## Evidence

          `pnpm test:mgsn-provider-registry:postgres` proves migration ownership, Core identity validation, duplicate prevention, durable replay/conflict behavior, suspension/reactivation, optimistic versioning, immutable Supply Capability history, bounded supply inputs, operational ineligibility, append-only audit and outage mapping.

          Final acceptance is the clean PR #51 head passing repository-required CI with no temporary helper workflow retained.

          ## Next dependency

          After PR #51 merges with green hosted gates, continue with **M4-WP-04 — Service Package and deterministic Eligibility**.
          EOF
      - name: Install dependencies and update lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Format WP03 files
        run: |
          pnpm exec prettier --write packages/contracts/src/provider-execution.ts services/mgsn infrastructure/persistence/migration-owners.json infrastructure/persistence/migrations/0028_mgsn_provider_registry.sql package.json pnpm-lock.yaml .github/workflows/ci.yml docs/planning/MO-MVP-MILESTONE-004-IMPLEMENTATION-TRACEABILITY.json docs/planning/MO-MVP-MILESTONE-004-IMPLEMENTATION-TRACEABILITY.md docs/planning/TASK-INDEX.md docs/tasks/MO-MVP-M4-WP-03-DURABLE-MGSN-PROVIDER-REGISTRY.md
      - name: Create isolated MGSN database
        env:
          PGPASSWORD: markorbit-test-only
        run: psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE markorbit_mgsn_test;'
      - name: Focused WP03 verification
        run: |
          pnpm --filter @markorbit/contracts typecheck
          pnpm --filter @markorbit/contracts test
          pnpm --filter @markorbit/mgsn-service typecheck
          pnpm --filter @markorbit/mgsn-service lint
          pnpm test:mgsn-provider-registry:postgres
      - name: Commit verified WP03 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/provider-execution.ts services/mgsn infrastructure/persistence/migration-owners.json infrastructure/persistence/migrations/0028_mgsn_provider_registry.sql package.json pnpm-lock.yaml .github/workflows/ci.yml docs/planning/MO-MVP-MILESTONE-004-IMPLEMENTATION-TRACEABILITY.json docs/planning/MO-MVP-MILESTONE-004-IMPLEMENTATION-TRACEABILITY.md docs/planning/TASK-INDEX.md docs/tasks/MO-MVP-M4-WP-03-DURABLE-MGSN-PROVIDER-REGISTRY.md
          git diff --cached --check
          git commit -m "feat(m4): complete durable MGSN provider registry"
          git push origin HEAD:m4-wp-03-durable-mgsn-provider-registry
