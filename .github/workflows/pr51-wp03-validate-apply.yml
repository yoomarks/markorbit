name: PR51 WP03 validate apply
on:
  push:
    branches: [m4-wp-03-durable-mgsn-provider-registry]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      MGSN_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_mgsn_test
      MGSN_PROVIDER_REGISTRY_POSTGRES_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4-wp-03-durable-mgsn-provider-registry
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Apply WP03 patch
        run: |
          python scripts/pr51-wp03-apply.py
          python scripts/pr51-wp03-lint-fix.py
      - name: Install and update lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Format supported files
        run: |
          pnpm exec prettier --write packages/contracts/src/provider-execution.ts services/mgsn/package.json services/mgsn/src/provider-registry.ts services/mgsn/src/provider-registry-postgres.ts services/mgsn/tests/provider-registry-postgres.test.ts services/mgsn/README.md infrastructure/persistence/migration-owners.json package.json pnpm-lock.yaml docs/planning/MO-MVP-MILESTONE-004-IMPLEMENTATION-TRACEABILITY.json docs/planning/TASK-INDEX.md docs/tasks/MO-MVP-M4-WP-03-DURABLE-MGSN-PROVIDER-REGISTRY.md
      - name: Create MGSN database
        env:
          PGPASSWORD: markorbit-test-only
        run: psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE markorbit_mgsn_test;'
      - name: Verify WP03
        run: |
          pnpm --filter @markorbit/contracts typecheck
          pnpm --filter @markorbit/contracts test
          pnpm --filter @markorbit/mgsn-service typecheck
          pnpm --filter @markorbit/mgsn-service lint
          pnpm test:mgsn-provider-registry:postgres
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/provider-execution.ts services/mgsn package.json pnpm-lock.yaml docs/planning/MO-MVP-MILESTONE-004-IMPLEMENTATION-TRACEABILITY.json docs/planning/TASK-INDEX.md docs/tasks/MO-MVP-M4-WP-03-DURABLE-MGSN-PROVIDER-REGISTRY.md
          git diff --cached --check
          git commit -m "feat(m4): verify durable MGSN provider registry"
          git push origin HEAD:m4-wp-03-durable-mgsn-provider-registry
