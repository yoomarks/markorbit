name: PR52 format traceability
on:
  push:
    branches: [m4-wp-04-service-package-eligibility]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4-wp-04-service-package-eligibility
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/planning/MO-MVP-MILESTONE-004-IMPLEMENTATION-TRACEABILITY.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planning/MO-MVP-MILESTONE-004-IMPLEMENTATION-TRACEABILITY.md
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(m4): format WP04 traceability"
          git push origin HEAD:m4-wp-04-service-package-eligibility
