name: PR52 WP04 focused validation

on:
  push:
    branches: [m4-wp-04-service-package-eligibility]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      MGSN_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_mgsn_test
      MGSN_PROVIDER_REGISTRY_POSTGRES_REQUIRED: '1'
      MGSN_SERVICE_PACKAGE_POSTGRES_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4-wp-04-service-package-eligibility
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply WP04 contract and compatibility patch
        run: python scripts/pr52-wp04-patch.py
      - name: Format supported WP04 files
        run: |
          pnpm exec prettier --write packages/contracts/src/provider-execution.ts services/mgsn/src/service-package-eligibility.ts services/mgsn/src/service-package-eligibility-postgres.ts services/mgsn/tests/provider-registry-postgres.test.ts services/mgsn/tests/service-package-eligibility-postgres.test.ts infrastructure/persistence/migration-owners.json
      - name: Create MGSN database
        env:
          PGPASSWORD: markorbit-test-only
        run: psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE markorbit_mgsn_test;'
      - name: Verify WP04
        run: |
          pnpm --filter @markorbit/contracts typecheck
          pnpm --filter @markorbit/contracts test
          pnpm --filter @markorbit/mgsn-service typecheck
          pnpm --filter @markorbit/mgsn-service lint
          pnpm build:mgsn-provider-registry-deps
          pnpm --filter @markorbit/mgsn-service exec vitest run tests/provider-registry-postgres.test.ts
          pnpm --filter @markorbit/mgsn-service exec vitest run tests/service-package-eligibility-postgres.test.ts
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/provider-execution.ts services/mgsn/src/service-package-eligibility.ts services/mgsn/src/service-package-eligibility-postgres.ts services/mgsn/tests/provider-registry-postgres.test.ts services/mgsn/tests/service-package-eligibility-postgres.test.ts infrastructure/persistence/migration-owners.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(m4): verify service package eligibility"
          git push origin HEAD:m4-wp-04-service-package-eligibility
