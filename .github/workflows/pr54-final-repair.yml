name: PR54 final repair
on:
  push:
    branches: [agent/m4-wp-06-provider-return-evidence-handoff]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m4-wp-06-provider-return-evidence-handoff
      - name: Apply WP06 service and runtime fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(file, old, new):
              p = Path(file)
              s = p.read_text()
              count = s.count(old)
              assert count == 1, f'{file}: expected one match, found {count}'
              p.write_text(s.replace(old, new, 1))

          provider = 'services/mgsn/src/provider-return.ts'
          old_acceptance = """    if (\n      acceptance.version !== expectedVersion ||\n      acceptance.decision !== 'ACCEPTED' ||\n      acceptance.allocation.id !== allocation.allocationId ||\n      Number(acceptance.allocation.version) !== allocation.version ||\n      acceptance.providerId !== allocation.provider.providerId ||\n      acceptance.providerWorkspaceId !== providerWorkspaceId\n    )\n      throw new ProviderReturnError(\n        'ALLOCATION_NOT_CURRENT',\n        'Provider Return requires the exact authenticated ACCEPTED Allocation.',\n        409\n      );"""
          new_acceptance = """    if (acceptance.providerWorkspaceId !== providerWorkspaceId)\n      throw new ProviderReturnError(\n        'PROVIDER_IDENTITY_MISMATCH',\n        'Authenticated provider workspace does not match the Provider Acceptance.',\n        403\n      );\n    if (\n      acceptance.version !== expectedVersion ||\n      acceptance.decision !== 'ACCEPTED' ||\n      acceptance.allocation.id !== allocation.allocationId ||\n      Number(acceptance.allocation.version) !== allocation.version ||\n      acceptance.providerId !== allocation.provider.providerId\n    )\n      throw new ProviderReturnError(\n        'ALLOCATION_NOT_CURRENT',\n        'Provider Return requires the exact authenticated ACCEPTED Allocation.',\n        409\n      );"""
          replace_once(provider, old_acceptance, new_acceptance)

          runtime = 'scripts/professional-review-real-runtime.ts'
          old_tables = """    `DROP TABLE IF EXISTS\n       filing_execution_task_drafts,\n       execution_releases,"""
          new_tables = """    `DROP TABLE IF EXISTS\n       execution_provider_return_evidence_audit,\n       execution_provider_return_evidence_commands,\n       execution_provider_return_evidence_receipts,\n       filing_execution_task_drafts,\n       execution_releases,"""
          replace_once(runtime, old_tables, new_tables)
          old_fn = """  await executionPool.query(\n    'DROP FUNCTION IF EXISTS reject_filing_governance_audit_mutation() CASCADE'\n  );"""
          new_fn = """  await executionPool.query(\n    'DROP FUNCTION IF EXISTS reject_execution_provider_return_evidence_audit_mutation() CASCADE'\n  );\n  await executionPool.query(\n    'DROP FUNCTION IF EXISTS reject_filing_governance_audit_mutation() CASCADE'\n  );"""
          replace_once(runtime, old_fn, new_fn)

          Path('.github/workflows/pr54-final-repair.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce WP06 provider identity and runtime migration isolation"
          git push origin HEAD:agent/m4-wp-06-provider-return-evidence-handoff
