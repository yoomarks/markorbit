name: PR54 one-shot CI repair
on:
  push:
    branches: [agent/m4-wp-06-provider-return-evidence-handoff]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m4-wp-06-provider-return-evidence-handoff
      - name: Apply cleanup repair
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace_once(file, old, new):
              p = Path(file)
              s = p.read_text()
              assert s.count(old) == 1, (file, s.count(old))
              p.write_text(s.replace(old, new, 1))
          old_prefix = "      `DROP TABLE IF EXISTS\n         mgsn_allocation_audit,"
          new_prefix = "      `DROP TABLE IF EXISTS\n         mgsn_provider_return_audit,\n         mgsn_provider_return_commands,\n         mgsn_provider_returns,\n         mgsn_allocation_audit,"
          for file in ['services/mgsn/tests/service-package-eligibility-postgres.test.ts', 'services/mgsn/tests/allocation-provider-acceptance-postgres.test.ts']:
              replace_once(file, old_prefix, new_prefix)
          service_file = 'services/mgsn/tests/service-package-eligibility-postgres.test.ts'
          old_service_fn = "    await pool.query(\n      'DROP FUNCTION IF EXISTS reject_mgsn_service_package_audit_mutation() CASCADE'\n    );"
          new_service_fn = "    await pool.query(\n      'DROP FUNCTION IF EXISTS reject_mgsn_provider_return_audit_mutation() CASCADE'\n    );\n" + old_service_fn
          replace_once(service_file, old_service_fn, new_service_fn)
          allocation_file = 'services/mgsn/tests/allocation-provider-acceptance-postgres.test.ts'
          old_allocation_fn = "    await pool.query('DROP FUNCTION IF EXISTS reject_mgsn_allocation_audit_mutation() CASCADE');"
          new_allocation_fn = "    await pool.query(\n      'DROP FUNCTION IF EXISTS reject_mgsn_provider_return_audit_mutation() CASCADE'\n    );\n" + old_allocation_fn
          replace_once(allocation_file, old_allocation_fn, new_allocation_fn)
          tenant = 'scripts/milestone2-tenant-isolation.integration.test.ts'
          old = "      'DROP TABLE IF EXISTS filing_execution_task_drafts,execution_releases,filing_authorizations,filing_governance_commands,filing_governance_audit,professional_review_audit,professional_review_commands,professional_review_cases CASCADE; DROP FUNCTION IF EXISTS reject_filing_governance_audit_mutation() CASCADE; DROP SCHEMA IF EXISTS markorbit_persistence CASCADE'"
          new = "      'DROP TABLE IF EXISTS execution_provider_return_evidence_audit,execution_provider_return_evidence_commands,execution_provider_return_evidence_receipts,filing_execution_task_drafts,execution_releases,filing_authorizations,filing_governance_commands,filing_governance_audit,professional_review_audit,professional_review_commands,professional_review_cases CASCADE; DROP FUNCTION IF EXISTS reject_execution_provider_return_evidence_audit_mutation() CASCADE; DROP FUNCTION IF EXISTS reject_filing_governance_audit_mutation() CASCADE; DROP SCHEMA IF EXISTS markorbit_persistence CASCADE'"
          replace_once(tenant, old, new)
          Path('.github/workflows/pr54-one-shot-ci-repair.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: isolate WP06 persistence migrations across legacy suites"
          git push origin HEAD:agent/m4-wp-06-provider-return-evidence-handoff
