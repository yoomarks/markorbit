name: PR56 format
on:
  push:
    branches:
      - agent/m4-wp-08-reliability-matrix
    paths:
      - .github/workflows/pr56-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m4-wp-08-reliability-matrix
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/gateway/tests/mgsn-outage.test.ts
      - name: Commit exact formatting and remove helper workflow
        run: |
          rm .github/workflows/pr56-format.yml
          git config user.name "markorbit-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style(m4): apply exact Prettier formatting"
          git push origin HEAD:agent/m4-wp-08-reliability-matrix
