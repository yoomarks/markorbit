name: PR57 format audit docs

on:
  push:
    branches:
      - m4-wp-09-integration-authority-audit

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4-wp-09-integration-authority-audit
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format audit files
        run: >-
          pnpm exec prettier --write
          docs/audits/MO-MVP-MILESTONE-004-INTEGRATION-AUDIT.json
          docs/planning/MO-MVP-MILESTONE-004-IMPLEMENTATION-TRACEABILITY.md
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/MO-MVP-MILESTONE-004-INTEGRATION-AUDIT.json docs/planning/MO-MVP-MILESTONE-004-IMPLEMENTATION-TRACEABILITY.md
          git commit -m "style(m4): format WP09 audit docs"
          git push origin HEAD:m4-wp-09-integration-authority-audit
