name: Prettier Diagnostic

on:
  push:
    branches:
      - core/664-coverage-gap-postgres-bootstrap
    paths:
      - .github/workflows/prettier-diagnostic.yml
      - services/core/src/method-improvement-coverage-gap-postgres.ts
      - services/core/tests/method-improvement-coverage-gap-postgres.test.ts

permissions:
  contents: write

jobs:
  format-and-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier formatting and remove diagnostic workflow
        run: |
          pnpm exec prettier --write services/core/src/method-improvement-coverage-gap-postgres.ts services/core/tests/method-improvement-coverage-gap-postgres.test.ts
          rm .github/workflows/prettier-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/core/src/method-improvement-coverage-gap-postgres.ts services/core/tests/method-improvement-coverage-gap-postgres.test.ts .github/workflows/prettier-diagnostic.yml
          git commit -m "[CORE-P0] Apply repository Prettier formatting"
          git push origin HEAD:core/664-coverage-gap-postgres-bootstrap
