name: Product Loop Candidate Qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/product-loop-candidate-qualification.yml'
      - 'services/lite/**'
      - 'packages/contracts/src/product-loop.ts'
      - 'infrastructure/persistence/migrations/0040_lite_candidate_qualification.sql'

permissions:
  contents: read

jobs:
  lite-candidate-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_lite_candidate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_lite_candidate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LITE_CANDIDATE_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_lite_candidate_test
      LITE_CANDIDATE_POSTGRES_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate ownership boundaries
        run: pnpm validate:workspace && pnpm validate:persistence-boundaries
      - name: Build Lite dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/lite-service...
      - name: Validate Lite service
        run: pnpm --filter @markorbit/lite-service lint && pnpm --filter @markorbit/lite-service typecheck
      - name: Run real PostgreSQL Candidate qualification tests
        run: pnpm --filter @markorbit/lite-service exec vitest run tests/candidate-qualification-postgres.test.ts
