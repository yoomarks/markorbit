name: Product Loop Content Preparation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/product-loop-content-preparation.yml'
      - 'services/lite/**'
      - 'services/core/src/knowledge-content.ts'
      - 'services/core/src/knowledge-daily-source.ts'
      - 'services/core/tests/knowledge-daily-source-http.test.ts'
      - 'packages/contracts/src/product-loop.ts'
      - 'packages/contracts/src/daily-source.ts'
      - 'packages/contracts/src/daily-workspace.ts'
      - 'infrastructure/persistence/migrations/0039_lite_content_preparation.sql'
      - 'infrastructure/persistence/migrations/0052_lite_daily_signals.sql'
      - 'infrastructure/persistence/migration-owners.json'

permissions:
  contents: write

jobs:
  lint-fix-wp03-once:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Lite dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/lite-service...
      - name: Apply exact WP03 lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('services/lite/src/daily-orbit.ts'): [
                  ('  ContentPickId,\n', ''),
                  ('  DailyOrbitItemId,\n', ''),
              ],
              Path('services/lite/tests/daily-orbit.test.ts'): [
                  ('  DailySignalId,\n', ''),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          pnpm exec eslint services/lite/src/daily-orbit.ts services/lite/tests/daily-orbit.test.ts --fix
      - name: Commit exact lint fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "markorbit-ci"
          git config user.email "markorbit-ci@users.noreply.github.com"
          git add services/lite/src/daily-orbit.ts services/lite/tests/daily-orbit.test.ts
          git commit -m "style: apply M9 WP03 lint fixes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  lite-content-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_lite_content_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_lite_content_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LITE_CONTENT_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_lite_content_test
      LITE_CONTENT_POSTGRES_TEST_REQUIRED: '1'
      LITE_DAILY_SIGNAL_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_lite_daily_signal_test
      LITE_DAILY_SIGNAL_POSTGRES_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create isolated Daily Signal database
        env:
          PGPASSWORD: markorbit-test-only
        run: >-
          psql -h 127.0.0.1 -U markorbit_test -d postgres
          -c "CREATE DATABASE markorbit_lite_daily_signal_test"
      - name: Validate ownership boundaries
        run: pnpm validate:workspace && pnpm validate:persistence-boundaries
      - name: Build Lite dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/lite-service...
      - name: Run real PostgreSQL Content preparation tests
        run: pnpm --filter @markorbit/lite-service exec vitest run tests/content-preparation-postgres.test.ts
      - name: Run real PostgreSQL Daily Signal tests
        run: pnpm --filter @markorbit/lite-service exec vitest run tests/daily-signal-postgres.test.ts
      - name: Run real PostgreSQL Daily Orbit tests
        run: pnpm --filter @markorbit/lite-service exec vitest run tests/daily-orbit-postgres.test.ts
