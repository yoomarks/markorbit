name: Product Loop Feedback Observability

# Exact-head gate for PLC-WP-06 manual use feedback and Product-loop evidence.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/product-loop-feedback-observability.yml'
      - 'apps/gateway/src/product-loop-http.ts'
      - 'apps/gateway/tests/product-loop-http.test.ts'
      - 'apps/lite-web/**'
      - 'services/lite/**'
      - 'packages/contracts/src/product-loop.ts'
      - 'infrastructure/persistence/migrations/0043_lite_product_loop_feedback.sql'
      - 'scripts/product-loop-today-runtime.integration.test.ts'

permissions:
  contents: write

jobs:
  format-self-clean:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/m10-wp03-owner-data-composition'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format WP03 files and restore workflow
        shell: bash
        run: |
          pnpm exec prettier --write packages/contracts/tests/trademark-asset-composition-contract.test.ts services/lite/src/trademark-asset-view.ts
          git fetch origin main
          git checkout origin/main -- .github/workflows/product-loop-feedback-observability.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/contracts/tests/trademark-asset-composition-contract.test.ts services/lite/src/trademark-asset-view.ts .github/workflows/product-loop-feedback-observability.yml
          git commit -m 'style(m10): apply repository Prettier to WP03 composition'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  feedback-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_lite_feedback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_lite_feedback_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LITE_FEEDBACK_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_lite_feedback_test
      LITE_FEEDBACK_POSTGRES_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate ownership boundaries
        run: pnpm validate:workspace && pnpm validate:persistence-boundaries
      - name: Check repository formatting
        run: pnpm format:check
      - name: Build WP-06 dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/lite-service... --filter=@markorbit/gateway... --filter=@markorbit/lite-web...
      - name: Lint and typecheck WP-06 packages
        run: |
          pnpm --filter @markorbit/lite-service lint
          pnpm --filter @markorbit/lite-service typecheck
          pnpm --filter @markorbit/gateway lint
          pnpm --filter @markorbit/gateway typecheck
          pnpm --filter @markorbit/lite-web lint
          pnpm --filter @markorbit/lite-web typecheck
      - name: Run real PostgreSQL Product-loop feedback tests
        run: pnpm --filter @markorbit/lite-service exec vitest run tests/product-loop-feedback-postgres.test.ts
      - name: Run Gateway Product-loop boundary tests
        run: pnpm --filter @markorbit/gateway exec vitest run tests/product-loop-http.test.ts
