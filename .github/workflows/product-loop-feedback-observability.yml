name: Product Loop Feedback Observability

# Manual diagnostic entrypoint. Automated PR/main coverage is owned by validation.yml affected gates.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feedback-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_lite_feedback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_lite_feedback_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LITE_FEEDBACK_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_lite_feedback_test
      LITE_FEEDBACK_POSTGRES_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build feedback dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/lite-service... --filter=@markorbit/gateway...
      - name: Run real PostgreSQL Product-loop feedback tests
        run: pnpm --filter @markorbit/lite-service exec vitest run tests/product-loop-feedback-postgres.test.ts
      - name: Run Gateway Product-loop boundary tests
        run: pnpm --filter @markorbit/gateway exec vitest run tests/product-loop-http.test.ts
