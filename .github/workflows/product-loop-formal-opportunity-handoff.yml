name: Product Loop Formal Opportunity Handoff

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/product-loop-formal-opportunity-handoff.yml'
      - 'services/markreg/**'
      - 'packages/contracts/src/product-loop.ts'
      - 'infrastructure/persistence/migrations/**'
      - 'infrastructure/persistence/migration-owners.json'
      - 'scripts/validate-workspace.mjs'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  markreg-formal-opportunity-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_formal_opportunity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_formal_opportunity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MARKREG_FORMAL_OPPORTUNITY_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_formal_opportunity_test
      MARKREG_FORMAL_OPPORTUNITY_POSTGRES_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate ownership boundaries
        run: pnpm validate:workspace && pnpm validate:persistence-boundaries
      - name: Build MarkReg dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/markreg-service...
      - name: Validate MarkReg service
        run: pnpm --filter @markorbit/markreg-service lint && pnpm --filter @markorbit/markreg-service typecheck
      - name: Run real PostgreSQL Formal Opportunity handoff tests
        run: pnpm --filter @markorbit/markreg-service exec vitest run tests/formal-opportunity-postgres.test.ts
