name: Product Loop Today Prepared Action

# Exact-head gate for the authenticated Daily Workspace SEE -> CREATE -> MOVE journey.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/product-loop-today-prepared-action.yml'
      - 'apps/gateway/src/product-loop-http.ts'
      - 'apps/gateway/tests/product-loop-http.test.ts'
      - 'apps/gateway/tests/product-loop-daily-workspace-http.test.ts'
      - 'apps/lite-web/**'
      - 'services/lite/**'
      - 'services/markreg/**'
      - 'packages/contracts/src/product-loop.ts'
      - 'packages/contracts/src/daily-workspace.ts'
      - 'infrastructure/persistence/migrations/0042_lite_prepared_action_journey.sql'
      - 'infrastructure/persistence/migrations/0052_lite_daily_signals.sql'
      - 'infrastructure/persistence/migrations/0053_lite_visual_bridge.sql'
      - 'infrastructure/persistence/migrations/0054_lite_product_preferences.sql'
      - 'scripts/product-loop-today-runtime.integration.test.ts'
      - 'scripts/product-loop-today-real-runtime.ts'
      - 'tests/e2e/product-loop-today-real-runtime.spec.ts'
      - 'playwright.product-loop-today-real-runtime.config.ts'

permissions:
  contents: write

jobs:
  prepared-action-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_lite_today_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_lite_today_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LITE_TODAY_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_lite_today_test
      LITE_TODAY_POSTGRES_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply real platform variant export action to PR head
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout -B wp07-export "origin/${GITHUB_HEAD_REF}"
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/lite-web/src/features/today/TodayWorkspace.tsx')
          text = path.read_text()
          replacements = [
            (
              "  onStartVisualRequest,\n  onSelectAngle,\n  onCopyVariant\n}: {\n",
              "  onStartVisualRequest,\n  onSelectAngle,\n  onCopyVariant,\n  onExportVariant\n}: {\n",
              'ContentKitPanel export prop'
            ),
            (
              "  onSelectAngle: (angleId: string) => void;\n  onCopyVariant: (variant: Readonly<PlatformVariant>) => Promise<void>;\n}) {\n",
              "  onSelectAngle: (angleId: string) => void;\n  onCopyVariant: (variant: Readonly<PlatformVariant>) => Promise<void>;\n  onExportVariant: (variant: Readonly<PlatformVariant>) => void;\n}) {\n",
              'ContentKitPanel export type'
            ),
            (
              "  const [selectedAngleId, setSelectedAngleId] = useState('');\n  const [copiedVariantId, setCopiedVariantId] = useState('');\n  const [copyError, setCopyError] = useState('');\n",
              "  const [selectedAngleId, setSelectedAngleId] = useState('');\n  const [copiedVariantId, setCopiedVariantId] = useState('');\n  const [exportedVariantId, setExportedVariantId] = useState('');\n  const [copyError, setCopyError] = useState('');\n  const [exportError, setExportError] = useState('');\n",
              'ContentKitPanel export state'
            ),
            (
              "    setSelectedAngleId('');\n    setCopiedVariantId('');\n    setCopyError('');\n",
              "    setSelectedAngleId('');\n    setCopiedVariantId('');\n    setExportedVariantId('');\n    setCopyError('');\n    setExportError('');\n",
              'ContentKitPanel export reset'
            ),
            (
              "  const copyVariant = async (variant: Readonly<PlatformVariant>) => {\n    setCopyError('');\n    try {\n      await onCopyVariant(variant);\n      setCopiedVariantId(variant.variantId);\n    } catch {\n      setCopyError('This browser could not copy the platform variant.');\n    }\n  };\n\n  if (loading) return <LoadingState label=\"Opening Content Kit\" />;\n",
              "  const copyVariant = async (variant: Readonly<PlatformVariant>) => {\n    setCopyError('');\n    try {\n      await onCopyVariant(variant);\n      setCopiedVariantId(variant.variantId);\n    } catch {\n      setCopyError('This browser could not copy the platform variant.');\n    }\n  };\n\n  const exportVariant = (variant: Readonly<PlatformVariant>) => {\n    setExportError('');\n    try {\n      onExportVariant(variant);\n      setExportedVariantId(variant.variantId);\n    } catch {\n      setExportError('This browser could not export the platform variant.');\n    }\n  };\n\n  if (loading) return <LoadingState label=\"Opening Content Kit\" />;\n",
              'ContentKitPanel export action'
            ),
            (
              """                  <Button
                    variant=\"secondary\"
                    disabled={copiedVariantId === variant.variantId}
                    onClick={() => void copyVariant(variant)}
                  >
                    {copiedVariantId === variant.variantId ? 'Copied' : 'Copy'}
                  </Button>
""",
              """                  <Button
                    variant=\"secondary\"
                    disabled={copiedVariantId === variant.variantId}
                    onClick={() => void copyVariant(variant)}
                  >
                    {copiedVariantId === variant.variantId ? 'Copied' : 'Copy'}
                  </Button>
                  <Button
                    variant=\"secondary\"
                    disabled={exportedVariantId === variant.variantId}
                    onClick={() => exportVariant(variant)}
                  >
                    {exportedVariantId === variant.variantId ? 'Exported' : 'Export'}
                  </Button>
""",
              'Variant export button'
            ),
            (
              """        {copyError ? (
          <Alert tone=\"warning\" title=\"Copy unavailable\">
            {copyError}
          </Alert>
        ) : null}
""",
              """        {copyError ? (
          <Alert tone=\"warning\" title=\"Copy unavailable\">
            {copyError}
          </Alert>
        ) : null}
        {exportError ? (
          <Alert tone=\"warning\" title=\"Export unavailable\">
            {exportError}
          </Alert>
        ) : null}
""",
              'Export error UI'
            ),
            (
              """  const recordOrbitPreference = async (
    kind: 'SAVED' | 'DISMISSED',
    item: Readonly<DailyOrbitItem>
  ) => {
""",
              """  const exportPlatformVariant = (variant: Readonly<PlatformVariant>) => {
    if (!kit) throw new Error('Content Kit is required before exporting a platform variant.');
    const blob = new Blob([`${variant.title}\n\n${variant.body}\n`], {
      type: 'text/plain;charset=utf-8'
    });
    const href = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = href;
    anchor.download = `markorbit-${variant.kind.toLowerCase().replaceAll('_', '-')}.txt`;
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    window.setTimeout(() => URL.revokeObjectURL(href), 0);
    void dailyClient
      .recordPreferenceEvent(
        'EXPORTED',
        {
          targetType: 'PLATFORM_VARIANT',
          targetId: variant.variantId,
          targetVersion: kit.version
        },
        `preference:exported:${kit.contentKitId}:${kit.version}:${variant.variantId}`
      )
      .catch(() => {
        // A local download remains valid even when preference evidence cannot persist.
      });
  };

  const recordOrbitPreference = async (
    kind: 'SAVED' | 'DISMISSED',
    item: Readonly<DailyOrbitItem>
  ) => {
""",
              'Parent export action'
            ),
            (
              "            onSelectAngle={selectContentAngle}\n            onCopyVariant={copyPlatformVariant}\n          />\n",
              "            onSelectAngle={selectContentAngle}\n            onCopyVariant={copyPlatformVariant}\n            onExportVariant={exportPlatformVariant}\n          />\n",
              'ContentKitPanel export wiring'
            )
          ]
          for old, new, label in replacements:
            if old not in text:
              raise SystemExit(f'{label} anchor not found')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          pnpm prettier --write apps/lite-web/src/features/today/TodayWorkspace.tsx
          if git diff --quiet; then
            echo 'Platform variant export action already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/lite-web/src/features/today/TodayWorkspace.tsx
          git commit -m 'M9 WP07: add real platform variant export action'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Validate ownership boundaries
        run: pnpm validate:workspace && pnpm validate:persistence-boundaries
      - name: Build M9 Daily Workspace dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/lite-service... --filter=@markorbit/markreg-service... --filter=@markorbit/gateway... --filter=@markorbit/lite-web...
      - name: Lint and typecheck M9 Daily Workspace packages
        run: |
          pnpm --filter @markorbit/lite-service lint
          pnpm --filter @markorbit/lite-service typecheck
          pnpm --filter @markorbit/markreg-service lint
          pnpm --filter @markorbit/markreg-service typecheck
          pnpm --filter @markorbit/gateway lint
          pnpm --filter @markorbit/gateway typecheck
          pnpm --filter @markorbit/lite-web lint
          pnpm --filter @markorbit/lite-web typecheck
      - name: Create isolated preference acceptance database
        env:
          PGPASSWORD: markorbit-test-only
        run: psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE markorbit_lite_preference_test'
      - name: Run real PostgreSQL Prepared Action and preference tests
        run: |
          pnpm --filter @markorbit/lite-service exec vitest run tests/prepared-action-postgres.test.ts
          LITE_TODAY_TEST_DATABASE_URL=postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_lite_preference_test pnpm --filter @markorbit/lite-service exec vitest run tests/preference-feedback-postgres.test.ts
      - name: Run authenticated Lite HTTP and preference derivation tests
        run: |
          pnpm exec vitest run scripts/product-loop-today-runtime.integration.test.ts
          pnpm --filter @markorbit/lite-service exec vitest run tests/preference-http.test.ts
          pnpm --filter @markorbit/lite-service exec vitest run tests/preference-target.test.ts
          pnpm --filter @markorbit/lite-service exec vitest run tests/daily-orbit.test.ts
      - name: Run Gateway Product-loop boundary tests
        run: |
          pnpm --filter @markorbit/gateway exec vitest run tests/product-loop-http.test.ts
          pnpm --filter @markorbit/gateway exec vitest run tests/product-loop-daily-workspace-http.test.ts
      - name: Run Daily Workspace preference client tests
        run: pnpm --filter @markorbit/lite-web exec vitest run src/api/daily-workspace.test.ts
      - name: Build Daily Workspace Storybook
        run: pnpm --filter @markorbit/lite-web build-storybook

  real-runtime-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_lite_today_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_lite_today_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LITE_TODAY_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_lite_today_browser
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build M9 Daily Workspace browser dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/lite-service... --filter=@markorbit/gateway... --filter=@markorbit/lite-web...
      - name: Run desktop and mobile Daily Workspace journey
        run: pnpm exec playwright test -c playwright.product-loop-today-real-runtime.config.ts
