name: Product Loop Today Prepared Action

# Exact-head gate for the authenticated Daily Workspace SEE -> CREATE -> MOVE journey.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/product-loop-today-prepared-action.yml'
      - 'apps/gateway/src/product-loop-http.ts'
      - 'apps/gateway/tests/product-loop-http.test.ts'
      - 'apps/gateway/tests/product-loop-daily-workspace-http.test.ts'
      - 'apps/lite-web/**'
      - 'services/lite/**'
      - 'services/markreg/**'
      - 'packages/contracts/src/product-loop.ts'
      - 'packages/contracts/src/daily-workspace.ts'
      - 'infrastructure/persistence/migrations/0042_lite_prepared_action_journey.sql'
      - 'infrastructure/persistence/migrations/0052_lite_daily_signals.sql'
      - 'infrastructure/persistence/migrations/0053_lite_visual_bridge.sql'
      - 'infrastructure/persistence/migrations/0054_lite_product_preferences.sql'
      - 'scripts/product-loop-today-runtime.integration.test.ts'
      - 'scripts/product-loop-today-real-runtime.ts'
      - 'tests/e2e/product-loop-today-real-runtime.spec.ts'
      - 'playwright.product-loop-today-real-runtime.config.ts'

permissions:
  contents: write

jobs:
  prepared-action-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_lite_today_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_lite_today_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LITE_TODAY_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_lite_today_test
      LITE_TODAY_POSTGRES_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply stable Daily Orbit identity fix to PR head
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout -B wp07-stable-identity "origin/${GITHUB_HEAD_REF}"
          python - <<'PY'
          from pathlib import Path

          orbit = Path('services/lite/src/daily-orbit.ts')
          text = orbit.read_text()
          old = """  const identity = digest(\n    `${signal.dailySignalFingerprintSha256}:${subjectUserId}:${preference?.creatorPreferenceId ?? 'workspace-baseline'}:${preference?.version ?? 0}`\n  );\n"""
          new = """  const identity = digest(`${signal.dailySignalFingerprintSha256}:${subjectUserId}`);\n"""
          if old not in text:
              raise SystemExit('Daily Orbit identity anchor not found')
          orbit.write_text(text.replace(old, new, 1))

          test = Path('services/lite/tests/daily-orbit.test.ts')
          text = test.read_text()
          anchor = """  it('uses a transparent Workspace baseline when no explicit preference exists', () => {\n    const item = rankDailyOrbitItem(\n      signal(),\n      userId,\n      undefined,\n      undefined,\n      '2026-08-18T03:00:00.000Z'\n    );\n    expect(item.section).toBe('TODAYS_ORBIT');\n    expect(item.score.personalRelevance.score).toBe(50);\n    expect(item.score.personalRelevance.reason).toContain('no explicit Creator Preference');\n  });\n\n"""
          addition = anchor + """  it('keeps Orbit and Content Pick identities stable when preference changes relevance', async () => {\n    const baselineService = new DailyOrbitService(\n      new Signals([signal()]),\n      new Today(today(recommendation(true))),\n      new Preferences(undefined),\n      () => '2026-08-18T03:00:00.000Z'\n    );\n    const personalizedService = new DailyOrbitService(\n      new Signals([signal()]),\n      new Today(today(recommendation(true))),\n      new Preferences(preference()),\n      () => '2026-08-18T03:00:00.000Z'\n    );\n\n    const baseline = await baselineService.snapshot(workspaceId, userId);\n    const personalized = await personalizedService.snapshot(workspaceId, userId);\n\n    expect(baseline.items[0]?.score.personalRelevance.score).toBe(50);\n    expect(personalized.items[0]?.score.personalRelevance.score).toBe(95);\n    expect(personalized.items[0]?.dailyOrbitItemId).toBe(baseline.items[0]?.dailyOrbitItemId);\n    expect(personalized.contentPicks[0]?.contentPickId).toBe(\n      baseline.contentPicks[0]?.contentPickId\n    );\n  });\n\n"""
          if anchor not in text:
              raise SystemExit('Daily Orbit stability test anchor not found')
          test.write_text(text.replace(anchor, addition, 1))
          PY
          pnpm prettier --write services/lite/src/daily-orbit.ts services/lite/tests/daily-orbit.test.ts
          if git diff --quiet; then
            echo 'Stable Daily Orbit identity fix is already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/lite/src/daily-orbit.ts services/lite/tests/daily-orbit.test.ts
          git commit -m 'M9 WP07: keep Daily Orbit identity stable across preferences'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Validate ownership boundaries
        run: pnpm validate:workspace && pnpm validate:persistence-boundaries
      - name: Build M9 Daily Workspace dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/lite-service... --filter=@markorbit/markreg-service... --filter=@markorbit/gateway... --filter=@markorbit/lite-web...
      - name: Lint and typecheck M9 Daily Workspace packages
        run: |
          pnpm --filter @markorbit/lite-service lint
          pnpm --filter @markorbit/lite-service typecheck
          pnpm --filter @markorbit/markreg-service lint
          pnpm --filter @markorbit/markreg-service typecheck
          pnpm --filter @markorbit/gateway lint
          pnpm --filter @markorbit/gateway typecheck
          pnpm --filter @markorbit/lite-web lint
          pnpm --filter @markorbit/lite-web typecheck
      - name: Create isolated preference acceptance database
        env:
          PGPASSWORD: markorbit-test-only
        run: psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE markorbit_lite_preference_test'
      - name: Run real PostgreSQL Prepared Action and preference tests
        run: |
          pnpm --filter @markorbit/lite-service exec vitest run tests/prepared-action-postgres.test.ts
          LITE_TODAY_TEST_DATABASE_URL=postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_lite_preference_test pnpm --filter @markorbit/lite-service exec vitest run tests/preference-feedback-postgres.test.ts
      - name: Run authenticated Lite HTTP and preference derivation tests
        run: |
          pnpm exec vitest run scripts/product-loop-today-runtime.integration.test.ts
          pnpm --filter @markorbit/lite-service exec vitest run tests/preference-http.test.ts
          pnpm --filter @markorbit/lite-service exec vitest run tests/preference-target.test.ts
          pnpm --filter @markorbit/lite-service exec vitest run tests/daily-orbit.test.ts
      - name: Run Gateway Product-loop boundary tests
        run: |
          pnpm --filter @markorbit/gateway exec vitest run tests/product-loop-http.test.ts
          pnpm --filter @markorbit/gateway exec vitest run tests/product-loop-daily-workspace-http.test.ts
      - name: Run Daily Workspace preference client tests
        run: pnpm --filter @markorbit/lite-web exec vitest run src/api/daily-workspace.test.ts
      - name: Build Daily Workspace Storybook
        run: pnpm --filter @markorbit/lite-web build-storybook

  real-runtime-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_lite_today_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_lite_today_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LITE_TODAY_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_lite_today_browser
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build M9 Daily Workspace browser dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/lite-service... --filter=@markorbit/gateway... --filter=@markorbit/lite-web...
      - name: Run desktop and mobile Daily Workspace journey
        run: pnpm exec playwright test -c playwright.product-loop-today-real-runtime.config.ts
