name: Product Loop Today Prepared Action

# Exact-head gate for the authenticated Daily Workspace SEE -> CREATE -> MOVE journey.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/product-loop-today-prepared-action.yml'
      - 'apps/gateway/src/product-loop-http.ts'
      - 'apps/gateway/tests/product-loop-http.test.ts'
      - 'apps/gateway/tests/product-loop-daily-workspace-http.test.ts'
      - 'apps/lite-web/**'
      - 'services/lite/**'
      - 'services/markreg/**'
      - 'packages/contracts/src/product-loop.ts'
      - 'packages/contracts/src/daily-workspace.ts'
      - 'infrastructure/persistence/migrations/0042_lite_prepared_action_journey.sql'
      - 'infrastructure/persistence/migrations/0052_lite_daily_signals.sql'
      - 'infrastructure/persistence/migrations/0053_lite_visual_bridge.sql'
      - 'infrastructure/persistence/migrations/0054_lite_product_preferences.sql'
      - 'scripts/product-loop-today-runtime.integration.test.ts'
      - 'scripts/product-loop-today-real-runtime.ts'
      - 'tests/e2e/product-loop-today-real-runtime.spec.ts'
      - 'playwright.product-loop-today-real-runtime.config.ts'

permissions:
  contents: write

jobs:
  prepared-action-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_lite_today_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_lite_today_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LITE_TODAY_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_lite_today_test
      LITE_TODAY_POSTGRES_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply Angle Select and Copy actions to PR head
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout -B wp07-create-actions "origin/${GITHUB_HEAD_REF}"
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/lite-web/src/features/today/TodayWorkspace.tsx')
          text = path.read_text()

          old = """  ContentPick,\n  DailyOrbitItem,\n  VisualOutputKind\n"""
          new = """  ContentPick,\n  DailyOrbitItem,\n  PlatformVariant,\n  VisualOutputKind\n"""
          if old not in text:
              raise SystemExit('PlatformVariant import anchor not found')
          text = text.replace(old, new, 1)

          old = """  busy,\n  onCreateVisualBrief,\n  onStartVisualRequest\n}: {\n"""
          new = """  busy,\n  onCreateVisualBrief,\n  onStartVisualRequest,\n  onSelectAngle,\n  onCopyVariant\n}: {\n"""
          if old not in text:
              raise SystemExit('ContentKitPanel props destructure anchor not found')
          text = text.replace(old, new, 1)

          old = """  });\n  onStartVisualRequest: () => void;\n}) {\n  const [ipPackage, setIpPackage] = useState('');\n  const [outputKind, setOutputKind] = useState<VisualOutputKind>('XIAOHONGSHU_COVER');\n  const [sceneIntent, setSceneIntent] = useState('');\n"""
          new = """  });\n  onStartVisualRequest: () => void;\n  onSelectAngle: (angleId: string) => void;\n  onCopyVariant: (variant: Readonly<PlatformVariant>) => Promise<void>;\n}) {\n  const [ipPackage, setIpPackage] = useState('');\n  const [outputKind, setOutputKind] = useState<VisualOutputKind>('XIAOHONGSHU_COVER');\n  const [sceneIntent, setSceneIntent] = useState('');\n  const [selectedAngleId, setSelectedAngleId] = useState('');\n  const [copiedVariantId, setCopiedVariantId] = useState('');\n  const [copyError, setCopyError] = useState('');\n"""
          if old not in text:
              raise SystemExit('ContentKitPanel callback type anchor not found')
          text = text.replace(old, new, 1)

          old = """  useEffect(() => {\n    setSceneIntent(pick.suggestedAngles[0] ?? pick.whyPublish);\n  }, [pick.contentPickId, pick.suggestedAngles, pick.whyPublish]);\n\n  if (loading) return <LoadingState label=\"Opening Content Kit\" />;\n"""
          new = """  useEffect(() => {\n    setSceneIntent(pick.suggestedAngles[0] ?? pick.whyPublish);\n  }, [pick.contentPickId, pick.suggestedAngles, pick.whyPublish]);\n\n  useEffect(() => {\n    setSelectedAngleId('');\n    setCopiedVariantId('');\n    setCopyError('');\n  }, [kit?.contentKitId, kit?.version]);\n\n  const copyVariant = async (variant: Readonly<PlatformVariant>) => {\n    setCopyError('');\n    try {\n      await onCopyVariant(variant);\n      setCopiedVariantId(variant.variantId);\n    } catch {\n      setCopyError('This browser could not copy the platform variant.');\n    }\n  };\n\n  if (loading) return <LoadingState label=\"Opening Content Kit\" />;\n"""
          if old not in text:
              raise SystemExit('ContentKitPanel local action anchor not found')
          text = text.replace(old, new, 1)

          old = """            <ul className=\"daily-angle-list\">\n              {kit.angles.map((angle) => (\n                <li key={angle.angleId}>\n                  <strong>{angle.title}</strong>\n                  <span>{angle.thesis}</span>\n                </li>\n              ))}\n            </ul>\n"""
          new = """            <ul className=\"daily-angle-list\">\n              {kit.angles.map((angle) => {\n                const selected = selectedAngleId === angle.angleId;\n                return (\n                  <li key={angle.angleId}>\n                    <strong>{angle.title}</strong>\n                    <span>{angle.thesis}</span>\n                    <Button\n                      variant={selected ? 'secondary' : 'primary'}\n                      disabled={selected}\n                      onClick={() => {\n                        setSelectedAngleId(angle.angleId);\n                        onSelectAngle(angle.angleId);\n                      }}\n                    >\n                      {selected ? 'Selected angle' : 'Use this angle'}\n                    </Button>\n                  </li>\n                );\n              })}\n            </ul>\n"""
          if old not in text:
              raise SystemExit('Angles list anchor not found')
          text = text.replace(old, new, 1)

          old = """                  <p>{variant.body}</p>\n                  <small>Human review required · external publish executed: No</small>\n                </li>\n"""
          new = """                  <p>{variant.body}</p>\n                  <small>Human review required · external publish executed: No</small>\n                  <Button\n                    variant=\"secondary\"\n                    disabled={copiedVariantId === variant.variantId}\n                    onClick={() => void copyVariant(variant)}\n                  >\n                    {copiedVariantId === variant.variantId ? 'Copied' : 'Copy'}\n                  </Button>\n                </li>\n"""
          if old not in text:
              raise SystemExit('Variant copy anchor not found')
          text = text.replace(old, new, 1)

          old = """        </div>\n      </Card>\n\n      <Card>\n        <div className=\"daily-card-heading\">\n          <div>\n            <p className=\"daily-kicker\">VISUAL</p>\n"""
          new = """        </div>\n        {copyError ? (\n          <Alert tone=\"warning\" title=\"Copy unavailable\">\n            {copyError}\n          </Alert>\n        ) : null}\n      </Card>\n\n      <Card>\n        <div className=\"daily-card-heading\">\n          <div>\n            <p className=\"daily-kicker\">VISUAL</p>\n"""
          if old not in text:
              raise SystemExit('Copy error anchor not found')
          text = text.replace(old, new, 1)

          old = """  const recordOrbitPreference = async (\n    kind: 'SAVED' | 'DISMISSED',\n    item: Readonly<DailyOrbitItem>\n  ) => {\n"""
          new = """  const selectContentAngle = (angleId: string) => {\n    if (!kit) return;\n    void dailyClient\n      .recordPreferenceEvent(\n        'ANGLE_SELECTED',\n        {\n          targetType: 'CONTENT_KIT',\n          targetId: kit.contentKitId,\n          targetVersion: kit.version\n        },\n        `preference:angle-selected:${kit.contentKitId}:${kit.version}:${angleId}`\n      )\n      .catch(() => {\n        // Angle selection is the primary local action; preference evidence is best-effort.\n      });\n  };\n\n  const copyPlatformVariant = async (variant: Readonly<PlatformVariant>) => {\n    if (!kit) throw new Error('Content Kit is required before copying a platform variant.');\n    if (!navigator.clipboard?.writeText)\n      throw new Error('Clipboard write is unavailable in this browser.');\n    await navigator.clipboard.writeText(`${variant.title}\\n\\n${variant.body}`);\n    void dailyClient\n      .recordPreferenceEvent(\n        'COPIED',\n        {\n          targetType: 'PLATFORM_VARIANT',\n          targetId: variant.variantId,\n          targetVersion: kit.version\n        },\n        `preference:copied:${kit.contentKitId}:${kit.version}:${variant.variantId}`\n      )\n      .catch(() => {\n        // A successful clipboard write remains successful even if preference evidence cannot persist.\n      });\n  };\n\n  const recordOrbitPreference = async (\n    kind: 'SAVED' | 'DISMISSED',\n    item: Readonly<DailyOrbitItem>\n  ) => {\n"""
          if old not in text:
              raise SystemExit('Parent CREATE action anchor not found')
          text = text.replace(old, new, 1)

          old = """            onCreateVisualBrief={(input) => void createVisualBrief(input)}\n            onStartVisualRequest={() => void startVisualRequest()}\n          />\n"""
          new = """            onCreateVisualBrief={(input) => void createVisualBrief(input)}\n            onStartVisualRequest={() => void startVisualRequest()}\n            onSelectAngle={selectContentAngle}\n            onCopyVariant={copyPlatformVariant}\n          />\n"""
          if old not in text:
              raise SystemExit('ContentKitPanel render prop anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          e2e = Path('tests/e2e/product-loop-today-real-runtime.spec.ts')
          text = e2e.read_text()
          anchor = """    for (let index = 0; index < nativeVariantCount; index += 1) {\n      await expect(\n        nativeVariants\n          .nth(index)\n          .getByText('Human review required · external publish executed: No', { exact: true })\n      ).toBeVisible();\n    }\n\n    const durableUrl = page.url();\n"""
          addition = """    for (let index = 0; index < nativeVariantCount; index += 1) {\n      await expect(\n        nativeVariants\n          .nth(index)\n          .getByText('Human review required · external publish executed: No', { exact: true })\n      ).toBeVisible();\n    }\n\n    const firstAngle = page.locator('.daily-angle-list > li').first();\n    await expect(firstAngle).toBeVisible();\n    const angleResponsePromise = page.waitForResponse(\n      (response) =>\n        response.url().includes('/api/lite/product-preference-events') &&\n        response.request().method() === 'POST'\n    );\n    await firstAngle.getByRole('button', { name: 'Use this angle', exact: true }).click();\n    const angleResponse = await angleResponsePromise;\n    expect(angleResponse.status()).toBe(201);\n    const angleBody = (await angleResponse.json()) as {\n      event: { kind: string; targetType: string };\n    };\n    expect(angleBody.event).toMatchObject({ kind: 'ANGLE_SELECTED', targetType: 'CONTENT_KIT' });\n    await expect(\n      firstAngle.getByRole('button', { name: 'Selected angle', exact: true })\n    ).toBeDisabled();\n\n    await page.context().grantPermissions(['clipboard-read', 'clipboard-write'], { origin: lite });\n    const firstVariant = nativeVariants.first();\n    const copyResponsePromise = page.waitForResponse(\n      (response) =>\n        response.url().includes('/api/lite/product-preference-events') &&\n        response.request().method() === 'POST'\n    );\n    await firstVariant.getByRole('button', { name: 'Copy', exact: true }).click();\n    const copyResponse = await copyResponsePromise;\n    expect(copyResponse.status()).toBe(201);\n    const copyBody = (await copyResponse.json()) as {\n      event: { kind: string; targetType: string };\n    };\n    expect(copyBody.event).toMatchObject({ kind: 'COPIED', targetType: 'PLATFORM_VARIANT' });\n    await expect(firstVariant.getByRole('button', { name: 'Copied', exact: true })).toBeDisabled();\n\n    const durableUrl = page.url();\n"""
          if anchor not in text:
              raise SystemExit('E2E CREATE actions anchor not found')
          e2e.write_text(text.replace(anchor, addition, 1))
          PY
          pnpm prettier --write \
            apps/lite-web/src/features/today/TodayWorkspace.tsx \
            tests/e2e/product-loop-today-real-runtime.spec.ts
          if git diff --quiet; then
            echo 'Angle Select and Copy actions are already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/lite-web/src/features/today/TodayWorkspace.tsx \
            tests/e2e/product-loop-today-real-runtime.spec.ts
          git commit -m 'M9 WP07: add angle selection and variant copy actions'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Validate ownership boundaries
        run: pnpm validate:workspace && pnpm validate:persistence-boundaries
      - name: Build M9 Daily Workspace dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/lite-service... --filter=@markorbit/markreg-service... --filter=@markorbit/gateway... --filter=@markorbit/lite-web...
      - name: Lint and typecheck M9 Daily Workspace packages
        run: |
          pnpm --filter @markorbit/lite-service lint
          pnpm --filter @markorbit/lite-service typecheck
          pnpm --filter @markorbit/markreg-service lint
          pnpm --filter @markorbit/markreg-service typecheck
          pnpm --filter @markorbit/gateway lint
          pnpm --filter @markorbit/gateway typecheck
          pnpm --filter @markorbit/lite-web lint
          pnpm --filter @markorbit/lite-web typecheck
      - name: Create isolated preference acceptance database
        env:
          PGPASSWORD: markorbit-test-only
        run: psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE markorbit_lite_preference_test'
      - name: Run real PostgreSQL Prepared Action and preference tests
        run: |
          pnpm --filter @markorbit/lite-service exec vitest run tests/prepared-action-postgres.test.ts
          LITE_TODAY_TEST_DATABASE_URL=postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_lite_preference_test pnpm --filter @markorbit/lite-service exec vitest run tests/preference-feedback-postgres.test.ts
      - name: Run authenticated Lite HTTP and preference derivation tests
        run: |
          pnpm exec vitest run scripts/product-loop-today-runtime.integration.test.ts
          pnpm --filter @markorbit/lite-service exec vitest run tests/preference-http.test.ts
          pnpm --filter @markorbit/lite-service exec vitest run tests/preference-target.test.ts
          pnpm --filter @markorbit/lite-service exec vitest run tests/daily-orbit.test.ts
      - name: Run Gateway Product-loop boundary tests
        run: |
          pnpm --filter @markorbit/gateway exec vitest run tests/product-loop-http.test.ts
          pnpm --filter @markorbit/gateway exec vitest run tests/product-loop-daily-workspace-http.test.ts
      - name: Run Daily Workspace preference client tests
        run: pnpm --filter @markorbit/lite-web exec vitest run src/api/daily-workspace.test.ts
      - name: Build Daily Workspace Storybook
        run: pnpm --filter @markorbit/lite-web build-storybook

  real-runtime-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_lite_today_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_lite_today_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LITE_TODAY_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_lite_today_browser
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build M9 Daily Workspace browser dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/lite-service... --filter=@markorbit/gateway... --filter=@markorbit/lite-web...
      - name: Run desktop and mobile Daily Workspace journey
        run: pnpm exec playwright test -c playwright.product-loop-today-real-runtime.config.ts
