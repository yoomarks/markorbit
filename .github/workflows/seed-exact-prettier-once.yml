name: SEED Exact Prettier Formatter

on:
  push:
    branches:
      - lite/1401-contextual-workbench
    paths:
      - '.github/workflows/seed-exact-prettier-once.yml'
      - 'apps/lite-web/src/features/agency-ia-prototype/SeedContextualWorkbench.tsx'
      - 'apps/lite-web/src/features/agency-ia-prototype/SeedContextualWorkbench.test.tsx'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact targets
        run: >-
          pnpm exec prettier --write
          apps/lite-web/src/features/agency-ia-prototype/SeedContextualWorkbench.tsx
          apps/lite-web/src/features/agency-ia-prototype/SeedContextualWorkbench.test.tsx
      - name: Emit exact formatted payloads
        shell: bash
        run: |
          echo '===SEED_WORKBENCH_TSX_BASE64_BEGIN==='
          base64 -w0 apps/lite-web/src/features/agency-ia-prototype/SeedContextualWorkbench.tsx
          echo
          echo '===SEED_WORKBENCH_TSX_BASE64_END==='
          echo '===SEED_WORKBENCH_TEST_BASE64_BEGIN==='
          base64 -w0 apps/lite-web/src/features/agency-ia-prototype/SeedContextualWorkbench.test.tsx
          echo
          echo '===SEED_WORKBENCH_TEST_BASE64_END==='
