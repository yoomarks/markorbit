name: Shared Communication Autoformat

on:
  push:
    branches:
      - feat/shared-communication-outbound-272

permissions:
  contents: write

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-communication-outbound-272
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Shared Communication files
        run: >-
          pnpm exec prettier --write
          services/capability-engine/src/managed-communication-exchange.ts
          services/capability-engine/src/managed-communication-http.ts
          services/capability-engine/tests/managed-communication-exchange-postgres.test.ts
      - name: Commit formatter output when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/capability-engine/src/managed-communication-exchange.ts \
            services/capability-engine/src/managed-communication-http.ts \
            services/capability-engine/tests/managed-communication-exchange-postgres.test.ts
          git commit -m "chore: format Shared Communication outbound"
          git push origin HEAD:feat/shared-communication-outbound-272
