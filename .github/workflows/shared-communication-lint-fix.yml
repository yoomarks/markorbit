name: Shared Communication Lint Fix

on:
  push:
    branches:
      - feat/shared-communication-outbound-272

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-communication-outbound-272
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply lint-safe typing fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          exchange = Path('services/capability-engine/src/managed-communication-exchange.ts')
          text = exchange.read_text()
          text = text.replace(
            "  const participants = request.participants.map((participant) => ({",
            "  const participants = request.participants.map(\n    (participant: Readonly<ManagedCommunicationParticipantV1>) => ({"
          )
          text = text.replace(
            "    address: clean(participant.address, 'participant.address', 500)\n  }));",
            "      ...participant,\n      address: clean(participant.address, 'participant.address', 500)\n    })\n  );"
          ) if "    address: clean(participant.address, 'participant.address', 500)\n  }));" in text else text
          # Normalize the participant mapping if Prettier retained the spread line.
          text = text.replace(
            "  const participants = request.participants.map(\n    (participant: Readonly<ManagedCommunicationParticipantV1>) => ({\n    ...participant,\n    address: clean(participant.address, 'participant.address', 500)\n  }));",
            "  const participants = request.participants.map(\n    (participant: Readonly<ManagedCommunicationParticipantV1>) => ({\n      ...participant,\n      address: clean(participant.address, 'participant.address', 500)\n    })\n  );"
          )
          text = text.replace(
            "  const attachments = request.attachments.map((attachment) => {",
            "  const attachments = request.attachments.map(\n    (attachment: Readonly<ManagedCommunicationAttachmentRefV1>) => {"
          )
          text = text.replace(
            "    return { ...attachment, attachmentRef: clean(attachment.attachmentRef, 'attachmentRef', 500) };\n  });",
            "      return {\n        ...attachment,\n        attachmentRef: clean(attachment.attachmentRef, 'attachmentRef', 500)\n      };\n    }\n  );"
          )
          text = text.replace(
            "reason: String(row.reconciliation_reason ?? 'UNKNOWN_DELIVERY_STATE'),",
            "reason:\n                typeof row.reconciliation_reason === 'string'\n                  ? row.reconciliation_reason\n                  : 'UNKNOWN_DELIVERY_STATE',"
          )
          exchange.write_text(text)

          unit = Path('services/capability-engine/tests/managed-communication-exchange.test.ts')
          text = unit.read_text()
          text = text.replace("send: async () => {\n        calls += 1;\n        return {", "send: () => {\n        calls += 1;\n        return Promise.resolve({")
          text = text.replace("acceptedAt: '2026-08-27T04:01:01.000Z'\n        };\n      }", "acceptedAt: '2026-08-27T04:01:01.000Z'\n        });\n      }")
          text = text.replace("send: async () => {\n        calls += 1;\n        throw new Error('must not run');\n      }", "send: () => {\n        calls += 1;\n        return Promise.reject(new Error('must not run'));\n      }")
          unit.write_text(text)

          pg = Path('services/capability-engine/tests/managed-communication-exchange-postgres.test.ts')
          text = pg.read_text()
          text = text.replace("send: async () => {\n        calls += 1;\n        return {", "send: () => {\n        calls += 1;\n        return Promise.resolve({")
          text = text.replace("acceptedAt: '2026-08-27T05:01:01.000Z'\n        };\n      }", "acceptedAt: '2026-08-27T05:01:01.000Z'\n        });\n      }")
          text = text.replace("send: async () => ({", "send: () =>\n        Promise.resolve({")
          text = text.replace("acceptedAt: '2026-08-27T05:01:01.000Z'\n      })", "acceptedAt: '2026-08-27T05:01:01.000Z'\n        })")
          pg.write_text(text)
          PY
          pnpm exec prettier --write \
            services/capability-engine/src/managed-communication-exchange.ts \
            services/capability-engine/tests/managed-communication-exchange.test.ts \
            services/capability-engine/tests/managed-communication-exchange-postgres.test.ts
      - name: Commit lint fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/capability-engine/src/managed-communication-exchange.ts \
            services/capability-engine/tests/managed-communication-exchange.test.ts \
            services/capability-engine/tests/managed-communication-exchange-postgres.test.ts
          git commit -m "fix: satisfy Shared Communication lint boundaries"
          git push origin HEAD:feat/shared-communication-outbound-272
