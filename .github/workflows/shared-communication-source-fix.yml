name: Shared Communication Source Fix

on:
  push:
    branches:
      - feat/shared-communication-outbound-272

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-communication-outbound-272
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply fail-closed type and persistence fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/capability-engine/src/managed-communication-exchange.ts')
          text = path.read_text()
          text = text.replace("  managedCommunicationNoAuthorityConsequences,\n", "")
          text = text.replace("  type ManagedCommunicationAuthorityConsequencesV1,\n", "")
          text = text.replace(
          "export interface ManagedCommunicationSendReceiptV1 {",
          "export interface ManagedCommunicationSendAuthorityV1 {\n  externalMessageSent: true;\n  customerTruthMutated: false;\n  matterTruthMutated: false;\n  legalTruthCreated: false;\n  knowledgeApproved: false;\n  professionalDecisionCreated: false;\n}\n\nexport interface ManagedCommunicationSendReceiptV1 {"
          )
          text = text.replace(
          "  authority: Readonly<ManagedCommunicationAuthorityConsequencesV1> & {\n    externalMessageSent: true;\n  };",
          "  authority: Readonly<ManagedCommunicationSendAuthorityV1>;"
          )
          text = text.replace(
          "  const attachments = request.attachments.map((attachment) => {",
          "  if (!Array.isArray(request.attachments))\n    throw new ManagedCommunicationExchangeError(\n      'INVALID_SEND_REQUEST',\n      'Outbound communication attachments must be an array.'\n    );\n  const attachments = request.attachments.map((attachment) => {"
          )
          text = text.replace("ORDER BY occurred_at ASC, created_at ASC", "ORDER BY observed_at ASC, created_at ASC")
          text = text.replace(
          "      authority: {\n        ...managedCommunicationNoAuthorityConsequences,\n        externalMessageSent: true\n      }",
          "      authority: {\n        externalMessageSent: true,\n        customerTruthMutated: false,\n        matterTruthMutated: false,\n        legalTruthCreated: false,\n        knowledgeApproved: false,\n        professionalDecisionCreated: false\n      }"
          )
          path.write_text(text)
          PY
          pnpm exec prettier --write services/capability-engine/src/managed-communication-exchange.ts
      - name: Commit source fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/capability-engine/src/managed-communication-exchange.ts
          git commit -m "fix: harden Shared Communication send authority and evidence"
          git push origin HEAD:feat/shared-communication-outbound-272
