name: TASK029 format

on:
  push:
    branches: [task-029-milestone4-scope-lock]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-029-milestone4-scope-lock
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          docs/planning/MO-MVP-MILESTONE-004-SCOPE-LOCK.md
          docs/planning/MO-MVP-MILESTONE-004-DELIVERY-PLAN.md
          docs/planning/MO-MVP-MILESTONE-004-PLAN.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planning/MO-MVP-MILESTONE-004-SCOPE-LOCK.md docs/planning/MO-MVP-MILESTONE-004-DELIVERY-PLAN.md docs/planning/MO-MVP-MILESTONE-004-PLAN.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(m4): format milestone 4 planning documents"
          git push origin HEAD:task-029-milestone4-scope-lock
