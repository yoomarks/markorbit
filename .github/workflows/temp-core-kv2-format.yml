name: Temp Core KV2 Format

on:
  push:
    branches:
      - feat/core-kv2-consumer-completion

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/core-kv2-consumer-completion
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          services/core/src/knowledge-v2-acceptance.ts
          services/core/src/knowledge-v2-delivery.ts
          services/core/tests/knowledge-v2-delivery-http.test.ts
          services/core/tests/knowledge-v2-delivery-postgres.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/core/src/knowledge-v2-acceptance.ts services/core/src/knowledge-v2-delivery.ts services/core/tests/knowledge-v2-delivery-http.test.ts services/core/tests/knowledge-v2-delivery-postgres.test.ts
          git commit -m "chore(core-kv2): apply repository formatting"
          git push origin HEAD:feat/core-kv2-consumer-completion
