name: Temp Core KV2 Ledger Format

on:
  push:
    branches:
      - docs/core-kv2-consumer-ledger

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/core-kv2-consumer-ledger
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/integrations/knowledge-ready-package-v2/integration-status.yaml
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/integrations/knowledge-ready-package-v2/integration-status.yaml
          git commit -m "style(core-kv2): format integration ledger"
          git push origin HEAD:docs/core-kv2-consumer-ledger
