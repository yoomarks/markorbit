name: TEMP NEVER MERGE MGSN Trusted Public Format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-format-push:
    if: github.head_ref == 'tmp-mgsn-685-trusted-public-format'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mgsn-trusted-public-exposure-runtime
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact owner files
        run: |
          pnpm exec prettier --write services/mgsn/src/trusted-public-exposure.ts services/mgsn/tests/trusted-public-exposure.test.ts
          pnpm exec prettier --check services/mgsn/src/trusted-public-exposure.ts services/mgsn/tests/trusted-public-exposure.test.ts
      - name: Build MGSN dependency closure
        run: pnpm turbo run build --filter=@markorbit/mgsn-service...
      - name: MGSN typecheck and lint
        run: |
          pnpm --filter @markorbit/mgsn-service typecheck
          pnpm --filter @markorbit/mgsn-service lint
      - name: Run focused Trusted Public tests
        run: pnpm --filter @markorbit/mgsn-service exec vitest run tests/trusted-public-exposure.test.ts
      - name: Push only verified formatting to formal branch
        run: |
          if git diff --quiet -- services/mgsn/src/trusted-public-exposure.ts services/mgsn/tests/trusted-public-exposure.test.ts; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/mgsn/src/trusted-public-exposure.ts services/mgsn/tests/trusted-public-exposure.test.ts
          git commit -m "[MGSN-P0] Format Trusted Public serve runtime"
          git push origin HEAD:mgsn-trusted-public-exposure-runtime
