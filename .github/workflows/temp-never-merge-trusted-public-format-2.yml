name: TEMP NEVER MERGE Trusted Public Format 2

on:
  pull_request:
    paths:
      - '.github/workflows/temp-never-merge-trusted-public-format-2.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and verify Trusted Public contract
        run: |
          pnpm prettier --write packages/contracts/src/trusted-public-exposure.ts
          pnpm prettier --check packages/contracts/src/trusted-public-exposure.ts
          pnpm --filter @markorbit/contracts lint
          pnpm --filter @markorbit/contracts typecheck
          pnpm --filter @markorbit/contracts test -- tests/trusted-public-exposure.test.ts
          cp packages/contracts/src/trusted-public-exposure.ts /tmp/trusted-public-exposure.ts
      - name: Push only formatted source to formal branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin integration-mgsn-trusted-public-exposure-contract
          git checkout -B formal origin/integration-mgsn-trusted-public-exposure-contract
          cp /tmp/trusted-public-exposure.ts packages/contracts/src/trusted-public-exposure.ts
          git add packages/contracts/src/trusted-public-exposure.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "[INTEGRATION][MGSN-P0] Format lint-safe Trusted Public parser"
          git push origin HEAD:integration-mgsn-trusted-public-exposure-contract
