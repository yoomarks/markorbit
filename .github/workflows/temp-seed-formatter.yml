name: Temporary SEED Formatter

on:
  push:
    branches:
      - lite/1401-contextual-workbench

permissions:
  contents: write

concurrency:
  group: temp-seed-formatter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format bounded SEED files
        run: >
          pnpm exec prettier --write
          apps/lite-web/src/features/agency-ia-prototype/SeedContextualWorkbench.tsx
          apps/lite-web/src/features/agency-ia-prototype/SeedContextualWorkbench.test.tsx
          apps/lite-web/tests/agency-ia-prototype.pw.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet --             apps/lite-web/src/features/agency-ia-prototype/SeedContextualWorkbench.tsx             apps/lite-web/src/features/agency-ia-prototype/SeedContextualWorkbench.test.tsx             apps/lite-web/tests/agency-ia-prototype.pw.ts; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/lite-web/src/features/agency-ia-prototype/SeedContextualWorkbench.tsx             apps/lite-web/src/features/agency-ia-prototype/SeedContextualWorkbench.test.tsx             apps/lite-web/tests/agency-ia-prototype.pw.ts
          git commit -m "style: format contextual workbench V1"
          git push origin HEAD:${{ github.ref_name }}
