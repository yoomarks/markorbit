name: tmp 319 prettier

on:
  push:
    branches:
      - fix/319-m6-repeatability-db-isolation

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier patch
        run: |
          pnpm exec prettier --write services/capability-engine/tests/reset-capability-postgres-test-database.ts
          git diff -- services/capability-engine/tests/reset-capability-postgres-test-database.ts
