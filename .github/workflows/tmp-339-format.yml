name: Temporary #339 formatter

on:
  push:
    branches:
      - fix/336-product-loop-current-ui-assertions

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/336-product-loop-current-ui-assertions
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/e2e/product-loop-closure-real-runtime.spec.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/product-loop-closure-real-runtime.spec.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format Product-loop closure spec"
          git push origin HEAD:fix/336-product-loop-current-ui-assertions
