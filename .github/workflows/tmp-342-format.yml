name: tmp-342-format

on:
  push:
    branches:
      - phase6/341-method-outcome-evidence-admission

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6/341-method-outcome-evidence-admission
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          packages/contracts/src/method-outcome-evidence.ts
          services/core/src/method-outcome-evidence-http.ts
          services/core/src/method-outcome-evidence.ts
          services/core/tests/method-outcome-evidence-postgres.test.ts
          services/core/tests/method-outcome-evidence.test.ts
      - name: Commit formatter output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet; then
            exit 0
          fi
          git add packages/contracts/src/method-outcome-evidence.ts services/core/src/method-outcome-evidence-http.ts services/core/src/method-outcome-evidence.ts services/core/tests/method-outcome-evidence-postgres.test.ts services/core/tests/method-outcome-evidence.test.ts
          git commit -m "style: format Method Outcome Evidence admission"
          git push origin HEAD:phase6/341-method-outcome-evidence-admission
