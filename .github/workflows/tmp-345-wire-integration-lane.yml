name: tmp-345-wire-integration-lane

on:
  push:
    branches:
      - phase6/345-product-outcome-evidence-loop

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6/345-product-outcome-evidence-loop
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire and format Phase 6 cross-service acceptance
        run: |
          node scripts/tmp-345-wire-integration-lane.mjs
          pnpm exec prettier --write package.json scripts/phase6-product-outcome-evidence.integration.test.ts
      - name: Commit corrected acceptance lane
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json scripts/phase6-product-outcome-evidence.integration.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'test: place Phase 6 acceptance at cross-service boundary'
          git push origin HEAD:phase6/345-product-outcome-evidence-loop
