name: tmp-369-focused
on:
  push:
    branches: [tmp/369-focused]
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markorbit/gateway typecheck
      - run: pnpm --filter @markorbit/gateway lint
      - run: pnpm --filter @markorbit/gateway exec vitest run tests/mgsn-network-participation-http.test.ts
