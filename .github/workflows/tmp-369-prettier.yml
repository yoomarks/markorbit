name: tmp-369-prettier
on:
  push:
    branches: [tmp/369-prettier]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier apps/gateway/tests/mgsn-network-participation-http.test.ts --write
          git diff -- apps/gateway/tests/mgsn-network-participation-http.test.ts
