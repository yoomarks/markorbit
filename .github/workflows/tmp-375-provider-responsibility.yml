name: tmp-375 provider responsibility

on:
  push:
    branches:
      - tmp/375-provider-responsibility-format

permissions:
  contents: write

jobs:
  prepare-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: |
          node <<'NODE'
          const fs = require('fs');
          const packagePath = 'packages/contracts/package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.exports['./provider-responsibility'] = {
            types: './dist/provider-responsibility.d.ts',
            import: './dist/provider-responsibility.js',
            default: './dist/provider-responsibility.js'
          };
          if (!pkg.scripts.build.includes('src/provider-responsibility.ts')) {
            pkg.scripts.build = pkg.scripts.build.replace(
              'src/provider-discovery.ts',
              'src/provider-discovery.ts src/provider-responsibility.ts'
            );
          }
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const sourcePath = 'packages/contracts/src/provider-responsibility.ts';
          let source = fs.readFileSync(sourcePath, 'utf8');
          source = source.replaceAll(
            "legallyRequiredDistinctSigner: { kind: 'NONE', distinctSignerRequired: false },",
            "legallyRequiredDistinctSigner: { kind: 'NONE', distinctSignerRequired: false } as const,"
          );
          source = source.replace(
            "    doesNotReplaceFinalExecutionProvider: true\n  },\n  version: 3,",
            "    doesNotReplaceFinalExecutionProvider: true\n  } as const,\n  version: 3,"
          );
          fs.writeFileSync(sourcePath, source);
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/contracts/package.json packages/contracts/src/provider-responsibility.ts packages/contracts/tests/provider-responsibility.test.ts
      - run: pnpm --filter @markorbit/contracts typecheck
      - run: pnpm --filter @markorbit/contracts exec vitest run tests/provider-responsibility.test.ts
      - run: pnpm --filter @markorbit/contracts build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/contracts/package.json packages/contracts/src/provider-responsibility.ts packages/contracts/tests/provider-responsibility.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore(contracts): export and format provider responsibility"
            git push
          fi
