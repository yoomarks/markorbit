name: tmp-378 AI baseline

on:
  push:
    branches:
      - tmp/378-ai-baseline

permissions:
  contents: read

jobs:
  verify-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markorbit/ai... build
      - run: pnpm --filter @markorbit/ai lint
      - run: pnpm --filter @markorbit/ai typecheck
      - run: pnpm --filter @markorbit/ai test
