name: Temporary PR 407 Prettier Probe

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-407-prettier-probe.yml'
      - 'services/markreg/src/matter-intelligence-read.ts'
      - 'services/markreg/tests/matter-intelligence-read.test.ts'
      - 'services/markreg/tests/matter-intelligence-read-postgres.test.ts'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write services/markreg/src/matter-intelligence-read.ts services/markreg/tests/matter-intelligence-read.test.ts services/markreg/tests/matter-intelligence-read-postgres.test.ts
          echo '--- PRETTIER DIFF START ---'
          git diff -- services/markreg/src/matter-intelligence-read.ts services/markreg/tests/matter-intelligence-read.test.ts services/markreg/tests/matter-intelligence-read-postgres.test.ts
          echo '--- PRETTIER DIFF END ---'
          test -z "$(git status --porcelain -- services/markreg/src/matter-intelligence-read.ts services/markreg/tests/matter-intelligence-read.test.ts services/markreg/tests/matter-intelligence-read-postgres.test.ts)"
