name: Temporary 433 Prettier

on:
  push:
    branches:
      - tmp/433-prettier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          services/core/package.json
          services/core/src/brain-build-self-audit-observation.ts
          services/core/tests/brain-build-self-audit-observation.test.ts
      - run: git diff --check
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/core/package.json services/core/src/brain-build-self-audit-observation.ts services/core/tests/brain-build-self-audit-observation.test.ts
          git commit -m "chore: format #433 helper"
          git push
