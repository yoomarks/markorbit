name: tmp-439-outcome-trust-evidence
on:
  push:
    branches: [tmp/439-outcome-trust-evidence]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/439-outcome-trust-evidence
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add package subpath and build entry
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'packages/contracts/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.exports['./outcome-trust-evidence'] = {
            types: './dist/outcome-trust-evidence.d.ts',
            import: './dist/outcome-trust-evidence.js',
            default: './dist/outcome-trust-evidence.js'
          };
          const needle = 'src/method-improvement-coverage-gap.ts';
          const addition = 'src/outcome-trust-evidence.ts';
          if (!pkg.scripts.build.includes(addition)) {
            pkg.scripts.build = pkg.scripts.build.replace(needle, `${needle} ${addition}`);
          }
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
      - name: Fix exact optional executor assessment pair
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'packages/contracts/src/outcome-trust-evidence.ts';
          let source = fs.readFileSync(path, 'utf8');
          const before = `  return {\n    state: 'NOT_ESTABLISHED',\n    assessmentState: executor.assessmentState as Exclude<ProviderDirectExecutorAssessmentState, 'DIRECT_FINAL_EXECUTOR_ESTABLISHED' | 'DIRECT_EXECUTOR_WITH_REQUIRED_SIGNER_ESTABLISHED'>,\n    ...(assessmentReference ? { assessmentReference, assessmentFingerprintSha256 } : {}),`;
          const after = `  const assessmentIdentity =\n    assessmentReference === undefined\n      ? {}\n      : { assessmentReference, assessmentFingerprintSha256: assessmentFingerprintSha256! };\n  return {\n    state: 'NOT_ESTABLISHED',\n    assessmentState: executor.assessmentState as Exclude<ProviderDirectExecutorAssessmentState, 'DIRECT_FINAL_EXECUTOR_ESTABLISHED' | 'DIRECT_EXECUTOR_WITH_REQUIRED_SIGNER_ESTABLISHED'>,\n    ...assessmentIdentity,`;
          if (!source.includes(before)) throw new Error('expected executor construction not found');
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE
      - name: Use lint-safe validated allowlists and control-flow narrowing
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'packages/contracts/src/outcome-trust-evidence.ts';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              'const ownerByKind: Readonly<Record<TrustEvidenceOwnerFactKindV1, TrustEvidenceOwnerFactOwnerV1>> = {',
              'const ownerByKind: Readonly<Record<string, TrustEvidenceOwnerFactOwnerV1>> = {'
            ],
            [
              'ownerByKind[source.factKind as TrustEvidenceOwnerFactKindV1]',
              'ownerByKind[source.factKind]'
            ],
            [
              'const allowedNonPositive: readonly ProviderDirectExecutorAssessmentState[] = [',
              'const allowedNonPositive: ReadonlySet<string> = new Set(['
            ],
            [
              "    'AUTHORITY_UNAVAILABLE'\n  ];",
              "    'AUTHORITY_UNAVAILABLE'\n  ]);"
            ],
            [
              'allowedNonPositive.includes(executor.assessmentState as ProviderDirectExecutorAssessmentState)',
              'allowedNonPositive.has(executor.assessmentState)'
            ],
            [
              'providerReturnStatus: source.providerReturnStatus as ProviderReturnStatus,',
              'providerReturnStatus: source.providerReturnStatus,'
            ],
            [
              "if (typeof executor.assessmentState !== 'string' || !POSITIVE_EXECUTOR_STATES.has(executor.assessmentState))\n      invalid('Established executorAttribution requires a positive #375 assessment state.');",
              "if (\n      executor.assessmentState !== 'DIRECT_FINAL_EXECUTOR_ESTABLISHED' &&\n      executor.assessmentState !== 'DIRECT_EXECUTOR_WITH_REQUIRED_SIGNER_ESTABLISHED'\n    )\n      invalid('Established executorAttribution requires a positive #375 assessment state.');"
            ],
            [
              "assessmentState: executor.assessmentState as 'DIRECT_FINAL_EXECUTOR_ESTABLISHED' | 'DIRECT_EXECUTOR_WITH_REQUIRED_SIGNER_ESTABLISHED',",
              'assessmentState: executor.assessmentState,'
            ]
          ];
          for (const [before, after] of replacements) {
            if (!source.includes(before)) throw new Error(`expected narrowing fragment not found: ${before}`);
            source = source.replace(before, after);
          }
          fs.writeFileSync(path, source);
          NODE
      - name: Narrow Trust Evidence item reference helper
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'packages/contracts/tests/outcome-trust-evidence.test.ts';
          let source = fs.readFileSync(path, 'utf8');
          const before = `function itemReference(item = claimItem()): TrustEvidenceItemReferenceV1 {`;
          const after = `function itemReference(\n  item: {\n    trustEvidenceItemId: string;\n    version: number;\n    trustEvidenceItemFingerprintSha256: string;\n  } = claimItem()\n): TrustEvidenceItemReferenceV1 {`;
          if (!source.includes(before)) throw new Error('expected itemReference helper not found');
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE
      - run: pnpm exec prettier packages/contracts/package.json packages/contracts/src/outcome-trust-evidence.ts packages/contracts/tests/outcome-trust-evidence.test.ts --write
      - run: pnpm --filter @markorbit/contracts build
      - run: pnpm --filter @markorbit/contracts typecheck
      - run: pnpm --filter @markorbit/contracts lint
      - run: pnpm --filter @markorbit/contracts exec vitest run tests/outcome-trust-evidence.test.ts tests/provider-responsibility.test.ts tests/provider-discovery.test.ts tests/evidence-lifecycle.test.ts
      - run: git diff --check
      - name: Commit normalized blobs
        run: |
          git config user.name yoomarks
          git config user.email lukeluccas6292643@gmail.com
          git add packages/contracts/package.json packages/contracts/src/outcome-trust-evidence.ts packages/contracts/tests/outcome-trust-evidence.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'tmp: normalize Outcome Trust Evidence contract'
            git push origin HEAD:tmp/439-outcome-trust-evidence
          fi
