name: Temporary 446 Prettier

on:
  push:
    branches:
      - tmp/446-prettier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/446-prettier
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/capability-engine/src/capability-source-output-identity.ts services/capability-engine/src/current-source-admission-evidence-v2.ts services/capability-engine/tests/current-source-admission-evidence-v2.test.ts
      - run: git diff --check
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/capability-engine/src/capability-source-output-identity.ts services/capability-engine/src/current-source-admission-evidence-v2.ts services/capability-engine/tests/current-source-admission-evidence-v2.test.ts
          git commit -m "chore: format #446 helper"
          git push origin HEAD:tmp/446-prettier
