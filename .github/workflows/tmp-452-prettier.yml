name: Temporary 452 Prettier

on:
  push:
    branches:
      - tmp/452-prettier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/452-prettier
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/contracts/src/provider-discovery.ts packages/contracts/tests/provider-discovery.test.ts
      - run: git diff --check
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/contracts/src/provider-discovery.ts packages/contracts/tests/provider-discovery.test.ts
          git commit -m "chore: format #452 helper"
          git push origin HEAD:tmp/452-prettier
