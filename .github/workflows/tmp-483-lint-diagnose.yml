name: tmp-483-lint-diagnose

on:
  push:
    branches:
      - tmp/483-lint-diagnose

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract failure summary
        shell: bash
        run: |
          set +e
          {
            echo "=== EXIT CODES ==="
            grep -E "^(build_exit|validate_exit|hygiene_exit)=" tmp-483-affected-report.txt || true
            echo "=== ERROR SIGNALS ==="
            grep -Ein "error|failed|failure|ELIFECYCLE|TS[0-9]{4}|cannot find|not found|exit code|command.*exited" tmp-483-affected-report.txt | tail -n 250 || true
            echo "=== REPORT TAIL ==="
            tail -n 180 tmp-483-affected-report.txt
          } > tmp-483-failure-summary.txt
          cat tmp-483-failure-summary.txt
      - name: Commit summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-483-failure-summary.txt
          git commit -m "chore: summarize #483 validation diagnostics" || exit 0
          git push
