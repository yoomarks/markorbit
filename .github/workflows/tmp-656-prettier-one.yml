name: tmp-656-prettier-one

on:
  push:
    branches:
      - capability/656-uspto-production-promotion

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capability/656-uspto-production-promotion
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/capability-engine/src/uspto-official-fee-production-promotion.ts
      - run: git rm .github/workflows/tmp-656-prettier-one.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/capability-engine/src/uspto-official-fee-production-promotion.ts
          git commit -m 'style(capability): format governed USPTO production executor'
          git push origin HEAD:capability/656-uspto-production-promotion
