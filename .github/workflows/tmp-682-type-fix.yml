name: Temporary
on:
  push:
    branches:
      - capability/682-production-source-evidence-read
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capability/682-production-source-evidence-read
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix exact fixture typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/capability-engine/tests/production-source-evidence-read.test.ts')
          text = path.read_text()
          replacements = {
              'function acceptedReference() {': 'function acceptedReference(amountMinor: number = 35000) {',
              '    amountMinor: 35000,': '    amountMinor,',
              '    const changedReference = { ...acceptedReference(), amountMinor: 36000 };': '    const changedReference = acceptedReference(36000);',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, got {text.count(old)}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          pnpm exec prettier --write services/capability-engine/tests/production-source-evidence-read.test.ts
          pnpm --filter @markorbit/capability-engine lint
          pnpm --filter @markorbit/capability-engine typecheck
      - name: Remove temporary workflow and push fixed tree
        shell: bash
        run: |
          rm .github/workflows/tmp-682-type-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/capability-engine/tests/production-source-evidence-read.test.ts .github/workflows/tmp-682-type-fix.yml
          git commit -m '[CAPABILITY-P0] Fix #682 stale-reference fixture typing'
          git push origin HEAD:capability/682-production-source-evidence-read
