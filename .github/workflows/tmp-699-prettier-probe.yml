name: tmp-699-prettier-probe

on:
  push:
    branches:
      - 'tmp/699-prettier-probe'

permissions:
  contents: write

jobs:
  prettier-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/699-prettier-probe
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit exact Prettier output to temporary branch
        run: |
          pnpm exec prettier --write \
            apps/markreg-web/src/ProductionIntakePlanning.tsx \
            apps/markreg-web/src/ProductionIntakePlanning.test.tsx \
            apps/markreg-web/src/api/production-intake.test.ts
          if git diff --quiet -- \
            apps/markreg-web/src/ProductionIntakePlanning.tsx \
            apps/markreg-web/src/ProductionIntakePlanning.test.tsx \
            apps/markreg-web/src/api/production-intake.test.ts; then
            echo 'already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/markreg-web/src/ProductionIntakePlanning.tsx \
            apps/markreg-web/src/ProductionIntakePlanning.test.tsx \
            apps/markreg-web/src/api/production-intake.test.ts
          git commit -m 'style: temporary #699 exact prettier output'
          git push origin HEAD:tmp/699-prettier-probe
