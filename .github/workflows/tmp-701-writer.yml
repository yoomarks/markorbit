name: tmp-701-writer
on:
  push:
    branches: [tmp/701-writer]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/701-writer
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/tmp-701-patch.mjs
      - run: pnpm exec prettier --write apps/gateway/src/index.ts apps/gateway/src/filing-governance-http.ts apps/gateway/tests/filing-governance-http.test.ts apps/gateway/tests/filing-authorization-execution-release.test.ts
      - run: |
          pnpm --filter @markorbit/contracts build
          pnpm --filter @markorbit/events build
          pnpm --filter @markorbit/service-kit build
          pnpm --filter @markorbit/gateway lint
          pnpm --filter @markorbit/gateway typecheck
          pnpm --filter @markorbit/gateway exec vitest run tests/filing-governance-http.test.ts tests/filing-authorization-execution-release.test.ts tests/execution-negative-path-matrix.test.ts
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/gateway/src/index.ts apps/gateway/src/filing-governance-http.ts apps/gateway/tests/filing-governance-http.test.ts apps/gateway/tests/filing-authorization-execution-release.test.ts
          git commit -m "fix: temporary #701 verified output"
          git push
