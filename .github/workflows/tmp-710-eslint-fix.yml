name: tmp-710-eslint-fix

on:
  push:
    branches:
      - integration/710-capability-recommendation-source

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply ESLint autofix to the isolated MarkReg test
        run: pnpm --filter @markorbit/markreg-service exec eslint tests/recommendation-source.test.ts --fix
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-710-eslint-fix.yml
          git add services/markreg/tests/recommendation-source.test.ts
          git commit -m "test: fix #710 MarkReg lint assertions"
          git push
