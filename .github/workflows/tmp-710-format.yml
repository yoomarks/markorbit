name: tmp-710-format

on:
  push:
    branches:
      - integration/710-capability-recommendation-source

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write services/capability-engine/src/production-source-evidence-http.ts services/capability-engine/tests/production-source-evidence-http.test.ts services/markreg/src/recommendation-source.ts services/markreg/tests/recommendation-source.test.ts
      - name: Commit formatted files and remove formatter
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-710-format.yml
          git add services/capability-engine/src/production-source-evidence-http.ts services/capability-engine/tests/production-source-evidence-http.test.ts services/markreg/src/recommendation-source.ts services/markreg/tests/recommendation-source.test.ts
          git commit -m "style: format #710 producer-consumer boundary"
          git push
