name: tmp-710-markreg-format

on:
  push:
    branches:
      - integration/710-capability-recommendation-source

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier to typed MarkReg test
        run: pnpm exec prettier --write services/markreg/tests/recommendation-source.test.ts
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-710-markreg-format.yml
          git add services/markreg/tests/recommendation-source.test.ts
          git commit -m "style(markreg): format #710 typed source test"
          git push
