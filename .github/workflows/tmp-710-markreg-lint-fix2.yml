name: tmp-710-markreg-lint-fix2

on:
  push:
    branches:
      - integration/710-capability-recommendation-source

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Type fetch mocks without unused parameters
        shell: python
        run: |
          from pathlib import Path
          path = Path('services/markreg/tests/recommendation-source.test.ts')
          text = path.read_text()
          old = """    const fetcher = vi.fn(\n      (_input: string | URL | Request, _init?: RequestInit): Promise<Response> =>\n        Promise.resolve(\n          new Response(JSON.stringify(productionRead()), {\n            status: 200,\n            headers: { 'content-type': 'application/json' }\n          })\n        )\n    );"""
          new = """    const fetcher = vi.fn<typeof fetch>(() =>\n      Promise.resolve(\n        new Response(JSON.stringify(productionRead()), {\n          status: 200,\n          headers: { 'content-type': 'application/json' }\n        })\n      )\n    );"""
          assert old in text
          text = text.replace(old, new)
          text = text.replace(
              "    expect(JSON.parse(String(init?.body))).toEqual(productionReference());",
              "    if (typeof init?.body !== 'string') throw new Error('expected JSON request body');\n    expect(JSON.parse(init.body)).toEqual(productionReference());"
          )
          text = text.replace(
              "vi.fn((_input: string | URL | Request, _init?: RequestInit): Promise<Response> =>\n        Promise.reject(new Error('offline'))\n      )",
              "vi.fn<typeof fetch>(() => Promise.reject(new Error('offline')))"
          )
          text = text.replace(
              "vi.fn((_input: string | URL | Request, _init?: RequestInit): Promise<Response> =>\n        Promise.resolve(new Response('{}', { status: 403 }))\n      )",
              "vi.fn<typeof fetch>(() => Promise.resolve(new Response('{}', { status: 403 })))"
          )
          text = text.replace(
              "vi.fn((_input: string | URL | Request, _init?: RequestInit): Promise<Response> =>\n        Promise.resolve(new Response('not-json', { status: 200 }))\n      )",
              "vi.fn<typeof fetch>(() => Promise.resolve(new Response('not-json', { status: 200 })))"
          )
          path.write_text(text)
      - name: Format and lint isolated MarkReg test
        run: |
          pnpm exec prettier --write services/markreg/tests/recommendation-source.test.ts
          pnpm --filter @markorbit/markreg-service exec eslint tests/recommendation-source.test.ts
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-710-markreg-lint-fix2.yml
          git add services/markreg/tests/recommendation-source.test.ts
          git commit -m "test(markreg): type #710 fetch mocks without lint escapes"
          git push
