name: tmp-724-lint-fix-v2

on:
  push:
    branches:
      - 'tmp/724-lint-fix-v2'

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/724-lint-fix-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact lint and typecheck repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('apps/markreg-web/src/ProductionIntakeFlow.test.tsx')
          text = test_path.read_text()
          replacements = [
              (
                  "import type { ProductionIntakeV1 } from '@markorbit/contracts/markreg-early-funnel';",
                  """import type {
            CreateProductionIntakeCommandV1,
            ProductionIntakeV1
          } from '@markorbit/contracts/markreg-early-funnel';"""
              ),
              (
                  "    const productionClient = client();",
                  """    const create = vi.fn(() =>
              Promise.resolve({
                ...durableIntake,
                input: {
                  ...durableIntake.input,
                  businessContext: 'POST response must not be rendered'
                }
              })
            );
            const get = vi.fn(() => Promise.resolve(durableIntake));
            const productionClient = client({ create, get });"""
              ),
              (
                  "    expect(productionClient.create).toHaveBeenCalledTimes(1);",
                  "    expect(create).toHaveBeenCalledTimes(1);"
              ),
              (
                  "    expect(productionClient.get).toHaveBeenCalledWith('production-intake_699');",
                  "    expect(get).toHaveBeenCalledWith('production-intake_699');"
              ),
              (
                  "    const firstCommand = create.mock.calls[0]![0];",
                  "    const firstCommand = create.mock.calls[0]![0] as CreateProductionIntakeCommandV1;"
              ),
              (
                  "    const secondCommand = create.mock.calls[1]![0];",
                  "    const secondCommand = create.mock.calls[1]![0] as CreateProductionIntakeCommandV1;"
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              assert count == 1, (old, count)
              text = text.replace(old, new, 1)
          test_path.write_text(text)

          flow_path = Path('apps/markreg-web/src/ProductionIntakeFlow.tsx')
          flow = flow_path.read_text()
          old = "    const next = { ...draft, [key]: value } as ProductionIntakeDraft;"
          new = "    const next = { ...draft, [key]: value };"
          count = flow.count(old)
          assert count == 1, (old, count)
          flow_path.write_text(flow.replace(old, new, 1))

          api_test_path = Path('apps/markreg-web/src/api/production-intake.test.ts')
          api_text = api_test_path.read_text()
          api_replacements = [
              (
                  "    const post = vi.fn(() => Promise.resolve({ intake }));",
                  """    const post = vi.fn((...args: [string, unknown, Record<string, string>?]) => {
              expect(args).toHaveLength(3);
              return Promise.resolve({ intake });
            });"""
              ),
              (
                  "    const body = post.mock.calls[0]![1] as Record<string, unknown>;",
                  "    const body = post.mock.calls[0]![1];"
              ),
          ]
          for old, new in api_replacements:
              count = api_text.count(old)
              assert count == 1, (old, count)
              api_text = api_text.replace(old, new, 1)
          api_test_path.write_text(api_text)
          PY
          pnpm exec prettier --write \
            apps/markreg-web/src/ProductionIntakeFlow.tsx \
            apps/markreg-web/src/ProductionIntakeFlow.test.tsx \
            apps/markreg-web/src/api/production-intake.test.ts
      - name: Validate MarkReg Web lint typecheck test
        run: |
          pnpm --filter @markorbit/contracts build
          pnpm --filter @markorbit/ui build
          pnpm --filter @markorbit/markreg-web lint
          pnpm --filter @markorbit/markreg-web typecheck
          pnpm --filter @markorbit/markreg-web test
      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/markreg-web/src/ProductionIntakeFlow.tsx \
            apps/markreg-web/src/ProductionIntakeFlow.test.tsx \
            apps/markreg-web/src/api/production-intake.test.ts
          git commit -m 'test(markreg): satisfy #699 strict Web validation'
          git push origin HEAD:tmp/724-lint-fix-v2
