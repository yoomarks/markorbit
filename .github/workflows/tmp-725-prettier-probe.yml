name: tmp 725 prettier probe

on:
  push:
    branches:
      - tmp/725-prettier-probe-20260904

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/gateway/tests/filing-governance-http.test.ts
      - name: Commit formatted probe
        run: |
          if git diff --quiet -- apps/gateway/tests/filing-governance-http.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/gateway/tests/filing-governance-http.test.ts
          git commit -m "chore: format #725 probe"
          git push origin HEAD:tmp/725-prettier-probe-20260904
