name: tmp 729 production durable entry

on:
  push:
    branches:
      - tmp/729-production-durable-entry-writer

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/729-production-durable-entry-writer
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply TASK 729 patch
        run: node scripts/tmp-729-durable-production-entry.mjs
      - name: Prettier exact files
        run: pnpm exec prettier --write apps/markreg-web/src/App.tsx apps/markreg-web/tests/App.test.tsx
      - name: Build workspace dependencies
        run: pnpm -w build
      - name: MarkReg Web typecheck
        run: pnpm --filter @markorbit/markreg-web typecheck
      - name: MarkReg Web lint
        run: pnpm --filter @markorbit/markreg-web lint
      - name: Targeted completed-review entry regression
        run: pnpm --filter @markorbit/markreg-web exec vitest run tests/App.test.tsx
      - name: MarkReg Web full tests
        run: pnpm --filter @markorbit/markreg-web test
      - name: MarkReg Web build
        run: pnpm --filter @markorbit/markreg-web build
      - name: Commit writer output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/markreg-web/src/App.tsx apps/markreg-web/tests/App.test.tsx
          git commit -m "tmp: wire completed review to durable preparation consumer"
          git push
