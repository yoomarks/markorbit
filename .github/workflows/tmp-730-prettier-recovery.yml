name: tmp-730-prettier-recovery
on:
  push:
    branches:
      - tmp/730-prettier-recovery
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/730-prettier-recovery
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact recovery files
        run: |
          pnpm exec prettier --write \
            apps/markreg-web/src/routing/GovernedRouteEntry.tsx \
            apps/markreg-web/src/routing/GovernedRouteEntry.test.tsx
      - name: Commit exact Prettier output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/markreg-web/src/routing/GovernedRouteEntry.tsx \
            apps/markreg-web/src/routing/GovernedRouteEntry.test.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'style(markreg): format preparation recovery'
          git push origin HEAD:tmp/730-prettier-recovery
