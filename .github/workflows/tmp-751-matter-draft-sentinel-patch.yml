name: tmp-751-matter-draft-sentinel-patch

on:
  push:
    branches:
      - lite/695-authenticated-execution-release
    paths:
      - .github/workflows/tmp-751-matter-draft-sentinel-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lite/695-authenticated-execution-release
      - name: Restore Matter Draft readiness contract in real-runtime golden path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/milestone-001-real-runtime.spec.ts')
          text = path.read_text()
          old = "      await page.getByRole('button', { name: 'Prepare Matter Draft' }).click();\n      await expect(page.getByText('BLOCKED', { exact: true }).first()).toBeVisible();\n      const matterId = await id(page, /Matter Draft ID\\s+(matter-draft_[\\w-]+)/);"
          new = "      await page.getByRole('button', { name: 'Prepare Matter Draft' }).click();\n      await expect(\n        page.getByText('APPLICANT_IDENTITY_PRESENT', { exact: true }).first()\n      ).toBeVisible();\n      const matterId = await id(page, /Matter Draft ID\\s+(matter-draft_[\\w-]+)/);"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one Matter Draft stale BLOCKED assertion, found {count}')
          path.write_text(text.replace(old, new))
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Canonical format targeted harness
        run: pnpm exec prettier --write tests/e2e/milestone-001-real-runtime.spec.ts
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/milestone-001-real-runtime.spec.ts
          git diff --cached --check
          git commit -m "test(e2e): restore Matter Draft readiness sentinel"
          git push origin HEAD:lite/695-authenticated-execution-release
