name: tmp-751-prettier-auth-config

on:
  push:
    branches:
      - lite/695-authenticated-execution-release
    paths:
      - .github/workflows/tmp-751-prettier-auth-config.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lite/695-authenticated-execution-release
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write playwright.real-runtime.config.ts
      - name: Commit canonical formatting
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add playwright.real-runtime.config.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style(e2e): format authenticated milestone config"
          git push origin HEAD:lite/695-authenticated-execution-release
