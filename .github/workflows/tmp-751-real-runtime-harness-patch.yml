name: tmp-751-real-runtime-harness-patch

on:
  push:
    branches:
      - lite/695-authenticated-execution-release
    paths:
      - .github/workflows/tmp-751-real-runtime-harness-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lite/695-authenticated-execution-release
      - name: Patch stale real-runtime harness labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/milestone-001-real-runtime.spec.ts')
          text = path.read_text()
          old_open = "      await page.getByRole('button', { name: 'Open release' }).click();\n"
          old_assign = "      await page.getByRole('button', { name: 'Assign internal executor' }).click();"
          if text.count(old_open) != 1:
              raise SystemExit(f'expected exactly one stale Open release line, found {text.count(old_open)}')
          if text.count(old_assign) != 1:
              raise SystemExit(f'expected exactly one stale assignment line, found {text.count(old_assign)}')
          text = text.replace(old_open, '')
          text = text.replace(old_assign, "      await page.getByRole('button', { name: 'Assign to me' }).click();")
          path.write_text(text)
          PY
      - name: Commit harness patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/milestone-001-real-runtime.spec.ts
          git diff --cached --check
          git commit -m "test(e2e): align real-runtime execution release flow"
          git push origin HEAD:lite/695-authenticated-execution-release
