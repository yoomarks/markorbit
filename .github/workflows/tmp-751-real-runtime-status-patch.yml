name: tmp-751-real-runtime-status-patch

on:
  push:
    branches:
      - lite/695-authenticated-execution-release
    paths:
      - .github/workflows/tmp-751-real-runtime-status-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lite/695-authenticated-execution-release
      - name: Patch stale real-runtime pre-evaluation assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/milestone-001-real-runtime.spec.ts')
          text = path.read_text()
          old = "      await expect(page.getByText(/UNKNOWN/).first()).toBeVisible();"
          new = "      await expect(page.getByText('BLOCKED', { exact: true }).first()).toBeVisible();"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale UNKNOWN assertion, found {count}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit harness patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/milestone-001-real-runtime.spec.ts
          git diff --cached --check
          git commit -m "test(e2e): assert durable blocked release state"
          git push origin HEAD:lite/695-authenticated-execution-release
