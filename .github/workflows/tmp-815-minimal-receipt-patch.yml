name: TMP 815 Minimal Receipt Patch
on:
  push:
    branches:
      - integration/815-durable-human-action-receipt
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/815-durable-human-action-receipt
      - run: python3 .github/tmp-815-minimal-receipt-patch.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/gateway/src/mgsn-http.ts apps/gateway/tests/mgsn-governed-network-http.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: consume Core governed action receipts in Gateway'
          git push origin HEAD:integration/815-durable-human-action-receipt
