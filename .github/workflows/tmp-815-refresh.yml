name: TMP 815 Refresh
on:
  push:
    branches:
      - integration/815-durable-human-action-receipt
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/815-durable-human-action-receipt
          fetch-depth: 0
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/tmp-815-refresh.yml
          git commit -m 'chore: refresh #815 onto current main'
          git push origin HEAD:integration/815-durable-human-action-receipt
