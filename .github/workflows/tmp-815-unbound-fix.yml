name: TMP 815 Unbound Fix
on:
  push:
    branches:
      - integration/815-durable-human-action-receipt
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/815-durable-human-action-receipt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: perl -0pi -e 's/  const materialize = authentication\.materializeGovernedHumanActionReceipt;\n  if \(!materialize\)\n/  if (!authentication.materializeGovernedHumanActionReceipt)\n/' apps/gateway/src/mgsn-http.ts
      - run: perl -0pi -e 's/receipt = await materialize\.call\(authentication, materialization, correlationId\);/receipt = await authentication.materializeGovernedHumanActionReceipt(materialization, correlationId);/' apps/gateway/src/mgsn-http.ts
      - run: pnpm exec prettier --write apps/gateway/src/mgsn-http.ts
      - run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/gateway/src/mgsn-http.ts
          git commit -m 'fix: call Core governed receipt client directly'
          git push origin HEAD:integration/815-durable-human-action-receipt
