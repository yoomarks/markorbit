name: TMP 836 Format
on:
  push:
    branches:
      - core/836-governed-human-action-receipt
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/836-governed-human-action-receipt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/core/src/governed-human-action-receipt.ts services/core/src/main.ts services/core/tests/governed-human-action-receipt-http.test.ts services/core/tests/governed-human-action-receipt-postgres.test.ts services/core/tests/governed-human-action-receipt.test.ts
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/core/src/governed-human-action-receipt.ts services/core/src/main.ts services/core/tests/governed-human-action-receipt-http.test.ts services/core/tests/governed-human-action-receipt-postgres.test.ts services/core/tests/governed-human-action-receipt.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(core): format governed human-action receipt'
          git push origin HEAD:core/836-governed-human-action-receipt
