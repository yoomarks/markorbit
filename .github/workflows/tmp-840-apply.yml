name: tmp-840-apply

on:
  push:
    branches:
      - integration/840-governed-action-framework

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply #840 migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          markreg = Path('apps/gateway/src/markreg-early-funnel-http.ts')
          s = markreg.read_text()
          auth_import = """import {
            type CoreAuthenticationClient,
            readSessionCookie,
            requireTrustedOrigin,
            validateCsrf
          } from './auth.js';
          """
          framework_import = "import { authorizeGovernedWorkspaceMutation } from './governed-action.js';\n"
          if framework_import not in s:
              normalized = """import {
            type CoreAuthenticationClient,
            readSessionCookie,
            requireTrustedOrigin,
            validateCsrf
          } from './auth.js';
          """
              # Source indentation is two spaces inside the import body, not Python indentation.
              normalized = normalized.replace('          ', '')
              if normalized not in s:
                  raise SystemExit('MarkReg auth import not found')
              s = s.replace(normalized, normalized + framework_import, 1)
          new_customer = """  const customerConfirmationRoute: JsonRoute = {
            method: 'POST',
            path: '/api/markreg/customer-confirmations',
            handle: async (request) => {
              const context = await authorizeGovernedWorkspaceMutation(
                request,
                {
                  authenticationClient: options.authenticationClient,
                  csrfSecret: options.csrfSecret,
                  allowedOrigins: options.allowedOrigins
                },
                {
                  permission: 'matter:create',
                  idempotency: 'REQUIRED',
                  idempotencyError: {
                    code: 'INVALID_REQUEST',
                    message: 'Idempotency-Key header is required.'
                  },
                  bodyIdempotency: 'MATCH_IF_PRESENT',
                  forbiddenBodyFields: topLevelAuthorityFields,
                  browserAuthorityError: {
                    code: 'ACTOR_SPOOF_REJECTED',
                    message: (field) =>
                      `${field} is trusted authority context and must not be supplied by the browser.`
                  },
                  bindTrustedWorkspaceField: 'workspaceId'
                }
              );
              const { body, principal } = context;
              const key = context.idempotencyKey!;
              const correlation = correlationId(request);
              const command = {
                workspaceId: principal.workspaceId,
                quoteId: body.quoteId,
                quoteVersion: body.quoteVersion,
                planId: body.planId,
                planVersion: body.planVersion,
                customerId: body.customerId,
                termsVersion: body.termsVersion,
                acknowledgements: body.acknowledgements,
                actor: trustedActor(principal, body),
                idempotencyKey: key
              };
              return forward(
                request,
                principal,
                '/v1/customer-confirmations',
                command,
                key,
                correlation
              );
            }
          };

          const matterDraftRoute"""
          new_customer = new_customer.replace('          ', '')
          s, n = re.subn(
              r"  const customerConfirmationRoute: JsonRoute = \{.*?\n  \};\n\n  const matterDraftRoute",
              new_customer,
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('Customer Confirmation route not found')
          markreg.write_text(s)

          mgsn = Path('apps/gateway/src/mgsn-http.ts')
          s = mgsn.read_text()
          s = s.replace("import { createHash } from 'node:crypto';\n", '', 1)
          old_import = """import {
            GovernedHumanActionReceiptClientError,
            readSessionCookie,
            requireTrustedOrigin,
            validateCsrf,
            type CoreAuthenticationClient,
            type GovernedHumanActionReceiptMaterializationV1
          } from './auth.js';
          """.replace('          ', '')
          new_import = """import {
            readSessionCookie,
            requireTrustedOrigin,
            validateCsrf,
            type CoreAuthenticationClient
          } from './auth.js';
          import { authorizeGovernedWorkspaceMutation } from './governed-action.js';
          """.replace('          ', '')
          if old_import not in s:
              raise SystemExit('MGSN auth import not found')
          s = s.replace(old_import, new_import, 1)
          patterns = [
              (r"\nfunction mapGovernedReceipt\(error: unknown\): never \{.*?\n\}\n", 'map receipt'),
              (r"\nfunction requireGovernedPermission\(.*?(?=\nfunction requireNetworkParticipationPermission)", 'governed helpers'),
              (r"\nfunction forbidNetworkParticipationAuthorityPayload\(.*?(?=\nfunction downstreamPath)", 'network helpers'),
              (r"\n  const resolveGovernedPrincipal = async \(request: JsonRequest\) => \{.*?(?=\n  const forward = async)", 'governed principal'),
          ]
          for pattern, label in patterns:
              s, n = re.subn(pattern, '\n', s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'MGSN {label} block not found')

          new_governed = """  const handleGoverned = async (request: JsonRequest, route: GovernedRouteDefinition) => {
            try {
              const context = await authorizeGovernedWorkspaceMutation(
                request,
                {
                  authenticationClient: authentication(),
                  csrfSecret: options.csrfSecret,
                  allowedOrigins: options.allowedOrigins
                },
                {
                  permission: route.permission,
                  idempotency: route.idempotency ? 'REQUIRED' : 'OPTIONAL',
                  ...(route.idempotency
                    ? {
                        idempotencyError: {
                          code: 'IDEMPOTENCY_KEY_REQUIRED',
                          message: 'Idempotency-Key is required for governed-network mutations.'
                        }
                      }
                    : {}),
                  forbiddenHeaders: [GOVERNED_HUMAN_ACTION_HEADER_NAME],
                  browserAuthorityError: {
                    code: 'BROWSER_GOVERNED_AUTHORITY_FORBIDDEN',
                    message: () => 'Browser-supplied governed-network authority is not accepted.'
                  },
                  workspaceContextError: {
                    code: 'INVALID_WORKSPACE_CONTEXT',
                    message: 'Trusted Workspace header is required for governed-network operations.'
                  },
                  ...(route.humanAction ? { humanAction: route.humanAction } : {})
                }
              );
              return forward(
                request,
                context.principal,
                false,
                undefined,
                context.humanActionEnvelope
              );
            } catch (error) {
              return mapAuthentication(error);
            }
          };
          """.replace('          ', '')
          s, n = re.subn(
              r"  const handleGoverned = async \(request: JsonRequest, route: GovernedRouteDefinition\) => \{.*?\n  \};",
              new_governed.rstrip(),
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('MGSN handleGoverned not found')

          new_network = """  const handleNetworkParticipation = async (request: JsonRequest) => {
            const mutation = request.method !== 'GET';
            try {
              if (mutation) {
                const context = await authorizeGovernedWorkspaceMutation(
                  request,
                  {
                    authenticationClient: authentication(),
                    csrfSecret: options.csrfSecret,
                    allowedOrigins: options.allowedOrigins
                  },
                  {
                    permission: 'workspace:manage',
                    workspaceHeaderName: PROVIDER_WORKSPACE_HEADER_NAME,
                    workspaceContextError: {
                      code: 'PROVIDER_WORKSPACE_CONTEXT_REQUIRED',
                      message: 'Provider Workspace context is required.'
                    },
                    idempotency: 'REQUIRED',
                    idempotencyError: {
                      code: 'IDEMPOTENCY_KEY_REQUIRED',
                      message: 'Idempotency-Key is required for Network Participation mutations.'
                    },
                    forbiddenBodyFields: [
                      'workspaceId',
                      'actorId',
                      'providerWorkspaceId',
                      'providerId',
                      'principal',
                      'trustedActorId'
                    ],
                    browserAuthorityError: {
                      code: 'NETWORK_PARTICIPATION_AUTHORITY_PAYLOAD_FORBIDDEN',
                      message: () =>
                        'Network Participation identity and authority come only from the authenticated Provider Workspace.'
                    }
                  }
                );
                return forward(request, context.principal, false, 'manage');
              }
              const principal = await resolvePrincipal(request, true);
              const ownerAuthority = requireNetworkParticipationPermission(principal, false);
              return forward(request, principal, false, ownerAuthority);
            } catch (error) {
              return mapAuthentication(error);
            }
          };
          """.replace('          ', '')
          s, n = re.subn(
              r"  const handleNetworkParticipation = async \(request: JsonRequest\) => \{.*?\n  \};",
              new_network.rstrip(),
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('MGSN handleNetworkParticipation not found')
          mgsn.write_text(s)

          index = Path('apps/gateway/src/index.ts')
          s = index.read_text()
          if "export * from './governed-action.js';\n" not in s:
              s = s.replace(
                  "export * from './auth.js';\n",
                  "export * from './auth.js';\nexport * from './governed-action.js';\n",
                  1,
              )
          index.write_text(s)

          test = Path('apps/gateway/tests/governed-action.test.ts')
          s = test.read_text()
          old = """    const authentication = client();
            const result = await authorizeGovernedWorkspaceMutation(
              request(),
              options(authentication),
              standardPolicy
            );

            expect(result.principal).toEqual(principal);
            expect(result.idempotencyKey).toBe('key-840');
            expect(result.body).toMatchObject({ value: 'reviewed', workspaceId });
            expect(authentication.resolveWorkspace).toHaveBeenCalledWith(
          """.replace('          ', '')
          new = """    const resolveWorkspace = vi.fn(() => Promise.resolve(principal));
            const authentication = client({ resolveWorkspace });
            const result = await authorizeGovernedWorkspaceMutation(
              request(),
              options(authentication),
              standardPolicy
            );

            expect(result.principal).toEqual(principal);
            expect(result.idempotencyKey).toBe('key-840');
            expect(result.body).toMatchObject({ value: 'reviewed', workspaceId });
            expect(resolveWorkspace).toHaveBeenCalledWith(
          """.replace('          ', '')
          if old not in s:
              raise SystemExit('Test lint block not found')
          test.write_text(s.replace(old, new, 1))
          PY
      - name: Format Gateway scope
        run: pnpm exec prettier --write apps/gateway/src/governed-action.ts apps/gateway/src/mgsn-http.ts apps/gateway/src/markreg-early-funnel-http.ts apps/gateway/src/index.ts apps/gateway/tests/governed-action.test.ts
      - name: Gateway lint
        run: pnpm --filter @markorbit/gateway lint
      - name: Gateway typecheck
        run: pnpm --filter @markorbit/gateway typecheck
      - name: Gateway tests
        run: pnpm --filter @markorbit/gateway test
      - name: Commit clean #840 implementation
        shell: bash
        run: |
          rm .github/workflows/tmp-840-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: establish governed Gateway action framework (#840)'
          git push
