name: tmp-840-apply

on:
  push:
    branches:
      - integration/840-governed-action-framework

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply #840 migrations
        shell: bash
        run: |
          git show c31de81413049a94e2f5921b628949fe73b8e765:.github/workflows/tmp-840-apply.yml > /tmp/tmp-840-source.yml
          awk '
            /^[[:space:]]+python - <<'"'"'PY'"'"'$/ { capture=1; next }
            /^[[:space:]]+PY$/ && capture { exit }
            capture { sub(/^          /, ""); print }
          ' /tmp/tmp-840-source.yml > /tmp/apply-840.py
          python /tmp/apply-840.py
      - name: Format Gateway scope
        run: pnpm exec prettier --write apps/gateway/src/governed-action.ts apps/gateway/src/mgsn-http.ts apps/gateway/src/markreg-early-funnel-http.ts apps/gateway/src/index.ts apps/gateway/tests/governed-action.test.ts
      - name: Gateway lint
        run: pnpm --filter @markorbit/gateway lint
      - name: Gateway typecheck
        run: pnpm --filter @markorbit/gateway typecheck
      - name: Build Gateway dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/gateway...
      - name: Gateway full tests
        run: pnpm --filter @markorbit/gateway test
      - name: Commit clean #840 implementation
        shell: bash
        run: |
          rm .github/workflows/tmp-840-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: establish governed Gateway action framework (#840)'
          git push
