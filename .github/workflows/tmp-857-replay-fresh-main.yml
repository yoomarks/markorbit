name: tmp-857-replay-fresh-main

on:
  push:
    branches:
      - tmp/857-replay-fresh-main-20260906

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Replay validated clean Trust commit onto latest main
        shell: bash
        run: |
          git config user.name 'yoomarks'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main integration/mgsn-trust-discovery-contract-845-main
          test "$(git rev-parse origin/main)" = "63dd3a1fff72517b67a235fd60bf917f6486b161"
          test "$(git rev-parse origin/integration/mgsn-trust-discovery-contract-845-main)" = "5ec0a1412e31a240e2162feb5270c9c575e27296"
          git checkout -B replay-857 origin/main
          git cherry-pick 5ec0a1412e31a240e2162feb5270c9c575e27296
      - run: pnpm install --frozen-lockfile
      - name: Format and verify bounded shared-contract diff
        shell: bash
        run: |
          git restore --worktree pnpm-lock.yaml
          pnpm exec prettier --write \
            packages/contracts/package.json \
            packages/contracts/src/provider-discovery-trust.ts \
            packages/contracts/tests/provider-discovery-trust.test.ts
          git diff --name-only origin/main...HEAD | tee /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt)" -eq 3
          grep -qx 'packages/contracts/package.json' /tmp/changed.txt
          grep -qx 'packages/contracts/src/provider-discovery-trust.ts' /tmp/changed.txt
          grep -qx 'packages/contracts/tests/provider-discovery-trust.test.ts' /tmp/changed.txt
          git diff --check origin/main...HEAD
      - name: Contracts typecheck
        run: pnpm --filter @markorbit/contracts typecheck
      - name: Contracts tests
        run: pnpm --filter @markorbit/contracts test
      - name: Contracts build
        run: pnpm --filter @markorbit/contracts build
      - name: Push refreshed clean branch
        shell: bash
        run: |
          git push --force-with-lease=refs/heads/integration/mgsn-trust-discovery-contract-845-main:5ec0a1412e31a240e2162feb5270c9c575e27296 \
            origin HEAD:refs/heads/integration/mgsn-trust-discovery-contract-845-main
