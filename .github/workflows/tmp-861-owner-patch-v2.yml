name: tmp-861-owner-patch-v2

on:
  push:
    branches:
      - tmp/861-owner-patch-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/861-owner-patch-20260906
          fetch-depth: 0
      - name: Extract bounded patch script
        shell: bash
        run: |
          awk '/^[[:space:]]*python <<'"'"'PY'"'"'/{capture=1;next} /^[[:space:]]*PY$/{capture=0} capture{sub(/^[[:space:]]{10}/,""); print}' .github/workflows/tmp-861-owner-patch.yml > /tmp/owner-patch.py
          test -s /tmp/owner-patch.py
      - name: Check out stacked target
        run: |
          git checkout -B mgsn/provider-work-action-lineage-861 origin/mgsn/provider-work-action-lineage-861
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded owner patch
        run: python /tmp/owner-patch.py
      - name: Format owner files
        run: >-
          pnpm exec prettier --write
          services/mgsn/src/provider-work-read-model.ts
          services/mgsn/src/provider-work-read-model-postgres.ts
          services/mgsn/src/provider-work-incoming-authority.ts
          services/mgsn/tests/provider-work-read-model.test.ts
          services/mgsn/tests/provider-work-read-model-postgres.test.ts
      - name: Build shared contracts
        run: pnpm --filter @markorbit/contracts build
      - name: Focused verification
        run: >-
          pnpm --filter @markorbit/mgsn-service exec vitest run
          tests/provider-work-read-model.test.ts
          tests/provider-work-incoming-authority.test.ts
      - name: Typecheck MGSN
        run: pnpm --filter @markorbit/mgsn-service typecheck
      - name: Commit owner patch
        shell: bash
        run: |
          git config user.name 'yoomarks'
          git config user.email 'actions@users.noreply.github.com'
          git add services/mgsn
          git diff --cached --check
          git commit -m 'feat(mgsn): project Provider Work action lineage'
          git push origin HEAD:mgsn/provider-work-action-lineage-861
