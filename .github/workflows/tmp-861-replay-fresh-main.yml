name: tmp-861-replay-fresh-main

on:
  push:
    branches:
      - tmp/861-replay-fresh-main-20260906

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Replay validated owner commit onto latest main
        shell: bash
        run: |
          git config user.name 'yoomarks'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main mgsn/provider-work-action-lineage-861-main
          test "$(git rev-parse origin/main)" = "2c22f73c3c498691428e30fbee312efa73c5b2a0"
          test "$(git rev-parse origin/mgsn/provider-work-action-lineage-861-main)" = "022f6b28bc9ed49422561c72492d08937dc5075a"
          git checkout -B replay-861 origin/main
          git cherry-pick 022f6b28bc9ed49422561c72492d08937dc5075a
      - run: pnpm install --frozen-lockfile
      - name: Verify bounded owner diff
        shell: bash
        run: |
          git diff --name-only origin/main...HEAD | tee /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt)" -eq 5
          grep -qx 'services/mgsn/src/provider-work-incoming-authority.ts' /tmp/changed.txt
          grep -qx 'services/mgsn/src/provider-work-read-model-postgres.ts' /tmp/changed.txt
          grep -qx 'services/mgsn/src/provider-work-read-model.ts' /tmp/changed.txt
          grep -qx 'services/mgsn/tests/provider-work-read-model-postgres.test.ts' /tmp/changed.txt
          grep -qx 'services/mgsn/tests/provider-work-read-model.test.ts' /tmp/changed.txt
          git diff --check origin/main...HEAD
      - name: Build shared contracts
        run: pnpm --filter @markorbit/contracts build
      - name: Focused MGSN verification
        run: >-
          pnpm --filter @markorbit/mgsn-service exec vitest run
          tests/provider-work-read-model.test.ts
          tests/provider-work-incoming-authority.test.ts
      - name: Typecheck MGSN
        run: pnpm --filter @markorbit/mgsn-service typecheck
      - name: Push refreshed owner branch
        shell: bash
        run: |
          git push --force-with-lease=refs/heads/mgsn/provider-work-action-lineage-861-main:022f6b28bc9ed49422561c72492d08937dc5075a \
            origin HEAD:refs/heads/mgsn/provider-work-action-lineage-861-main
