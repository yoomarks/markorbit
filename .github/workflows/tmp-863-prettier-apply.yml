name: tmp-863-prettier-apply

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'operations/850-cognitive-blocker-paths'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: operations/850-cognitive-blocker-paths
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact files
        run: >-
          pnpm exec prettier --write
          apps/operations-console/src/cognitive-dependency-paths.test.ts
          apps/operations-console/src/cognitive-dependency-paths.ts
          apps/operations-console/src/cognitive-dependency-workspace.tsx
      - name: Commit exact formatted bytes
        shell: bash
        run: |
          if git diff --quiet -- \
            apps/operations-console/src/cognitive-dependency-paths.test.ts \
            apps/operations-console/src/cognitive-dependency-paths.ts \
            apps/operations-console/src/cognitive-dependency-workspace.tsx
          then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/operations-console/src/cognitive-dependency-paths.test.ts \
            apps/operations-console/src/cognitive-dependency-paths.ts \
            apps/operations-console/src/cognitive-dependency-workspace.tsx
          git commit -m "[OPERATIONS-P0] Apply exact Prettier 3.9.6 output"
          git push origin HEAD:operations/850-cognitive-blocker-paths
