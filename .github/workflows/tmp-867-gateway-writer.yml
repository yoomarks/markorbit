name: tmp-867-gateway-writer
on:
  push:
    branches:
      - tmp/867-gateway-writer-20260906
permissions:
  contents: write
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/867-workspace-action-gateway
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: tmp/867-gateway-writer-20260906
          path: .tmp-writer
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python .tmp-writer/.github/scripts/tmp-867-gateway-writer.py
