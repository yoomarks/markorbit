name: tmp-867-workspace-action-gateway-writer
on:
  push:
    branches:
      - tmp/867-workspace-action-gateway-writer
permissions:
  contents: write
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/867-workspace-action-gateway-writer
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write and validate Gateway diff
        run: |
          python .github/tmp/867-writer.py
          pnpm exec prettier --write apps/gateway/src/markreg-early-funnel-http.ts apps/gateway/tests/workspace-action-gateway.test.ts docs/architecture/GATEWAY_ROUTE_INVENTORY_MARKREG_EARLY_FUNNEL.json scripts/validate-gateway-inventory.mjs
          node scripts/validate-gateway-inventory.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/gateway/src/markreg-early-funnel-http.ts apps/gateway/tests/workspace-action-gateway.test.ts docs/architecture/GATEWAY_ROUTE_INVENTORY_MARKREG_EARLY_FUNNEL.json scripts/validate-gateway-inventory.mjs
          git commit -m "[INTEGRATION-P0] Add Workspace Action Gateway read [skip ci]"
          git push origin HEAD:tmp/867-workspace-action-gateway-writer
