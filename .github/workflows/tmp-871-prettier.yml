name: tmp-871-prettier

on:
  push:
    branches:
      - operations/851-attention-explain-govern

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: operations/851-attention-explain-govern
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/operations-console/src/cognitive-attention.ts
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- apps/operations-console/src/cognitive-attention.ts; then
            echo 'No formatter diff.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/operations-console/src/cognitive-attention.ts
          git commit -m '[OPERATIONS-P1] Format cognitive attention model'
          git push origin HEAD:operations/851-attention-explain-govern
