name: tmp-880-fresh-main-replay

on:
  push:
    branches: [tmp/880-provider-browser-register-20260906]

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replay verified Provider visual infrastructure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name yoomarks
          git config user.email actions@users.noreply.github.com
          git fetch origin main integration/provider-web-storybook-browser-880
          SOURCE=origin/integration/provider-web-storybook-browser-880
          BASE=$(git merge-base origin/main "$SOURCE")
          cat > /tmp/paths <<'EOF'
          .github/workflows/ci.yml
          apps/provider-web/src/ProviderWorkspaceShell.stories.js
          package.json
          packages/ui/.storybook-provider/main.ts
          packages/ui/package.json
          packages/ui/tsconfig.json
          playwright.provider-storybook.config.ts
          playwright.provider.config.ts
          pnpm-lock.yaml
          scripts/ci-detect-scope.mjs
          scripts/ci-detect-scope.test.mjs
          scripts/validate-provider-storybook-index.mjs
          tests/e2e/applications.ts
          tests/e2e/provider-storybook.spec.ts
          tests/e2e/provider.spec.ts
          EOF
          git diff --name-only "$BASE"..origin/main | sort -u > /tmp/main-changed
          if comm -12 <(sort /tmp/paths) /tmp/main-changed | grep .; then
            echo 'Fresh main changed a #880 path; refusing blind replay.' >&2
            exit 1
          fi
          git checkout -B clean-880 origin/main
          while IFS= read -r p; do git checkout "$SOURCE" -- "$p"; done < /tmp/paths
          git diff --cached --name-only | sort -u > /tmp/replayed
          diff -u <(sort /tmp/paths) /tmp/replayed
          git diff --cached --check
          git commit -m 'chore(ci): register Provider Web visual surfaces'
          git push --force origin HEAD:refs/heads/integration/provider-web-storybook-browser-880
