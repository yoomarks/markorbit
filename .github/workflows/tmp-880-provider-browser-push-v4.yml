name: tmp-880-provider-browser-push-v4

on:
  push:
    branches:
      - tmp/880-provider-browser-register-20260906

permissions:
  contents: write

jobs:
  push-validated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve validated patch script
        run: cp scripts/tmp-880-provider-browser-register.py /tmp/provider-browser-patch.py
      - name: Apply and push non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name yoomarks
          git config user.email actions@users.noreply.github.com
          git fetch origin integration/provider-web-storybook-browser-880
          git checkout -B target-880 origin/integration/provider-web-storybook-browser-880
          python /tmp/provider-browser-patch.py
          git restore --worktree .github/workflows/ci.yml
          git diff --check
          git add scripts/ci-detect-scope.mjs scripts/ci-detect-scope.test.mjs tests/e2e/applications.ts playwright.provider.config.ts tests/e2e/provider.spec.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m 'test(provider-web): register browser acceptance lane'
          git push origin HEAD:refs/heads/integration/provider-web-storybook-browser-880
