name: tmp-883-prettier-exact

on:
  push:
    branches:
      - tmp/883-prettier-exact-20260906

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[tmp formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact files
        run: |
          pnpm exec prettier --write \
            packages/contracts/tests/commercial-admin-auth.test.ts \
            services/core/src/internal-operator-principal.ts \
            services/core/tests/internal-operator-principal.test.ts
      - name: Commit exact formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/contracts/tests/commercial-admin-auth.test.ts \
            services/core/src/internal-operator-principal.ts \
            services/core/tests/internal-operator-principal.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "[tmp formatted] exact Prettier output for #883"
            git push
          fi
