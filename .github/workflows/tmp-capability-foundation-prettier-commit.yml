name: Temporary Capability Foundation Prettier Commit

on:
  push:
    branches:
      - docs/capability-foundation-final

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/capability-foundation-final
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical formatting
        run: |
          pnpm exec prettier --write \
            docs/audits/CAPABILITY-FOUNDATION-AUDIT-2026-08-25.md \
            docs/planning/CAPABILITY-FOUNDATION-ROADMAP.md \
            docs/planning/CAPABILITY-FOUNDATION-TASKS.yaml
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- \
            docs/audits/CAPABILITY-FOUNDATION-AUDIT-2026-08-25.md \
            docs/planning/CAPABILITY-FOUNDATION-ROADMAP.md \
            docs/planning/CAPABILITY-FOUNDATION-TASKS.yaml; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/audits/CAPABILITY-FOUNDATION-AUDIT-2026-08-25.md \
            docs/planning/CAPABILITY-FOUNDATION-ROADMAP.md \
            docs/planning/CAPABILITY-FOUNDATION-TASKS.yaml
          git commit -m "Docs: apply canonical Capability planning formatting"
          git push origin HEAD:docs/capability-foundation-final
