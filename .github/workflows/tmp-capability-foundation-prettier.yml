name: Temporary Capability Foundation Prettier

on:
  push:
    branches:
      - docs/capability-foundation-final

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format planning files
        run: |
          pnpm exec prettier --write \
            docs/audits/CAPABILITY-FOUNDATION-AUDIT-2026-08-25.md \
            docs/planning/CAPABILITY-FOUNDATION-ROADMAP.md \
            docs/planning/CAPABILITY-FOUNDATION-TASKS.yaml
      - name: Package canonical files
        run: |
          mkdir -p /tmp/capability-prettier/docs/audits /tmp/capability-prettier/docs/planning
          cp docs/audits/CAPABILITY-FOUNDATION-AUDIT-2026-08-25.md /tmp/capability-prettier/docs/audits/
          cp docs/planning/CAPABILITY-FOUNDATION-ROADMAP.md /tmp/capability-prettier/docs/planning/
          cp docs/planning/CAPABILITY-FOUNDATION-TASKS.yaml /tmp/capability-prettier/docs/planning/
      - uses: actions/upload-artifact@v4
        with:
          name: capability-foundation-prettier
          path: /tmp/capability-prettier
          if-no-files-found: error
