name: Core 744 HTTP Prettier Probe

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-core-744-http-prettier-probe.yml'
      - 'services/core/src/brain-cognitive-read-http.ts'

permissions:
  contents: read

jobs:
  prettier-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write services/core/src/brain-cognitive-read-http.ts
          git diff -- services/core/src/brain-cognitive-read-http.ts
          exit 1
