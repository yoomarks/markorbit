name: Core 755 Prettier Probe

on:
  push:
    branches:
      - tmp/core-755-prettier-probe-20260904

permissions:
  contents: read

jobs:
  prettier-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write \
            services/capability-engine/src/capability-cognitive-read.ts \
            services/capability-engine/tests/capability-cognitive-read.test.ts
          git diff -- \
            services/capability-engine/src/capability-cognitive-read.ts \
            services/capability-engine/tests/capability-cognitive-read.test.ts
