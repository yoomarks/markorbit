name: TMP Core 767 Prettier Probe

on:
  pull_request:
    paths:
      - 'services/core/src/brain-cognitive-read-postgres.ts'
      - 'services/core/src/method-improvement-cognitive-read-postgres.ts'
      - 'services/core/tests/method-improvement-cognitive-read-postgres.test.ts'
      - '.github/workflows/tmp-core-767-prettier-probe.yml'

permissions:
  contents: write

jobs:
  prettier-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format with exact Prettier 3.9.6 and push probe result
        run: |
          pnpm exec prettier --version
          pnpm exec prettier --write \
            services/core/src/brain-cognitive-read-postgres.ts \
            services/core/src/method-improvement-cognitive-read-postgres.ts \
            services/core/tests/method-improvement-cognitive-read-postgres.test.ts
          git diff -- \
            services/core/src/brain-cognitive-read-postgres.ts \
            services/core/src/method-improvement-cognitive-read-postgres.ts \
            services/core/tests/method-improvement-cognitive-read-postgres.test.ts
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            services/core/src/brain-cognitive-read-postgres.ts \
            services/core/src/method-improvement-cognitive-read-postgres.ts \
            services/core/tests/method-improvement-cognitive-read-postgres.test.ts
          git commit -m 'tmp: apply exact Prettier for Core 767 probe'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
