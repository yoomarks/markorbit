name: TMP Core 767 Prettier Probe

on:
  pull_request:
    paths:
      - 'services/core/src/brain-cognitive-read-postgres.ts'
      - 'services/core/src/method-improvement-cognitive-read-postgres.ts'
      - 'services/core/tests/method-improvement-cognitive-read-postgres.test.ts'
      - '.github/workflows/tmp-core-767-prettier-probe.yml'

permissions:
  contents: read

jobs:
  prettier-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier 3.9.6 diff
        run: |
          pnpm exec prettier --version
          pnpm exec prettier --write \
            services/core/src/brain-cognitive-read-postgres.ts \
            services/core/src/method-improvement-cognitive-read-postgres.ts \
            services/core/tests/method-improvement-cognitive-read-postgres.test.ts
          git diff -- \
            services/core/src/brain-cognitive-read-postgres.ts \
            services/core/src/method-improvement-cognitive-read-postgres.ts \
            services/core/tests/method-improvement-cognitive-read-postgres.test.ts
