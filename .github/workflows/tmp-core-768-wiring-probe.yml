name: TMP Core 768 Wiring Probe

on:
  pull_request:
    paths:
      - 'services/core/**'
      - '.github/workflows/tmp-core-768-wiring-probe.yml'

permissions:
  contents: write

jobs:
  wiring-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format complete Core 768 candidate and push exact blobs
        run: |
          pnpm exec prettier --write \
            services/core/src/index.ts \
            services/core/src/main.ts \
            services/core/src/internal-operator-principal.ts \
            services/core/src/internal-operator-principal-http.ts \
            services/core/tests/internal-operator-principal.test.ts \
            services/core/tests/internal-operator-principal-http.test.ts
          git diff -- \
            services/core/src/index.ts \
            services/core/src/main.ts \
            services/core/src/internal-operator-principal.ts \
            services/core/src/internal-operator-principal-http.ts \
            services/core/tests/internal-operator-principal.test.ts \
            services/core/tests/internal-operator-principal-http.test.ts
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            services/core/src/index.ts \
            services/core/src/main.ts \
            services/core/src/internal-operator-principal.ts \
            services/core/src/internal-operator-principal-http.ts \
            services/core/tests/internal-operator-principal.test.ts \
            services/core/tests/internal-operator-principal-http.test.ts
          git commit -m 'tmp: format complete Core 768 candidate'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
