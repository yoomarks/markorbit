name: Temporary Format Capability Conformance 223

on:
  push:
    branches:
      - tmp/format-capability-conformance-223

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target
        run: pnpm exec prettier services/capability-engine/tests/capability-runtime-conformance-harness.ts --write
      - uses: actions/upload-artifact@v4
        with:
          name: pr-223-prettier-output
          path: services/capability-engine/tests/capability-runtime-conformance-harness.ts
          if-no-files-found: error
