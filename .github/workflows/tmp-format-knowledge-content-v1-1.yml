name: Temporary Knowledge Content Formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/knowledge-content-export-v1-1-receiver-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write \
            packages/contracts/src/knowledge-content-export.ts \
            packages/contracts/tests/knowledge-content-export-contract.test.ts
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/contracts/src/knowledge-content-export.ts \
            packages/contracts/tests/knowledge-content-export-contract.test.ts
          git commit -m "style: format knowledge content export v1.1"
          git push origin HEAD:${{ github.head_ref }}
