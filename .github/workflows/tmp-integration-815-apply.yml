name: Temporary Integration 815 Apply

on:
  push:
    branches:
      - tmp-integration-815-apply

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          ref: tmp-integration-815-apply
          path: helper
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: integration-mgsn-workplace-governed-815
          fetch-depth: 0
          path: target
      - name: Lock target base and apply patch
        working-directory: target
        run: |
          test "$(git rev-parse HEAD)" = "4af4881f5990ea14f3d1cebfe098c3a31c133766"
          python3 ../helper/.agents/integration-815-patch.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('services/core/src/auth.ts')
          text = path.read_text()
          old = """import type {\n  MembershipRepository,\n  Permission,\n  Principal,\n  Session,\n  SessionRepository,\n  UserRepository,\n  WorkspaceRepository\n} from '@markorbit/contracts';"""
          new = """import type {\n  AuthenticatedUserPrincipal,\n  MembershipRepository,\n  Permission,\n  Principal,\n  Session,\n  SessionRepository,\n  UserRepository,\n  WorkspacePrincipal,\n  WorkspaceRepository\n} from '@markorbit/contracts';"""
          if old not in text:
              raise SystemExit('core auth import marker missing')
          text = text.replace(old, new, 1)
          old = '  async resolveSession(rawToken: string) {'
          new = '  async resolveSession(rawToken: string): Promise<AuthenticatedUserPrincipal> {'
          if old not in text:
              raise SystemExit('resolveSession marker missing')
          text = text.replace(old, new, 1)
          old = '  async resolveWorkspacePrincipal(token: string, workspaceId: string) {'
          new = '  async resolveWorkspacePrincipal(token: string, workspaceId: string): Promise<WorkspacePrincipal> {'
          if old not in text:
              raise SystemExit('resolveWorkspacePrincipal marker missing')
          text = text.replace(old, new, 1)
          old = """      permissions: Object.freeze(permissions),\n      sessionCreatedAt: principal.sessionCreatedAt,\n      sessionExpiresAt: principal.sessionExpiresAt"""
          new = """      permissions: Object.freeze(permissions),\n      ...(principal.sessionCreatedAt ? { sessionCreatedAt: principal.sessionCreatedAt } : {}),\n      sessionExpiresAt: principal.sessionExpiresAt"""
          if old not in text:
              raise SystemExit('workspace principal optional timestamp marker missing')
          path.write_text(text.replace(old, new, 1))

          test = Path('apps/gateway/tests/mgsn-governed-network-http.test.ts')
          text = test.read_text()
          marker = """function decodeHumanAction(value: string | string[] | undefined) {\n  if (typeof value !== 'string') throw new Error('human action header missing');\n  return JSON.parse(Buffer.from(value, 'base64url').toString('utf8')) as Record<string, unknown>;\n}\n\nbeforeEach(async () => {"""
          replacement = """function decodeHumanAction(value: string | string[] | undefined) {\n  if (typeof value !== 'string') throw new Error('human action header missing');\n  return JSON.parse(Buffer.from(value, 'base64url').toString('utf8')) as Record<string, unknown>;\n}\n\nasync function responseCode(response: Response): Promise<string | undefined> {\n  const payload: unknown = await response.json();\n  if (!payload || typeof payload !== 'object' || Array.isArray(payload)) return undefined;\n  const code = (payload as Record<string, unknown>).code;\n  return typeof code === 'string' ? code : undefined;\n}\n\nbeforeEach(async () => {"""
          if marker not in text:
              raise SystemExit('test response helper insertion marker missing')
          text = text.replace(marker, replacement, 1)
          replacements = {
              "expect((await response.json()).code).toBe('PERMISSION_DENIED');": "expect(await responseCode(response)).toBe('PERMISSION_DENIED');",
              "expect((await response.json()).code).toBe('INVALID_WORKSPACE_CONTEXT');": "expect(await responseCode(response)).toBe('INVALID_WORKSPACE_CONTEXT');",
              "expect((await response.json()).code).toBe('BROWSER_GOVERNED_AUTHORITY_FORBIDDEN');": "expect(await responseCode(response)).toBe('BROWSER_GOVERNED_AUTHORITY_FORBIDDEN');",
              "expect((await response.json()).code).toBe('GOVERNED_HUMAN_AUTHORITY_UNAVAILABLE');": "expect(await responseCode(response)).toBe('GOVERNED_HUMAN_AUTHORITY_UNAVAILABLE');",
              "expect((await noIdempotency.json()).code).toBe('IDEMPOTENCY_KEY_REQUIRED');": "expect(await responseCode(noIdempotency)).toBe('IDEMPOTENCY_KEY_REQUIRED');",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'test response replacement marker missing: {old}')
              text = text.replace(old, new, 1)
          test.write_text(text)
          PY
          git diff --check
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: target
        run: pnpm install --frozen-lockfile
      - name: Format and validate focused closure
        working-directory: target
        run: |
          pnpm exec prettier --write packages/contracts/src/auth.ts services/core/src/auth.ts apps/gateway/src/mgsn-http.ts apps/gateway/tests/mgsn-governed-network-http.test.ts
          pnpm --filter @markorbit/contracts lint
          pnpm --filter @markorbit/contracts typecheck
          pnpm --filter @markorbit/contracts build
          pnpm --filter @markorbit/core-service lint
          pnpm --filter @markorbit/core-service typecheck
          pnpm --filter @markorbit/gateway lint
          pnpm --filter @markorbit/gateway typecheck
          pnpm --filter @markorbit/gateway exec vitest run tests/mgsn-governed-network-http.test.ts
          git diff --check
      - name: Commit exact checked patch
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/auth.ts services/core/src/auth.ts apps/gateway/src/mgsn-http.ts apps/gateway/tests/mgsn-governed-network-http.test.ts
          git diff --cached --check
          git commit -m "feat(gateway): wire governed Workplace MGSN progression"
          git push origin HEAD:integration-mgsn-workplace-governed-815
