name: tmp-k-case-002-wp1-preflight
on:
  push:
    branches:
      - k-case-002-markreg-producer-binding-v2
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch producer binding to current Knowledge contract
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('services/markreg/src/knowledge-case-promotion.ts')
          s = p.read_text()
          s = s.replace("  AuthenticationError,\n  parseInternalWorkspacePrincipal,", "  AuthenticationError,\n  encodeInternalWorkspacePrincipal,\n  parseInternalWorkspacePrincipal,")
          s = s.replace("export interface KnowledgeCaseIntakeClient {\n  accept(candidate: KnowledgeCaseCandidateV1): Promise<KnowledgeCaseIntakeReceiptV1>;\n}", "export interface KnowledgeCaseIntakeClient {\n  accept(\n    candidate: KnowledgeCaseCandidateV1,\n    principal: WorkspacePrincipal\n  ): Promise<KnowledgeCaseIntakeReceiptV1>;\n}")
          start = s.index('function isCandidate(')
          end = s.index('\nfunction isIntake(', start)
          s = s[:start] + s[end+1:]
          s = s.replace("  const item = value as Record<string, unknown>;\n  return isCandidate(item.candidate) && isIntake(item.intake);", "  const item = value as Record<string, unknown>;\n  return (\n    item.candidate !== null &&\n    typeof item.candidate === 'object' &&\n    !Array.isArray(item.candidate) &&\n    isIntake(item.intake)\n  );")
          class_start = s.index('export class HttpKnowledgeCaseIntakeClient')
          class_end = s.index('\nexport class InMemoryKnowledgeCasePromotionRepository', class_start)
          new_class = '''export class HttpKnowledgeCaseIntakeClient implements KnowledgeCaseIntakeClient {
  private readonly baseUrl: string;
  constructor(
    baseUrl: string,
    private readonly internalServiceSecret: string,
    private readonly fetchImpl: typeof fetch = fetch
  ) {
    let parsed: URL;
    try {
      parsed = new URL(baseUrl.trim());
    } catch {
      throw new TypeError('Knowledge base URL must be a complete HTTP(S) URL.');
    }
    if (
      !['http:', 'https:'].includes(parsed.protocol) ||
      parsed.username ||
      parsed.password ||
      parsed.search ||
      parsed.hash
    )
      throw new TypeError(
        'Knowledge base URL must use HTTP(S) without credentials, query, or fragment.'
      );
    if (Buffer.byteLength(internalServiceSecret, 'utf8') < 32)
      throw new TypeError('Knowledge internal service secret must be at least 32 bytes.');
    parsed.pathname = parsed.pathname.replace(/\\/+$/u, '') || '/';
    this.baseUrl = parsed.toString().replace(/\\/$/u, '');
  }

  async accept(
    candidate: KnowledgeCaseCandidateV1,
    principal: WorkspacePrincipal
  ): Promise<KnowledgeCaseIntakeReceiptV1> {
    const principalHeader = encodeInternalWorkspacePrincipal(principal);
    const commonHeaders = {
      accept: 'application/json',
      'x-markorbit-internal-authorization': this.internalServiceSecret,
      'x-markorbit-principal': principalHeader,
      'x-markorbit-workspace-id': principal.workspaceId
    };
    let response: Response;
    try {
      response = await this.fetchImpl(`${this.baseUrl}/api/internal/case-candidates`, {
        method: 'POST',
        headers: { ...commonHeaders, 'content-type': 'application/json' },
        body: JSON.stringify(candidate)
      });
    } catch (cause) {
      throw new Error('Knowledge Case intake delivery is uncertain.', {
        cause: cause instanceof Error ? cause : undefined
      });
    }
    if (response.status !== 202)
      throw new Error(`Knowledge Case intake returned unexpected HTTP ${response.status}.`);
    let body: unknown;
    try {
      body = await response.json();
    } catch (cause) {
      throw new Error('Knowledge Case intake returned invalid JSON.', {
        cause: cause instanceof Error ? cause : undefined
      });
    }
    if (!isKnowledgeCaseIntakeReceiptV1(body))
      throw new Error('Knowledge Case intake returned an invalid receipt.');
    if (canonicalKnowledgeCaseJson(body.candidate) !== canonicalKnowledgeCaseJson(candidate))
      throw new Error('Knowledge Case intake receipt does not match the promoted candidate.');
    const expectedSourceIdentity = knowledgeCaseSourceIdentitySha256({
      workspaceId: candidate.accessScope.sourceWorkspaceId,
      formalMatterId: candidate.sourceMatterId,
      formalMatterVersion: candidate.sourceMatterVersion,
      snapshotSha256: candidate.sourceSnapshotSha256
    });
    if (
      body.intake.candidateId !== candidate.candidateId ||
      body.intake.sourceIdentitySha256 !== expectedSourceIdentity
    )
      throw new Error('Knowledge Case intake receipt source identity does not match the candidate.');

    let collectionResponse: Response;
    try {
      collectionResponse = await this.fetchImpl(
        `${this.baseUrl}/api/internal/case-candidates/${encodeURIComponent(candidate.candidateId)}/collect`,
        { method: 'POST', headers: commonHeaders }
      );
    } catch (cause) {
      throw new Error('Knowledge Case evidence collection delivery is uncertain.', {
        cause: cause instanceof Error ? cause : undefined
      });
    }
    if (collectionResponse.status !== 200)
      throw new Error(
        `Knowledge Case evidence collection returned unexpected HTTP ${collectionResponse.status}.`
      );
    let collectionBody: unknown;
    try {
      collectionBody = await collectionResponse.json();
    } catch (cause) {
      throw new Error('Knowledge Case evidence collection returned invalid JSON.', {
        cause: cause instanceof Error ? cause : undefined
      });
    }
    if (
      !collectionBody ||
      typeof collectionBody !== 'object' ||
      Array.isArray(collectionBody) ||
      (collectionBody as Record<string, unknown>).candidateId !== candidate.candidateId ||
      !(collectionBody as Record<string, unknown>).collection ||
      typeof (collectionBody as Record<string, unknown>).collection !== 'object'
    )
      throw new Error('Knowledge Case evidence collection returned an invalid response.');
    return clone(body);
  }
}
'''
          s = s[:class_start] + new_class + s[class_end:]
          s = s.replace('receipt = await this.intake.accept(candidate);', 'receipt = await this.intake.accept(candidate, principal);')
          p.write_text(s)

          p = Path('services/markreg/src/main.ts')
          s = p.read_text()
          anchor = "import { createMarkRegFormalOpportunityRoutes,\n  HttpQualifiedOpportunityAuthority\n} from './formal-opportunity-http.js';\n"
          addition = anchor + "import { PostgresKnowledgeCasePromotionRepository } from './knowledge-case-promotion-postgres.js';\nimport {\n  createKnowledgeCasePromotionRoutes,\n  HttpKnowledgeCaseIntakeClient\n} from './knowledge-case-promotion.js';\n"
          if anchor not in s:
            raise SystemExit('main import anchor not found')
          s = s.replace(anchor, addition)
          anchor2 = "  const formalOpportunityRoutes = createMarkRegFormalOpportunityRoutes({\n    internalServiceSecret,\n    store: formalOpportunityStore\n  });\n"
          addition2 = anchor2 + "  const knowledgeCaseRoutes = (() => {\n    if (process.env.MO_KNOWLEDGE_CASE_PROMOTION_ENABLED !== '1') return [];\n    const knowledgeUrl = process.env.KNOWLEDGE_URL;\n    if (!knowledgeUrl)\n      throw new Error(\n        'KNOWLEDGE_URL is required when MO_KNOWLEDGE_CASE_PROMOTION_ENABLED=1.'\n      );\n    return createKnowledgeCasePromotionRoutes({\n      internalServiceSecret,\n      formalMatterRepository,\n      promotionRepository: new PostgresKnowledgeCasePromotionRepository(database, pool),\n      intakeClient: new HttpKnowledgeCaseIntakeClient(\n        knowledgeUrl,\n        internalServiceSecret\n      )\n    });\n  })();\n"
          if anchor2 not in s:
            raise SystemExit('main route anchor not found')
          s = s.replace(anchor2, addition2)
          s = s.replace('      ...formalOpportunityRoutes\n', '      ...formalOpportunityRoutes,\n      ...knowledgeCaseRoutes\n')
          p.write_text(s)

          p = Path('services/markreg/tests/knowledge-case-promotion.test.ts')
          s = p.read_text()
          s = s.replace('  async accept(candidate: KnowledgeCaseCandidateV1) {', '  async accept(candidate: KnowledgeCaseCandidateV1, _principal: WorkspacePrincipal) {')
          test_start = s.index("  it('uses only the current Knowledge intake wire shape")
          test_end = s.index('\n  });\n});', test_start) + len('\n  });')
          replacement = '''  it('uses authenticated Knowledge intake + collection with the same Workspace Principal', async () => {
    const seen: Array<{ url: string; init?: RequestInit }> = [];
    const candidate: KnowledgeCaseCandidateV1 = {
      protocolVersion: '1.0',
      objectType: 'CASE_CANDIDATE',
      candidateId: `case-candidate_${'b'.repeat(64)}`,
      sourceSystem: 'MARKREG',
      sourceMatterId: 'formal-matter_a',
      sourceMatterVersion: 1,
      sourceSnapshotSha256: 'a'.repeat(64),
      sourceRetrievalRef: `markreg:case-source:v1:${'b'.repeat(64)}`,
      promotedBy: 'user_case-operator',
      promotedAt,
      accessScope: { sourceWorkspaceId: workspaceId, classification: 'INTERNAL' },
      idempotencyKey: 'promotion-key-http'
    };
    const fakeFetch: typeof fetch = async (input, init) => {
      seen.push({ url: String(input), init });
      if (seen.length === 1)
        return new Response(JSON.stringify(receipt(candidate)), {
          status: 202,
          headers: { 'content-type': 'application/json' }
        });
      return new Response(
        JSON.stringify({ candidateId: candidate.candidateId, collection: { collectionRef: 'case-evidence:test' } }),
        { status: 200, headers: { 'content-type': 'application/json' } }
      );
    };
    const internalSecret = 'k'.repeat(32);
    const operator = principal(['matter:read', 'matter:promote-knowledge']);
    const client = new HttpKnowledgeCaseIntakeClient(
      'http://knowledge.internal/',
      internalSecret,
      fakeFetch
    );

    await expect(client.accept(candidate, operator)).resolves.toEqual(receipt(candidate));
    expect(seen.map((entry) => entry.url)).toEqual([
      'http://knowledge.internal/api/internal/case-candidates',
      `http://knowledge.internal/api/internal/case-candidates/${candidate.candidateId}/collect`
    ]);
    const intakeHeaders = seen[0]!.init?.headers as Record<string, string>;
    const collectionHeaders = seen[1]!.init?.headers as Record<string, string>;
    expect(intakeHeaders['x-markorbit-internal-authorization']).toBe(internalSecret);
    expect(intakeHeaders['x-markorbit-principal']).toBeTruthy();
    expect(intakeHeaders['x-markorbit-workspace-id']).toBe(workspaceId);
    expect(collectionHeaders['x-markorbit-internal-authorization']).toBe(internalSecret);
    expect(collectionHeaders['x-markorbit-principal']).toBe(intakeHeaders['x-markorbit-principal']);
    expect(seen[0]!.init?.body).toBe(JSON.stringify(candidate));
  });'''
          s = s[:test_start] + replacement + s[test_end:]
          p.write_text(s)
          PY
      - run: pnpm exec prettier --write services/markreg/src/knowledge-case-promotion.ts services/markreg/src/main.ts services/markreg/tests/knowledge-case-promotion.test.ts
      - run: pnpm --filter @markorbit/markreg-service lint
      - run: pnpm --filter @markorbit/markreg-service typecheck
      - run: pnpm --filter @markorbit/markreg-service test -- knowledge-case-promotion.test.ts
      - name: Commit patched production files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/markreg/src/knowledge-case-promotion.ts services/markreg/src/main.ts services/markreg/tests/knowledge-case-promotion.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "K-CASE-002: bind authenticated Knowledge intake and collection"
          git push origin HEAD:k-case-002-markreg-producer-binding-v2
