name: tmp-k-case-002-wp1-preflight
on:
  push:
    branches:
      - k-case-002-markreg-producer-binding-v2
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 tools/tmp_k_case_002_patch.py
      - run: python3 tools/tmp_k_case_002_lintfix.py
      - run: pnpm exec prettier --write services/markreg/src/knowledge-case-promotion.ts services/markreg/src/main.ts services/markreg/tests/knowledge-case-promotion.test.ts
      - run: pnpm --filter @markorbit/markreg-service lint
      - run: pnpm --filter @markorbit/markreg-service typecheck
      - run: pnpm exec turbo run build --filter=@markorbit/markreg-service...
      - run: pnpm --filter @markorbit/markreg-service exec vitest run tests/knowledge-case-promotion.test.ts
      - name: Commit patched production files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/markreg/src/knowledge-case-promotion.ts services/markreg/src/main.ts services/markreg/tests/knowledge-case-promotion.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "K-CASE-002: bind authenticated Knowledge intake and collection"
          git push origin HEAD:k-case-002-markreg-producer-binding-v2
