name: Temporary Lite 703 Prettier Probe

on:
  pull_request:
    paths:
      - 'apps/lite-web/src/features/content-studio/**'
      - '.github/workflows/tmp-lite-703-prettier-probe.yml'

permissions:
  contents: read

jobs:
  prettier-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Emit canonical Prettier diff
        run: |
          set -euo pipefail
          FILES=(
            apps/lite-web/src/features/content-studio/ContentStudio.triage.stories.tsx
            apps/lite-web/src/features/content-studio/ContentStudio.triage.test.tsx
            apps/lite-web/src/features/content-studio/ContentStudio.tsx
          )
          pnpm exec prettier --write "${FILES[@]}"
          echo '--- BEGIN CANONICAL PRETTIER DIFF ---'
          git --no-pager diff --no-ext-diff --unified=200 -- "${FILES[@]}"
          echo '--- END CANONICAL PRETTIER DIFF ---'
          git diff --quiet -- "${FILES[@]}"
