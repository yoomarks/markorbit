name: Temporary Lite 703 Prettier Probe

on:
  pull_request:
    paths:
      - 'apps/lite-web/src/features/content-studio/**'
      - '.github/workflows/tmp-lite-703-prettier-probe.yml'

permissions:
  contents: write

jobs:
  prettier-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and commit canonical output
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          FILES=(
            apps/lite-web/src/features/content-studio/ContentStudio.triage.stories.tsx
            apps/lite-web/src/features/content-studio/ContentStudio.triage.test.tsx
            apps/lite-web/src/features/content-studio/ContentStudio.tsx
          )
          pnpm exec prettier --write "${FILES[@]}"
          git diff --check -- "${FILES[@]}"
          if git diff --quiet -- "${FILES[@]}"; then
            echo 'Already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${FILES[@]}"
          git commit -m 'style(lite): apply canonical Prettier to #703'
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
