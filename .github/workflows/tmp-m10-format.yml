name: Temporary M10 formatter

on:
  push:
    branches:
      - agent/m10-closeout-attention-loop-audit

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m10-closeout-attention-loop-audit
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/lite/src/trademark-asset-attention.ts services/lite/tests/trademark-asset-attention.test.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- services/lite/src/trademark-asset-attention.ts services/lite/tests/trademark-asset-attention.test.ts; then
            exit 0
          fi
          git config user.name "markorbit-ci"
          git config user.email "markorbit-ci@users.noreply.github.com"
          git add -- services/lite/src/trademark-asset-attention.ts services/lite/tests/trademark-asset-attention.test.ts
          git commit -m "style: apply exact M10 attention formatting"
          git push origin HEAD:agent/m10-closeout-attention-loop-audit
