name: Temporary M10 WP07 format fix

on:
  push:
    branches:
      - agent/m10-wp07-ai-asset-guide
    paths:
      - .github/workflows/tmp-m10-wp07-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m10-wp07-ai-asset-guide
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository lint and Prettier fixes
        run: |
          pnpm --filter @markorbit/lite-service exec eslint --fix src/trademark-asset-ai-guide.ts tests/trademark-asset-ai-guide.test.ts
          pnpm exec prettier --write services/lite/src/trademark-asset-ai-guide.ts services/lite/tests/trademark-asset-ai-guide.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/lite/src/trademark-asset-ai-guide.ts services/lite/tests/trademark-asset-ai-guide.test.ts
          git commit -m "Fix WP07 lint and formatting"
          git push origin HEAD:agent/m10-wp07-ai-asset-guide
