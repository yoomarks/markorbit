name: Temporary M11 WP01 formatter

on:
  push:
    branches:
      - agent/m11-wp01-management-signal-contracts

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m11-wp01-management-signal-contracts
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/contracts/src/trademark-asset-management.ts packages/contracts/tests/trademark-asset-management.test.ts packages/contracts/package.json
      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- packages/contracts/src/trademark-asset-management.ts packages/contracts/tests/trademark-asset-management.test.ts packages/contracts/package.json; then
            exit 0
          fi
          git config user.name "markorbit-ci"
          git config user.email "markorbit-ci@users.noreply.github.com"
          git add -- packages/contracts/src/trademark-asset-management.ts packages/contracts/tests/trademark-asset-management.test.ts packages/contracts/package.json
          git commit -m "style: apply exact M11 WP01 formatting"
          git push origin HEAD:agent/m11-wp01-management-signal-contracts
