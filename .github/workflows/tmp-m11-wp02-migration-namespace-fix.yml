name: Temporary M11 WP02 migration namespace fixer

on:
  push:
    branches:
      - agent/m11-wp02-asset-refresh-ledger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m11-wp02-asset-refresh-ledger
      - name: Reuse Trademark Asset migration namespace
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/lite/tests/trademark-asset-refresh-postgres.test.ts')
          text = path.read_text()
          text = text.replace('lite_trademark_asset_refresh_test', 'lite_trademark_asset_test')
          path.write_text(text)
          PY
      - name: Commit harness fix
        run: |
          git config user.name "markorbit-ci"
          git config user.email "markorbit-ci@users.noreply.github.com"
          git add -- services/lite/tests/trademark-asset-refresh-postgres.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(lite): reuse Trademark Asset migration namespace"
          git push origin HEAD:agent/m11-wp02-asset-refresh-ledger
