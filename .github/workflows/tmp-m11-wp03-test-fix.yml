name: Temporary M11 WP03 fixture fixer

on:
  push:
    branches:
      - agent/m11-wp03-management-signals

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m11-wp03-management-signals
      - name: Remove explicit undefined optional fields
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/lite/tests/trademark-asset-management-signal.test.ts')
          text = path.read_text().replace('          workspacePriority: undefined,\n', '')
          path.write_text(text)
          PY
      - name: Commit fixture fix
        run: |
          git config user.name "markorbit-ci"
          git config user.email "markorbit-ci@users.noreply.github.com"
          git add -- services/lite/tests/trademark-asset-management-signal.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(lite): omit absent WP03 priority fields"
          git push origin HEAD:agent/m11-wp03-management-signals
