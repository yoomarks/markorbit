name: Temporary M11 WP06 formatter

on:
  push:
    branches:
      - agent/m11-wp06-proactive-portfolio-ux

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m11-wp06-proactive-portfolio-ux
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/lite/src/trademark-asset-http.ts services/lite/src/main.ts apps/lite-web/src/api/trademark-assets.ts apps/lite-web/src/features/trademark-assets/TrademarkAssetPortfolio.tsx apps/lite-web/src/features/trademark-assets/TrademarkAssetWorkspace.tsx apps/lite-web/src/features/trademark-assets/trademark-asset-workspace.css
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "markorbit-ci"
          git config user.email "markorbit-ci@users.noreply.github.com"
          git add -- services/lite/src/trademark-asset-http.ts services/lite/src/main.ts apps/lite-web/src/api/trademark-assets.ts apps/lite-web/src/features/trademark-assets/TrademarkAssetPortfolio.tsx apps/lite-web/src/features/trademark-assets/TrademarkAssetWorkspace.tsx apps/lite-web/src/features/trademark-assets/trademark-asset-workspace.css
          git commit -m "style: apply exact M11 WP06 formatting"
          git push origin HEAD:agent/m11-wp06-proactive-portfolio-ux
