name: tmp M11 WP07 format

on:
  push:
    branches:
      - agent/m11-wp07-disposition-watch-recovery
    paths:
      - .github/workflows/tmp-m11-wp07-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m11-wp07-disposition-watch-recovery
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          services/lite/src/trademark-asset-management-disposition.ts
          services/lite/tests/trademark-asset-management-disposition-postgres.test.ts
          services/lite/tests/trademark-asset-management-disposition.test.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/lite/src/trademark-asset-management-disposition.ts \
            services/lite/tests/trademark-asset-management-disposition-postgres.test.ts \
            services/lite/tests/trademark-asset-management-disposition.test.ts
          git commit -m "M11 WP07 format disposition recovery"
          git push origin HEAD:agent/m11-wp07-disposition-watch-recovery
