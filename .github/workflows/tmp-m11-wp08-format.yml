name: tmp M11 WP08 format

on:
  push:
    branches:
      - agent/m11-wp08-independent-runtime-authority-audit
    paths:
      - .github/workflows/tmp-m11-wp08-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m11-wp08-independent-runtime-authority-audit
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/planning/MO-MVP-MILESTONE-011-CLOSEOUT-AUDIT.md
      - name: Commit formatted audit
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planning/MO-MVP-MILESTONE-011-CLOSEOUT-AUDIT.md
          git commit -m "M11 WP08 format closeout audit"
          git push origin HEAD:agent/m11-wp08-independent-runtime-authority-audit
