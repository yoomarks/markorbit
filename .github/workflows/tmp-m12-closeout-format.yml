name: tmp M12 closeout format
on:
  push:
    branches: [agent/m12-closeout-traceability]
    paths: [.github/workflows/tmp-m12-closeout-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-closeout-traceability
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/planning/MO-MVP-MILESTONE-012-IMPLEMENTATION-TRACEABILITY.md docs/planning/MO-MVP-MILESTONE-012-IMPLEMENTATION-TRACEABILITY.json
      - run: pnpm exec prettier --check docs/planning/MO-MVP-MILESTONE-012-IMPLEMENTATION-TRACEABILITY.md docs/planning/MO-MVP-MILESTONE-012-IMPLEMENTATION-TRACEABILITY.json
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/planning/MO-MVP-MILESTONE-012-IMPLEMENTATION-TRACEABILITY.md docs/planning/MO-MVP-MILESTONE-012-IMPLEMENTATION-TRACEABILITY.json
          git commit -m 'M12 closeout: format traceability' || exit 0
          git push origin HEAD:agent/m12-closeout-traceability
