name: tmp M12 scope format

on:
  push:
    branches:
      - agent/m12-service-workbench-scope
    paths:
      - .github/workflows/tmp-m12-scope-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-service-workbench-scope
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/planning/MO-MVP-MILESTONE-012-SCOPE-LOCK.md docs/planning/MO-MVP-MILESTONE-012-PLAN.json
      - name: Commit formatted docs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planning/MO-MVP-MILESTONE-012-SCOPE-LOCK.md docs/planning/MO-MVP-MILESTONE-012-PLAN.json
          git commit -m "M12: format scope documents"
          git push origin HEAD:agent/m12-service-workbench-scope
