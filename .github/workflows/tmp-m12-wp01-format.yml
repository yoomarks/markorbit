name: tmp M12 WP01 format

on:
  push:
    branches:
      - agent/m12-wp01-service-preparation-contracts
    paths:
      - .github/workflows/tmp-m12-wp01-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-wp01-service-preparation-contracts
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/contracts/src/trademark-service-workbench.ts
      - name: Commit formatted contract
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/trademark-service-workbench.ts
          git commit -m "M12 WP01 format service workbench contract"
          git push origin HEAD:agent/m12-wp01-service-preparation-contracts
