name: tmp M12 WP02 format

on:
  push:
    branches:
      - agent/m12-wp02-durable-service-work-package-v2
    paths:
      - .github/workflows/tmp-m12-wp02-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-wp02-durable-service-work-package-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/lite/src/trademark-service-work-package.ts
      - name: Commit formatted store
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/lite/src/trademark-service-work-package.ts
          git commit -m "M12 WP02 format Service Work Package store"
          git push origin HEAD:agent/m12-wp02-durable-service-work-package-v2
