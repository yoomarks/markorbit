name: tmp M12 WP02 test schema fix

on:
  push:
    branches:
      - agent/m12-wp02-durable-service-work-package-v2
    paths:
      - .github/workflows/tmp-m12-wp02-test-schema-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-wp02-durable-service-work-package-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Make migration setup reusable in the shared PostgreSQL gate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/lite/tests/trademark-service-work-package-postgres.test.ts')
          text = path.read_text()
          old = """    const liteMigrations = await loadMigrationsForOwner(\n      migrationsDirectory,\n      migrationOwners,\n      '@markorbit/lite-service'\n    );\n    await migrate(database.getPool(), 'lite_trademark_service_work_package_test', liteMigrations);\n"""
          new = """    const existingWorkPackageTable = await database\n      .getPool()\n      .query(\"SELECT to_regclass('public.lite_trademark_service_work_packages') AS table_name\");\n    if (!existingWorkPackageTable.rows[0]?.table_name) {\n      const liteMigrations = await loadMigrationsForOwner(\n        migrationsDirectory,\n        migrationOwners,\n        '@markorbit/lite-service'\n      );\n      await migrate(database.getPool(), 'lite_trademark_service_work_package_test', liteMigrations);\n    }\n"""
          if old not in text:
              raise SystemExit('target migration block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm exec prettier --write services/lite/tests/trademark-service-work-package-postgres.test.ts
      - run: pnpm --filter @markorbit/lite-service typecheck
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/lite/tests/trademark-service-work-package-postgres.test.ts
          git commit -m "M12 WP02 reuse shared PostgreSQL migration state"
          git push origin HEAD:agent/m12-wp02-durable-service-work-package-v2
