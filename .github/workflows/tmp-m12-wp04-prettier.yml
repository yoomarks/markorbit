name: tmp M12 WP04 prettier
on:
  push:
    branches: [agent/m12-wp04-readiness-missing-information]
    paths: [.github/workflows/tmp-m12-wp04-prettier.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-wp04-readiness-missing-information
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/lite/src/trademark-service-readiness.ts
      - run: pnpm exec prettier --check services/lite/src/trademark-service-readiness.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/lite/src/trademark-service-readiness.ts
          git commit -m "M12 WP04 format readiness engine"
          git push origin HEAD:agent/m12-wp04-readiness-missing-information
