name: tmp M12 WP05 validate
on:
  push:
    branches: [agent/m12-wp05-capability-provider-package-matching]
    paths: [.github/workflows/tmp-m12-wp05-validate.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-wp05-capability-provider-package-matching
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/lite/src/trademark-service-candidate-matching.ts services/lite/tests/trademark-service-candidate-matching.test.ts services/lite/src/index.ts services/lite/package.json
      - run: pnpm --filter @markorbit/lite-service lint
      - run: pnpm --filter @markorbit/lite-service typecheck
      - run: pnpm --filter @markorbit/lite-service test
      - run: pnpm --filter @markorbit/lite-service build
      - name: Commit formatted WP05
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/lite/src/trademark-service-candidate-matching.ts services/lite/tests/trademark-service-candidate-matching.test.ts services/lite/src/index.ts services/lite/package.json
          git commit -m "M12 WP05 format and validate candidate matching"
          git push origin HEAD:agent/m12-wp05-capability-provider-package-matching
