name: tmp-m12-wp07-wire
on:
  push:
    branches: [agent/m12-wp07-professional-service-workbench]
    paths: [.github/workflows/tmp-m12-wp07-wire.yml]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-wp07-professional-service-workbench
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire remaining runtime and styles
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('services/lite/src/main.ts')
          text = main.read_text()
          import_anchor = "import { createTrademarkAssetReadRoutes } from './trademark-asset-http.js';"
          import_block = import_anchor + "\nimport { PostgresTrademarkServiceWorkPackageStore } from './trademark-service-work-package.js';\nimport { createTrademarkServiceWorkbenchRoutes } from './trademark-service-workbench-http.js';"
          if "PostgresTrademarkServiceWorkPackageStore" not in text:
              text = text.replace(import_anchor, import_block, 1)
          ledger_anchor = "const trademarkAssetRefreshLedger = new PostgresTrademarkAssetRefreshLedger(database, pool);"
          store_line = "const trademarkServiceWorkPackages = new PostgresTrademarkServiceWorkPackageStore(database, pool);"
          if store_line not in text:
              text = text.replace(ledger_anchor, ledger_anchor + "\n" + store_line, 1)
          route_anchor = "    ...createContentKitRoutes({ internalServiceSecret, contentKitService }),"
          route_block = "    ...createTrademarkServiceWorkbenchRoutes({\n      internalServiceSecret,\n      workPackages: trademarkServiceWorkPackages,\n      query: pool\n    }),\n" + route_anchor
          if "...createTrademarkServiceWorkbenchRoutes({" not in text:
              text = text.replace(route_anchor, route_block, 1)
          main.write_text(text)

          css = Path('apps/lite-web/src/features/trademark-assets/trademark-asset-workspace.css')
          styles = '''\n\n.trademark-service-workbench { border: 1px solid var(--mo-border, #d9dde5); border-radius: 16px; padding: 20px; background: var(--mo-surface, #fff); margin-top: 20px; }\n.trademark-service-workbench__summary, .trademark-service-workbench__detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 16px 0; }\n.trademark-service-workbench__summary > div, .trademark-service-workbench__detail-grid > article { border: 1px solid var(--mo-border, #d9dde5); border-radius: 12px; padding: 14px; }\n.trademark-service-workbench__summary span, .trademark-service-workbench__summary strong { display: block; }\n.trademark-service-workbench__prepare { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }\n.trademark-service-workbench__boundary { margin-top: 14px; font-size: 0.9rem; }\n'''
          css_text = css.read_text()
          if '.trademark-service-workbench {' not in css_text:
              css.write_text(css_text + styles)
          PY
      - run: pnpm exec prettier --write services/lite/src/trademark-service-workbench-http.ts services/lite/src/main.ts apps/gateway/src/product-loop-http.ts apps/lite-web/src/api/trademark-assets.ts apps/lite-web/src/features/trademark-assets/TrademarkServiceWorkbench.tsx apps/lite-web/src/features/trademark-assets/TrademarkServiceWorkbench.test.tsx apps/lite-web/src/features/trademark-assets/TrademarkAssetPortfolio.tsx apps/lite-web/src/features/trademark-assets/trademark-asset-workspace.css
      - name: Commit wired WP07
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/lite/src/main.ts apps/gateway/src/product-loop-http.ts apps/lite-web/src/api/trademark-assets.ts apps/lite-web/src/features/trademark-assets/TrademarkAssetPortfolio.tsx apps/lite-web/src/features/trademark-assets/trademark-asset-workspace.css services/lite/src/trademark-service-workbench-http.ts apps/lite-web/src/features/trademark-assets/TrademarkServiceWorkbench.tsx apps/lite-web/src/features/trademark-assets/TrademarkServiceWorkbench.test.tsx
          git commit -m 'M12 WP07 wire and format professional service workbench' || exit 0
          git push origin HEAD:agent/m12-wp07-professional-service-workbench
