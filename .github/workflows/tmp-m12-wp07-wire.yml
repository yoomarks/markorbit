name: tmp-m12-wp07-wire
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m12-wp07-professional-service-workbench
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire remaining runtime and format WP07
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing anchor in {path}: {old[:80]!r}')
              p.write_text(s.replace(old,new,1))
          replace('services/lite/src/main.ts',
            "import { createTrademarkAssetReadRoutes } from './trademark-asset-http.js';",
            "import { createTrademarkAssetReadRoutes } from './trademark-asset-http.js';\nimport { PostgresTrademarkServiceWorkPackageStore } from './trademark-service-work-package.js';\nimport { createTrademarkServiceWorkbenchRoutes } from './trademark-service-workbench-http.js';")
          replace('services/lite/src/main.ts',
            "const trademarkAssetRefreshLedger = new PostgresTrademarkAssetRefreshLedger(database, pool);",
            "const trademarkAssetRefreshLedger = new PostgresTrademarkAssetRefreshLedger(database, pool);\nconst trademarkServiceWorkPackages = new PostgresTrademarkServiceWorkPackageStore(database, pool);")
          replace('services/lite/src/main.ts',
            "    ...createContentKitRoutes({ internalServiceSecret, contentKitService }),",
            "    ...createTrademarkServiceWorkbenchRoutes({\n      internalServiceSecret,\n      workPackages: trademarkServiceWorkPackages,\n      query: pool\n    }),\n    ...createContentKitRoutes({ internalServiceSecret, contentKitService }),")
          p=Path('apps/lite-web/src/features/trademark-assets/trademark-asset-workspace.css')
          p.write_text(p.read_text()+'''\n\n.trademark-service-workbench { border: 1px solid var(--mo-border, #d9dde5); border-radius: 16px; padding: 20px; background: var(--mo-surface, #fff); margin-top: 20px; }\n.trademark-service-workbench__summary, .trademark-service-workbench__detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 16px 0; }\n.trademark-service-workbench__summary > div, .trademark-service-workbench__detail-grid > article { border: 1px solid var(--mo-border, #d9dde5); border-radius: 12px; padding: 14px; }\n.trademark-service-workbench__summary span, .trademark-service-workbench__summary strong { display: block; }\n.trademark-service-workbench__prepare { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }\n.trademark-service-workbench__boundary { margin-top: 14px; font-size: 0.9rem; }\n''')
          PY
      - run: pnpm exec prettier --write services/lite/src/trademark-service-workbench-http.ts services/lite/src/main.ts apps/gateway/src/product-loop-http.ts apps/lite-web/src/api/trademark-assets.ts apps/lite-web/src/features/trademark-assets/TrademarkServiceWorkbench.tsx apps/lite-web/src/features/trademark-assets/TrademarkServiceWorkbench.test.tsx apps/lite-web/src/features/trademark-assets/TrademarkAssetPortfolio.tsx apps/lite-web/src/features/trademark-assets/trademark-asset-workspace.css
      - run: pnpm --filter @markorbit/lite build && pnpm --filter @markorbit/lite lint && pnpm --filter @markorbit/gateway build && pnpm --filter @markorbit/gateway lint && pnpm --filter @markorbit/lite-web build && pnpm --filter @markorbit/lite-web lint && pnpm --filter @markorbit/lite-web test
      - name: Commit wired WP07
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/lite/src/main.ts apps/gateway/src/product-loop-http.ts apps/lite-web/src/api/trademark-assets.ts apps/lite-web/src/features/trademark-assets/TrademarkAssetPortfolio.tsx apps/lite-web/src/features/trademark-assets/trademark-asset-workspace.css services/lite/src/trademark-service-workbench-http.ts apps/lite-web/src/features/trademark-assets/TrademarkServiceWorkbench.tsx apps/lite-web/src/features/trademark-assets/TrademarkServiceWorkbench.test.tsx
          git commit -m 'M12 WP07 wire professional service workbench' || exit 0
          git push origin HEAD:agent/m12-wp07-professional-service-workbench
