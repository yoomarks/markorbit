name: tmp-m13-closeout-prettier

on:
  push:
    branches:
      - agent/m13-closeout-traceability

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m13-closeout-traceability
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/planning/MO-MVP-MILESTONE-013-IMPLEMENTATION-TRACEABILITY.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/planning/MO-MVP-MILESTONE-013-IMPLEMENTATION-TRACEABILITY.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "M13 closeout: format traceability"
          git push origin HEAD:agent/m13-closeout-traceability
