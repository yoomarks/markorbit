name: Temporary M15 WP04 Prettier

on:
  push:
    branches:
      - agent/m15-wp04-egress-credential-isolation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m15-wp04-egress-credential-isolation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format WP04 files and self-clean
        run: |
          pnpm exec prettier --write \
            packages/contracts/src/trademark-service-execution-isolation.ts \
            services/execution/src/trademark-service-execution-isolation.ts
          git rm .github/workflows/tmp-m15-wp04-prettier.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/contracts/src/trademark-service-execution-isolation.ts services/execution/src/trademark-service-execution-isolation.ts
          git diff --cached --quiet && exit 0
          git commit -m "style(m15): apply repository Prettier to WP04"
          git push origin HEAD:agent/m15-wp04-egress-credential-isolation
