name: Temporary M15 WP08 Audit Check

on:
  push:
    branches:
      - agent/m15-wp08-independent-release-readiness-audit
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m15-wp08-independent-release-readiness-audit
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and validate independent audit
        run: |
          pnpm exec prettier --write services/execution/tests/trademark-service-execution-m15-release-readiness-audit.test.ts
          pnpm --filter @markorbit/execution-service exec vitest run tests/trademark-service-execution-m15-release-readiness-audit.test.ts
          pnpm --filter @markorbit/execution-service lint
          pnpm --filter @markorbit/execution-service typecheck
      - name: Persist formatting and self-clean
        run: |
          git rm .github/workflows/tmp-m15-wp08-audit-check.yml .m15-wp08-audit-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/execution/tests/trademark-service-execution-m15-release-readiness-audit.test.ts
          git commit -m "style(m15): format independent release-readiness audit"
          git push origin HEAD:agent/m15-wp08-independent-release-readiness-audit
