name: M5 WP01 final one-shot format

on:
  push:
    branches:
      - m5-wp-01-evidence-lifecycle-contracts

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-wp-01-evidence-lifecycle-contracts
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format final WP01 docs and remove one-shot workflow
        run: |
          pnpm exec prettier --write docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.md docs/tasks/MO-MVP-M5-WP-01-EVIDENCE-LIFECYCLE-CONTRACTS.md README.md
          git rm .github/workflows/tmp-m5-wp01-final-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.md docs/tasks/MO-MVP-M5-WP-01-EVIDENCE-LIFECYCLE-CONTRACTS.md README.md
          git commit -m 'style(m5): format final WP01 docs'
          git push origin HEAD:m5-wp-01-evidence-lifecycle-contracts
