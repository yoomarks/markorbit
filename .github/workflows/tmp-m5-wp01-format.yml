name: M5 WP01 one-shot format

on:
  push:
    branches:
      - m5-wp-01-evidence-lifecycle-contracts

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-wp-01-evidence-lifecycle-contracts
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format WP01 files and remove one-shot workflow
        run: |
          pnpm exec prettier --write packages/contracts/tests/evidence-lifecycle-contract.test.ts docs/architecture/EVIDENCE-REVIEW-LIFECYCLE-AUTHORITY-BOUNDARY.md
          git rm .github/workflows/tmp-m5-wp01-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/contracts/tests/evidence-lifecycle-contract.test.ts docs/architecture/EVIDENCE-REVIEW-LIFECYCLE-AUTHORITY-BOUNDARY.md
          git commit -m 'style(m5): format WP01 contract evidence'
          git push origin HEAD:m5-wp-01-evidence-lifecycle-contracts
