name: M5 WP01 one-shot status reconciliation

on:
  push:
    branches:
      - m5-wp-01-evidence-lifecycle-contracts

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-wp-01-evidence-lifecycle-contracts
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile approved M5 status and remove one-shot workflow
        run: |
          sed -i 's/PROPOSED_FOR_OWNER_APPROVAL/APPROVED_FOR_IMPLEMENTATION/g' docs/planning/MO-MVP-MILESTONE-005-SCOPE-LOCK.md docs/planning/MO-MVP-MILESTONE-005-DELIVERY-PLAN.md docs/planning/MO-MVP-MILESTONE-005-PLAN.json
          sed -i 's/`PROPOSED_FOR_OWNER_APPROVAL`/`APPROVED_BY_PR_60`/' docs/tasks/MO-MVP-TASK-030A-MILESTONE-005-SCOPE-LOCK.md
          sed -i 's/\*\*Proposed direction:\*\*/**Approved direction:**/' docs/tasks/MO-MVP-TASK-030A-MILESTONE-005-SCOPE-LOCK.md
          python -c "from pathlib import Path; p=Path('docs/tasks/MO-MVP-TASK-030A-MILESTONE-005-SCOPE-LOCK.md'); s=p.read_text(); old='Implementation must not start until the owner approves this scope by merging the planning PR. Merge of this planning task would authorize only the proposed Milestone 5 engineering direction and bounded work-package graph; it would not itself create product/runtime state or authorize any external action.'; new='The owner approved this scope by merging PR #60. That merge authorizes the Milestone 5 engineering direction and bounded work-package graph only; implementation proceeds through the approved work packages and the approval does not itself create product/runtime state or authorize any external action.'; assert old in s; p.write_text(s.replace(old,new))"
          sed -i 's/## Milestone 5 planning/## Milestone 5/' docs/planning/TASK-INDEX.md
          sed -i 's/(\*\*proposed for owner approval\*\*)/(**approved by merge of PR #60**)/' docs/planning/TASK-INDEX.md
          sed -i 's/  - Proposed direction:/  - Approved direction:/' docs/planning/TASK-INDEX.md
          sed -i 's/  - Proposed loop:/  - Approved loop:/' docs/planning/TASK-INDEX.md
          python -c "from pathlib import Path; p=Path('docs/planning/TASK-INDEX.md'); s=p.read_text(); old='  - Planning only: no runtime code, migration, tag, release, deployment freeze or external action is authorized until the owner approves the scope by merging the planning PR.'; new='  - Current implementation status: `docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.{md,json}`.\n- M5-WP-01 — Evidence review, lifecycle and recommendation contracts plus canonical authority boundary (**implemented in PR #61**)\n  - Shared contract: `@markorbit/contracts/evidence-lifecycle`.\n  - Authority evidence: `docs/architecture/EVIDENCE-REVIEW-LIFECYCLE-AUTHORITY-BOUNDARY.md`.\n  - No runtime migration or external action is introduced by WP-01.'; assert old in s; p.write_text(s.replace(old,new))"
          pnpm exec prettier --write docs/planning/MO-MVP-MILESTONE-005-SCOPE-LOCK.md docs/planning/MO-MVP-MILESTONE-005-DELIVERY-PLAN.md docs/planning/MO-MVP-MILESTONE-005-PLAN.json docs/tasks/MO-MVP-TASK-030A-MILESTONE-005-SCOPE-LOCK.md docs/planning/TASK-INDEX.md
          git rm .github/workflows/tmp-m5-wp01-status-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/planning/MO-MVP-MILESTONE-005-SCOPE-LOCK.md docs/planning/MO-MVP-MILESTONE-005-DELIVERY-PLAN.md docs/planning/MO-MVP-MILESTONE-005-PLAN.json docs/tasks/MO-MVP-TASK-030A-MILESTONE-005-SCOPE-LOCK.md docs/planning/TASK-INDEX.md
          git commit -m 'docs(m5): reconcile approved milestone status'
          git push origin HEAD:m5-wp-01-evidence-lifecycle-contracts
