name: M5 WP02 one-shot audit reset

on:
  push:
    branches:
      - m5-wp-02-execution-evidence-review

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-wp-02-execution-evidence-review
      - name: Respect append-only audit in intra-test reset
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/execution/tests/evidence-review-postgres.test.ts')
          text = p.read_text()
          old = '''      await database.getPool().query(
        `DELETE FROM execution_evidence_review_commands;
         DELETE FROM execution_evidence_correction_requests;
         DELETE FROM execution_evidence_review_decisions;
         DELETE FROM execution_evidence_review_audit;
         DELETE FROM execution_evidence_review_sources;`
      );'''
          new = '''      await database.getPool().query(
        `TRUNCATE
           execution_evidence_review_audit,
           execution_evidence_review_commands,
           execution_evidence_correction_requests,
           execution_evidence_review_decisions,
           execution_evidence_review_sources
         RESTART IDENTITY CASCADE`
      );'''
          if old not in text:
              raise SystemExit('append-only intra-test reset marker missing')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/execution/tests/evidence-review-postgres.test.ts
          git commit -m 'test(m5): preserve append-only audit during review reset'
          git push origin HEAD:m5-wp-02-execution-evidence-review
