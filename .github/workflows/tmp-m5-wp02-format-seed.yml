name: M5 WP02 one-shot seed format

on:
  push:
    branches:
      - m5-wp-02-execution-evidence-review

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-wp-02-execution-evidence-review
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/execution/tests/evidence-review-postgres.test.ts
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/execution/tests/evidence-review-postgres.test.ts
          git commit -m 'style(m5): format WP02 receipt seed test'
          git push origin HEAD:m5-wp-02-execution-evidence-review
