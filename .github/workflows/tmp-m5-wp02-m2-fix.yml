name: M5 WP02 one-shot M2 expectation fix

on:
  push:
    branches:
      - m5-wp-02-execution-evidence-review

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-wp-02-execution-evidence-review
      - name: Update historical Execution migration expectations for 0033
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/milestone2-migrations.integration.test.ts')
          text = p.read_text()
          old = "  Execution: [\n    'execution_provider_return_evidence_receipts',"
          new = "  Execution: [\n    'execution_evidence_review_sources',\n    'execution_evidence_review_decisions',\n    'execution_evidence_correction_requests',\n    'execution_evidence_review_commands',\n    'execution_evidence_review_audit',\n    'execution_provider_return_evidence_receipts',"
          if old not in text:
              raise SystemExit('Execution ownedTables marker missing')
          text = text.replace(old, new, 1)
          old = "    expect(sets.reduce((count, set) => count + set.size, 0)).toBe(11);\n    expect(sets[2]).toContain('0027_execution_filing_governance');\n    expect(sets[2]).toContain('0032_execution_provider_return_evidence');"
          new = "    expect(sets.reduce((count, set) => count + set.size, 0)).toBe(12);\n    expect(sets[2]).toContain('0027_execution_filing_governance');\n    expect(sets[2]).toContain('0032_execution_provider_return_evidence');\n    expect(sets[2]).toContain('0033_execution_evidence_review');"
          if old not in text:
              raise SystemExit('MIG-006 expectation marker missing')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/milestone2-migrations.integration.test.ts
          git commit -m 'test(m5): include WP02 in migration reliability expectations'
          git push origin HEAD:m5-wp-02-execution-evidence-review
