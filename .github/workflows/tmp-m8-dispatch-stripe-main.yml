name: Temporary M8 Dispatch Stripe Main

on:
  push:
    paths:
      - '.github/workflows/tmp-m8-dispatch-stripe-main.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Stripe sandbox acceptance on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "/repos/$GITHUB_REPOSITORY/actions/workflows/payment-stripe-sandbox-acceptance.yml/dispatches"
          -f ref=main
