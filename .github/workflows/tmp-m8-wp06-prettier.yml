name: Temporary M8 WP06 Prettier

on:
  push:
    branches:
      - agent/tmp-m8-wp06-prettier

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tmp-m8-wp06-prettier
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format exact WP06 files
        run: pnpm exec prettier --write infrastructure/rehearsal/m8-wp-06-commercial-runtime.json scripts/m8-wp-06-commercial-runtime-reliability.mjs
      - name: Commit formatted output and remove temporary workflow
        run: |
          rm .github/workflows/tmp-m8-wp06-prettier.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add infrastructure/rehearsal/m8-wp-06-commercial-runtime.json scripts/m8-wp-06-commercial-runtime-reliability.mjs .github/workflows/tmp-m8-wp06-prettier.yml
          git commit -m "tmp: format M8 WP06 files"
          git push origin HEAD:agent/tmp-m8-wp06-prettier
