name: Temporary M8 WP07 Prettier

on:
  push:
    branches:
      - agent/tmp-m8-wp07-prettier

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tmp-m8-wp07-prettier
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format exact WP07 audit script
        run: pnpm exec prettier --write scripts/m8-wp-07-independent-commercial-readiness-audit.mjs
      - name: Commit formatted output and remove temporary workflow
        run: |
          rm .github/workflows/tmp-m8-wp07-prettier.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/m8-wp-07-independent-commercial-readiness-audit.mjs .github/workflows/tmp-m8-wp07-prettier.yml
          git commit -m "tmp: format M8 WP07 audit script"
          git push origin HEAD:agent/tmp-m8-wp07-prettier
