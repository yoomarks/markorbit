name: Temporary Managed AI Bootstrap Preflight

on:
  push:
    branches: [mo-cap-002-managed-ai-server-bootstrap]

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec turbo run build --filter=@markorbit/capability-engine...
      - run: pnpm --filter @markorbit/capability-engine lint
      - run: pnpm --filter @markorbit/capability-engine typecheck
      - run: pnpm --filter @markorbit/capability-engine test
      - name: Persist lockfile update when needed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'Update lockfile for Managed AI bootstrap'
          git push origin "HEAD:${GITHUB_REF_NAME}"
