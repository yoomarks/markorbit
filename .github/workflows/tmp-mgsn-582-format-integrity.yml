# Temporary one-shot latest-main refresh for replacement PR #595; NEVER MERGE.
name: tmp-mgsn-582-format-integrity

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-formal-mgsn-to-latest-main:
    if: github.head_ref == 'tmp-mgsn-582-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mgsn-o-ready
          fetch-depth: 0
      - name: Merge exact latest main into replacement MGSN branch
        shell: bash
        run: |
          set -euo pipefail
          expected_main='134f3cd357ca09c97cefe217fd05aaef3ef3811d'
          git fetch origin main
          actual_main="$(git rev-parse origin/main)"
          test "$actual_main" = "$expected_main" || {
            echo "main moved: expected $expected_main got $actual_main"
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$expected_main"
          git push origin HEAD:mgsn-o-ready
