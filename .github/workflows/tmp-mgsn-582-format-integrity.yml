# Temporary one-shot formatter for PR #582; NEVER MERGE.
name: tmp-mgsn-582-format-integrity

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-formal-integrity-test:
    if: github.head_ref == 'tmp-mgsn-582-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mgsn-o
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format formal integrity test only
        run: pnpm exec prettier --write services/mgsn/tests/provider-responsibility-postgres-integrity.test.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- services/mgsn/tests/provider-responsibility-postgres-integrity.test.ts; then
            echo 'Integrity test already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/mgsn/tests/provider-responsibility-postgres-integrity.test.ts
          git commit -m 'style(mgsn): format responsibility integrity proofs'
          git push origin HEAD:mgsn-o
