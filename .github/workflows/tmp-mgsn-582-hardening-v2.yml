# Temporary verifier only; NEVER MERGE. Verifies the already-hardened MGSN blobs.
name: tmp-mgsn-582-hardening-v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-hardened-mgsn:
    if: github.head_ref == 'tmp-mgsn-582-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mgsn-582-hardening
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build typed MGSN dependency closure
        run: pnpm --filter @markorbit/mgsn-service... build
      - name: Verify hardened owner files
        run: |
          pnpm exec prettier --check services/mgsn/src/provider-responsibility-postgres.ts services/mgsn/src/durable-runtime.ts services/mgsn/tests/provider-responsibility-postgres.test.ts
          pnpm --filter @markorbit/mgsn-service lint
          pnpm --filter @markorbit/mgsn-service typecheck
          pnpm --filter @markorbit/mgsn-service test
