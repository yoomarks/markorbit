name: tmp-mgsn-715-prettier

on:
  push:
    branches:
      - tmp-mgsn-715-prettier-20260904

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mgsn-715-prettier-20260904
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact MGSN files
        run: |
          pnpm exec prettier --write \
            services/mgsn/src/controlled-handoff-current-authority.ts \
            services/mgsn/src/provider-selection-current-authority.ts \
            services/mgsn/src/runtime-dependencies.ts \
            services/mgsn/tests/controlled-handoff-current-authority.test.ts \
            services/mgsn/tests/provider-selection-current-authority.test.ts \
            services/mgsn/tests/runtime-dependencies-current-authority.test.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/mgsn/src/controlled-handoff-current-authority.ts \
                  services/mgsn/src/provider-selection-current-authority.ts \
                  services/mgsn/src/runtime-dependencies.ts \
                  services/mgsn/tests/controlled-handoff-current-authority.test.ts \
                  services/mgsn/tests/provider-selection-current-authority.test.ts \
                  services/mgsn/tests/runtime-dependencies-current-authority.test.ts
          git commit -m "tmp: canonical prettier for MGSN 715"
          git push origin HEAD:tmp-mgsn-715-prettier-20260904
