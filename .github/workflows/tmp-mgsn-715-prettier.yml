name: tmp-mgsn-715-prettier

on:
  push:
    branches:
      - tmp-mgsn-715-prettier-20260904

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mgsn-selection-handoff-current-authority-715
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair focused lint
        run: |
          python - <<'PY'
          from pathlib import Path

          def exact_replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          selection = "services/mgsn/tests/provider-selection-current-authority.test.ts"
          exact_replace(
              selection,
              "  const core: CoreCurrentWorkspaceAuthoritySource = {\n    validateCurrent: vi.fn(() =>\n      Promise.resolve(\n        options.core ?? {",
              "  const validateCurrent = vi.fn(() =>\n    Promise.resolve(\n      options.core ?? {",
          )
          exact_replace(
              selection,
              "        }\n      )\n    )\n  };\n  const network: SelectionNetworkAuthoritySource = {",
              "      }\n    )\n  );\n  const core: CoreCurrentWorkspaceAuthoritySource = { validateCurrent };\n  const network: SelectionNetworkAuthoritySource = {",
          )
          exact_replace(
              selection,
              "  return {\n    core,\n    source: new MgsnProviderSelectionCurrentAuthoritySource(",
              "  return {\n    validateCurrent,\n    source: new MgsnProviderSelectionCurrentAuthoritySource(",
          )
          exact_replace(
              selection,
              "    const { source, core } = harness();",
              "    const { source, validateCurrent } = harness();",
          )
          exact_replace(
              selection,
              "    expect(core.validateCurrent).not.toHaveBeenCalled();",
              "    expect(validateCurrent).not.toHaveBeenCalled();",
          )

          runtime = "services/mgsn/tests/runtime-dependencies-current-authority.test.ts"
          exact_replace(
              runtime,
              "    expect(JSON.parse(String(requestInit?.body))).toEqual({ workspaceId, userId, membershipId });",
              "    expect(requestInit?.body).toBe(JSON.stringify({ workspaceId, userId, membershipId }));",
          )
          PY
      - name: Canonical format
        run: |
          pnpm exec prettier --write \
            services/mgsn/tests/provider-selection-current-authority.test.ts \
            services/mgsn/tests/runtime-dependencies-current-authority.test.ts
      - name: Prove typecheck and lint
        run: |
          pnpm --filter @markorbit/mgsn-service typecheck
          pnpm --filter @markorbit/mgsn-service lint
      - name: Commit repair to formal branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/mgsn/tests/provider-selection-current-authority.test.ts \
                  services/mgsn/tests/runtime-dependencies-current-authority.test.ts
          git commit -m "test(mgsn): fix current-authority focused lint"
          git push origin HEAD:mgsn-selection-handoff-current-authority-715
