name: tmp MGSN 717 L1 fix probe

on:
  push:
    branches:
      - tmp-mgsn-717-l1-fix-20260904

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact fixture repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/mgsn/tests/outcome-trust-evidence-current-authority-review.test.ts')
          s = p.read_text()
          s = s.replace("""    const privatePolicy = {
      ...policy,
      scope: 'PRIVATE' as NetworkVisibilityPolicyVersionRecord['scope'],
      grants: []
    };""", """    const privatePolicy: NetworkVisibilityPolicyVersionRecord = {
      schemaVersion: 1,
      networkParticipationId: policy.networkParticipationId,
      participationVersion: policy.participationVersion,
      version: policy.version,
      scope: 'PRIVATE',
      grants: [],
      authorizationReference: policy.authorizationReference,
      reason: policy.reason,
      actorId: policy.actorId,
      correlationId: policy.correlationId,
      updatedAt: policy.updatedAt,
      createdAt: policy.createdAt
    };""")
          s = s.replace("""    const embeddedReference = providerClaimItem({
      evidenceReferences: ['unsupported-owner-evidence:717-review']
    });""", """    const embeddedReference = providerClaimItem({
      evidenceReferences: [
        {
          evidenceReference: 'unsupported-owner-evidence:717-review',
          sourceOwner: 'EXECUTION',
          sourceType: 'EXECUTION_EVIDENCE',
          sourceId: 'execution-evidence_717_review',
          sourceVersion: 1,
          sourceFingerprintSha256: hash('3'),
          recordedAt: now,
          authorityState: 'CURRENT',
          checkedAt: now,
          artifactAccessAuthorized: false,
          currentArtifactAuthorizationRequired: true
        }
      ]
    });""")
          s = s.replace("Promise.resolve({ state: 'UNKNOWN_OR_UNPROVEN', assessment: undefined })", "Promise.resolve({ state: 'UNKNOWN_OR_UNPROVEN', assessment: null })")
          p.write_text(s)
          PY
          pnpm prettier --write services/mgsn/tests/outcome-trust-evidence-current-authority-review.test.ts
      - name: Typecheck MGSN
        run: pnpm --filter @markorbit/mgsn-service typecheck
      - name: Run Trust current-authority focused tests
        run: pnpm --filter @markorbit/mgsn-service exec vitest run tests/outcome-trust-evidence-current-authority-review.test.ts tests/outcome-trust-evidence-current-authority.test.ts
      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/mgsn/tests/outcome-trust-evidence-current-authority-review.test.ts
          git commit -m "tmp: validate MGSN 717 L1 test repairs"
          git push origin HEAD:tmp-mgsn-717-l1-fix-20260904
