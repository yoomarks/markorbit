name: tmp MGSN 717 L1 formatter

on:
  push:
    branches:
      - tmp-mgsn-717-l1-format-20260904

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact review test
        run: pnpm prettier --write services/mgsn/tests/outcome-trust-evidence-current-authority-review.test.ts
      - name: Commit canonical formatter output
        shell: bash
        run: |
          if git diff --quiet -- services/mgsn/tests/outcome-trust-evidence-current-authority-review.test.ts; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/mgsn/tests/outcome-trust-evidence-current-authority-review.test.ts
          git commit -m "tmp: capture formatter output for MGSN 717 L1 repair"
          git push origin HEAD:tmp-mgsn-717-l1-format-20260904
