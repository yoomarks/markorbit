name: Temporary MGSN 825 Final Branch Refresh

on:
  push:
    branches:
      - tmp-mgsn-825-prettier-write

permissions:
  contents: write

jobs:
  refresh-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mgsn-governed-network-http-825
          fetch-depth: 0
      - name: Rebase exact hardened head onto current main
        run: |
          expected=14a1a291ca2c91559f0f29f502118d59eba1730b
          test "$(git rev-parse HEAD)" = "$expected"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "36af06ec7d87b7c60e0bf755f4a94b4fad67d895"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rebase origin/main
          git push --force-with-lease=refs/heads/mgsn-governed-network-http-825:$expected origin HEAD:mgsn-governed-network-http-825
