name: Temporary MGSN 825 Prettier Write

on:
  push:
    branches:
      - tmp-mgsn-825-prettier-write

permissions:
  contents: write

jobs:
  format-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mgsn-governed-network-http-825
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          services/mgsn/src/governed-network-http.ts
          services/mgsn/src/index.ts
          services/mgsn/tests/governed-network-http.test.ts
      - run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/mgsn/src/governed-network-http.ts services/mgsn/src/index.ts services/mgsn/tests/governed-network-http.test.ts
          git commit -m "style(mgsn): apply repository prettier rules"
          git push origin HEAD:mgsn-governed-network-http-825
