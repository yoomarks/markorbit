name: Temporary MGSN 825 Lint Cleanup

on:
  push:
    branches:
      - tmp-mgsn-825-prettier-write

permissions:
  contents: write

jobs:
  cleanup-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mgsn-governed-network-http-825
          fetch-depth: 0
      - run: |
          sed -i '1{/^\/\* eslint-disable @typescript-eslint\/no-unsafe-assignment, @typescript-eslint\/no-unsafe-argument /d;}' services/mgsn/src/governed-network-http.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/mgsn/src/governed-network-http.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore(mgsn): remove unused lint suppression"
          git push origin HEAD:mgsn-governed-network-http-825
