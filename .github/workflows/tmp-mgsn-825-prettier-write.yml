name: Temporary MGSN 825 Branch Refresh

on:
  push:
    branches:
      - tmp-mgsn-825-prettier-write

permissions:
  contents: write

jobs:
  refresh-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mgsn-governed-network-http-825
          fetch-depth: 0
      - run: |
          expected=322f5e7b64a72b4fed59b134db4d5972784da9be
          test "$(git rev-parse HEAD)" = "$expected"
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rebase origin/main
          git push --force-with-lease=refs/heads/mgsn-governed-network-http-825:$expected origin HEAD:mgsn-governed-network-http-825
