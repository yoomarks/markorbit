name: Temporary MGSN 825 Guard Precedence Fix

on:
  push:
    branches:
      - tmp-mgsn-825-prettier-write

permissions:
  contents: write

jobs:
  patch-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: helper
      - uses: actions/checkout@v4
        with:
          ref: mgsn-governed-network-http-825
          path: target
          fetch-depth: 0
      - name: Apply guard precedence fix
        working-directory: target
        run: |
          test "$(git rev-parse HEAD)" = "739331ad06d4260a5156b540a8cfe3dc4f29df0a"
          python3 ../helper/.agents/tmp-mgsn-825-precedence.py
          npx --yes prettier@3.9.6 --write services/mgsn/src/governed-network-http.ts
          git diff --check
      - name: Commit guard precedence fix
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/mgsn/src/governed-network-http.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(mgsn): preserve authority and idempotency guard precedence"
          git push origin HEAD:mgsn-governed-network-http-825
