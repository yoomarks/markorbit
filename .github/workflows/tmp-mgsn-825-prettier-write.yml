name: Temporary MGSN 825 Exact Transport Finish

on:
  push:
    branches:
      - tmp-mgsn-825-prettier-write

permissions:
  contents: write

jobs:
  finish-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: helper
      - uses: actions/checkout@v4
        with:
          ref: mgsn-governed-network-http-825
          path: target
          fetch-depth: 0
      - name: Apply owner-local transport hardening
        working-directory: target
        run: |
          test "$(git rev-parse HEAD)" = "8fb43ca9e911f86ec92e01559b48cf708e59edc9"
          python3 ../helper/.agents/tmp-mgsn-825-finish.py
          npx --yes prettier@3.9.6 --write services/mgsn/src/governed-network-http.ts services/mgsn/tests/governed-network-http.test.ts
          git diff --check
      - name: Commit exact transport hardening
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/mgsn/src/governed-network-http.ts services/mgsn/tests/governed-network-http.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(mgsn): close remaining transport shape gaps"
          git push origin HEAD:mgsn-governed-network-http-825
