name: Temporary MGSN 825 Prettier

on:
  push:
    branches:
      - tmp-mgsn-825-prettier

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          services/mgsn/src/governed-network-http.ts
          services/mgsn/src/index.ts
          services/mgsn/tests/governed-network-http.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: mgsn-825-prettier
          path: |
            services/mgsn/src/governed-network-http.ts
            services/mgsn/src/index.ts
            services/mgsn/tests/governed-network-http.test.ts
