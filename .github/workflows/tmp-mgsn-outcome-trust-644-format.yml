name: TEMP MGSN Outcome Trust 644 format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-format-push:
    if: github.head_ref == 'tmp-mgsn-outcome-trust-644-format'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_mgsn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_mgsn_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      MGSN_TEST_DATABASE_URL: postgres://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_mgsn_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mgsn-outcome-trust-durable
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair exact durable-lineage test fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/mgsn/tests/outcome-trust-evidence-postgres.test.ts')
          s = p.read_text()
          old = "function projection(items: TrustEvidenceItemV1[]): TrustEvidenceVisibilityProjectionV1 {"
          new = """function projection(\n  items: TrustEvidenceItemV1[],\n  contextFingerprintSha256 = outcomeTrustEvidenceFixtureContextV1.contextFingerprintSha256\n): TrustEvidenceVisibilityProjectionV1 {"""
          if old not in s:
              raise SystemExit('projection helper signature not found')
          s = s.replace(old, new, 1)
          old = "    contextFingerprintSha256: outcomeTrustEvidenceFixtureContextV1.contextFingerprintSha256,"
          new = "    contextFingerprintSha256,"
          if old not in s:
              raise SystemExit('projection context property not found')
          s = s.replace(old, new, 1)
          old = """    const divergent = {\n      ...item,\n      limitations: [{ code: 'CONTEXT_LIMITED' as const, explanation: 'Different immutable body.' }]\n    };\n    await expect(repository().putEvidenceItem(divergent)).rejects.toMatchObject({"""
          new = """    const divergent = {\n      ...item,\n      createdAt: '2026-08-26T10:01:00.000Z'\n    };\n    await expect(repository().putEvidenceItem(divergent)).rejects.toMatchObject({"""
          if old not in s:
              raise SystemExit('divergent evidence fixture block not found')
          s = s.replace(old, new, 1)
          old = """    await repository().putEvidenceItem(item);\n    const projected = projection([item]);\n    const wrongContext = {\n      ...projected,\n      contextFingerprintSha256: hash('9')\n    };\n    await expect(service().recordVisibilityProjection(wrongContext)).rejects.toBeInstanceOf("""
          new = """    await repository().putEvidenceItem(item);\n    const wrongContext = projection([item], hash('9'));\n    await expect(service().recordVisibilityProjection(wrongContext)).rejects.toBeInstanceOf("""
          if old not in s:
              raise SystemExit('wrong-context projection fixture block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format exact owner files
        run: pnpm exec prettier --write services/mgsn/src/outcome-trust-evidence-postgres.ts services/mgsn/tests/outcome-trust-evidence-postgres.test.ts
      - name: Build MGSN dependency closure
        run: pnpm turbo run build --filter=@markorbit/mgsn-service...
      - name: MGSN typecheck and lint
        run: |
          pnpm --filter @markorbit/mgsn-service typecheck
          pnpm --filter @markorbit/mgsn-service lint
      - name: Run focused Outcome Trust tests with real PostgreSQL
        run: pnpm --filter @markorbit/mgsn-service exec vitest run tests/outcome-trust-evidence-postgres.test.ts tests/outcome-trust-evidence.test.ts
      - name: Push verified repair and formatting to formal branch
        run: |
          if git diff --quiet -- services/mgsn; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/mgsn/src/outcome-trust-evidence-postgres.ts services/mgsn/tests/outcome-trust-evidence-postgres.test.ts
          git commit -m "[MGSN-P0] Verify durable Outcome & Trust Evidence lineage tests"
          git push origin HEAD:mgsn-outcome-trust-durable
