name: TEMP NEVER MERGE MGSN Public #649 formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mgsn-trusted-public-exposure-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write services/mgsn/docs/TRUSTED-PUBLIC-EXPOSURE-V1.md
      - run: pnpm prettier --check services/mgsn/docs/TRUSTED-PUBLIC-EXPOSURE-V1.md
      - name: Push verified formatting to formal branch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/mgsn/docs/TRUSTED-PUBLIC-EXPOSURE-V1.md
          git commit -m '[MGSN-P0] Format Trusted Public Exposure V1 boundary'
          git push origin HEAD:mgsn-trusted-public-exposure-v1
