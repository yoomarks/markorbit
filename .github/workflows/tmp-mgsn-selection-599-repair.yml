name: tmp-mgsn-selection-599-repair

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  refresh-formal-branch:
    if: github.head_ref == 'tmp-mgsn-selection-599-repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mgsn-selection-durable
          fetch-depth: 0
      - name: Merge exact latest main into formal Selection branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin afbc0371f17d677243bae7530bdfa32466462683
          test "$(git rev-parse FETCH_HEAD)" = "afbc0371f17d677243bae7530bdfa32466462683"
          git merge --no-ff --no-edit FETCH_HEAD
          git push origin HEAD:mgsn-selection-durable
