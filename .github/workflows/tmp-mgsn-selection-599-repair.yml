name: tmp-mgsn-selection-599-repair

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair-formal-branch:
    if: github.head_ref == 'tmp-mgsn-selection-599-repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mgsn-selection-durable
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix exact TypeScript defects
        shell: python
        run: |
          from pathlib import Path
          p = Path('services/mgsn/src/provider-selection-postgres.ts')
          s = p.read_text()
          old = "return structuredClone(value) as ProviderSelectionMutationResultV1;"
          new = "return structuredClone(value) as unknown as ProviderSelectionMutationResultV1;"
          if old not in s:
              raise SystemExit('canonical replay cast target not found')
          s = s.replace(old, new, 1)
          old = "selection.revocationReasonCode ?? null,"
          new = "selection.status === 'REVOKED' ? selection.revocationReasonCode : null,"
          if old not in s:
              raise SystemExit('revocation reason target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('services/mgsn/tests/provider-selection-postgres.test.ts')
          s = p.read_text()
          old = """    const left = structuredClone(fixture.createCommand);\n    const right = structuredClone(fixture.createCommand);\n    left.idempotencyKey = 'provider-selection:598:left';\n    right.idempotencyKey = 'provider-selection:598:right';\n    left.commandFingerprintSha256 = 'a'.repeat(64);\n    right.commandFingerprintSha256 = 'b'.repeat(64);"""
          new = """    const left = {\n      ...structuredClone(fixture.createCommand),\n      idempotencyKey: 'provider-selection:598:left',\n      commandFingerprintSha256: 'a'.repeat(64)\n    };\n    const right = {\n      ...structuredClone(fixture.createCommand),\n      idempotencyKey: 'provider-selection:598:right',\n      commandFingerprintSha256: 'b'.repeat(64)\n    };"""
          if old not in s:
              raise SystemExit('readonly concurrent command target not found')
          p.write_text(s.replace(old, new, 1))
      - name: Format owned files
        run: >-
          pnpm exec prettier --write
          services/mgsn/src/provider-selection-postgres.ts
          services/mgsn/src/durable-runtime.ts
          services/mgsn/tests/provider-selection-postgres.test.ts
      - name: Verify static owner checks
        run: |
          pnpm build:mgsn-provider-registry-deps
          pnpm --filter @markorbit/mgsn-service typecheck
          pnpm --filter @markorbit/mgsn-service lint
      - name: Commit verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/mgsn/src/provider-selection-postgres.ts services/mgsn/src/durable-runtime.ts services/mgsn/tests/provider-selection-postgres.test.ts
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'MGSN: repair durable Provider Selection static checks'
          git push origin HEAD:mgsn-selection-durable
