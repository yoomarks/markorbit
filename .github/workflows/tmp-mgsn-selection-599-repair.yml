name: tmp-mgsn-selection-599-repair

on:
  push:
    branches:
      - tmp-mgsn-selection-599-repair

permissions:
  contents: write

jobs:
  format-and-verify-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mgsn-controlled-handoff-phase-a
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/mgsn/src/controlled-privacy-handoff.ts services/mgsn/src/index.ts services/mgsn/tests/controlled-privacy-handoff.test.ts
      - run: pnpm build:mgsn-provider-registry-deps
      - run: pnpm --filter @markorbit/mgsn-service typecheck
      - run: pnpm --filter @markorbit/mgsn-service lint
      - run: pnpm --filter @markorbit/mgsn-service test
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/mgsn/src/controlled-privacy-handoff.ts services/mgsn/src/index.ts services/mgsn/tests/controlled-privacy-handoff.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'MGSN: format Controlled Handoff Phase A'
          git push origin HEAD:mgsn-controlled-handoff-phase-a
