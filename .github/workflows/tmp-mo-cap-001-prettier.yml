name: Temporary MO-CAP-001 Prettier

on:
  push:
    branches:
      - mo-cap-001-min-runtime-contract

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mo-cap-001-min-runtime-contract
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier
        run: >-
          pnpm exec prettier --write
          packages/contracts/src/capability-runtime.ts
          services/capability-engine/src/capability-runtime.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- packages/contracts/src/capability-runtime.ts services/capability-engine/src/capability-runtime.ts; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/capability-runtime.ts services/capability-engine/src/capability-runtime.ts
          git commit -m "CI: apply canonical Capability runtime formatting"
          git push origin HEAD:mo-cap-001-min-runtime-contract
