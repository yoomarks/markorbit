name: Temporary MO-CAP-002 DeepSeek Lint Fix

on:
  push:
    branches:
      - mo-cap-002-first-provider-deepseek-clean

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mo-cap-002-first-provider-deepseek-clean
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply strict typing fixes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const deepseekPath = 'packages/ai/src/deepseek.ts';
          let deepseek = fs.readFileSync(deepseekPath, 'utf8');
          const oldFirst = '  const first = Array.isArray(choices) ? choices[0] : undefined;';
          const newFirst = '  const first: unknown = Array.isArray(choices) ? (choices as unknown[])[0] : undefined;';
          if (!deepseek.includes(oldFirst)) throw new Error('DeepSeek choices marker not found');
          deepseek = deepseek.replace(oldFirst, newFirst);
          fs.writeFileSync(deepseekPath, deepseek);

          const testPath = 'packages/ai/tests/deepseek.test.ts';
          let test = fs.readFileSync(testPath, 'utf8');
          const oldAssertion = `    expect(transport).toHaveBeenCalledWith(
              expect.objectContaining({
                url: DEEPSEEK_CANONICAL_ENDPOINT,
                timeoutMs: 30_000,
                headers: expect.objectContaining({ authorization: 'Bearer test-secret-never-persist' })
              })
            );`;
          const newAssertion = `    expect(transport).toHaveBeenCalledWith(
              expect.objectContaining({
                url: DEEPSEEK_CANONICAL_ENDPOINT,
                timeoutMs: 30_000
              })
            );
            expect(JSON.stringify(vi.mocked(transport).mock.calls)).toContain(
              'Bearer test-secret-never-persist'
            );`;
          if (!test.includes(oldAssertion)) throw new Error('DeepSeek transport assertion marker not found');
          test = test.replace(oldAssertion, newAssertion);
          fs.writeFileSync(testPath, test);
          NODE
          pnpm exec prettier --write packages/ai/src/deepseek.ts packages/ai/tests/deepseek.test.ts
      - name: Verify focused package
        run: |
          pnpm --filter @markorbit/ai lint
          pnpm --filter @markorbit/ai typecheck
          pnpm --filter @markorbit/ai test
          pnpm --filter @markorbit/ai build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai/src/deepseek.ts packages/ai/tests/deepseek.test.ts
          git commit -m "MO-CAP-002: keep DeepSeek adapter strict-lint safe"
          git push origin HEAD:mo-cap-002-first-provider-deepseek-clean
