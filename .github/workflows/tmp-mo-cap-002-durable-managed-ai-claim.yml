name: Temporary MO-CAP-002 Durable Managed AI Claim Preflight

on:
  push:
    branches:
      - mo-cap-002-durable-managed-ai-claim

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format formal files
        run: >-
          pnpm exec prettier --write
          services/capability-engine/src/index.ts
          services/capability-engine/src/managed-ai-http.ts
          services/capability-engine/src/managed-ai-execution-claim.ts
          services/capability-engine/tests/managed-ai-http.test.ts
          services/capability-engine/tests/managed-ai-execution-claim-postgres.test.ts
          services/capability-engine/package.json
          infrastructure/persistence/migration-owners.json
          infrastructure/persistence/migrations/0064_capability_engine_managed_ai_execution_claims.sql
      - run: pnpm validate:persistence-boundaries
      - run: pnpm exec turbo run build --filter=@markorbit/capability-engine...
      - run: pnpm --filter @markorbit/capability-engine lint
      - run: pnpm --filter @markorbit/capability-engine typecheck
      - run: pnpm --filter @markorbit/capability-engine test
      - name: Create durable claim test database
        env:
          PGPASSWORD: markorbit-test-only
        run: psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE markorbit_capability_managed_ai_test;'
      - name: Prove durable claim behavior in PostgreSQL
        env:
          CAPABILITY_ENGINE_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_capability_managed_ai_test
          CAPABILITY_ENGINE_POSTGRES_TEST_REQUIRED: '1'
        run: pnpm --filter @markorbit/capability-engine test:managed-ai-claim:postgres
      - name: Commit formatted formal files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/capability-engine infrastructure/persistence/migration-owners.json infrastructure/persistence/migrations/0064_capability_engine_managed_ai_execution_claims.sql
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "CI: finalize durable Managed AI claim preflight"
          git push
