name: Temporary MO-CAP-002 Inventory Prettier

on:
  push:
    branches:
      - mo-cap-002-knowledge-ai-inventory

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mo-cap-002-knowledge-ai-inventory
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier
        run: pnpm exec prettier --write docs/audits/MANAGED-AI-MIGRATION-INVENTORY-2026-08-25.md
      - name: Commit formatting
        run: |
          if git diff --quiet -- docs/audits/MANAGED-AI-MIGRATION-INVENTORY-2026-08-25.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/MANAGED-AI-MIGRATION-INVENTORY-2026-08-25.md
          git commit -m "CI: format Managed AI migration inventory"
          git push origin HEAD:mo-cap-002-knowledge-ai-inventory
