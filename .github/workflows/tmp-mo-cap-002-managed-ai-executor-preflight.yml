name: Temporary MO-CAP-002 Managed AI Executor Preflight

on:
  push:
    branches:
      - mo-cap-002-managed-ai-executor

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Apply final Managed AI executor fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('packages/ai/src/managed-executor.ts')
          text = source.read_text()
          old = "}) satisfies Readonly<ManagedAiImplementationProfileV1>;"
          new = "} as const) satisfies Readonly<ManagedAiImplementationProfileV1>;"
          if old not in text:
              raise SystemExit('profile satisfies clause not found')
          source.write_text(text.replace(old, new, 1))

          test = Path('packages/ai/tests/managed-executor.test.ts')
          text = test.read_text()
          old = "    const input = managedInput();\n    input.promptPolicy.policyVersion = '999';"
          new = "    const baseInput = managedInput();\n    const input = {\n      ...baseInput,\n      promptPolicy: {\n        ...baseInput.promptPolicy,\n        policyVersion: '999'\n      }\n    };"
          if old not in text:
              raise SystemExit('policy mismatch test block not found')
          test.write_text(text.replace(old, new, 1))
          PY
      - run: >-
          pnpm exec prettier --write
          packages/ai/src/managed-executor.ts
          packages/ai/tests/managed-executor.test.ts
          packages/ai/src/index.ts
          packages/ai/package.json
          pnpm-lock.yaml
      - run: pnpm --filter @markorbit/contracts build
      - run: pnpm --filter @markorbit/ai build
      - run: pnpm --filter @markorbit/ai lint
      - run: pnpm --filter @markorbit/ai typecheck
      - run: pnpm --filter @markorbit/ai test
      - name: Commit finalized executor files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai/src/managed-executor.ts packages/ai/tests/managed-executor.test.ts packages/ai/src/index.ts packages/ai/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "CI: finalize Managed AI executor preflight"
          git push
