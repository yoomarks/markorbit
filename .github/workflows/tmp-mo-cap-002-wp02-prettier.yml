name: Temporary MO-CAP-002 WP02 Prettier

on:
  push:
    branches:
      - mo-cap-002-wp02-ai-gateway-boundary-clean

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mo-cap-002-wp02-ai-gateway-boundary-clean
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/ai/src/index.ts
      - name: Commit formatting
        run: |
          if git diff --quiet -- packages/ai/src/index.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai/src/index.ts
          git commit -m "CI: format WP02 AI Gateway boundary"
          git push origin HEAD:mo-cap-002-wp02-ai-gateway-boundary-clean
