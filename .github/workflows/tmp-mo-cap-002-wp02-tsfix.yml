name: Temporary MO-CAP-002 WP02 TS Fix

on:
  push:
    branches:
      - mo-cap-002-wp02-ai-gateway-boundary-clean

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mo-cap-002-wp02-ai-gateway-boundary-clean
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preserve runtime guard without impossible static comparison
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'packages/ai/src/index.ts';
          let source = fs.readFileSync(path, 'utf8');
          const before = "  } else if (result.deliveryState === 'PROVIDER_COMPLETED') {";
          const after = "  } else if (String(result.deliveryState) === 'PROVIDER_COMPLETED') {";
          if (!source.includes(before)) throw new Error('runtime delivery guard marker not found');
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE
          pnpm exec prettier --write packages/ai/src/index.ts
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai/src/index.ts
          git commit -m "MO-CAP-002 WP02: keep runtime delivery guard type-safe"
          git push origin HEAD:mo-cap-002-wp02-ai-gateway-boundary-clean
