name: Temporary Phase1 Brain Method Prettier

on:
  push:
    branches:
      - phase1/brain-method-contract-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/brain-method-contract-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 1 contract files
        run: >-
          pnpm exec prettier --write
          packages/contracts/src/brain-method.ts
          packages/contracts/src/brain-method-fallback.ts
          packages/contracts/tests/brain-method.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/contracts/src/brain-method.ts packages/contracts/src/brain-method-fallback.ts packages/contracts/tests/brain-method.test.ts
          git commit -m "style: format Brain Method V1 contracts"
          git push origin HEAD:phase1/brain-method-contract-v1
