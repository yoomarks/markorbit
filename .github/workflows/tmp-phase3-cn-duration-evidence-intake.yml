name: Temporary Phase 3 CN duration evidence intake patch

on:
  push:
    branches:
      - phase3/298-cn-duration-evidence-intake

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3/298-cn-duration-evidence-intake
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Wire package API and CLI
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('packages/contracts/package.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          exports = data['exports']
          if './brain-cn-duration-evidence-intake' not in exports:
              rebuilt = {}
              for key, value in exports.items():
                  rebuilt[key] = value
                  if key == './brain-cn-duration-research':
                      rebuilt['./brain-cn-duration-evidence-intake'] = {
                          'types': './dist/brain-cn-duration-evidence-intake.d.ts',
                          'import': './dist/brain-cn-duration-evidence-intake.js',
                          'default': './dist/brain-cn-duration-evidence-intake.js',
                      }
              data['exports'] = rebuilt
          build = data['scripts']['build']
          marker = 'src/brain-cn-duration-research.ts'
          addition = 'src/brain-cn-duration-evidence-intake.ts'
          if addition not in build:
              build = build.replace(marker, f'{marker} {addition}')
          data['scripts']['build'] = build
          data['scripts']['cn-duration-evidence:intake'] = (
              'tsx src/brain-cn-duration-evidence-intake.ts'
          )
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Format official files
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            packages/contracts/package.json \
            packages/contracts/src/brain-cn-duration-evidence-intake.ts \
            packages/contracts/tests/brain-cn-duration-evidence-intake.test.ts
      - name: Commit package wiring and formatting
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/contracts/package.json packages/contracts/src/brain-cn-duration-evidence-intake.ts packages/contracts/tests/brain-cn-duration-evidence-intake.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Phase 3: wire CN duration evidence intake"
          git push origin HEAD:phase3/298-cn-duration-evidence-intake
