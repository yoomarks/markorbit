name: Temporary Phase 3 CN duration lineage alias patch

on:
  push:
    branches:
      - phase3/298-cn-duration-lineage-alias-guard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3/298-cn-duration-lineage-alias-guard
          fetch-depth: 0
      - name: Apply exact lineage alias guard patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('packages/contracts/src/brain-cn-duration-research.ts')
          text = source.read_text(encoding='utf-8')
          old = """    'selected_fields'\n  );\n\n  const pagination = record(dataset.pagination);"""
          new = """    'selected_fields'\n  );\n\n  const sourceColumnAliases = record(query.source_column_aliases);\n  exactKeys(\n    sourceColumnAliases,\n    ['source_package_id'],\n    'CN duration research dataset query.source_column_aliases'\n  );\n  if (sourceColumnAliases.source_package_id !== 'last_source_package_id') {\n    throw new BrainMethodContractError(\n      'CN duration research source_package_id must map to cn_case_current.last_source_package_id.'\n    );\n  }\n\n  const pagination = record(dataset.pagination);"""
          if text.count(old) != 1:
              raise SystemExit(f'source anchor count={text.count(old)}')
          source.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('packages/contracts/tests/brain-cn-duration-evaluation.test.ts')
          text = test.read_text(encoding='utf-8')
          old = """        'source_rank'\n      ],\n      source_predicate: {"""
          new = """        'source_rank'\n      ],\n      source_column_aliases: {\n        source_package_id: 'last_source_package_id'\n      },\n      source_predicate: {"""
          if text.count(old) != 1:
              raise SystemExit(f'test fixture anchor count={text.count(old)}')
          text = text.replace(old, new)

          old = """  it('rejects a target-host receipt that does not match the dataset identity', () => {"""
          new = """  it('rejects missing or drifted physical source-package lineage aliases', () => {\n    const accepted = dataset();\n    const acceptedQuery = accepted.query as Record<string, unknown>;\n    const missingAliasQuery = { ...acceptedQuery };\n    delete missingAliasQuery.source_column_aliases;\n\n    const missingAlias = evaluateCnDurationResearchV1({\n      dataset: dataset({ query: missingAliasQuery }),\n      acceptanceReceipt: receipt(),\n      firstSummary: summary(),\n      replaySummary: summary()\n    });\n    expect(missingAlias).toEqual({ status: 'REJECTED', reason: 'DATASET_SCOPE_MISMATCH' });\n\n    const wrongAlias = evaluateCnDurationResearchV1({\n      dataset: dataset({\n        query: {\n          ...acceptedQuery,\n          source_column_aliases: { source_package_id: 'source_package_id' }\n        }\n      }),\n      acceptanceReceipt: receipt(),\n      firstSummary: summary(),\n      replaySummary: summary()\n    });\n    expect(wrongAlias).toEqual({ status: 'REJECTED', reason: 'DATASET_SCOPE_MISMATCH' });\n  });\n\n  it('rejects a target-host receipt that does not match the dataset identity', () => {"""
          if text.count(old) != 1:
              raise SystemExit(f'test case anchor count={text.count(old)}')
          test.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/contracts/src/brain-cn-duration-research.ts packages/contracts/tests/brain-cn-duration-evaluation.test.ts
          git diff --cached --check
          git commit -m "Phase 3: freeze CN duration physical lineage alias"
          git push origin HEAD:phase3/298-cn-duration-lineage-alias-guard
