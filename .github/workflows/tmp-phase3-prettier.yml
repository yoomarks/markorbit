name: Temporary Phase 3 Prettier Patch

on:
  pull_request:
    paths:
      - 'packages/contracts/src/brain-cn-duration-research.ts'
      - 'packages/contracts/tests/brain-cn-duration-research.test.ts'
      - '.github/workflows/tmp-phase3-prettier.yml'

permissions:
  contents: read

jobs:
  prettier-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate exact Prettier patch
        run: |
          pnpm exec prettier --write packages/contracts/src/brain-cn-duration-research.ts packages/contracts/tests/brain-cn-duration-research.test.ts
          git diff -- packages/contracts/src/brain-cn-duration-research.ts packages/contracts/tests/brain-cn-duration-research.test.ts > prettier.patch
          cat prettier.patch
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-prettier-patch
          path: prettier.patch
          if-no-files-found: error
