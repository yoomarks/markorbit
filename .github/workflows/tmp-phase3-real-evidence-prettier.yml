name: TEMP Phase3 Real Evidence Prettier

on:
  push:
    branches:
      - phase3/298-real-cn-duration-acceptance

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3/298-real-cn-duration-acceptance
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/contracts/tests/brain-cn-duration-real-evidence-acceptance.test.ts
      - name: Commit formatted test and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/tests/brain-cn-duration-real-evidence-acceptance.test.ts
          git rm .github/workflows/tmp-phase3-real-evidence-prettier.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Phase 3: apply repository Prettier to real evidence test"
          git push origin HEAD:phase3/298-real-cn-duration-acceptance
