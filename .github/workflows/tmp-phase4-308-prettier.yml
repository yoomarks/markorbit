name: Temporary Phase 4 308 Prettier

on:
  push:
    branches:
      - phase4/308-method-package-runtime-bridge
    paths:
      - .github/workflows/tmp-phase4-308-prettier.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4/308-method-package-runtime-bridge
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact Phase 4 files
        run: |
          pnpm exec prettier --write \
            services/capability-engine/src/executable-method-runtime.ts \
            services/capability-engine/src/index.ts \
            services/capability-engine/tests/executable-method-runtime.test.ts
      - name: Remove temporary workflow and commit formatted files
        run: |
          rm .github/workflows/tmp-phase4-308-prettier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 4: format executable method runtime bridge"
          git push origin HEAD:phase4/308-method-package-runtime-bridge
