name: tmp-phase4-312-build

on:
  push:
    branches:
      - phase4/312-cn-prelim-publication-discovery-capability

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire additive Discovery exports
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing: {path}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace(
              'packages/contracts/src/data-engine.ts',
              "  'TTAB_PROCEEDING_FACTS'\n] as const;",
              "  'TTAB_PROCEEDING_FACTS',\n  'PRELIMINARY_PUBLICATION_FACT_DISCOVERY'\n] as const;",
          )
          replace(
              'packages/contracts/package.json',
              '    "./data-engine": {\n      "types": "./dist/data-engine.d.ts",\n      "import": "./dist/data-engine.js"\n    },',
              '    "./data-engine": {\n      "types": "./dist/data-engine.d.ts",\n      "import": "./dist/data-engine.js"\n    },\n    "./data-engine-discovery": {\n      "types": "./dist/data-engine-discovery.d.ts",\n      "import": "./dist/data-engine-discovery.js"\n    },',
          )
          replace(
              'packages/contracts/package.json',
              'src/daily-source.ts src/data-engine.ts src/capability-learning.ts',
              'src/daily-source.ts src/data-engine.ts src/data-engine-discovery.ts src/capability-learning.ts',
          )
          replace(
              'apps/gateway/package.json',
              'src/index.ts src/main.ts src/data-engine-http.ts --format esm',
              'src/index.ts src/main.ts src/data-engine-http.ts src/data-engine-discovery-http.ts --format esm',
          )
          replace(
              'apps/gateway/package.json',
              '    "./data-engine": {\n      "types": "./dist/data-engine-http.d.ts",\n      "import": "./dist/data-engine-http.js"\n    }',
              '    "./data-engine": {\n      "types": "./dist/data-engine-http.d.ts",\n      "import": "./dist/data-engine-http.js"\n    },\n    "./data-engine-discovery": {\n      "types": "./dist/data-engine-discovery-http.d.ts",\n      "import": "./dist/data-engine-discovery-http.js"\n    }',
          )
          replace(
              'services/capability-engine/src/index.ts',
              "export * from './cn-duration-band-classification-pilot.js';",
              "export * from './cn-duration-band-classification-pilot.js';\nexport * from './cn-preliminary-publication-discovery-pilot.js';",
          )
          PY
      - name: Format Discovery slice
        run: |
          pnpm exec prettier --write \
            packages/contracts/src/data-engine.ts \
            packages/contracts/src/data-engine-discovery.ts \
            packages/contracts/tests/data-engine-discovery-contract.test.ts \
            packages/contracts/package.json \
            apps/gateway/src/data-engine-discovery-http.ts \
            apps/gateway/tests/data-engine-discovery-http.test.ts \
            apps/gateway/package.json \
            services/capability-engine/src/cn-preliminary-publication-discovery-pilot.ts \
            services/capability-engine/tests/cn-preliminary-publication-discovery-pilot.test.ts \
            services/capability-engine/src/index.ts
      - name: Build shared dependencies
        run: |
          pnpm --filter @markorbit/contracts build
          pnpm --filter @markorbit/events build
          pnpm --filter @markorbit/service-kit build
      - name: Contracts safe lint fixups
        run: |
          pnpm --filter @markorbit/contracts exec eslint \
            src/data-engine-discovery.ts \
            tests/data-engine-discovery-contract.test.ts --fix
      - name: Contracts checks
        run: |
          pnpm --filter @markorbit/contracts lint
          pnpm --filter @markorbit/contracts typecheck
          pnpm --filter @markorbit/contracts test -- data-engine-discovery-contract.test.ts
      - name: Gateway checks
        run: |
          pnpm --filter @markorbit/gateway build
          pnpm --filter @markorbit/gateway exec eslint \
            src/data-engine-discovery-http.ts \
            tests/data-engine-discovery-http.test.ts --fix
          pnpm --filter @markorbit/gateway lint
          pnpm --filter @markorbit/gateway typecheck
          pnpm --filter @markorbit/gateway test -- data-engine-discovery-http.test.ts
      - name: Capability checks
        run: |
          pnpm --filter @markorbit/capability-engine build
          pnpm --filter @markorbit/capability-engine exec eslint \
            src/cn-preliminary-publication-discovery-pilot.ts \
            tests/cn-preliminary-publication-discovery-pilot.test.ts --fix
          pnpm --filter @markorbit/capability-engine lint
          pnpm --filter @markorbit/capability-engine typecheck
          pnpm --filter @markorbit/capability-engine test -- cn-preliminary-publication-discovery-pilot.test.ts
      - name: Commit validated slice and remove helper workflow
        run: |
          rm .github/workflows/tmp-phase4-312-build.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Phase 4: wire bounded CN preliminary publication Discovery"
          git push origin HEAD:phase4/312-cn-prelim-publication-discovery-capability
