name: tmp-phase4-312-runtime-export

on:
  push:
    branches:
      - phase4/312-cn-prelim-publication-discovery-capability

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add runtime default exports
        run: |
          python - <<'PY'
          from pathlib import Path

          patches = {
              'packages/contracts/package.json': (
                  '    "./data-engine-discovery": {\n      "types": "./dist/data-engine-discovery.d.ts",\n      "import": "./dist/data-engine-discovery.js"\n    },',
                  '    "./data-engine-discovery": {\n      "types": "./dist/data-engine-discovery.d.ts",\n      "import": "./dist/data-engine-discovery.js",\n      "default": "./dist/data-engine-discovery.js"\n    },',
              ),
              'apps/gateway/package.json': (
                  '    "./data-engine-discovery": {\n      "types": "./dist/data-engine-discovery-http.d.ts",\n      "import": "./dist/data-engine-discovery-http.js"\n    }',
                  '    "./data-engine-discovery": {\n      "types": "./dist/data-engine-discovery-http.d.ts",\n      "import": "./dist/data-engine-discovery-http.js",\n      "default": "./dist/data-engine-discovery-http.js"\n    }',
              ),
          }
          for path, (old, new) in patches.items():
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected runtime export anchor missing: {path}')
              p.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write packages/contracts/package.json apps/gateway/package.json
      - name: Build runtime dependency closure
        run: |
          pnpm --filter @markorbit/contracts build
          pnpm --filter @markorbit/events build
          pnpm --filter @markorbit/service-kit build
          pnpm --filter @markorbit/gateway build
          pnpm --filter @markorbit/capability-engine build
      - name: Verify tsx runtime subpath resolution
        run: |
          pnpm --filter @markorbit/capability-engine exec tsx -e "import('@markorbit/contracts/data-engine-discovery').then((m) => { if (!m.DATA_ENGINE_DISCOVERY_CONTRACT_VERSION) process.exit(1); console.log('contracts discovery runtime export ok'); })"
          pnpm --filter @markorbit/gateway exec tsx -e "import('@markorbit/gateway/data-engine-discovery').then((m) => { if (!m.createCnPreliminaryPublicationDiscoveryClientV2) process.exit(1); console.log('gateway discovery runtime export ok'); })"
      - name: Remove helper and commit fix
        run: |
          rm .github/workflows/tmp-phase4-312-runtime-export.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: expose Discovery subpaths to runtime loaders"
          git push origin HEAD:phase4/312-cn-prelim-publication-discovery-capability
