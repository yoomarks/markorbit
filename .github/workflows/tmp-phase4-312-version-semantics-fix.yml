name: tmp-phase4-312-version-semantics-fix

on:
  push:
    branches:
      - phase4/312-cn-prelim-publication-discovery-capability

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Align Discovery source-version semantics with provider contract
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('packages/contracts/src/data-engine-discovery.ts')
          text = source.read_text()
          old = """  if (\n    !payload ||\n    payload.snapshot.source_version !== envelope.engine_version ||\n    payload.provenance.engine_version !== envelope.engine_version\n  ) {\n    return null;\n  }\n"""
          new = """  if (\n    !payload ||\n    payload.provenance.engine_version !== payload.snapshot.source_version\n  ) {\n    return null;\n  }\n"""
          if old not in text:
              raise SystemExit('Discovery envelope version patch anchor missing')
          source.write_text(text.replace(old, new, 1))

          test = Path('packages/contracts/tests/data-engine-discovery-contract.test.ts')
          text = test.read_text()
          old = """  it('rejects envelope engine-version drift', () => {\n    expect(\n      parseCnPreliminaryPublicationDiscoveryEnvelopeV2({ ...envelope(), engine_version: 'other' })\n    ).toBeNull();\n  });\n"""
          new = """  it('keeps integration release version separate from exact Discovery source version', () => {\n    expect(\n      parseCnPreliminaryPublicationDiscoveryEnvelopeV2({\n        ...envelope(),\n        engine_version: '0.4.0'\n      })\n    ).not.toBeNull();\n\n    const internalDrift = page();\n    internalDrift.provenance.engine_version = 'git:different';\n    expect(parseCnPreliminaryPublicationDiscoveryEnvelopeV2(envelope(internalDrift))).toBeNull();\n  });\n"""
          if old not in text:
              raise SystemExit('Discovery version test patch anchor missing')
          test.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write \
            packages/contracts/src/data-engine-discovery.ts \
            packages/contracts/tests/data-engine-discovery-contract.test.ts
      - name: Build and verify focused Discovery contract
        run: |
          pnpm --filter @markorbit/contracts build
          pnpm --filter @markorbit/contracts lint
          pnpm --filter @markorbit/contracts typecheck
          pnpm --filter @markorbit/contracts exec vitest run tests/data-engine-discovery-contract.test.ts
      - name: Remove helper and commit validated fix
        run: |
          rm .github/workflows/tmp-phase4-312-version-semantics-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: align Discovery source-version semantics with provider"
          git push origin HEAD:phase4/312-cn-prelim-publication-discovery-capability
