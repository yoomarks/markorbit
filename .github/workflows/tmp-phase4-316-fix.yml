name: Phase 4 316 Export Format Fix

on:
  push:
    branches:
      - phase4/316-cn-duration-band-classification
    paths:
      - .github/workflows/tmp-phase4-316-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4/316-cn-duration-band-classification
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add formal export, format and verify
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'packages/contracts/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.exports['./brain-cn-duration-band-classification'] = {
            types: './dist/brain-cn-duration-band-classification.d.ts',
            import: './dist/brain-cn-duration-band-classification.js',
            default: './dist/brain-cn-duration-band-classification.js'
          };
          const entry = 'src/brain-cn-duration-band-classification.ts';
          if (!pkg.scripts.build.includes(entry)) {
            pkg.scripts.build = pkg.scripts.build.replace(
              'src/brain-cn-duration-research.ts',
              `src/brain-cn-duration-research.ts ${entry}`
            );
          }
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          pnpm exec prettier --write packages/contracts/package.json packages/contracts/src/brain-cn-duration-band-classification.ts
          pnpm --filter @markorbit/contracts build
          pnpm --filter @markorbit/contracts typecheck
          pnpm --filter @markorbit/contracts test
          rm .github/workflows/tmp-phase4-316-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/contracts/package.json packages/contracts/src/brain-cn-duration-band-classification.ts .github/workflows/tmp-phase4-316-fix.yml
          git commit -m 'fix: export and format CN duration classifier'
          git push origin HEAD:phase4/316-cn-duration-band-classification
