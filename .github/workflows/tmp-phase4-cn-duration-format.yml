name: Temporary Phase 4 CN duration formatter

on:
  push:
    branches:
      - phase4/309-cn-duration-analytical-pilot

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4/309-cn-duration-analytical-pilot
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier to Phase 4 files only
        run: >-
          pnpm exec prettier --write
          packages/contracts/package.json
          packages/contracts/src/brain-method-activation.ts
          packages/contracts/tests/brain-method-activation.test.ts
          services/capability-engine/src/cn-duration-analytical-pilot.ts
          services/capability-engine/tests/cn-duration-analytical-pilot.test.ts
      - name: Commit formatted files and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/contracts/package.json \
            packages/contracts/src/brain-method-activation.ts \
            packages/contracts/tests/brain-method-activation.test.ts \
            services/capability-engine/src/cn-duration-analytical-pilot.ts \
            services/capability-engine/tests/cn-duration-analytical-pilot.test.ts
          git rm .github/workflows/tmp-phase4-cn-duration-format.yml
          git commit -m 'style: format Phase 4 CN analytical pilot'
          git push origin HEAD:phase4/309-cn-duration-analytical-pilot
