name: Phase 5 Test Format Fix

on:
  push:
    branches:
      - phase5/324-markreg-matter-intelligence-observation
    paths:
      - .github/workflows/tmp-phase5-format-test.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5/324-markreg-matter-intelligence-observation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 5 test and self-remove
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write services/markreg/tests/matter-intelligence.test.ts
          pnpm exec prettier --check services/markreg/tests/matter-intelligence.test.ts
          git rm .github/workflows/tmp-phase5-format-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/markreg/tests/matter-intelligence.test.ts
          git diff --cached --check
          git commit -m 'style: format Phase 5 MarkReg intelligence tests'
          git push origin HEAD:phase5/324-markreg-matter-intelligence-observation
