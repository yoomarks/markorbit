name: Phase 5 Owner Fix

on:
  push:
    branches:
      - phase5/324-markreg-matter-intelligence-observation
    paths:
      - .github/workflows/tmp-phase5-owner-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5/324-markreg-matter-intelligence-observation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add explicit command-ledger ownership and self-remove
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'infrastructure/persistence/migration-owners.json';
          const value = JSON.parse(fs.readFileSync(path, 'utf8'));
          value.namespaces.markreg_matter_intelligence_commands = '@markorbit/markreg-service';
          fs.writeFileSync(path, JSON.stringify(value, null, 2) + '\n');
          NODE
          git rm .github/workflows/tmp-phase5-owner-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add infrastructure/persistence/migration-owners.json
          git diff --cached --check
          git commit -m 'fix: own Phase 5 MarkReg command ledger explicitly'
          git push origin HEAD:phase5/324-markreg-matter-intelligence-observation
