name: Temporary Phase 6 333 Contract Reconcile

on:
  push:
    branches:
      - phase6/331-markreg-intelligence-review-source

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6/331-markreg-intelligence-review-source
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile contract semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/contracts/src/method-outcome-evidence.ts')
          s = p.read_text()
          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'missing expected contract fragment: {old[:80]!r}')
              s = s.replace(old, new)
          rep("export const matterIntelligenceReviewOutcomes = [\n  'CONFIRMED_AS_PRESENTED',\n  'OVERRIDDEN',\n  'INCONCLUSIVE'\n] as const;",
              "export const matterIntelligenceReviewOutcomes = ['CONFIRMED', 'OVERRIDDEN', 'INCONCLUSIVE'] as const;")
          rep("export const matterIntelligenceReviewReasonCodes = [\n  'INDEPENDENT_REVIEW_CONFIRMED',\n  'METHOD_OUTPUT_INCORRECT',\n  'APPLICABILITY_MISMATCH',\n  'INPUT_FACT_INCORRECT',\n  'SOURCE_DATA_OR_REFERENCE_STALE',\n  'PRODUCT_OR_WORKFLOW_PREFERENCE',\n  'INSUFFICIENT_EVIDENCE'\n] as const;",
              "export const matterIntelligenceReviewReasonCodes = [\n  'METHOD_ERROR',\n  'INPUT_DATA_ERROR',\n  'APPLICABILITY_ERROR',\n  'PRODUCT_USER_PREFERENCE',\n  'INCONCLUSIVE_EVIDENCE'\n] as const;")
          rep("    sourceVersion: 1;", "    sourceVersion: number;")
          rep("    reasonCode: MatterIntelligenceReviewReasonCode;", "    reasonCode?: MatterIntelligenceReviewReasonCode;")
          old = """export function assertMatterIntelligenceReviewTaxonomy(\n  outcome: MatterIntelligenceReviewOutcome,\n  reasonCode: MatterIntelligenceReviewReasonCode\n): void {\n  const valid =\n    (outcome === 'CONFIRMED_AS_PRESENTED' && reasonCode === 'INDEPENDENT_REVIEW_CONFIRMED') ||\n    (outcome === 'INCONCLUSIVE' && reasonCode === 'INSUFFICIENT_EVIDENCE') ||\n    (outcome === 'OVERRIDDEN' &&\n      [\n        'METHOD_OUTPUT_INCORRECT',\n        'APPLICABILITY_MISMATCH',\n        'INPUT_FACT_INCORRECT',\n        'SOURCE_DATA_OR_REFERENCE_STALE',\n        'PRODUCT_OR_WORKFLOW_PREFERENCE'\n      ].includes(reasonCode));\n  if (!valid)\n    throw new MethodOutcomeEvidenceContractError(\n      `Review outcome ${outcome} cannot use reason ${reasonCode}.`\n    );\n}\n"""
          new = """export function assertMatterIntelligenceReviewTaxonomy(\n  outcome: MatterIntelligenceReviewOutcome,\n  reasonCode?: MatterIntelligenceReviewReasonCode\n): void {\n  const valid =\n    (outcome === 'CONFIRMED' && reasonCode === undefined) ||\n    (outcome === 'INCONCLUSIVE' && reasonCode === 'INCONCLUSIVE_EVIDENCE') ||\n    (outcome === 'OVERRIDDEN' &&\n      reasonCode !== undefined &&\n      ['METHOD_ERROR', 'INPUT_DATA_ERROR', 'APPLICABILITY_ERROR', 'PRODUCT_USER_PREFERENCE'].includes(\n        reasonCode\n      ));\n  if (!valid)\n    throw new MethodOutcomeEvidenceContractError(\n      `Review outcome ${outcome} cannot use reason ${String(reasonCode)}.`\n    );\n}\n"""
          rep(old, new)
          rep("  const reasonCode = reviewReason(review.reasonCode);\n  assertMatterIntelligenceReviewTaxonomy(outcome, reasonCode);",
              "  const reasonCode =\n    review.reasonCode === undefined ? undefined : reviewReason(review.reasonCode);\n  assertMatterIntelligenceReviewTaxonomy(outcome, reasonCode);")
          rep("      sourceVersion: 1,", "      sourceVersion: positiveInteger(source.sourceVersion, 'source.sourceVersion'),")
          rep("      outcome,\n      reasonCode,\n      ...(rationale ? { rationale } : {}),",
              "      outcome,\n      ...(reasonCode ? { reasonCode } : {}),\n      ...(rationale ? { rationale } : {}),")
          rep("    source.owner !== 'MARKREG' ||\n    source.kind !== 'MATTER_INTELLIGENCE_REVIEW' ||\n    source.sourceVersion !== 1",
              "    source.owner !== 'MARKREG' ||\n    source.kind !== 'MATTER_INTELLIGENCE_REVIEW'")
          rep("      'source must identify a MARKREG MATTER_INTELLIGENCE_REVIEW version 1.'",
              "      'source must identify a MARKREG MATTER_INTELLIGENCE_REVIEW.'")
          p.write_text(s)

          t = Path('packages/contracts/tests/method-outcome-evidence.test.ts')
          x = t.read_text()
          x = x.replace("METHOD_OUTPUT_INCORRECT", "METHOD_ERROR")
          x = x.replace("PRODUCT_OR_WORKFLOW_PREFERENCE", "PRODUCT_USER_PREFERENCE")
          x = x.replace("INSUFFICIENT_EVIDENCE", "INCONCLUSIVE_EVIDENCE")
          x = x.replace("assertMatterIntelligenceReviewTaxonomy(\n        'CONFIRMED_AS_PRESENTED',\n        'INDEPENDENT_REVIEW_CONFIRMED'\n      )", "assertMatterIntelligenceReviewTaxonomy('CONFIRMED')")
          x = x.replace("assertMatterIntelligenceReviewTaxonomy('CONFIRMED_AS_PRESENTED', 'METHOD_ERROR')", "assertMatterIntelligenceReviewTaxonomy('CONFIRMED', 'METHOD_ERROR')")
          t.write_text(x)
          PY
          pnpm exec prettier --write packages/contracts/src/method-outcome-evidence.ts packages/contracts/tests/method-outcome-evidence.test.ts
          pnpm --filter @markorbit/contracts build
          pnpm --filter @markorbit/contracts typecheck
          pnpm --filter @markorbit/contracts test -- method-outcome-evidence.test.ts
      - name: Commit and self-remove
        run: |
          rm .github/workflows/tmp-phase6-333-contract-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/method-outcome-evidence.ts packages/contracts/tests/method-outcome-evidence.test.ts .github/workflows/tmp-phase6-333-contract-reconcile.yml
          git commit -m "fix: align Phase 6 review contract with #330"
          git push origin HEAD:phase6/331-markreg-intelligence-review-source
