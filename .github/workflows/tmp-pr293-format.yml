name: Temporary PR293 Format

on:
  push:
    branches:
      - phase2/uspto-official-fee-brain-method

permissions:
  contents: write

jobs:
  format-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2/uspto-official-fee-brain-method
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target and remove temporary workflow
        run: |
          pnpm exec prettier --write packages/contracts/src/brain-official-fee-method.ts
          git rm .github/workflows/tmp-pr293-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/brain-official-fee-method.ts
          git commit -m "style(brain): format official fee method"
          git push origin HEAD:phase2/uspto-official-fee-brain-method
