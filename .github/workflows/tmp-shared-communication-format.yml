name: Temporary Shared Communication Format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix/shared-communication-exact-evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/capability-engine/src/managed-communication-exact-evidence.ts services/capability-engine/tests/managed-communication-exact-evidence.test.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/capability-engine/src/managed-communication-exact-evidence.ts services/capability-engine/tests/managed-communication-exact-evidence.test.ts
          git commit -m "style: format Shared Communication exact evidence"
          git push origin HEAD:${{ github.head_ref }}
