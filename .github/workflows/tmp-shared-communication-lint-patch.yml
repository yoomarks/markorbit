name: Temporary Shared Communication Lint Patch

on:
  push:
    branches: [fix/shared-communication-exact-evidence]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shared-communication-exact-evidence
      - name: Patch lint findings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/capability-engine/src/managed-communication-exact-evidence.ts')
          s = p.read_text()
          s = s.replace(
          """  const normalized = headers.map((header, index) => {""",
          """  const normalized = headers.map((header: ManagedCommunicationEvidenceHeaderV1, index) => {""")
          s = s.replace(
          """    } catch (error) {\n      return Promise.reject(error);\n    }""",
          """    } catch (error) {\n      return Promise.reject(\n        error instanceof Error ? error : new Error('Unexpected exact evidence admission error.')\n      );\n    }""")
          p.write_text(s)
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write services/capability-engine/src/managed-communication-exact-evidence.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/capability-engine/src/managed-communication-exact-evidence.ts
          git commit -m "fix: satisfy exact evidence lint"
          git push origin HEAD:fix/shared-communication-exact-evidence
