name: TMP WP05 format once

on:
  push:
    branches:
      - agent/tmp-wp05-format-once
    paths:
      - .github/workflows/tmp-wp05-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tmp-wp05-format-once
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format WP05 files
        run: |
          pnpm exec prettier --write apps/operations-console/src/commercial-admin.tsx services/markreg/tests/commercial-admin-read.test.ts
          pnpm exec prettier --check apps/operations-console/src/commercial-admin.tsx services/markreg/tests/commercial-admin-read.test.ts
      - name: Commit formatted files and remove one-shot workflow
        run: |
          git config user.name "markorbit-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tmp-wp05-format-once.yml
          git add apps/operations-console/src/commercial-admin.tsx services/markreg/tests/commercial-admin-read.test.ts
          git commit -m "style(wp05): format commercial admin files"
          git push origin HEAD:agent/tmp-wp05-format-once
