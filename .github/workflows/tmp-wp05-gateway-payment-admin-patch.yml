name: TMP WP05 Gateway Payment Admin Patch

on:
  push:
    branches:
      - agent/m8-wp05-commercial-admin-operator-control
    paths:
      - .github/workflows/tmp-wp05-gateway-payment-admin-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m8-wp05-commercial-admin-operator-control
      - name: Patch Gateway runtime
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/gateway/src/index.ts')
          text = path.read_text()

          export_anchor = "export * from './payment-http.js';\n"
          if export_anchor not in text:
              raise SystemExit('export anchor not found')
          text = text.replace(
              export_anchor,
              export_anchor + "export * from './commercial-admin-payment-http.js';\n",
              1
          )

          import_anchor = "import { createGatewayPaymentRoutes } from './payment-http.js';\n"
          if import_anchor not in text:
              raise SystemExit('import anchor not found')
          text = text.replace(
              import_anchor,
              import_anchor + "import { createGatewayCommercialAdminPaymentRoutes } from './commercial-admin-payment-http.js';\n",
              1
          )

          mount_anchor = """        ...createGatewayPaymentRoutes({\n          paymentUrl,\n          ...(authenticationClient ? { authenticationClient } : {}),\n          ...((options.internalServiceSecret ?? process.env.MO_INTERNAL_SERVICE_SECRET)\n            ? {\n                internalServiceSecret: (options.internalServiceSecret ??\n                  process.env.MO_INTERNAL_SERVICE_SECRET)!\n              }\n            : {}),\n          csrfSecret,\n          allowedOrigins\n        }),\n"""
          mount_insert = """        ...createGatewayCommercialAdminPaymentRoutes({\n          paymentUrl,\n          ...(authenticationClient ? { authenticationClient } : {}),\n          ...((options.internalServiceSecret ?? process.env.MO_INTERNAL_SERVICE_SECRET)\n            ? {\n                internalServiceSecret: (options.internalServiceSecret ??\n                  process.env.MO_INTERNAL_SERVICE_SECRET)!\n              }\n            : {})\n        }),\n"""
          if mount_anchor not in text:
              raise SystemExit('mount anchor not found')
          text = text.replace(mount_anchor, mount_anchor + mount_insert, 1)
          path.write_text(text)
      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "markorbit-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tmp-wp05-gateway-payment-admin-patch.yml
          git add apps/gateway/src/index.ts
          git commit -m "feat(m8): mount Gateway Payment admin reads"
          git push origin HEAD:agent/m8-wp05-commercial-admin-operator-control
