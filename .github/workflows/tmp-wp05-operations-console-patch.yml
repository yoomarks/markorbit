name: TMP WP05 Operations Console Patch

on:
  push:
    branches:
      - agent/m8-wp05-commercial-admin-operator-control
    paths:
      - .github/workflows/tmp-wp05-operations-console-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m8-wp05-commercial-admin-operator-control
      - name: Patch Operations Console
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/operations-console/src/App.tsx')
          text = path.read_text()

          import_anchor = "} from './lifecycle.js';\n"
          if import_anchor not in text:
              raise SystemExit('lifecycle import anchor not found')
          text = text.replace(
              import_anchor,
              import_anchor + "import { CommercialAdminWorkspace } from './commercial-admin.js';\n",
              1
          )

          nav_anchor = "{ label: 'Overview', href: '#overview', active: true },\n"
          if nav_anchor not in text:
              raise SystemExit('navigation anchor not found')
          text = text.replace(
              nav_anchor,
              nav_anchor + "            { label: 'Commercial operations', href: '#commercial-admin' },\n",
              1
          )

          start = text.find('      <div className="mo-grid" id="overview">')
          end_marker = '\n\n      <section id="evidence-review"'
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('overview replacement boundary not found')
          replacement = '''      <section id="overview" aria-labelledby="operations-overview-heading">
        <Alert tone="info" title="Live authority only">
          Synthetic service-health counters and placeholder queue totals have been removed. Use the
          governed commercial views below or the evidence/lifecycle owner routes for live operational
          truth.
        </Alert>
      </section>

      <CommercialAdminWorkspace />'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git config user.name "markorbit-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tmp-wp05-operations-console-patch.yml
          git add apps/operations-console/src/App.tsx
          git commit -m "feat(m8): mount commercial operations workspace"
          git push origin HEAD:agent/m8-wp05-commercial-admin-operator-control
