name: TMP WP05 Payment Admin Postgres Patch

on:
  push:
    branches:
      - agent/m8-wp05-commercial-admin-operator-control
    paths:
      - .github/workflows/tmp-wp05-payment-admin-postgres-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m8-wp05-commercial-admin-operator-control
      - name: Patch Payment postgres admin reads
        shell: python
        run: |
          from pathlib import Path

          path = Path('services/payment/src/payment-postgres.ts')
          text = path.read_text()

          import_anchor = """  type PaymentReconciliationObservation,\n  type PaymentRefund,\n"""
          if import_anchor not in text:
              raise SystemExit('payment import anchor not found')

          map_anchor = """function replayFromRow(row: Row): PaymentInitiationReplay {\n"""
          map_insert = """function mapReconciliation(row: Row): PaymentReconciliationObservation {\n  const value: PaymentReconciliationObservation = {\n    schemaVersion: 1,\n    reconciliationId: String(row.reconciliation_id) as PaymentReconciliationObservation['reconciliationId'],\n    workspaceId: String(row.workspace_id),\n    paymentId: String(row.payment_id) as PaymentId,\n    provider: String(row.provider),\n    providerPaymentReference: String(row.provider_payment_reference),\n    localStatus: String(row.local_status) as PaymentReconciliationObservation['localStatus'],\n    observedProviderStatus: String(row.observed_provider_status),\n    localAmount: {\n      amountMinor: Number(row.local_amount_minor),\n      currency: String(row.currency)\n    },\n    observedAmount: {\n      amountMinor: Number(row.observed_amount_minor),\n      currency: String(row.observed_currency)\n    },\n    classification: String(\n      row.classification\n    ) as PaymentReconciliationObservation['classification'],\n    disposition: String(row.disposition) as PaymentReconciliationObservation['disposition'],\n    ...(typeof row.operator_note === 'string' ? { operatorNote: row.operator_note } : {}),\n    observedAt: iso(row.observed_at),\n    createdAt: iso(row.created_at),\n    updatedAt: iso(row.updated_at)\n  };\n  assertPaymentReconciliation(value);\n  return value;\n}\n\n"""
          if map_anchor not in text:
              raise SystemExit('map anchor not found')
          text = text.replace(map_anchor, map_insert + map_anchor, 1)

          method_anchor = """  async findByProviderPaymentReference(\n"""
          methods = """  async listAttempts(paymentId: PaymentId): Promise<readonly PaymentAttempt[]> {\n    try {\n      const result = await this.query.query(\n        'SELECT * FROM payment_attempts WHERE payment_id=$1 ORDER BY attempt_number ASC',\n        [paymentId]\n      );\n      return result.rows.map((row) => mapAttempt(row as Row));\n    } catch (cause) {\n      throw lifecycleUnavailable(cause);\n    }\n  }\n\n  async listProviderEvents(\n    paymentId: PaymentId\n  ): Promise<readonly PaymentProviderEventReceipt[]> {\n    try {\n      const result = await this.query.query(\n        `SELECT * FROM payment_provider_event_receipts\n         WHERE payment_id=$1\n            OR refund_id IN (SELECT refund_id FROM payment_refunds WHERE payment_id=$1)\n         ORDER BY occurred_at ASC, receipt_id ASC`,\n        [paymentId]\n      );\n      return result.rows.map((row) => mapReceipt(row as Row));\n    } catch (cause) {\n      throw lifecycleUnavailable(cause);\n    }\n  }\n\n  async listRefunds(\n    workspaceId: string,\n    paymentId: PaymentId\n  ): Promise<readonly PaymentRefund[]> {\n    try {\n      const result = await this.query.query(\n        `SELECT * FROM payment_refunds\n         WHERE workspace_id=$1 AND payment_id=$2\n         ORDER BY created_at ASC, refund_id ASC`,\n        [workspaceId, paymentId]\n      );\n      return result.rows.map((row) => mapRefund(row as Row));\n    } catch (cause) {\n      throw lifecycleUnavailable(cause);\n    }\n  }\n\n  async listReconciliations(\n    workspaceId: string,\n    paymentId: PaymentId\n  ): Promise<readonly PaymentReconciliationObservation[]> {\n    try {\n      const result = await this.query.query(\n        `SELECT * FROM payment_reconciliations\n         WHERE workspace_id=$1 AND payment_id=$2\n         ORDER BY observed_at DESC, reconciliation_id DESC`,\n        [workspaceId, paymentId]\n      );\n      return result.rows.map((row) => mapReconciliation(row as Row));\n    } catch (cause) {\n      throw lifecycleUnavailable(cause);\n    }\n  }\n\n"""
          if method_anchor not in text:
              raise SystemExit('method anchor not found')
          text = text.replace(method_anchor, methods + method_anchor, 1)
          path.write_text(text)
      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "markorbit-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tmp-wp05-payment-admin-postgres-patch.yml
          git add services/payment/src/payment-postgres.ts
          git commit -m "feat(m8): add Payment admin history reads"
          git push origin HEAD:agent/m8-wp05-commercial-admin-operator-control
