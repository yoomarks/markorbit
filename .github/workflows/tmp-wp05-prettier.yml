name: Temporary WP05 Prettier

on:
  push:
    branches:
      - agent/m9-wp05-visual-bridge
    paths:
      - '.github/workflows/tmp-wp05-prettier.yml'
      - 'services/lite/src/visual-bridge.ts'
      - 'services/lite/src/visual-bridge-http.ts'
      - 'services/lite/tests/visual-bridge-postgres.test.ts'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m9-wp05-visual-bridge
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format exact WP05 files
        run: |
          pnpm exec prettier --write \
            services/lite/src/visual-bridge.ts \
            services/lite/src/visual-bridge-http.ts \
            services/lite/tests/visual-bridge-postgres.test.ts
      - name: Commit formatted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/lite/src/visual-bridge.ts \
            services/lite/src/visual-bridge-http.ts \
            services/lite/tests/visual-bridge-postgres.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'M9 WP05: format visual bridge'
            git push origin HEAD:agent/m9-wp05-visual-bridge
          fi
