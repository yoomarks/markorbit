name: Temporary WP06 Prettier

on:
  push:
    branches:
      - agent/m10-wp06-marketplace-reference

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m10-wp06-marketplace-reference
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format WP06 files and self-clean
        run: |
          pnpm exec prettier --write \
            packages/contracts/src/trademark-asset-marketplace-reference.ts \
            services/lite/src/trademark-asset-marketplace-reference.ts
          git rm .github/workflows/tmp-wp06-prettier.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/contracts/src/trademark-asset-marketplace-reference.ts services/lite/src/trademark-asset-marketplace-reference.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: apply repository Prettier to M10 WP06"
          git push origin HEAD:agent/m10-wp06-marketplace-reference
