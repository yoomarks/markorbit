name: Temporary WP114 Prettier

on:
  push:
    branches: [agent/tmp-wp114-prettier]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tmp-wp114-prettier
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/m8-wp-07-independent-commercial-readiness-audit.mjs
      - name: Commit formatted script
        run: |
          if git diff --quiet -- scripts/m8-wp-07-independent-commercial-readiness-audit.mjs; then
            exit 0
          fi
          git config user.name "markorbit-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/m8-wp-07-independent-commercial-readiness-audit.mjs
          git commit -m "style(m8): format repeatable WP07 audit"
          git push origin HEAD:agent/tmp-wp114-prettier
