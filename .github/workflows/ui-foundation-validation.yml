name: UI Foundation Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mo-mvp-task-003-ui-foundation

permissions:
  contents: write

concurrency:
  group: ui-foundation-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mo-mvp-task-003-ui-foundation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Show versions
        run: |
          node --version
          pnpm --version

      - name: Generate dependency lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: update UI dependency lockfile"
            git push origin HEAD:feat/mo-mvp-task-003-ui-foundation
          fi

      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm -w format:check

      - name: Lint
        run: pnpm -w lint

      - name: Typecheck
        run: pnpm -w typecheck

      - name: Test
        run: pnpm -w test

      - name: Build workspace
        run: pnpm -w build

      - name: Build UI package
        run: pnpm --filter @markorbit/ui build

      - name: Build Storybook
        run: pnpm --filter @markorbit/ui build-storybook

      - name: Build Lite
        run: pnpm --filter @markorbit/lite-web build

      - name: Build markreg.com
        run: pnpm --filter @markorbit/markreg-web build

      - name: Build Operations Console
        run: pnpm --filter @markorbit/operations-console build

      - name: Full workspace check
        run: pnpm -w check

      - name: Verify diff formatting
        run: git diff --check
