name: WP02 final lint DB fix
on:
  push:
    branches:
      - m4-wp-02-durable-execution-filing-governance
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4-wp-02-durable-execution-filing-governance
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python .github/wp02_final_lint_db_fix.py
      - run: pnpm exec prettier --write scripts/professional-review-real-runtime.ts scripts/document-package-real-runtime.ts services/execution/src/filing-authorization-postgres.ts services/execution/src/index.ts services/execution/tests/filing-authorization-auth.test.ts services/execution/tests/filing-authorization-postgres.test.ts
      - run: pnpm --filter @markorbit/execution-service lint
      - run: pnpm --filter @markorbit/execution-service typecheck
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/professional-review-real-runtime.ts scripts/document-package-real-runtime.ts services/execution/src/filing-authorization-postgres.ts services/execution/src/index.ts services/execution/tests/filing-authorization-auth.test.ts services/execution/tests/filing-authorization-postgres.test.ts
          git commit -m "fix(m4): isolate browser DBs and satisfy Execution lint"
          git push origin HEAD:m4-wp-02-durable-execution-filing-governance
