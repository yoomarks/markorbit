name: WP02 finalize tests

on:
  push:
    branches: [m4-wp-02-durable-execution-filing-governance]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      EXECUTION_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_execution_test
      EXECUTION_POSTGRES_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4-wp-02-durable-execution-filing-governance
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create Execution test database
        env:
          PGPASSWORD: markorbit-test-only
        run: psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE markorbit_execution_test;'
      - name: Apply WP02 production fix and permanent test wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'services/execution/src/index.ts',
              """    const declaredWorkspace =
      request.headers['x-markorbit-workspace-id'] ??
      (request.body &&
      typeof request.body === 'object' &&
      'workspaceId' in request.body &&
      typeof (request.body as { workspaceId?: unknown }).workspaceId === 'string'
        ? (request.body as { workspaceId: string }).workspaceId
        : undefined);
    if (declaredWorkspace && declaredWorkspace !== principal.workspaceId) {
""",
              """    const headerWorkspace = request.headers['x-markorbit-workspace-id'];
    const bodyWorkspace =
      request.body &&
      typeof request.body === 'object' &&
      'workspaceId' in request.body &&
      typeof (request.body as { workspaceId?: unknown }).workspaceId === 'string'
        ? (request.body as { workspaceId: string }).workspaceId
        : undefined;
    if (
      (headerWorkspace && headerWorkspace !== principal.workspaceId) ||
      (bodyWorkspace && bodyWorkspace !== principal.workspaceId)
    ) {
"""
          )
          replace(
              'package.json',
              '    "test:professional-review:postgres": "pnpm build:professional-review-deps && pnpm --filter @markorbit/execution-service exec vitest run tests/professional-review-postgres.test.ts",\n',
              '    "test:professional-review:postgres": "pnpm build:professional-review-deps && pnpm --filter @markorbit/execution-service exec vitest run tests/professional-review-postgres.test.ts",\n'
              '    "test:filing-governance:auth": "pnpm build:professional-review-deps && pnpm --filter @markorbit/execution-service exec vitest run tests/filing-authorization-auth.test.ts",\n'
              '    "test:filing-governance:postgres": "pnpm build:professional-review-deps && EXECUTION_POSTGRES_TEST_REQUIRED=1 pnpm --filter @markorbit/execution-service exec vitest run tests/filing-authorization-postgres.test.ts",\n'
          )
          replace(
              '.github/workflows/ci.yml',
              '      - run: pnpm test:professional-review:http\n',
              '      - run: pnpm test:professional-review:http\n'
              '      - name: Run authenticated Execution filing-governance boundary\n'
              '        run: pnpm test:filing-governance:auth\n'
              '      - name: Run durable Execution filing-governance PostgreSQL suite\n'
              '        run: pnpm test:filing-governance:postgres\n'
          )
          replace(
              'services/execution/tests/professional-review-postgres.test.ts',
              """    await pool.query(
      'DROP TABLE IF EXISTS professional_review_audit, professional_review_commands, professional_review_cases CASCADE'
    );
""",
              """    await pool.query(
      `DROP TABLE IF EXISTS
         filing_execution_task_drafts,
         execution_releases,
         filing_authorizations,
         filing_governance_commands,
         filing_governance_audit,
         professional_review_audit,
         professional_review_commands,
         professional_review_cases
       CASCADE`
    );
    await pool.query(
      'DROP FUNCTION IF EXISTS reject_filing_governance_audit_mutation() CASCADE'
    );
"""
          )
          replace(
              'services/execution/src/filing-authorization-postgres.ts',
              """import {
  FilingGovernanceError,
  type ExecutionReleaseRepository,
  type FilingGovernanceDenial
} from './filing-authorization.js';
""",
              """import {
  FilingGovernanceError,
  type FilingGovernanceDenial
} from './filing-authorization.js';
"""
          )
          replace(
              'services/execution/tests/filing-authorization-postgres.test.ts',
              """    const command = {
      acknowledgementCodes: [...codes],
      acknowledgedBy: actorId,
      idempotencyKey: 'confirm-durable'
    };
""",
              """    const command: Parameters<
      FilingGovernanceService['confirmAuthorization']
    >[1] = {
      acknowledgementCodes: [...codes],
      acknowledgedBy: actorId,
      idempotencyKey: 'confirm-durable'
    };
"""
          )
          PY
      - run: pnpm exec prettier --write services/execution/src/index.ts package.json .github/workflows/ci.yml services/execution/tests/professional-review-postgres.test.ts services/execution/src/filing-authorization-postgres.ts services/execution/tests/filing-authorization-auth.test.ts services/execution/tests/filing-authorization-postgres.test.ts
      - run: pnpm --filter @markorbit/contracts typecheck && pnpm --filter @markorbit/execution-service typecheck
      - run: pnpm build:professional-review-deps
      - run: pnpm --filter @markorbit/execution-service exec vitest run tests/filing-authorization-auth.test.ts
      - run: pnpm --filter @markorbit/execution-service exec vitest run tests/filing-authorization-postgres.test.ts
      - name: Commit tested WP02 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/execution/src/index.ts package.json .github/workflows/ci.yml services/execution/tests/professional-review-postgres.test.ts services/execution/src/filing-authorization-postgres.ts services/execution/tests/filing-authorization-auth.test.ts services/execution/tests/filing-authorization-postgres.test.ts
          git commit -m "test(m4): prove durable authenticated Execution filing governance"
          git push origin HEAD:m4-wp-02-durable-execution-filing-governance
