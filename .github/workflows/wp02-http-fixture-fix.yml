name: WP02 HTTP fixture isolation fix
on:
  push:
    branches:
      - m4-wp-02-durable-execution-filing-governance
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4-wp-02-durable-execution-filing-governance
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python .github/wp02_http_fixture_fix.py
      - run: pnpm exec prettier --write scripts/document-package-http.integration.test.ts scripts/professional-review-http.integration.test.ts
      - run: pnpm exec prettier --check scripts/document-package-http.integration.test.ts scripts/professional-review-http.integration.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/document-package-http.integration.test.ts scripts/professional-review-http.integration.test.ts
          git commit -m "test(m4): isolate Execution schema in HTTP integration fixtures"
          git push origin HEAD:m4-wp-02-durable-execution-filing-governance
