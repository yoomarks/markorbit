name: WP02 M2 additive fix v2
on:
  push:
    branches:
      - m4-wp-02-durable-execution-filing-governance
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4-wp-02-durable-execution-filing-governance
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python .github/wp02_m2_fix.py
      - run: pnpm exec prettier --write scripts/milestone2-migrations.integration.test.ts
      - run: pnpm exec prettier --check scripts/milestone2-migrations.integration.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/milestone2-migrations.integration.test.ts
          git commit -m "test(m4): reconcile M2 migration matrix with Execution 0027"
          git push origin HEAD:m4-wp-02-durable-execution-filing-governance
