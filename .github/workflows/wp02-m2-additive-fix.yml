name: WP02 M2 additive matrix fix

on:
  push:
    branches: [m4-wp-02-durable-execution-filing-governance]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4-wp-02-durable-execution-filing-governance
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Reconcile M2 current-schema expectations additively
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/milestone2-migrations.integration.test.ts')
          text = p.read_text()
          old = """  Execution: [
    'professional_review_cases',
    'professional_review_commands',
    'professional_review_audit'
  ]
"""
          new = """  Execution: [
    'professional_review_cases',
    'professional_review_commands',
    'professional_review_audit',
    'filing_authorizations',
    'execution_releases',
    'filing_execution_task_drafts',
    'filing_governance_commands',
    'filing_governance_audit'
  ]
"""
          if old not in text:
              raise SystemExit('ownedTables.Execution anchor missing')
          text = text.replace(old, new, 1)
          old = "expect(sets.reduce((count, set) => count + set.size, 0)).toBe(9);"
          new = """expect(sets.reduce((count, set) => count + set.size, 0)).toBe(10);
    expect(sets[2]).toContain('0027_execution_filing_governance');"""
          if old not in text:
              raise SystemExit('owner migration count anchor missing')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - run: pnpm exec prettier --write scripts/milestone2-migrations.integration.test.ts
      - run: pnpm exec prettier --check scripts/milestone2-migrations.integration.test.ts
      - name: Commit additive reliability reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/milestone2-migrations.integration.test.ts
          git commit -m "test(m4): reconcile M2 migration matrix with Execution 0027"
          git push origin HEAD:m4-wp-02-durable-execution-filing-governance
