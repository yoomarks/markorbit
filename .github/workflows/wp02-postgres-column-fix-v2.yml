name: WP02 postgres column fix v2

on:
  push:
    branches: [m4-wp-02-durable-execution-filing-governance]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4-wp-02-durable-execution-filing-governance
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Replace reserved authorization column
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('infrastructure/persistence/migrations/0027_execution_filing_governance.sql')
          text = p.read_text().replace('  authorization jsonb NOT NULL,', '  authorization_record jsonb NOT NULL,')
          p.write_text(text)

          p = Path('services/execution/src/filing-authorization-postgres.ts')
          text = p.read_text()
          text = text.replace('SELECT authorization,version,status FROM filing_authorizations', 'SELECT authorization_record,version,status FROM filing_authorizations')
          text = text.replace('(filing_authorization_id,workspace_id,preparation_lock_id,preparation_lock_version,status,version,authorization,created_by,updated_by,created_at,updated_at)', '(filing_authorization_id,workspace_id,preparation_lock_id,preparation_lock_version,status,version,authorization_record,created_by,updated_by,created_at,updated_at)')
          text = text.replace('SET status=$3,version=$4,authorization=$5::jsonb,updated_by=$6,updated_at=$7', 'SET status=$3,version=$4,authorization_record=$5::jsonb,updated_by=$6,updated_at=$7')
          text = text.replace('...(row.authorization as FilingAuthorization)', '...(row.authorization_record as FilingAuthorization)')
          p.write_text(text)
          PY
      - run: pnpm exec prettier --write services/execution/src/filing-authorization-postgres.ts
      - name: Commit focused production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infrastructure/persistence/migrations/0027_execution_filing_governance.sql services/execution/src/filing-authorization-postgres.ts
          git commit -m "fix(m4): use non-reserved filing authorization record column"
          git push origin HEAD:m4-wp-02-durable-execution-filing-governance
