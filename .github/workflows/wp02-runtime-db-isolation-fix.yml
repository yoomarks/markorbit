name: WP02 runtime DB isolation fix
on:
  push:
    branches:
      - m4-wp-02-durable-execution-filing-governance
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4-wp-02-durable-execution-filing-governance
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Isolate current Execution schema between browser fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          old = """  await executionPool.query(
    'DROP TABLE IF EXISTS professional_review_audit,professional_review_commands,professional_review_cases CASCADE'
  );
"""
          new = """  await executionPool.query(
    `DROP TABLE IF EXISTS
       filing_execution_task_drafts,
       execution_releases,
       filing_authorizations,
       filing_governance_commands,
       filing_governance_audit,
       professional_review_audit,
       professional_review_commands,
       professional_review_cases
     CASCADE`
  );
  await executionPool.query(
    'DROP FUNCTION IF EXISTS reject_filing_governance_audit_mutation() CASCADE'
  );
"""
          for path in [
              'scripts/professional-review-real-runtime.ts',
              'scripts/document-package-real-runtime.ts'
          ]:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'cleanup anchor missing in {path}')
              p.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm exec prettier --write scripts/professional-review-real-runtime.ts scripts/document-package-real-runtime.ts
      - run: pnpm --filter @markorbit/execution-service lint
      - run: pnpm --filter @markorbit/execution-service typecheck
      - name: Commit runtime DB isolation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/professional-review-real-runtime.ts scripts/document-package-real-runtime.ts
          git commit -m "test(m4): isolate current Execution schema in browser fixtures"
          git push origin HEAD:m4-wp-02-durable-execution-filing-governance
