name: WP02 runtime patch v2

on:
  push:
    branches: [m4-wp-02-durable-execution-filing-governance]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4-wp-02-durable-execution-filing-governance
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Patch Execution authenticated durable runtime
        run: python -c "import base64; exec(base64.b64decode(''))"
      - run: pnpm exec prettier --write services/execution/src/index.ts services/execution/src/main.ts
      - run: pnpm --filter @markorbit/contracts typecheck && pnpm --filter @markorbit/execution-service typecheck
      - name: Commit runtime patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/execution/src/index.ts services/execution/src/main.ts
          git commit -m "feat(m4): authenticate durable Execution filing governance"
          git push origin HEAD:m4-wp-02-durable-execution-filing-governance
