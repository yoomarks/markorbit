name: WP02 wire tests v2

on:
  push:
    branches: [m4-wp-02-durable-execution-filing-governance]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      EXECUTION_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_execution_test
      EXECUTION_POSTGRES_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4-wp-02-durable-execution-filing-governance
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create Execution test database
        env:
          PGPASSWORD: markorbit-test-only
        run: psql -h 127.0.0.1 -U markorbit_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE markorbit_execution_test;'
      - name: Wire corrected WP02 test commands
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'package.json',
              '    "test:professional-review:postgres": "pnpm build:professional-review-deps && pnpm --filter @markorbit/execution-service exec vitest run tests/professional-review-postgres.test.ts",\n',
              '    "test:professional-review:postgres": "pnpm build:professional-review-deps && pnpm --filter @markorbit/execution-service exec vitest run tests/professional-review-postgres.test.ts",\n'
              '    "test:filing-governance:auth": "pnpm build:professional-review-deps && pnpm --filter @markorbit/execution-service exec vitest run tests/filing-authorization-auth.test.ts",\n'
              '    "test:filing-governance:postgres": "pnpm build:professional-review-deps && EXECUTION_POSTGRES_TEST_REQUIRED=1 pnpm --filter @markorbit/execution-service exec vitest run tests/filing-authorization-postgres.test.ts",\n'
          )
          replace(
              '.github/workflows/ci.yml',
              '      - run: pnpm test:professional-review:http\n',
              '      - run: pnpm test:professional-review:http\n'
              '      - name: Run authenticated Execution filing-governance boundary\n'
              '        run: pnpm test:filing-governance:auth\n'
              '      - name: Run durable Execution filing-governance PostgreSQL suite\n'
              '        run: pnpm test:filing-governance:postgres\n'
          )
          replace(
              'services/execution/tests/professional-review-postgres.test.ts',
              """    await pool.query(\n      'DROP TABLE IF EXISTS professional_review_audit, professional_review_commands, professional_review_cases CASCADE'\n    );\n""",
              """    await pool.query(\n      `DROP TABLE IF EXISTS\n         filing_execution_task_drafts,\n         execution_releases,\n         filing_authorizations,\n         filing_governance_commands,\n         filing_governance_audit,\n         professional_review_audit,\n         professional_review_commands,\n         professional_review_cases\n       CASCADE`\n    );\n    await pool.query(\n      'DROP FUNCTION IF EXISTS reject_filing_governance_audit_mutation() CASCADE'\n    );\n"""
          )
          replace(
              'services/execution/src/filing-authorization-postgres.ts',
              """import {\n  FilingGovernanceError,\n  type ExecutionReleaseRepository,\n  type FilingGovernanceDenial\n} from './filing-authorization.js';\n""",
              """import {\n  FilingGovernanceError,\n  type FilingGovernanceDenial\n} from './filing-authorization.js';\n"""
          )
          replace(
              'services/execution/tests/filing-authorization-postgres.test.ts',
              """    const command = {\n      acknowledgementCodes: [...codes],\n      acknowledgedBy: actorId,\n      idempotencyKey: 'confirm-durable'\n    };\n""",
              """    const command: Parameters<\n      FilingGovernanceService['confirmAuthorization']\n    >[1] = {\n      acknowledgementCodes: [...codes],\n      acknowledgedBy: actorId,\n      idempotencyKey: 'confirm-durable'\n    };\n"""
          )
          PY
      - run: pnpm exec prettier --write package.json .github/workflows/ci.yml services/execution/tests/professional-review-postgres.test.ts services/execution/src/filing-authorization-postgres.ts services/execution/tests/filing-authorization-auth.test.ts services/execution/tests/filing-authorization-postgres.test.ts
      - run: pnpm --filter @markorbit/contracts typecheck && pnpm --filter @markorbit/execution-service typecheck
      - run: pnpm --filter @markorbit/execution-service exec vitest run tests/filing-authorization-auth.test.ts
      - run: pnpm --filter @markorbit/execution-service exec vitest run tests/filing-authorization-postgres.test.ts
      - name: Commit tested WP02 wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .github/workflows/ci.yml services/execution/tests/professional-review-postgres.test.ts services/execution/src/filing-authorization-postgres.ts services/execution/tests/filing-authorization-auth.test.ts services/execution/tests/filing-authorization-postgres.test.ts
          git commit -m "test(m4): wire durable Execution filing governance gates"
          git push origin HEAD:m4-wp-02-durable-execution-filing-governance
