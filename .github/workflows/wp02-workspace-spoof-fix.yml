name: WP02 workspace spoof fix

on:
  push:
    branches: [m4-wp-02-durable-execution-filing-governance]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4-wp-02-durable-execution-filing-governance
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: python .github/wp02_finalize.py
      - run: pnpm exec prettier --write services/execution/src/index.ts
      - run: pnpm --filter @markorbit/execution-service typecheck
      - name: Commit workspace spoof fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/execution/src/index.ts
          git commit -m "fix(m4): reject conflicting Workspace declarations"
          git push origin HEAD:m4-wp-02-durable-execution-filing-governance
