name: WP03 format capture

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format WP03 files
        run: >-
          pnpm exec prettier --write
          services/markreg/src/lifecycle-projection.ts
          services/markreg/tests/formal-matter-postgres.test.ts
          services/markreg/tests/lifecycle-projection-postgres.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: wp03-prettier
          path: |
            services/markreg/src/lifecycle-projection.ts
            services/markreg/tests/formal-matter-postgres.test.ts
            services/markreg/tests/lifecycle-projection-postgres.test.ts
