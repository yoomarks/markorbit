name: WP03 format capture

on:
  pull_request:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Reconcile WP03 task index
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/planning/TASK-INDEX.md';
          let text = fs.readFileSync(path, 'utf8');
          if (!text.includes('- M5-WP-03 — Durable MarkReg Lifecycle Projection')) {
            if (!text.endsWith('\n')) text += '\n';
            text += [
              '- M5-WP-03 — Durable MarkReg Lifecycle Projection from exact admitted reviewed sources (**implemented in PR #64**)',
              '  - MarkReg-owned migration: `0034_markreg_lifecycle_projection`.',
              '  - Exact Reviewed Source Admission provenance, append-only lifecycle events, deterministic current view and durable idempotency/replay.',
              '  - Lifecycle Projection remains internal governed truth with `officialStatusVerified = false`; no filing or official application/status truth is created.',
              ''
            ].join('\n');
            fs.writeFileSync(path, text);
          }
          NODE
      - name: Commit task index only when needed
        run: |
          if git diff --quiet -- docs/planning/TASK-INDEX.md; then
            echo 'WP03 task index is already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/planning/TASK-INDEX.md
          git commit -m 'docs(planning): add M5 WP03 task index entry'
          git push origin HEAD:${{ github.head_ref }}
