name: WP03 format capture

on:
  pull_request:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format WP03 files
        run: >-
          pnpm exec prettier --write
          services/markreg/src/lifecycle-projection.ts
          services/markreg/tests/formal-matter-postgres.test.ts
          services/markreg/tests/lifecycle-projection-postgres.test.ts
      - name: Commit exact formatting only when needed
        run: |
          if git diff --quiet -- \
            services/markreg/src/lifecycle-projection.ts \
            services/markreg/tests/formal-matter-postgres.test.ts \
            services/markreg/tests/lifecycle-projection-postgres.test.ts; then
            echo 'WP03 files already match repository Prettier.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/markreg/src/lifecycle-projection.ts \
            services/markreg/tests/formal-matter-postgres.test.ts \
            services/markreg/tests/lifecycle-projection-postgres.test.ts
          git commit -m 'style(markreg): format WP03 lifecycle projection'
          git push origin HEAD:${{ github.head_ref }}
