name: WP03 format diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply semantic cleanup and format
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('services/markreg/src/order-service.ts')
          text = service.read_text()
          text = text.replace('  async cancel(\n', '  cancel(\n', 1)
          service.write_text(text)

          test = Path('services/markreg/tests/order-service.test.ts')
          text = test.read_text()
          old = """    const incomplete = source('incomplete');
              incomplete.commercialScope.goodsServices = [];
          """
          new = """    const base = source('incomplete');
              const incomplete: CommercialSourceSnapshot = {
                ...base,
                commercialScope: { ...base.commercialScope, goodsServices: [] }
              };
          """
          if old not in text:
              raise SystemExit('expected incomplete-source fixture was not found')
          test.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write \
            packages/contracts/tests/order-permissions.test.ts \
            services/markreg/src/order-service.ts \
            services/markreg/tests/order-service-postgres.test.ts \
            services/markreg/tests/order-service.test.ts
      - name: Commit formatted WP03 sources and remove diagnostic workflow
        run: |
          git rm .github/workflows/wp03-format-diagnostic.yml
          git add packages/contracts/tests/order-permissions.test.ts \
            services/markreg/src/order-service.ts \
            services/markreg/tests/order-service-postgres.test.ts \
            services/markreg/tests/order-service.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wp03): format and harden lifecycle tests"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
