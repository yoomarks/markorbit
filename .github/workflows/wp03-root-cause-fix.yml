name: WP03 root cause fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded WP03 fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const lifecycleTest = 'services/markreg/tests/lifecycle-projection-postgres.test.ts';
          let lifecycle = fs.readFileSync(lifecycleTest, 'utf8');
          const untyped = "    const formalMatterId = `formal-matter_${suffix}`;";
          const typed = "    const formalMatterId: FormalMatterId = `formal-matter_${suffix}`;";
          if (!lifecycle.includes(typed)) {
            if (!lifecycle.includes(untyped)) throw new Error('Lifecycle FormalMatterId anchor not found.');
            lifecycle = lifecycle.replace(untyped, typed);
            fs.writeFileSync(lifecycleTest, lifecycle);
          }

          const formalTest = 'services/markreg/tests/formal-matter-postgres.test.ts';
          let formal = fs.readFileSync(formalTest, 'utf8');
          const oldSql = "        'TRUNCATE formal_matter_audit, formal_matter_commands, formal_matters, matter_drafts, customer_confirmations RESTART IDENTITY'";
          const newSql = "        'TRUNCATE markreg_lifecycle_commands, markreg_lifecycle_views, markreg_lifecycle_events, formal_matter_audit, formal_matter_commands, formal_matters, matter_drafts, customer_confirmations RESTART IDENTITY'";
          if (!formal.includes(newSql)) {
            if (!formal.includes(oldSql)) throw new Error('Formal Matter truncate anchor not found.');
            formal = formal.replace(oldSql, newSql);
            fs.writeFileSync(formalTest, formal);
          }
          NODE
          pnpm exec prettier --write \
            services/markreg/tests/lifecycle-projection-postgres.test.ts \
            services/markreg/tests/formal-matter-postgres.test.ts
      - name: Run focused static validation
        run: |
          pnpm --filter @markorbit/markreg-service typecheck
          pnpm --filter @markorbit/markreg-service lint
      - name: Commit only bounded fixes
        run: |
          if git diff --quiet -- services/markreg/tests/lifecycle-projection-postgres.test.ts services/markreg/tests/formal-matter-postgres.test.ts; then
            echo 'WP03 root cause fixes already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/markreg/tests/lifecycle-projection-postgres.test.ts services/markreg/tests/formal-matter-postgres.test.ts
          git commit -m 'fix(markreg): isolate lifecycle projection test state'
          git push origin HEAD:${{ github.head_ref }}
