name: WP04 cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Align semantics, exports and CI
        run: |
          python - <<'PY'
          from pathlib import Path

          conversion = Path('services/markreg/src/order-matter-conversion.ts')
          text = conversion.read_text()
          text = text.replace(
              "import { randomUUID } from 'node:crypto';",
              "import { createHash, randomUUID } from 'node:crypto';",
              1,
          )
          text = text.replace(
              "snapshotSha256: hashOrderPersistenceValue(canonicalFormalMatterSnapshot(snapshot)),",
              "snapshotSha256: createHash('sha256').update(canonicalFormalMatterSnapshot(snapshot)).digest('hex'),",
              1,
          )
          needle = """  await client.query(
            `INSERT INTO formal_matters (
          """
          replacement = """  const source = await client.query(
            'SELECT formal_matter_id FROM formal_matters WHERE workspace_id=$1 AND source_matter_draft_id=$2 AND source_matter_draft_version=$3 FOR UPDATE',
            [matter.workspaceId, matter.sourceMatterDraftId, matter.sourceMatterDraftVersion]
          );
          if (source.rowCount)
            throw new OrderMatterConversionError(
              'DUPLICATE_SOURCE',
              'The exact Matter Draft version already created a Formal Matter.'
            );
          await client.query(
            `INSERT INTO formal_matters (
          """
          if needle not in text:
              raise SystemExit('formal matter insert marker not found')
          text = text.replace(needle, replacement, 1)
          conversion.write_text(text)

          index = Path('services/markreg/src/index.ts')
          text = index.read_text()
          marker = "export * from './order-service.js';\n"
          export = "export * from './order-matter-conversion.js';\n"
          if export not in text:
              if marker not in text:
                  raise SystemExit('order-service export marker not found')
              text = text.replace(marker, marker + export, 1)
          index.write_text(text)

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          env_marker = "      MARKREG_ORDER_SERVICE_POSTGRES_REQUIRED: '1'\n"
          env_line = "      MARKREG_ORDER_MATTER_POSTGRES_REQUIRED: '1'\n"
          if env_line not in text:
              if env_marker not in text:
                  raise SystemExit('WP03 persistence env marker not found')
              text = text.replace(env_marker, env_marker + env_line, 1)
          test_marker = "      - run: pnpm --filter @markorbit/markreg-service exec vitest run tests/order-service-postgres.test.ts\n"
          test_line = "      - run: pnpm --filter @markorbit/markreg-service exec vitest run tests/order-matter-conversion-postgres.test.ts\n"
          if test_line not in text:
              if test_marker not in text:
                  raise SystemExit('WP03 test marker not found')
              text = text.replace(test_marker, test_marker + test_line, 1)
          ci.write_text(text)
          PY
          pnpm exec prettier --write \
            services/markreg/src/order-matter-conversion.ts \
            services/markreg/tests/order-matter-conversion-postgres.test.ts \
            services/markreg/src/index.ts
      - name: Commit finalized WP04 sources and remove cleanup workflow
        run: |
          git rm .github/workflows/wp04-cleanup.yml
          git add .github/workflows/ci.yml \
            services/markreg/src/index.ts \
            services/markreg/src/order-matter-conversion.ts \
            services/markreg/tests/order-matter-conversion-postgres.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wp04): finalize atomic conversion boundary"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
