name: WP04 final gate fixes once v2

on:
  push:
    branches:
      - agent/tmp-wp04-final-gates
    paths:
      - .github/workflows/wp04-final-gates-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/wp04-wire-gateway-runtime-temp.mjs
      - run: pnpm exec prettier --write apps/gateway/src/index.ts apps/gateway/tests/payment-runtime-wiring.test.ts
      - run: pnpm turbo run build --filter=@markorbit/gateway...
      - run: pnpm --filter @markorbit/gateway lint
      - run: pnpm --filter @markorbit/gateway typecheck
      - run: pnpm --filter @markorbit/gateway exec vitest run tests/payment-http.test.ts tests/payment-runtime-wiring.test.ts
      - run: pnpm exec node scripts/validate-gateway-inventory.mjs
      - name: Commit wiring
        run: |
          git config user.name "markorbit-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/wp04-final-gates-fix-once.yml scripts/wp04-wire-gateway-runtime-temp.mjs
          git add apps/gateway/src/index.ts apps/gateway/tests/payment-runtime-wiring.test.ts
          git commit -m "fix(payment): mount Payment API in Gateway runtime"
          git push origin HEAD:agent/tmp-wp04-final-gates
