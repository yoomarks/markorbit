name: WP04 final gate fixes once

on:
  push:
    branches:
      - agent/tmp-wp04-final-gates
    paths:
      - .github/workflows/wp04-final-gates-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire Payment routes into actual Gateway runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/gateway/src/index.ts')
          s = p.read_text()
          assert "export * from './payment-http.js';" not in s
          s = s.replace("export * from './order-http.js';\n", "export * from './order-http.js';\nexport * from './payment-http.js';\n", 1)
          assert "import { createGatewayPaymentRoutes } from './payment-http.js';" not in s
          s = s.replace("import { createGatewayOrderRoutes } from './order-http.js';\n", "import { createGatewayOrderRoutes } from './order-http.js';\nimport { createGatewayPaymentRoutes } from './payment-http.js';\n", 1)
          assert '  paymentUrl?: string;' not in s
          s = s.replace("  markRegUrl?: string;\n", "  markRegUrl?: string;\n  paymentUrl?: string;\n", 1)
          assert "const paymentUrl = options.paymentUrl" not in s
          s = s.replace("  const executionUrl = options.executionUrl ?? process.env.EXECUTION_URL ?? 'http://127.0.0.1:4104';\n", "  const executionUrl = options.executionUrl ?? process.env.EXECUTION_URL ?? 'http://127.0.0.1:4104';\n  const paymentUrl = options.paymentUrl ?? process.env.PAYMENT_URL ?? 'http://127.0.0.1:4108';\n", 1)
          marker = """        ...createGatewayOrderRoutes({
          markRegUrl,
          ...(authenticationClient ? { authenticationClient } : {}),
          ...((options.internalServiceSecret ?? process.env.MO_INTERNAL_SERVICE_SECRET)
            ? {
                internalServiceSecret: (options.internalServiceSecret ??
                  process.env.MO_INTERNAL_SERVICE_SECRET)!
              }
            : {}),
          csrfSecret,
          allowedOrigins
        }),
"""
          addition = marker + """        ...createGatewayPaymentRoutes({
          paymentUrl,
          ...(authenticationClient ? { authenticationClient } : {}),
          ...((options.internalServiceSecret ?? process.env.MO_INTERNAL_SERVICE_SECRET)
            ? {
                internalServiceSecret: (options.internalServiceSecret ??
                  process.env.MO_INTERNAL_SERVICE_SECRET)!
              }
            : {}),
          csrfSecret,
          allowedOrigins
        }),
"""
          assert s.count(marker) == 1
          s = s.replace(marker, addition, 1)
          p.write_text(s)
          lines = [
            "import { afterEach, describe, expect, it } from 'vitest';",
            "import { createRuntime } from '../src/index.js';",
            "",
            "const runtimes: ReturnType<typeof createRuntime>[] = [];",
            "",
            "afterEach(async () => {",
            "  await Promise.all(runtimes.splice(0).map((runtime) => runtime.stop()));",
            "});",
            "",
            "describe('Gateway Payment runtime wiring', () => {",
            "  it('mounts /api/payments on the actual Gateway runtime', async () => {",
            "    const runtime = createRuntime({",
            "      port: 0,",
            "      csrfSecret: 'runtime-wire-test-secret',",
            "      allowedOrigins: ['https://markorbit.test']",
            "    });",
            "    runtimes.push(runtime);",
            "    await runtime.start();",
            "    const response = await fetch(`http://127.0.0.1:${runtime.listeningPort}/api/payments`, {",
            "      method: 'POST',",
            "      headers: { 'content-type': 'application/json' },",
            "      body: JSON.stringify({ checkoutSessionId: 'checkout_runtime-wire', amountMinor: 1 })",
            "    });",
            "    expect(response.status).toBe(400);",
            "    await expect(response.json()).resolves.toMatchObject({ code: 'MONETARY_OR_ACTOR_SPOOF_REJECTED' });",
            "  });",
            "});"
          ]
          Path('apps/gateway/tests/payment-runtime-wiring.test.ts').write_text('\n'.join(lines) + '\n')
          PY
          pnpm exec prettier --write apps/gateway/src/index.ts apps/gateway/tests/payment-runtime-wiring.test.ts
      - name: Validate real Gateway runtime wiring
        run: |
          pnpm turbo run build --filter=@markorbit/gateway...
          pnpm --filter @markorbit/gateway lint
          pnpm --filter @markorbit/gateway typecheck
          pnpm --filter @markorbit/gateway exec vitest run tests/payment-http.test.ts tests/payment-runtime-wiring.test.ts
          pnpm exec node scripts/validate-gateway-inventory.mjs
      - name: Commit wiring and remove one-shot workflow
        run: |
          git config user.name "markorbit-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/wp04-final-gates-fix-once.yml
          git add apps/gateway/src/index.ts apps/gateway/tests/payment-runtime-wiring.test.ts
          git commit -m "fix(payment): mount Payment API in Gateway runtime"
          git push origin HEAD:agent/tmp-wp04-final-gates
