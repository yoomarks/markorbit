name: WP04 focused validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  wp04:
    if: github.head_ref == 'm5-wp-04-recommended-actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format WP04 files
        run: pnpm exec prettier --write services/markreg/src/recommended-action.ts services/markreg/tests/recommended-action-postgres.test.ts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/markreg/src/recommended-action.ts services/markreg/tests/recommended-action-postgres.test.ts
          git commit -m "style(markreg): format WP04 recommended actions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - run: pnpm --filter @markorbit/markreg-service typecheck
      - run: pnpm --filter @markorbit/markreg-service lint
