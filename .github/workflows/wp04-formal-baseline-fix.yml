name: WP04 Formal Matter baseline fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'm5-wp-04-recommended-actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add 0035 to the exact MarkReg owner migration assertion
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'services/markreg/tests/formal-matter-postgres.test.ts';
          let source = fs.readFileSync(file, 'utf8');
          const oldText = `      '0026',\n      '0034'\n`;
          const newText = `      '0026',\n      '0034',\n      '0035'\n`;
          if (source.includes(oldText)) source = source.replace(oldText, newText);
          else if (!source.includes(`      '0035'\n`)) throw new Error('Formal Matter migration assertion anchor missing');
          fs.writeFileSync(file, source);
          NODE
          pnpm exec prettier --write services/markreg/tests/formal-matter-postgres.test.ts
      - name: Commit exact baseline fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/markreg/tests/formal-matter-postgres.test.ts
          git commit -m "test(markreg): include Recommended Action migration in Formal Matter baseline"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
