name: WP04 format fix once

on:
  push:
    branches:
      - agent/tmp-wp04-format-fix
    paths:
      - .github/workflows/wp04-format-fix-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Stripe sandbox acceptance
        run: |
          pnpm exec prettier --write services/payment/tests/stripe-provider.sandbox.test.ts
          pnpm exec prettier --check services/payment/tests/stripe-provider.sandbox.test.ts
      - name: Commit formatted file and remove one-shot workflow
        run: |
          git config user.name "markorbit-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/wp04-format-fix-once.yml
          git add services/payment/tests/stripe-provider.sandbox.test.ts
          git commit -m "style(payment): format Stripe sandbox acceptance"
          git push origin HEAD:agent/tmp-wp04-format-fix
