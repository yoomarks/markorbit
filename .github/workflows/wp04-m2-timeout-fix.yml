name: WP04 migration timeout fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'm5-wp-04-recommended-actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Give the full Execution migration replay an explicit reliability budget
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/milestone2-migrations.integration.test.ts';
          let source = fs.readFileSync(file, 'utf8');
          const oldText = `    ).toEqual(before);\n  });\n\n  it('MIG-004 rolls back interrupted test-only DDL`;
          const newText = `    ).toEqual(before);\n  }, 10_000);\n\n  it('MIG-004 rolls back interrupted test-only DDL`;
          if (source.includes(oldText)) source = source.replace(oldText, newText);
          else if (!source.includes(`MIG-003 Execution retains exact Professional Review evidence across repeated forward application', async () => {`) || !source.includes('  }, 10_000);'))
            throw new Error('Execution MIG-003 timeout patch anchor missing');
          fs.writeFileSync(file, source);
          NODE
          pnpm exec prettier --write scripts/milestone2-migrations.integration.test.ts
      - name: Commit reliability-only timeout fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/milestone2-migrations.integration.test.ts
          git commit -m "test(reliability): budget full Execution migration replay"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
