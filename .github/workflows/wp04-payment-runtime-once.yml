name: WP04 Payment runtime once v3

on:
  push:
    branches:
      - agent/tmp-wp04-final-gates
    paths:
      - .github/workflows/wp04-payment-runtime-once.yml

permissions:
  contents: write

jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/wp04-payment-runtime-temp.mjs
      - run: pnpm exec prettier --write services/payment
      - run: pnpm turbo run build --filter=@markorbit/payment-service...
      - run: pnpm --filter @markorbit/payment-service lint
      - run: pnpm --filter @markorbit/payment-service typecheck
      - run: pnpm --filter @markorbit/payment-service test
      - run: pnpm --filter @markorbit/payment-service build
      - name: Commit runtime
        run: |
          git config user.name "markorbit-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/wp04-payment-runtime-once.yml scripts/wp04-payment-runtime-temp.mjs
          git add services/payment .env.example
          git commit -m "fix(payment): add durable fail-closed service runtime"
          git push origin HEAD:agent/tmp-wp04-final-gates
