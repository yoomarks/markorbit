name: WP04 test types

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Type PostgreSQL result rows and format
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/markreg/tests/order-matter-conversion-postgres.test.ts')
          text = path.read_text()

          text = text.replace(
              "import {\n  OrderMatterConversionError,\n  PostgresOrderMatterConversionService\n} from '../src/order-matter-conversion.js';",
              "import { PostgresOrderMatterConversionService } from '../src/order-matter-conversion.js';\nimport type { OrderMatterConversionError } from '../src/order-matter-conversion.js';",
              1,
          )

          counts_marker = "const counts = await database.getPool().query(`\n      SELECT\n        (SELECT count(*)::int FROM formal_matters) AS matters,"
          if counts_marker in text:
              text = text.replace(
                  counts_marker,
                  "const counts = await database.getPool().query<{\n      matters: number;\n      matter_commands: number;\n      matter_audits: number;\n      conversion_commands: number;\n      link_audits: number;\n    }>(`\n      SELECT\n        (SELECT count(*)::int FROM formal_matters) AS matters,",
                  1,
              )

          text = text.replace(
              "database.getPool().query('SELECT count(*) AS count FROM formal_matters')",
              "database.getPool().query<{ count: string }>('SELECT count(*) AS count FROM formal_matters')",
          )

          sql_marker = "'SELECT commercial_source_snapshot FROM orders WHERE order_id=$1'"
          pos = text.find(sql_marker)
          if pos < 0:
              raise SystemExit('compatibility Order SQL marker not found')
          start = text.rfind('    const order = (', 0, pos)
          end_marker = ').rows[0].commercial_source_snapshot as CommercialSourceSnapshot;\n'
          end = text.find(end_marker, pos)
          if start < 0 or end < 0:
              raise SystemExit('compatibility Order query bounds not found')
          end += len(end_marker)
          replacement = """    const orderRow = (
              await database
                .getPool()
                .query<{ commercial_source_snapshot: CommercialSourceSnapshot }>(
                  'SELECT commercial_source_snapshot FROM orders WHERE order_id=$1',
                  [ready.orderId]
                )
            ).rows[0];
            if (!orderRow) throw new Error('Order conversion fixture was not found.');
            const order = orderRow.commercial_source_snapshot;
          """
          text = text[:start] + replacement + text[end:]

          text = text.replace(
              ".query('SELECT * FROM matter_drafts WHERE customer_confirmation_id=$1', [",
              ".query<Record<string, unknown>>('SELECT * FROM matter_drafts WHERE customer_confirmation_id=$1', [",
              1,
          )
          path.write_text(text)
          PY
          pnpm exec prettier --write services/markreg/tests/order-matter-conversion-postgres.test.ts
          pnpm --filter @markorbit/markreg-service exec eslint tests/order-matter-conversion-postgres.test.ts
      - name: Commit typed test queries
        run: |
          git add services/markreg/tests/order-matter-conversion-postgres.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wp04): type PostgreSQL conversion evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
