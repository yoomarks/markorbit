name: WP05 acceptance patch

on:
  push:
    branches:
      - m5-wp-05-reviewed-source-handoff

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[wp05-acceptance-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-wp-05-reviewed-source-handoff
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch WP05 acceptance coverage and traceability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          test_path = Path('scripts/milestone5-reviewed-source-handoff.integration.test.ts')
          test_text = test_path.read_text()
