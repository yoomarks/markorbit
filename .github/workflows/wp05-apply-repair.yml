name: WP05 apply repair

on:
  push:
    branches: [agent/m4-wp-05-allocation-provider-acceptance]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m4-wp-05-allocation-provider-acceptance
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply source and forward-compatibility repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('services/mgsn/tests/service-package-eligibility-postgres.test.ts')
          s = p.read_text()
          for anchor in ['DROP TABLE IF EXISTS\n', '`TRUNCATE\n']:
              replacement = anchor + '         mgsn_allocation_audit,\n         mgsn_allocation_commands,\n         mgsn_provider_acceptances,\n         mgsn_allocations,\n'
              if replacement not in s:
                  if anchor not in s:
                      raise SystemExit(f'missing WP04 reset anchor: {anchor!r}')
                  s = s.replace(anchor, replacement, 1)
          old = """expect(owned.map((migration) => `${migration.version}_${migration.name}`)).toEqual([\n      '0028_mgsn_provider_registry',\n      '0029_mgsn_service_package_eligibility'\n    ]);"""
          new = """expect(owned.map((migration) => `${migration.version}_${migration.name}`)).toEqual(\n      expect.arrayContaining([\n        '0028_mgsn_provider_registry',\n        '0029_mgsn_service_package_eligibility'\n      ])\n    );"""
          if old not in s:
              raise SystemExit('missing WP04 migration assertion')
          p.write_text(s.replace(old, new, 1))

          p = Path('services/mgsn/src/allocation-provider-acceptance.ts')
          s = p.read_text()
          s = s.replace(
              "  EligibilityEvaluationRecord,\n  ServicePackageEligibilityRepository,\n  ServicePackageRecord\n",
              "  EligibilityEvaluationRecord,\n  ExecutionSourceAdmissionSource,\n  ServicePackageEligibilityRepository,\n  ServicePackageRecord\n",
              1,
          )
          start = s.find('\nexport const allocationProviderAcceptanceAuthorityConsequences = Object.freeze({')
          if start < 0:
              raise SystemExit('missing local authority fixture')
          end = s.find('\n});\n', start)
          if end < 0:
              raise SystemExit('missing authority fixture end')
          s = s[:start] + '\n' + s[end + 5:]
          old_ctor = """    private readonly servicePackageEligibility: ServicePackageEligibilityRepository,\n    private readonly providerRegistry: ProviderRegistryRepository,\n    private readonly now: () => string = () => new Date().toISOString(),"""
          new_ctor = """    private readonly servicePackageEligibility: ServicePackageEligibilityRepository,\n    private readonly providerRegistry: ProviderRegistryRepository,\n    private readonly executionSource: ExecutionSourceAdmissionSource,\n    private readonly now: () => string = () => new Date().toISOString(),"""
          if old_ctor not in s:
              raise SystemExit('missing allocation constructor anchor')
          s = s.replace(old_ctor, new_ctor, 1)
          old_check = """    this.assertPackageForAllocation(\n      servicePackage,\n      workspaceId,\n      command.expectedServicePackageVersion,\n      expectedPackageFingerprint,\n      command.correlationId\n    );\n\n    const evaluation = await this.requireEligibilityEvaluation(command.eligibilityEvaluationId);"""
          new_check = """    this.assertPackageForAllocation(\n      servicePackage,\n      workspaceId,\n      command.expectedServicePackageVersion,\n      expectedPackageFingerprint,\n      command.correlationId\n    );\n    const executionVerification = await this.executionSource.verifyCurrentSource(\n      servicePackage.source\n    );\n    if (executionVerification.status !== 'CURRENT')\n      throw new AllocationProviderAcceptanceError(\n        'STALE_SOURCE',\n        executionVerification.reason ?? 'Execution source is no longer current.',\n        409\n      );\n    if (\n      executionVerification.exactSourceFingerprintSha256 !== servicePackage.sourceFingerprintSha256\n    )\n      throw new AllocationProviderAcceptanceError(\n        'SOURCE_FINGERPRINT_MISMATCH',\n        'Execution source fingerprint changed after Eligibility Evaluation.',\n        409\n      );\n\n    const evaluation = await this.requireEligibilityEvaluation(command.eligibilityEvaluationId);"""
          if old_check not in s:
              raise SystemExit('missing allocation package check anchor')
          p.write_text(s.replace(old_check, new_check, 1))

          p = Path('services/mgsn/tests/allocation-provider-acceptance-postgres.test.ts')
          s = p.read_text()
          old_import = "import type { ProviderExecutionSourceSnapshot } from '@markorbit/contracts/provider-execution';"
          new_import = """import {\n  allocationAuthorityConsequences,\n  providerAcceptanceAuthorityConsequences,\n  type ProviderExecutionSourceSnapshot\n} from '@markorbit/contracts/provider-execution';"""
          if old_import not in s:
              raise SystemExit('missing contract import anchor')
          s = s.replace(old_import, new_import, 1)
          old_local = """import {\n  AllocationProviderAcceptanceService,\n  allocationProviderAcceptanceAuthorityConsequences\n} from '../src/allocation-provider-acceptance.js';"""
          if old_local not in s:
              raise SystemExit('missing local service import anchor')
          s = s.replace(old_local, "import { AllocationProviderAcceptanceService } from '../src/allocation-provider-acceptance.js';", 1)
          old_factory = """      allocationRepository(),\n      packageRepository(),\n      providerRepository(),\n      () => clock,"""
          new_factory = """      allocationRepository(),\n      packageRepository(),\n      providerRepository(),\n      { verifyCurrentSource: () => Promise.resolve(structuredClone(sourceVerification)) },\n      () => clock,"""
          if old_factory not in s:
              raise SystemExit('missing allocation test factory anchor')
          s = s.replace(old_factory, new_factory, 1)
          old_authority = """    expect(allocationProviderAcceptanceAuthorityConsequences).toMatchObject({\n      providerAllocated: true,\n      providerAccepted: true,\n      legalProfessionalAppointmentCreated: false,\n      paymentCreated: false,\n      invoiceCreated: false,\n      filingSubmitted: false,\n      officialTruthCreated: false\n    });"""
          new_authority = """    expect(allocationAuthorityConsequences).toMatchObject({\n      providerAllocated: true,\n      providerAccepted: false,\n      legalProfessionalAppointmentCreated: false,\n      paymentCreated: false,\n      invoiceCreated: false,\n      filingSubmitted: false,\n      officialTruthCreated: false\n    });\n    expect(providerAcceptanceAuthorityConsequences).toMatchObject({\n      providerAllocated: true,\n      providerAccepted: true,\n      legalProfessionalAppointmentCreated: false,\n      paymentCreated: false,\n      invoiceCreated: false,\n      filingSubmitted: false,\n      officialTruthCreated: false\n    });"""
          if old_authority not in s:
              raise SystemExit('missing authority assertion anchor')
          s = s.replace(old_authority, new_authority, 1)
          stale_test = """\n  it('fails closed when Execution source becomes stale after Eligibility Evaluation', async () => {\n    const sourceValue = await createEligibleSource();\n    sourceVerification = {\n      status: 'STALE',\n      reason: 'Execution Release changed after Eligibility Evaluation.'\n    };\n    await expect(allocate(sourceValue, 'allocation-after-source-stale')).rejects.toMatchObject({\n      code: 'STALE_SOURCE',\n      status: 409\n    });\n    expect(\n      await allocationRepository().findActiveAllocation(sourceValue.servicePackage.servicePackageId)\n    ).toBeUndefined();\n  });\n"""
          marker = "\n  it('fails closed when current Provider or Supply truth changed after eligibility', async () => {"
          if marker not in s:
              raise SystemExit('missing stale-source test insertion marker')
          p.write_text(s.replace(marker, stale_test + marker, 1))
          PY
      - name: Format changed sources
        run: >-
          pnpm exec prettier --write
          services/mgsn/src/allocation-provider-acceptance.ts
          services/mgsn/tests/allocation-provider-acceptance-postgres.test.ts
          services/mgsn/tests/service-package-eligibility-postgres.test.ts
      - name: Validate MGSN types
        run: pnpm --filter @markorbit/mgsn-service typecheck
      - name: Remove temporary workflows before committing
        run: rm -f .github/workflows/wp05-final-repair.yml .github/workflows/wp05-apply-repair.yml
      - name: Commit source repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: revalidate exact source at allocation boundary'
          git push origin HEAD:agent/m4-wp-05-allocation-provider-acceptance
