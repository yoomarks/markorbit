name: WP05 bootstrap

on:
  push:
    branches: [m3-wp-05-gateway-order-api]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-wp-05-gateway-order-api
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/wp05-bootstrap.mjs
      - run: pnpm exec prettier --write services/markreg/src/index.ts apps/gateway/src/index.ts apps/gateway/src/order-http.ts services/markreg/src/order-http.ts apps/markreg-web/src/api/order.ts apps/markreg-web/tests/order-api.test.ts scripts/order-http.integration.test.ts scripts/gateway-route-source.mjs scripts/validate-gateway-inventory.mjs docs/architecture/GATEWAY_ROUTE_INVENTORY.json package.json .github/workflows/ci.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(m3): wire authenticated Order API boundary"
          git push origin HEAD:m3-wp-05-gateway-order-api
