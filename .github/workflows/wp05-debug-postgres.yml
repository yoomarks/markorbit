name: WP05 PostgreSQL diagnostic

on:
  push:
    branches:
      - plc-wp-05-lite-today-prepared-action
    paths:
      - .github/workflows/wp05-debug-postgres.yml

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_lite_today_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_lite_today_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LITE_TODAY_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_lite_today_test
      LITE_TODAY_POSTGRES_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-05-lite-today-prepared-action
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Run target and write concise diagnostic
        shell: bash
        run: |
          set +e
          pnpm --filter @markorbit/lite-service exec vitest run tests/prepared-action-postgres.test.ts --reporter=verbose > /tmp/wp05.log 2>&1
          status=$?
          {
            echo '===== WP05 FAILURES ====='
            grep -n -E 'FAIL|AssertionError|Error:|× |expected|Received|PreparedActionJourneyError|Foreign key|duplicate key|violates|not found|PERSISTENCE|DEPENDENCY' /tmp/wp05.log | tail -n 180 || true
            echo '===== WP05 TAIL ====='
            tail -n 220 /tmp/wp05.log
            echo "===== EXIT ${status} ====="
          } > wp05-debug.txt
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wp05-debug.txt
          git commit -m 'chore: persist WP-05 PostgreSQL diagnostic' || exit 0
          git push origin HEAD:plc-wp-05-lite-today-prepared-action
