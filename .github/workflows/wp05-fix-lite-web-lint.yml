name: WP05 fix Lite Web lint

on:
  push:
    branches:
      - plc-wp-05-lite-today-prepared-action
    paths:
      - .github/workflows/wp05-fix-lite-web-lint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-05-lite-today-prepared-action
      - name: Apply exact lint fixes
        shell: python
        run: |
          from pathlib import Path
          app = Path('apps/lite-web/src/App.tsx')
          text = app.read_text()
          old = '  DataList,\n'
          if old not in text:
              raise SystemExit('DataList import anchor missing')
          app.write_text(text.replace(old, '', 1))

          stories = Path('apps/lite-web/src/features/today/TodayWorkspace.stories.tsx')
          text = stories.read_text()
          replacements = {
              'loadToday: async () => value': 'loadToday: () => Promise.resolve(value)',
              'loadPreparedAction: async () => prepared': 'loadPreparedAction: () => Promise.resolve(prepared)',
              'prepareContent: async () => prepared': 'prepareContent: () => Promise.resolve(prepared)',
              'confirm: async () => completed': 'confirm: () => Promise.resolve(completed)',
              "loadToday: async () => {\n        throw new TodayHttpError(\n          403,": "loadToday: () =>\n        Promise.reject(\n          new TodayHttpError(\n            403,",
              "'workspace:read permission is required.'\n        );\n      }": "'workspace:read permission is required.'\n          )\n        )",
              "loadToday: async () => {\n        throw new TodayHttpError(\n          503,": "loadToday: () =>\n        Promise.reject(\n          new TodayHttpError(\n            503,",
              "'Lite Today is temporarily unavailable.'\n        );\n      }": "'Lite Today is temporarily unavailable.'\n          )\n        )"
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'story lint anchor missing: {old[:48]}')
              text = text.replace(old, new, 1)
          stories.write_text(text)
          Path('.github/workflows/wp05-fix-lite-web-lint.yml').unlink()
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/lite-web/src/App.tsx apps/lite-web/src/features/today/TodayWorkspace.stories.tsx
      - name: Commit exact fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: satisfy Lite Web WP-05 lint'
          git push origin HEAD:plc-wp-05-lite-today-prepared-action
