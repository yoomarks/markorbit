name: WP05 fix Today UI types

on:
  push:
    branches:
      - plc-wp-05-lite-today-prepared-action
    paths:
      - .github/workflows/wp05-fix-today-types.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-05-lite-today-prepared-action
      - name: Patch exact TypeScript findings
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/lite-web/src/features/today/TodayWorkspace.tsx')
          text = p.read_text()
          old = """      <ErrorState
        title={permission ? 'Today access denied' : 'Lite Today unavailable'}
        description={error.message}
        onRetry={permission ? undefined : () => void reload()}
      />"""
          new = """      <ErrorState
        title={permission ? 'Today access denied' : 'Lite Today unavailable'}
        description={error.message}
        {...(!permission ? { onRetry: () => void reload() } : {})}
      />"""
          if old not in text:
              raise SystemExit('ErrorState exact-optional anchor missing')
          text = text.replace(old, new, 1)
          old = "tone={error.status === 409 || error.status === 422 ? 'warning' : 'danger'}"
          if old not in text:
              raise SystemExit('Alert tone anchor missing')
          text = text.replace(old, 'tone="warning"', 1)
          p.write_text(text)
          Path('.github/workflows/wp05-fix-today-types.yml').unlink()
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/lite-web/src/features/today/TodayWorkspace.tsx
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: satisfy Today exact optional UI types'
          git push origin HEAD:plc-wp-05-lite-today-prepared-action
