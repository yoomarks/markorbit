name: WP05 format acceptance patch

on:
  push:
    branches:
      - m5-wp-05-reviewed-source-handoff

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-wp-05-reviewed-source-handoff
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format WP05 acceptance files
        run: pnpm exec prettier --write scripts/milestone5-reviewed-source-handoff.integration.test.ts docs/tasks/MO-MVP-M5-WP-05-REVIEWED-SOURCE-HANDOFF.md docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.md docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.json docs/planning/TASK-INDEX.md
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/milestone5-reviewed-source-handoff.integration.test.ts docs/tasks/MO-MVP-M5-WP-05-REVIEWED-SOURCE-HANDOFF.md docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.md docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.json docs/planning/TASK-INDEX.md
          git commit -m "style(wp05): format acceptance evidence [wp05-formatted]"
          git push origin HEAD:m5-wp-05-reviewed-source-handoff
