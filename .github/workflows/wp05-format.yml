name: WP05 format

on:
  push:
    branches: [m3-wp-05-gateway-order-api]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-wp-05-gateway-order-api
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/order-http.integration.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/order-http.integration.test.ts
          git commit -m "style(m3): format Order HTTP integration test"
          git push origin HEAD:m3-wp-05-gateway-order-api
