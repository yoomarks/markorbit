name: WP05 HTTP harness remediation

on:
  push:
    branches:
      - plc-wp-05-lite-today-prepared-action
    paths:
      - '.github/workflows/wp05-http-harness-remediation.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_lite_today_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_lite_today_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LITE_TODAY_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_lite_today_test
      LITE_TODAY_POSTGRES_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-05-lite-today-prepared-action
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Align root HTTP harness imports with built shared package instances
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/product-loop-today-runtime.integration.test.ts')
          s = p.read_text()
          replacements = {
              "from '@markorbit/contracts';": "from '../packages/contracts/dist/index.js';",
              "from '@markorbit/persistence';": "from '../packages/persistence/dist/index.js';",
              "from '@markorbit/service-kit';": "from '../packages/service-kit/dist/index.js';",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing import anchor: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: pnpm exec prettier --write scripts/product-loop-today-runtime.integration.test.ts
      - name: Build shared package and service dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/lite-service... --filter=@markorbit/markreg-service... --filter=@markorbit/gateway...
      - name: Verify authenticated Lite HTTP integration
        run: pnpm exec vitest run scripts/product-loop-today-runtime.integration.test.ts
      - name: Commit harness repair and remove one-shot workflow
        run: |
          rm .github/workflows/wp05-http-harness-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align WP-05 HTTP harness shared package identity'
          git push origin HEAD:plc-wp-05-lite-today-prepared-action
