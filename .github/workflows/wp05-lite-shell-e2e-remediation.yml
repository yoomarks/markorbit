name: WP05 Lite shell E2E remediation

on:
  push:
    branches:
      - plc-wp-05-lite-today-prepared-action
    paths:
      - '.github/workflows/wp05-lite-shell-e2e-remediation.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-05-lite-today-prepared-action
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Align legacy shell acceptance with authenticated Today boundary
        run: >-
          python -c "from pathlib import Path; p=Path('tests/e2e/lite.spec.ts'); s=p.read_text(); s=s.replace('Lite Today provides its fixed semantic navigation and responsive workspace @visual','Lite shell provides its fixed semantic navigation and responsive fixture workspace @visual',1); s=s.replace('await page.goto(urls.lite);','await page.goto(`${urls.lite}#work-customers`);',1); s=s.replace("await expect(page.getByRole('heading', { level: 1, name: 'Today' })).toBeVisible();","await expect(page.getByRole('heading', { level: 1, name: 'Customers' })).toBeVisible();",1); p.write_text(s)"
      - run: pnpm exec prettier --write tests/e2e/lite.spec.ts
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/wp05-lite-shell-e2e-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align Lite shell E2E with authenticated Today boundary'
          git push origin HEAD:plc-wp-05-lite-today-prepared-action
