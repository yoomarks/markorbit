name: WP05 one-shot bootstrap patch

on:
  push:
    branches:
      - plc-wp-05-lite-today-prepared-action
    paths:
      - .github/workflows/wp05-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-05-lite-today-prepared-action
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply bounded integration patches
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Gateway stays transport/composition only.
          replace(
              'apps/gateway/src/index.ts',
              "export * from './mgsn-http.js';\n",
              "export * from './mgsn-http.js';\nexport * from './product-loop-http.js';\n"
          )
          replace(
              'apps/gateway/src/index.ts',
              "import { createGatewayMgsnRoutes } from './mgsn-http.js';\n",
              "import { createGatewayMgsnRoutes } from './mgsn-http.js';\nimport { createGatewayProductLoopRoutes } from './product-loop-http.js';\n"
          )
          replace(
              'apps/gateway/src/index.ts',
              "  mgsnUrl?: string;\n",
              "  mgsnUrl?: string;\n  liteUrl?: string;\n"
          )
          replace(
              'apps/gateway/src/index.ts',
              "  const mgsnUrl = options.mgsnUrl ?? process.env.MGSN_URL ?? 'http://127.0.0.1:4106';\n",
              "  const mgsnUrl = options.mgsnUrl ?? process.env.MGSN_URL ?? 'http://127.0.0.1:4106';\n  const liteUrl = options.liteUrl ?? process.env.LITE_URL ?? 'http://127.0.0.1:4107';\n"
          )
          replace(
              'apps/gateway/src/index.ts',
              "      routes: [\n        ...createGatewayMgsnRoutes({\n",
              "      routes: [\n        ...createGatewayProductLoopRoutes({\n          liteUrl,\n          ...(authenticationClient ? { authenticationClient } : {}),\n          ...((options.internalServiceSecret ?? process.env.MO_INTERNAL_SERVICE_SECRET)\n            ? {\n                internalServiceSecret: (options.internalServiceSecret ??\n                  process.env.MO_INTERNAL_SERVICE_SECRET)!\n              }\n            : {}),\n          csrfSecret,\n          allowedOrigins\n        }),\n        ...createGatewayMgsnRoutes({\n"
          )

          # Remove an accidental unused contracts import in the new Lite HTTP adapter.
          p = Path('services/lite/src/http.ts')
          text = p.read_text().replace(
              "  PreparedActionId,\n  PreparedActionPlan as _PreparedActionPlan\n",
              "  PreparedActionId\n"
          )
          p.write_text(text)

          # Existing Product-loop human actor fields now accept authoritative Core UUID/string IDs.
          p = Path('services/lite/src/content-preparation.ts')
          text = p.read_text()
          text = text.replace('  reviewerPrincipalId: MarkOrbitId;','  reviewerPrincipalId: string;')
          anchor = "function cleanMarkOrbitId(value: MarkOrbitId, field: string): MarkOrbitId {\n  const cleaned = value.trim() as MarkOrbitId;\n  if (!MARKORBIT_ID.test(cleaned))\n    throw new LiteContentPreparationError('INVALID_INPUT', `${field} is invalid.`, 422);\n  return cleaned;\n}\n"
          if anchor not in text:
              raise SystemExit('content-preparation actor cleaner anchor missing')
          text = text.replace(anchor, anchor + "\nfunction cleanPrincipalId(value: string, field: string): string {\n  return cleanText(value, field, 300);\n}\n", 1)
          text = text.replace(
              "cleanMarkOrbitId(command.reviewerPrincipalId, 'reviewerPrincipalId')",
              "cleanPrincipalId(command.reviewerPrincipalId, 'reviewerPrincipalId')"
          )
          p.write_text(text)

          p = Path('services/lite/src/candidate-qualification.ts')
          text = p.read_text()
          text = text.replace('  decidedByPrincipalId: MarkOrbitId;','  decidedByPrincipalId: string;')
          anchor = "function cleanMarkOrbitId(value: MarkOrbitId, field: string): MarkOrbitId {\n  const cleaned = value.trim() as MarkOrbitId;\n  if (!MARKORBIT_ID.test(cleaned))\n    throw new LiteCandidateQualificationError('INVALID_INPUT', `${field} is invalid.`, 422);\n  return cleaned;\n}\n"
          if anchor not in text:
              raise SystemExit('candidate-qualification actor cleaner anchor missing')
          text = text.replace(anchor, anchor + "\nfunction cleanPrincipalId(value: string, field: string): string {\n  return cleanText(value, field, 300);\n}\n", 1)
          text = text.replace(
              "cleanMarkOrbitId(command.decidedByPrincipalId, 'decidedByPrincipalId')",
              "cleanPrincipalId(command.decidedByPrincipalId, 'decidedByPrincipalId')"
          )
          p.write_text(text)

          p = Path('services/markreg/src/formal-opportunity.ts')
          text = p.read_text()
          text = text.replace(',\n  type MarkOrbitId,',' ,') if False else text
          text = text.replace('  type MarkOrbitId,\n','')
          text = text.replace('  promotedByPrincipalId: MarkOrbitId;','  promotedByPrincipalId: string;')
          text = text.replace('  confirmedByPrincipalId: MarkOrbitId;','  confirmedByPrincipalId: string;')
          text = text.replace(
              "function cleanMarkOrbitId(value: MarkOrbitId, field: string): MarkOrbitId {\n  const cleaned = value.trim() as MarkOrbitId;\n  if (!MARKORBIT_ID.test(cleaned))\n    throw new FormalOpportunityError('INVALID_INPUT', `${field} is invalid.`, 422);\n  return cleaned;\n}\n",
              "function cleanPrincipalId(value: string, field: string): string {\n  return cleanText(value, field, 300);\n}\n"
          )
          text = text.replace("const MARKORBIT_ID = /^[^_\\s]+_.+$/;\n", '')
          text = text.replace(
              "cleanMarkOrbitId(\n      command.promotedByPrincipalId,\n      'promotedByPrincipalId'\n    )",
              "cleanPrincipalId(command.promotedByPrincipalId, 'promotedByPrincipalId')"
          )
          text = text.replace(
              "cleanMarkOrbitId(\n      command.confirmedByPrincipalId,\n      'confirmedByPrincipalId'\n    )",
              "cleanPrincipalId(command.confirmedByPrincipalId, 'confirmedByPrincipalId')"
          )
          text = text.replace('    principalId: MarkOrbitId\n','    principalId: string\n')
          p.write_text(text)

          # Remove this workflow from the final diff.
          Path('.github/workflows/wp05-one-shot.yml').unlink()
      - name: Refresh lockfile
        run: pnpm install --lockfile-only
      - name: Format touched files
        run: >-
          pnpm exec prettier --write
          packages/contracts/src/product-loop.ts
          services/lite/package.json
          services/lite/src/index.ts
          services/lite/src/main.ts
          services/lite/src/http.ts
          services/lite/src/prepared-action.ts
          services/lite/src/content-preparation.ts
          services/lite/src/candidate-qualification.ts
          services/markreg/package.json
          services/markreg/src/main.ts
          services/markreg/src/formal-opportunity.ts
          services/markreg/src/formal-opportunity-http.ts
          apps/gateway/src/index.ts
          apps/gateway/src/product-loop-http.ts
          infrastructure/persistence/migration-owners.json
          infrastructure/persistence/migrations/0042_lite_prepared_action_journey.sql
          docs/tasks/MO-MVP-PLC-WP-05-LITE-TODAY-PREPARED-ACTION.md
          pnpm-lock.yaml
      - name: Commit bounded patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: complete WP-05 runtime wiring' || exit 0
          git push origin HEAD:plc-wp-05-lite-today-prepared-action
