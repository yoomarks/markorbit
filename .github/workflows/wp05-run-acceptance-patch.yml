name: WP05 run acceptance patch

on:
  push:
    branches:
      - m5-wp-05-reviewed-source-handoff

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-wp-05-reviewed-source-handoff
      - name: Run stored patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/wp05-acceptance-patch.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index("\n          PY\n", start)
          raw = source[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in raw.splitlines()) + "\n"
          Path('/tmp/wp05_patch.py').write_text(script)
          PY
          python /tmp/wp05_patch.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/milestone5-reviewed-source-handoff.integration.test.ts docs/tasks/MO-MVP-M5-WP-05-REVIEWED-SOURCE-HANDOFF.md docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.md docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.json docs/planning/TASK-INDEX.md
          git commit -m "test(wp05): complete handoff acceptance evidence [wp05-acceptance-patched]"
          git push origin HEAD:m5-wp-05-reviewed-source-handoff
