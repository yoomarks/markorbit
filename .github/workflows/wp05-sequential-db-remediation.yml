name: WP05 sequential DB remediation

on:
  push:
    branches:
      - plc-wp-05-lite-today-prepared-action
    paths:
      - '.github/workflows/wp05-sequential-db-remediation.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markorbit_test
          POSTGRES_PASSWORD: markorbit-test-only
          POSTGRES_DB: markorbit_lite_today_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markorbit_test -d markorbit_lite_today_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LITE_TODAY_TEST_DATABASE_URL: postgresql://markorbit_test:markorbit-test-only@127.0.0.1:5432/markorbit_lite_today_test
      LITE_TODAY_POSTGRES_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-05-lite-today-prepared-action
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reuse the Lite owner migration namespace across sequential suites
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/product-loop-today-runtime.integration.test.ts')
          s = p.read_text()
          a = "migrationNamespace: 'wp05_http'"
          b = "migrationNamespace: 'lite_today_test'"
          if a not in s:
              raise SystemExit('ManagedDatabase migration namespace anchor missing')
          s = s.replace(a, b, 1)
          a = "      'wp05_http',\n      await loadMigrationsForOwner"
          b = "      'lite_today_test',\n      await loadMigrationsForOwner"
          if a not in s:
              raise SystemExit('migrate namespace anchor missing')
          s = s.replace(a, b, 1)
          p.write_text(s)
          PY
      - run: pnpm exec prettier --write scripts/product-loop-today-runtime.integration.test.ts
      - name: Build dependency closure
        run: pnpm exec turbo run build --filter=@markorbit/lite-service... --filter=@markorbit/markreg-service... --filter=@markorbit/gateway... --filter=@markorbit/lite-web...
      - name: Reproduce formal sequential database order
        run: |
          pnpm --filter @markorbit/lite-service exec vitest run tests/prepared-action-postgres.test.ts
          pnpm exec vitest run scripts/product-loop-today-runtime.integration.test.ts
      - name: Verify downstream WP-05 gates
        run: |
          pnpm --filter @markorbit/gateway exec vitest run tests/product-loop-http.test.ts
          pnpm --filter @markorbit/lite-web build-storybook -- --quiet
      - name: Commit remediation and remove one-shot workflow
        run: |
          rm .github/workflows/wp05-sequential-db-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: reuse Lite migration namespace across WP-05 suites'
          git push origin HEAD:plc-wp-05-lite-today-prepared-action
