name: WP05 status typefix

on:
  push:
    branches: [m3-wp-05-gateway-order-api]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-wp-05-gateway-order-api
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/wp05-status-typefix.mjs
      - run: pnpm exec prettier --write services/markreg/src/order-http.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(markreg): parse typed Order status filter"
          git push origin HEAD:m3-wp-05-gateway-order-api
