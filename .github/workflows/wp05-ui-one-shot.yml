name: WP05 UI one-shot wiring

on:
  push:
    branches:
      - plc-wp-05-lite-today-prepared-action
    paths:
      - .github/workflows/wp05-ui-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-05-lite-today-prepared-action
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/wp05-ui-patch.py
      - run: pnpm exec prettier --write apps/lite-web/src/App.tsx apps/lite-web/src/api/product-loop.ts apps/lite-web/src/features/today/TodayWorkspace.tsx apps/lite-web/src/features/today/TodayWorkspace.stories.tsx apps/lite-web/src/features/today/today.css
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: wire real Lite Today surface'
          git push origin HEAD:plc-wp-05-lite-today-prepared-action
