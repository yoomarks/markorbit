name: WP06 docs and format repair

on:
  push:
    branches:
      - m5-wp-06-authenticated-lifecycle-journey

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[wp06-docs-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-wp-06-authenticated-lifecycle-journey
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch WP06 traceability and lint-safe fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          for file in [
              Path('services/markreg/tests/lifecycle-surface-http.test.ts'),
              Path('services/execution/tests/evidence-provenance-http.test.ts'),
          ]:
              text = file.read_text()
              directive = '/* eslint-disable @typescript-eslint/require-await */\n'
              if not text.startswith(directive):
                  file.write_text(directive + text)

          trace = Path('docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.md')
          text = trace.read_text()
          text = text.replace(
              '**Current work package:** `M5-WP-05` — retry-safe Execution-to-MarkReg Reviewed Source handoff and correction/replay loop  ',
              '**Current work package:** `M5-WP-06` — authenticated customer/Operations lifecycle surfaces and non-executing action controls  '
          )
          text = text.replace(
              '- **M5-WP-06 — Authenticated Gateway, operations review surface and markreg.com lifecycle/status journey:** `NOT_STARTED`.',
              '- **M5-WP-06 — Authenticated Gateway, operations review surface and markreg.com lifecycle/status journey:** `IMPLEMENTED_IN_PR_67`. Evidence: authenticated Gateway lifecycle routes, MarkReg customer/Operations surfaces, Execution review provenance route, markreg.com Lifecycle Panel, Operations Console provenance inspection and focused permission/redaction tests.'
          )
          marker = '## Ownership boundary\n'
          if '## WP-06 authenticated lifecycle surface boundary' not in text:
              section = '''## WP-06 authenticated lifecycle surface boundary

WP-06 exposes the governed M5 projection through Session-backed, Workspace-scoped surfaces without changing semantic ownership:

```text
customer Session + matter:read
-> Gateway
-> MarkReg customer-safe Current Lifecycle View / timeline / Recommended Action

Operations Session + review:perform
-> Gateway
-> MarkReg full projection provenance
+ Execution exact review/admission/correction/handoff provenance
```

Customer output is intentionally bounded and redacted: no reviewed-source fingerprints, review rationale, Provider Return provenance, retry/idempotency metadata or correction detail crosses the customer boundary. An explicit no-action state is returned when no current recommendation exists.

Operations provenance uses `review:perform` rather than silently reusing customer `matter:read` or `review:read`. Gateway composes MarkReg and Execution reads over trusted internal HTTP; it performs no cross-service SQL and becomes no semantic owner.

Recommended Action acknowledgement/dismissal requires a live Session, Workspace match, `matter:manage`, trusted Origin, CSRF, stable idempotency key and exact expected version. The only customer transitions are `ACKNOWLEDGED` and `DISMISSED`; they remain advisory state changes with `executionAuthorized = false` and cannot file, pay, appoint or contact a trademark office.

Focused acceptance covers customer redaction/no-action rendering, Operations permission separation, exact review/correction/handoff provenance, expired Session, cross-Workspace lookup, Origin/CSRF and stale-version rejection. The exhaustive restart/replay/isolation/redaction/concurrency/browser matrix remains WP-07.

'''
              text = text.replace(marker, section + marker)
          old_next = 'After M5-WP-05 passes exact-head hosted gates and merges, the next dependency-ordered implementation step is `M5-WP-06` — authenticated Gateway, operations review surface and markreg.com lifecycle/status journey. WP-06 must consume the governed WP-05 transport and existing MarkReg projections without changing semantic ownership or creating execution authority.'
          new_next = 'After M5-WP-06 passes exact-head hosted gates and merges, the next dependency-ordered implementation step is `M5-WP-07` — migration, restart, replay, isolation, redaction, concurrency and browser reliability matrix. WP-07 must harden the authenticated lifecycle surfaces without expanding authority or semantic ownership.'
          text = text.replace(old_next, new_next)
          trace.write_text(text)

          index = Path('docs/planning/TASK-INDEX.md')
          text = index.read_text()
          if 'M5-WP-06 — Authenticated customer and Operations lifecycle surfaces' not in text:
              anchor = '''- M5-WP-05 — Retry-safe Execution-to-MarkReg Reviewed Source handoff and correction/replay loop (**implemented in PR #66**)
  - Execution-owned migration: `0036_execution_reviewed_source_handoff`.
  - Durable sender state is persisted before transport; stable MarkReg idempotency survives receiver unavailability, response loss and restart replay.
  - Corrected newer evidence requires a new explicit review/admission identity; cross-Workspace handoff and changed retry payloads fail closed.
  - Execution and MarkReg remain database-isolated; no filing, Payment/Invoice, Recommended Action execution or Official Truth authority is added.'''
              addition = anchor + '''
- M5-WP-06 — Authenticated customer and Operations lifecycle surfaces (**implemented in PR #67**)
  - Customer Formal Matter lifecycle is Session-backed, Workspace-scoped and summary-only, with bounded timeline and explicit no-action state.
  - Recommended Action acknowledge/dismiss requires `matter:manage`, Origin, CSRF, idempotency and exact version; it never executes the action.
  - Operations provenance requires `review:perform` and composes exact MarkReg projection provenance with Execution review/correction/handoff evidence over internal HTTP.
  - Customer/Operations permission boundaries remain separate; no cross-service SQL, filing, Payment/Invoice, appointment or Official Truth authority is added.'''
              text = text.replace(anchor, addition)
          index.write_text(text)
          PY
      - name: Format WP06 additions
        run: pnpm exec prettier --write apps/gateway/tests/lifecycle-http.test.ts apps/markreg-web/tests/LifecyclePanel.test.tsx services/execution/tests/evidence-provenance-http.test.ts services/markreg/tests/lifecycle-surface-http.test.ts docs/tasks/MO-MVP-M5-WP-06-AUTHENTICATED-LIFECYCLE-SURFACES.md docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.md docs/planning/MO-MVP-MILESTONE-005-IMPLEMENTATION-TRACEABILITY.json docs/planning/TASK-INDEX.md
      - name: Commit repair
        run: |
          git config user.name "yoomarks"
          git config user.email "lukeluccas6292643@gmail.com"
          git add apps services docs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(wp06): finalize acceptance traceability [wp06-docs-repaired]"
          git push origin HEAD:m5-wp-06-authenticated-lifecycle-journey
