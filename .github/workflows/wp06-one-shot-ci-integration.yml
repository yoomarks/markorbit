name: WP06 one-shot CI integration

on:
  push:
    branches:
      - agent/m4-wp-06-provider-return-evidence-handoff

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m4-wp-06-provider-return-evidence-handoff
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Integrate WP06 test fixtures and permanent CI gates
        shell: python
        run: |
          from pathlib import Path

          execution_test = Path('services/execution/tests/provider-return-evidence-postgres.test.ts')
          text = execution_test.read_text()
          old = """    await database.getPool().query(\n      `TRUNCATE\n         execution_provider_return_evidence_audit,\n         execution_provider_return_evidence_commands,\n         execution_provider_return_evidence_receipts\n       RESTART IDENTITY CASCADE`\n    );"""
          new = """    const pool = database.getPool();\n    await pool.query(\n      `TRUNCATE\n         execution_provider_return_evidence_audit,\n         execution_provider_return_evidence_commands,\n         execution_provider_return_evidence_receipts,\n         filing_execution_task_drafts,\n         execution_releases,\n         filing_authorizations\n       RESTART IDENTITY CASCADE`\n    );\n    await pool.query(\n      `INSERT INTO filing_authorizations(\n         filing_authorization_id,workspace_id,preparation_lock_id,preparation_lock_version,status,version,\n         authorization_record,created_by,updated_by,created_at,updated_at\n       ) VALUES($1,$2,$3,$4,'AUTHORIZED',2,$5::jsonb,$6,$6,$7,$7)`,\n      [\n        release.filingAuthorizationId,\n        workspaceId,\n        release.preparationLockId,\n        release.preparationLockVersion,\n        JSON.stringify({ filingAuthorizationId: release.filingAuthorizationId, version: 2 }),\n        'user_execution_manager',\n        release.createdAt\n      ]\n    );\n    await pool.query(\n      `INSERT INTO execution_releases(\n         execution_release_id,workspace_id,filing_authorization_id,filing_authorization_version,status,version,\n         release_record,created_by,updated_by,created_at,updated_at\n       ) VALUES($1,$2,$3,$4,$5,$6,$7::jsonb,$8,$8,$9,$10)`,\n      [\n        release.executionReleaseId,\n        workspaceId,\n        release.filingAuthorizationId,\n        release.filingAuthorizationVersion,\n        release.status,\n        release.version,\n        JSON.stringify(release),\n        'user_execution_manager',\n        release.createdAt,\n        release.updatedAt\n      ]\n    );\n    await pool.query(\n      `INSERT INTO filing_execution_task_drafts(\n         filing_execution_task_draft_id,workspace_id,execution_release_id,filing_authorization_id,status,\n         task_record,created_by,updated_by,created_at,updated_at\n       ) VALUES($1,$2,$3,$4,$5,$6::jsonb,$7,$7,$8,$8)`,\n      [\n        task.filingExecutionTaskDraftId,\n        workspaceId,\n        task.executionReleaseId,\n        task.filingAuthorizationId,\n        task.status,\n        JSON.stringify(task),\n        'user_execution_manager',\n        task.createdAt\n      ]\n    );"""
          assert old in text, 'Execution beforeEach fixture anchor not found'
          execution_test.write_text(text.replace(old, new, 1))

          mgsn_test = Path('services/mgsn/tests/provider-return-postgres.test.ts')
          text = mgsn_test.read_text()
          text = text.replace(
              "  type EvidenceHandoffReference,\n  type ProviderExecutionSourceSnapshot",
              "  type ProviderExecutionSourceSnapshot"
          )
          anchor = "import { ProviderReturnService } from '../src/provider-return.js';"
          replacement = "import {\n  ProviderReturnService,\n  type ProviderReturnEvidenceHandoffTarget\n} from '../src/provider-return.js';"
          assert anchor in text
          text = text.replace(anchor, replacement, 1)
          old_handoff = """  const evidenceHandoff = {\n    handoffProviderReturnEvidence: (input: {\n      command: {\n        workspaceId: string;\n        providerReturnId: `provider-return_${string}`;\n        expectedProviderReturnVersion: number;\n        expectedProviderReturnFingerprintSha256: string;\n        executionReleaseId: `execution-release_${string}`;\n        expectedExecutionReleaseVersion: number;\n        filingExecutionTaskDraftId: `filing-task-draft_${string}`;\n        expectedFilingExecutionTaskDraftVersion: number | string;\n        idempotencyKey: string;\n        correlationId: typeof correlationId;\n      };\n      providerReturn: { providerReturnId: `provider-return_${string}`; version: number };\n    }): Promise<EvidenceHandoffReference> => {"""
          new_handoff = """  const evidenceHandoff: ProviderReturnEvidenceHandoffTarget = {\n    handoffProviderReturnEvidence: (input) => {"""
          assert old_handoff in text, 'MGSN handoff type anchor not found'
          mgsn_test.write_text(text.replace(old_handoff, new_handoff, 1))

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          env_anchor = "      EXECUTION_POSTGRES_TEST_REQUIRED: '1'\n"
          if "EXECUTION_PROVIDER_RETURN_EVIDENCE_POSTGRES_REQUIRED" not in text:
              assert env_anchor in text
              text = text.replace(
                  env_anchor,
                  env_anchor + "      EXECUTION_PROVIDER_RETURN_EVIDENCE_POSTGRES_REQUIRED: '1'\n",
                  1
              )
          mgsn_anchor = "      MGSN_ALLOCATION_POSTGRES_REQUIRED: '1'\n"
          if "MGSN_PROVIDER_RETURN_POSTGRES_REQUIRED" not in text:
              assert mgsn_anchor in text
              text = text.replace(
                  mgsn_anchor,
                  mgsn_anchor + "      MGSN_PROVIDER_RETURN_POSTGRES_REQUIRED: '1'\n",
                  1
              )
          step_anchor = """      - name: Run durable MGSN Allocation and Provider Acceptance PostgreSQL suite\n        run: pnpm --filter @markorbit/mgsn-service exec vitest run tests/allocation-provider-acceptance-postgres.test.ts\n"""
          if "Run durable MGSN Provider Return PostgreSQL suite" not in text:
              assert step_anchor in text
              text = text.replace(
                  step_anchor,
                  step_anchor + """      - name: Run durable MGSN Provider Return PostgreSQL suite\n        run: pnpm --filter @markorbit/mgsn-service exec vitest run tests/provider-return-postgres.test.ts\n      - name: Run durable Execution Provider Return evidence PostgreSQL suite\n        run: pnpm --filter @markorbit/execution-service exec vitest run tests/provider-return-evidence-postgres.test.ts\n""",
                  1
              )
          ci.write_text(text)

          Path('.github/workflows/wp06-one-shot-ci-integration.yml').unlink()
      - run: >-
          pnpm exec prettier --write
          .github/workflows/ci.yml
          services/execution/tests/provider-return-evidence-postgres.test.ts
          services/mgsn/tests/provider-return-postgres.test.ts
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: wire WP06 durable validation"
          git push origin HEAD:agent/m4-wp-06-provider-return-evidence-handoff
