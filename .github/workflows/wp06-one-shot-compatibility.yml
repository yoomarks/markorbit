name: WP06 one-shot compatibility repair

on:
  push:
    branches:
      - agent/m4-wp-06-provider-return-evidence-handoff

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m4-wp-06-provider-return-evidence-handoff
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply forward-compatible Execution cleanup and M2 ownership evidence
        shell: python
        run: |
          from pathlib import Path

          cleanup_files = [
              Path('services/execution/tests/professional-review-postgres.test.ts'),
              Path('services/execution/tests/filing-authorization-postgres.test.ts'),
              Path('scripts/document-package-real-runtime.ts'),
          ]
          extra_tables = (
              '         execution_provider_return_evidence_audit,\n'
              '         execution_provider_return_evidence_commands,\n'
              '         execution_provider_return_evidence_receipts,\n'
          )
          for path in cleanup_files:
              text = path.read_text()
              marker = '`DROP TABLE IF EXISTS\n'
              assert marker in text, f'drop-table anchor missing in {path}'
              if 'execution_provider_return_evidence_receipts,' not in text:
                  text = text.replace(marker, marker + extra_tables, 1)
              path.write_text(text)

          m2 = Path('scripts/milestone2-migrations.integration.test.ts')
          text = m2.read_text()
          anchor = "  Execution: [\n"
          if "'execution_provider_return_evidence_receipts'" not in text:
              assert anchor in text
              text = text.replace(
                  anchor,
                  anchor
                  + "    'execution_provider_return_evidence_receipts',\n"
                  + "    'execution_provider_return_evidence_commands',\n"
                  + "    'execution_provider_return_evidence_audit',\n",
                  1,
              )
          text = text.replace(
              "expect(sets.reduce((count, set) => count + set.size, 0)).toBe(10);",
              "expect(sets.reduce((count, set) => count + set.size, 0)).toBe(11);",
              1,
          )
          old = "    expect(sets[2]).toContain('0027_execution_filing_governance');\n"
          new = old + "    expect(sets[2]).toContain('0032_execution_provider_return_evidence');\n"
          if "sets[2]).toContain('0032_execution_provider_return_evidence')" not in text:
              assert old in text
              text = text.replace(old, new, 1)
          m2.write_text(text)

          provider_return = Path('services/mgsn/src/provider-return.ts')
          text = provider_return.read_text()
          old = """    if (!servicePackage || servicePackage.version !== Number(providerReturn.servicePackage.version))\n      throw new ProviderReturnError('STALE_SOURCE', 'Service Package source is no longer exact.', 409);"""
          new = """    if (\n      !servicePackage ||\n      servicePackage.version !== Number(providerReturn.servicePackage.version) ||\n      servicePackage.status !== 'ADMITTED'\n    )\n      throw new ProviderReturnError('STALE_SOURCE', 'Service Package source is no longer exact.', 409);"""
          if old in text:
              text = text.replace(old, new, 1)
          else:
              assert "servicePackage.status !== 'ADMITTED'" in text
          provider_return.write_text(text)

          Path('.github/workflows/wp06-one-shot-compatibility.yml').unlink()
      - run: >-
          pnpm exec prettier --write
          services/execution/tests/professional-review-postgres.test.ts
          services/execution/tests/filing-authorization-postgres.test.ts
          scripts/document-package-real-runtime.ts
          scripts/milestone2-migrations.integration.test.ts
          services/mgsn/src/provider-return.ts
      - name: Validate and commit
        run: |
          pnpm check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: keep Execution suites forward-compatible with WP06"
          git push origin HEAD:agent/m4-wp-06-provider-return-evidence-handoff
