name: WP06 one-shot HTTP restart compatibility

on:
  push:
    branches:
      - agent/m4-wp-06-provider-return-evidence-handoff

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m4-wp-06-provider-return-evidence-handoff
      - name: Add WP06 Execution tables to HTTP-suite cleanup
        shell: python
        run: |
          from pathlib import Path

          for name in [
              'scripts/document-package-http.integration.test.ts',
              'scripts/professional-review-http.integration.test.ts',
          ]:
              path = Path(name)
              text = path.read_text()
              anchor = "      `DROP TABLE IF EXISTS\n"
              assert anchor in text, f'cleanup anchor missing in {name}'
              if 'execution_provider_return_evidence_receipts,' not in text:
                  text = text.replace(
                      anchor,
                      anchor
                      + '         execution_provider_return_evidence_audit,\n'
                      + '         execution_provider_return_evidence_commands,\n'
                      + '         execution_provider_return_evidence_receipts,\n',
                      1,
                  )
              path.write_text(text)

          Path('.github/workflows/wp06-one-shot-http-restart-compat.yml').unlink()
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: keep HTTP restart suites compatible with WP06"
          git push origin HEAD:agent/m4-wp-06-provider-return-evidence-handoff
