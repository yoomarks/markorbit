name: WP06 one-shot source integration

on:
  push:
    branches:
      - agent/m4-wp-06-provider-return-evidence-handoff

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m4-wp-06-provider-return-evidence-handoff
      - name: Integrate WP06 exports and forward-compatible migration assertions
        shell: python
        run: |
          from pathlib import Path

          execution_index = Path('services/execution/src/index.ts')
          text = execution_index.read_text()
          anchor = "export * from './filing-authorization-postgres.js';\n"
          addition = anchor + "export * from './provider-return-evidence.js';\nexport * from './provider-return-evidence-postgres.js';\n"
          if "export * from './provider-return-evidence.js';" not in text:
              assert anchor in text
              text = text.replace(anchor, addition, 1)
          execution_index.write_text(text)

          evidence = Path('services/execution/src/provider-return-evidence.ts')
          text = evidence.read_text()
          text = text.replace("      release.workspaceId !== workspaceId ||\n", "")
          text = text.replace("      task.workspaceId !== workspaceId ||\n", "")
          evidence.write_text(text)

          wp05 = Path('services/mgsn/tests/allocation-provider-acceptance-postgres.test.ts')
          text = wp05.read_text()
          old = """    expect(owned.map((migration) => `${migration.version}_${migration.name}`)).toEqual([\n      '0028_mgsn_provider_registry',\n      '0029_mgsn_service_package_eligibility',\n      '0030_mgsn_allocation_provider_acceptance'\n    ]);"""
          new = """    expect(owned.map((migration) => `${migration.version}_${migration.name}`)).toEqual(\n      expect.arrayContaining([\n        '0028_mgsn_provider_registry',\n        '0029_mgsn_service_package_eligibility',\n        '0030_mgsn_allocation_provider_acceptance'\n      ])\n    );"""
          if old in text:
              text = text.replace(old, new, 1)
          wp05.write_text(text)

          Path('.github/workflows/wp06-one-shot-source-fix.yml').unlink()
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/execution/src/index.ts services/execution/src/provider-return-evidence.ts services/mgsn/tests/allocation-provider-acceptance-postgres.test.ts .github/workflows/wp06-one-shot-source-fix.yml
          git diff --cached --check
          git commit -m "chore: integrate WP06 source boundaries"
          git push origin HEAD:agent/m4-wp-06-provider-return-evidence-handoff
