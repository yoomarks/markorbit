name: WP06 Prettier remediation

on:
  push:
    branches:
      - plc-wp-06-feedback-observability
    paths:
      - '.github/workflows/wp06-prettier-remediation.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-06-feedback-observability
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format WP-06 files
        run: >-
          pnpm exec prettier --write
          .github/workflows/product-loop-feedback-observability.yml
          apps/gateway/src/product-loop-http.ts
          apps/gateway/tests/product-loop-http.test.ts
          apps/lite-web/src/api/product-loop.ts
          apps/lite-web/src/features/today/TodayWorkspace.tsx
          apps/lite-web/src/features/today/TodayWorkspace.stories.tsx
          apps/lite-web/src/features/today/today.css
          docs/tasks/MO-MVP-PLC-WP-06-FEEDBACK-OBSERVABILITY.md
          infrastructure/persistence/migration-owners.json
          scripts/product-loop-today-runtime.integration.test.ts
          services/lite/package.json
          services/lite/src/feedback.ts
          services/lite/src/http.ts
          services/lite/src/index.ts
          services/lite/src/main.ts
          services/lite/tests/product-loop-feedback-postgres.test.ts
      - name: Commit formatted files and remove one-shot workflow
        run: |
          rm .github/workflows/wp06-prettier-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format PLC-WP-06 implementation'
          git push origin HEAD:plc-wp-06-feedback-observability
