name: WP06 route refinements

on:
  push:
    branches: [m3-wp-06-markreg-order-journey]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-wp-06-markreg-order-journey
      - run: node scripts/wp06-refine.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(m3): recover Order journey from governed confirmation"
          git push origin HEAD:m3-wp-06-markreg-order-journey
