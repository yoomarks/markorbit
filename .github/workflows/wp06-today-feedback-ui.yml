name: WP06 Today feedback UI patch

on:
  push:
    branches:
      - plc-wp-06-feedback-observability
    paths:
      - '.github/workflows/wp06-today-feedback-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-06-feedback-observability
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply asserted Today patch
        run: node scripts/wp06-patch-today.mjs
      - name: Format patched UI
        run: >-
          pnpm exec prettier --write
          apps/lite-web/src/features/today/TodayWorkspace.tsx
          apps/lite-web/src/features/today/TodayWorkspace.stories.tsx
          apps/lite-web/src/features/today/today.css
          apps/lite-web/src/api/product-loop.ts
          services/lite/src/feedback.ts
          services/lite/src/http.ts
      - name: Commit and remove one-shot patch assets
        run: |
          rm .github/workflows/wp06-today-feedback-ui.yml
          rm scripts/wp06-patch-today.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(lite): close manual feedback loop in Today'
          git push origin HEAD:plc-wp-06-feedback-observability
