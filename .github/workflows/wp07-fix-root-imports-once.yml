name: WP07 fix root imports once

on:
  push:
    branches:
      - plc-wp-07-reliability-browser-matrix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-07-reliability-browser-matrix
      - name: Replace root workspace aliases with source-relative imports
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/product-loop-closure-reliability.integration.test.ts')
          text = path.read_text()
          replacements = {
              "from '@markorbit/contracts/product-loop';": "from '../packages/contracts/src/product-loop.js';",
              "from '@markorbit/persistence';": "from '../packages/persistence/src/index.js';",
              "from '@markorbit/service-kit';": "from '../packages/service-kit/src/index.js';",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/wp07-fix-root-imports-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/product-loop-closure-reliability.integration.test.ts .github/workflows/wp07-fix-root-imports-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'test: resolve WP-07 integration from source'
          git push origin HEAD:plc-wp-07-reliability-browser-matrix
