name: WP07 format integration once

on:
  push:
    branches:
      - plc-wp-07-reliability-browser-matrix

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plc-wp-07-reliability-browser-matrix
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/product-loop-closure-reliability.integration.test.ts
      - name: Commit formatted integration and remove one-shot workflow
        run: |
          rm .github/workflows/wp07-format-integration-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/product-loop-closure-reliability.integration.test.ts .github/workflows/wp07-format-integration-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'style: format WP-07 cross-owner integration'
          git push origin HEAD:plc-wp-07-reliability-browser-matrix
