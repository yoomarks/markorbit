name: WP07 format sources

on:
  push:
    branches: [m3-wp-07-reliability-matrix]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-wp-07-reliability-matrix
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          scripts/milestone3-reliability-command.test.mjs
          scripts/run-milestone3-reliability.mjs
          scripts/run-order-repeatability.mjs
          scripts/validate-milestone3-reliability-matrix.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/milestone3-reliability-command.test.mjs scripts/run-milestone3-reliability.mjs scripts/run-order-repeatability.mjs scripts/validate-milestone3-reliability-matrix.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(m3): format reliability sources"
          git push origin HEAD:m3-wp-07-reliability-matrix
