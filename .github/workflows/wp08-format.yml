name: WP08 format

on:
  push:
    branches: [m3-wp-08-integration-authority-audit]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-wp-08-integration-authority-audit
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          README.md
          docs/audits/MO-MVP-MILESTONE-003-INTEGRATION-AUDIT.md
          docs/planning/MO-MVP-MILESTONE-003-IMPLEMENTATION-TRACEABILITY.md
          docs/planning/TASK-INDEX.md
          docs/tasks/MO-MVP-TASK-028-MILESTONE-003-SCOPE-LOCK.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/audits/MO-MVP-MILESTONE-003-INTEGRATION-AUDIT.md docs/planning/MO-MVP-MILESTONE-003-IMPLEMENTATION-TRACEABILITY.md docs/planning/TASK-INDEX.md docs/tasks/MO-MVP-TASK-028-MILESTONE-003-SCOPE-LOCK.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(m3): format WP08 audit documents"
          git push origin HEAD:m3-wp-08-integration-authority-audit
