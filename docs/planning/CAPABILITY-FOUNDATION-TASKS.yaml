  title: MarkOrbit Capability Foundation Program
  status: ACTIVE_P0_REUSE_PROOF
  date: 2026-08-25
  last_reconciled: 2026-08-26
  planning_baseline: b7ee1ff4fda8a2a770b94d49c8cd9bbda52ee039
  current_main: 6ddf351b0425a0024901dce10ba54f7243dade47
  architecture: docs/architecture/CAPABILITY-FOUNDATION-ARCHITECTURE.md
  audit: docs/audits/CAPABILITY-FOUNDATION-AUDIT-2026-08-25.md
  closeout_audit: docs/audits/MO-CAP-001-CLOSEOUT-AUDIT-2026-08-26.md
  roadmap: docs/planning/CAPABILITY-FOUNDATION-ROADMAP.md
  canon_rule: 'Capability = Stable Outcome Contract + Governed Implementation + Evidence Base + Version Lineage + Controlled Evolution'
  historical_reconciliation:
