tasks:
  - id: MO-CAP-001
    title: Capability Runtime Execution & Admission Plane
    priority: P0
    status: SINGLE_CONSUMER_PROVEN
    audited_main: 6ddf351b0425a0024901dce10ba54f7243dade47
    closeout_issue: 242
    closeout_audit: docs/audits/MO-CAP-001-CLOSEOUT-AUDIT-2026-08-26.md
    owner:
      primary: Capability Engine
      supporting:
        - Gateway
        - Core
        - Contracts
    objective: >-
      Evolve the existing Capability Engine from durable registry/learning maturity into the common
      governed execution/admission plane: resolve an accepted Capability version, decide eligibility,
      bind an approved implementation profile, execute, validate, and return a typed outcome/session receipt.
    depends_on: []
    preserves:
      - M6 durable runtime registry/version lineage
      - Capability Observation and Ledger
      - Reflection Candidate and Disposition
      - private Capability Profile/Twin
      - capability pointer/registry/release guards
    work_packages:
      - id: MO-CAP-001-WP01
        title: Historical TASK-010..013 and M6 reconciliation
        status: COMPLETED
        evidence: c594ad26906d44e4b026bf86a5cc1d3507f1b95e
      - id: MO-CAP-001-WP02
        title: Runtime invocation contract family
        status: COMPLETED
        evidence: ff7e19ce9b7a3f7ad8d422ba9cac6bb01c5d055c
      - id: MO-CAP-001-WP03
        title: Durable Implementation Profile registry and binding
        status: COMPLETED
        evidence: 8b599b33e04dbe3d654587c37b0acb67b7858165
      - id: MO-CAP-001-WP04
        title: Governed invocation runtime replacing hard-coded fixture
        status: COMPLETED
        evidence: f9b7fa6af81be052f5992d3033567ca58edb75fe
      - id: MO-CAP-001-WP05
        title: Gateway/internal caller admission and context propagation
        status: COMPLETED
        evidence: 2692079d527f80356645fef7a22b5836e1a4630a
      - id: MO-CAP-001-WP06
        title: Reliability, replay, version and authority gates
        status: COMPLETED
        evidence:
          - f4039c56a3b98d87122c850cff5ebc384f69a746
          - f88911ca77ff64d0004d4ad550f2711e18851b7c
      - id: MO-CAP-001-WP07
        title: First real consumer conformance thin slice
        status: COMPLETED
        evidence:
          - 25a37443c36497ec4c4b852db3bd3e4474bb8ce2
          - 6ddf351b0425a0024901dce10ba54f7243dade47
      - id: MO-CAP-001-WP08
        title: Independent integration and authority audit
        status: IN_CLOSEOUT_PR
        issue: 242
    implementation_label_note: >-
      Implementation issues used WP07/WP07B/WP08 labels for production bootstrap, durable replay and the Lite client.
      The conceptual roadmap mapping above remains authoritative and is reconciled by the 2026-08-26 closeout audit.
    required_contracts:
      - ImplementationProfile
      - CapabilityRequestV2
      - CapabilityEligibilityDecision
      - CapabilityComposition
      - ImplementationBinding
      - CapabilityInvocation
      - CapabilityOutcome
      - CapabilityReturn
      - SessionReceipt
    acceptance:
      - hard_coded_trademark_application_recommendation_fixture_removed_from_real_request_path
      - accepted_capability_version_resolved_from_durable_runtime_definition
      - caller_cannot_select_raw_provider_endpoint_model_or_credential
      - trusted_workspace_principal_and_caller_product_context
      - applicability_and_eligibility_fail_closed
