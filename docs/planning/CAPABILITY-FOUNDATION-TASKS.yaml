      governed_runtime_binding: IMPLEMENTED
      knowledge_specialized_managed_ai_http_consumer: IMPLEMENTED
      knowledge_governed_capability_v2_consumer: NOT_YET_PROVEN
      brain_second_consumer: NOT_YET_PROVEN
    first_consumer: Knowledge
    second_consumer: Brain
    work_packages:
      - id: MO-CAP-002-WP01
        title: Provider-neutral AI outcome contract
      - id: MO-CAP-002-WP02
        title: AI Gateway provider/model adapter boundary
      - id: MO-CAP-002-WP03
        title: Prompt policy model and implementation lineage
      - id: MO-CAP-002-WP04
