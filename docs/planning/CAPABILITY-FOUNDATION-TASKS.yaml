  execution_policy:
    one_objective_per_pr: true
    direct_main_push: false
    exact_head_ci_required: true
    cross_service_sql: forbidden
    runtime_outcome_auto_canon_mutation: forbidden
    brain_direct_canonical_product_api: forbidden

architecture_locks:
  product_consumption: CAPABILITY
  brain_role: TYPED_ATTRIBUTABLE_VERSIONED_NON_CANONICAL_INTELLIGENCE
  core_role: SHARED_SEMANTICS_IDENTITY_CONTEXT_GOVERNANCE
  capability_engine_role: GOVERNED_RUNTIME_DEFINITION_BINDING_INVOCATION_OUTCOME_LEARNING
  ai_gateway_role: IMPLEMENTATION_INFRASTRUCTURE_NOT_CAPABILITY_ID
  communication_hub_role: IMPLEMENTATION_INFRASTRUCTURE_NOT_CAPABILITY_ID
  email_providers_role: TOOL_PROVIDER_ADAPTER
  ai_providers_role: TOOL_PROVIDER_ADAPTER

sequence:
  - id: MO-CAP-001
    gate: SINGLE_CONSUMER_PROVEN
    closeout_issue: 242
  - parallel_now:
      prerequisite: MO-CAP-001_MINIMUM_INVOCATION_BINDING_CONTRACT_ACCEPTED
      prerequisite_status: SATISFIED
      tasks:
        - MO-CAP-002
        - MO-CAP-003
  - parallel_after:
      prerequisite: FOUNDATION_RUNTIME_PATTERN_PROVEN_WITH_TWO_INDEPENDENT_CONSUMERS
      tasks:
        - MO-CAP-004
        - MO-CAP-005
        - MO-CAP-006
  - after:
      prerequisite: MULTI_PRODUCT_FOUNDATION_REUSE_PROVEN
      wave: DOMAIN_CAPABILITY_WAVE_1

admission_levels:
  - PLANNED
  - IMPLEMENTATION_BOUND
  - SINGLE_CONSUMER_PROVEN
  - FOUNDATION_REUSABLE
  - DEPRECATED

foundation_reusable_gate:
  minimum_independent_consumers: 2
  requirements:
    - stable_capability_definition_and_version
    - approved_implementation_profile
    - exact_head_conformance_for_each_consumer
    - workspace_and_principal_isolation
    - provider_secrets_confined_to_implementation_boundary
    - deterministic_evidence_and_provenance
    - usage_observability_where_applicable
    - provider_or_tool_substitution_test_or_explicit_single_provider_limit
    - no_product_dependency_on_provider_sdk_or_secret
    - no_authority_promotion_of_brain_model_or_provider_output

current_p0_cross_repository_blockers:
  - id: MARKREG_KNOWLEDGE_CASE
    core_issue: 244
    knowledge_issue: 467
    owner: MarkReg
    status: ACTIVE_REPOSITORY_LEAD_LANE
  - id: SHARED_COMMUNICATION_EXPERT
